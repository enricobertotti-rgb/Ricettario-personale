eps":["Preparare una pastella con farina setacciata, birra scura, sale e pepe; coprire e tenere in frigorifero.","Lavare e tagliare iceberg, radicchio, carote e pomodorini; immergere brevemente le carote in acqua ghiacciata per mantenerle croccanti.","Mescolare lo yogurt con scorza e succo di lime per ottenere la salsa.","Portare l'olio a circa 170 °C, immergere il merluzzo a pezzi nella pastella e friggere per circa 4 minuti fino a doratura; scolare.","Condire iceberg e carote con lime e sale, scaldare le tortillas e farcirle con verdure, pesce fritto, salsa, radicchio e pomodorini; finire con coriandolo."],"photo":"https://www.giallozafferano.com/images/330-33012/fish-tacos_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/fish-tacos.html","pdfPage":180,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03847","name":"Gyoza cacio e pepe","category":"Piatti unici e cucine del mondo","serves":"16 pezzi (circa 4 persone)","prep":"45 min","cook":"10 min","rest":"30 min riposo impasto","ingredients":["Per 16 gyoza: farina 00 200 g","acqua tiepida 90 g","sale 1 pizzico. Ripieno: ricotta vaccina 250 g","Pecorino Romano DOP 60 g","pepe di Sichuan q.b. Cottura: olio EVO 10 g","acqua 20 g."],"steps":["Impastare farina, sale e acqua tiepida fino a ottenere una massa liscia; coprirla e farla riposare per circa mezz'ora.","Dividere in sedici porzioni e stenderle in dischi sottili, tenendo coperti quelli in attesa.","Amalgamare ricotta, Pecorino grattugiato e pepe; distribuire poco ripieno su ogni disco e richiudere a mezzaluna pizzicando i bordi.","Dorare i gyoza in padella con olio, aggiungere l'acqua e coprire per ultimare la cottura a vapore; servire con pepe e, se gradita, salsa di soia."],"photo":"","source":"https://www.giallozafferano.com/recipes/gyoza-cacio-e-pepe.html","pdfPage":181,"description":"I tradizionali ravioli giapponesi incontrano un ripieno tipicamente italiano per un primo piatto fusion tutto da provare: gyoza cacio e pepe!"},{"id":"GZ-03848","name":"Gyoza vegetariani","category":"Piatti unici e cucine del mondo","serves":"circa 40 gyoza / 8 persone","prep":"90 min","cook":"30 min","rest":"","ingredients":["Pasta (circa 40 gyoza): farina 00 200 g","acqua calda 90 g","sale q.b. Ripieno: tofu 100 g","cavolo 100 g","funghi Pleurotus medi 2","funghi shiitake piccoli 3","carote medie 2","cipollotto piccolo 1","aglio 2 spicchi","zenzero fresco 60 g","salsa di soia 40 g","olio di sesamo 10 g","salsa sriracha 6 g","olio di girasole q.b. Cottura: acqua 200 g","olio di sesamo 10 g","olio di girasole q.b. Salsa: salsa di soia 50 g","aceto di riso 50 g."],"steps":["Impastare farina, sale e acqua calda fino a una pasta liscia; avvolgerla e lasciarla riposare.","Pulire e tritare cavolo, carote, funghi, cipollotto, aglio, tofu e zenzero.","Saltare il trito in poco olio di girasole per circa 10 minuti; fuori dal fuoco aggiungere salsa di soia, olio di sesamo e sriracha, quindi raffreddare.","Formare piccole porzioni di ripieno di circa 10 g; stendere la pasta sottile e ricavare dischi di circa 8 cm, farcirli e sigillarli a mezzaluna con pieghe.","Rosolare i gyoza in padella oliata sul solo fondo per 4-5 minuti, versare l'acqua, coprire e cuocere circa 10 minuti.","Scoprire, completare con olio di sesamo e servire con salsa di soia mescolata ad aceto di riso."],"photo":"https://www.giallozafferano.com/images/344-34434/vegetarian-gyoza_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/vegetarian-gyoza.html","pdfPage":182,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03849","name":"hummus","category":"Piatti unici e cucine del mondo","serves":"circa 700 g / 4 persone","prep":"15 min","cook":"","rest":"","ingredients":["Per circa 700 g: ceci precotti 500 g","succo di limone 90 g","tahina 70 g","aglio 1 spicchio (facoltativo)","olio EVO 50 g","acqua q.b.","sale fino q.b. Finitura: paprika dolce q.b.","prezzemolo q.b.","olio EVO q.b.","pepe nero q.b. Tahina casalinga facoltativa: semi di sesamo 100 g","olio di sesamo 30 g","acqua tiepida q.b.","sale q.b."],"steps":["Sciacquare e scolare i ceci cotti, poi raccoglierli nel mixer.","Aggiungere tahina, succo di limone, olio, sale e, se gradito, aglio privato del germoglio.","Frullare modulando la consistenza con poca acqua, finché la crema diventa omogenea.","Trasferire in una ciotola e guarnire con paprika, pepe, prezzemolo tritato e olio.","Se si prepara la tahina in casa, tostare il sesamo e lavorarlo al mortaio con olio, sale e acqua tiepida fino a formare una pasta."],"photo":"https://www.giallozafferano.com/images/253-25382/Hummus_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Hummus.html","pdfPage":183,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03850","name":"Hummus con gambi di carciofo","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"10 min","cook":"","rest":"","ingredients":["Gambi di carciofo 2","ceci precotti 200 g","succo di limone 1/2 limone","tahina 1 cucchiaio","aglio 1 spicchio (facoltativo)","olio EVO q.b.","sale fino q.b.","menta q.b."],"steps":["Pelare i gambi di carciofo eliminando lo strato esterno più fibroso e tagliarli a pezzetti.","Lessarli o cuocerli a vapore finché risultano teneri.","Mettere nel mixer ceci scolati, tahina, aglio facoltativo, succo di limone e gambi cotti.","Aggiungere olio e sale nella quantità testuale indicata dalla fonte (q.b.) e frullare a impulsi fino a una crema liscia.","Trasferire in una ciotola e completare con menta e un filo d'olio."],"photo":"https://www.giallozafferano.com/images/343-34363/hummus-with-artichoke-stems_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/hummus-with-artichoke-stems.html","pdfPage":184,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03855","name":"hummus senza tahina","category":"Piatti unici e cucine del mondo","serves":"8 persone / circa 750 g","prep":"5 min","cook":"","rest":"","ingredients":["Ceci precotti scolati 500 g","aglio 1 spicchio","succo di limone 100 g","olio EVO 70 g","acqua 75 g","sale fino q.b. GUARNIZIONE: prezzemolo, paprika dolce, scorza di limone, olio EVO e pepe nero q.b."],"steps":["Scolare i ceci e versarli nel frullatore insieme al succo di limone e all'aglio grattugiato.","Aggiungere olio, sale e acqua; frullare fino a ottenere una crema omogenea, regolando la densità con poca acqua se necessario.","Trasferire in una ciotola e completare con prezzemolo tritato, paprika, pepe, scorza di limone e un filo d'olio."],"photo":"https://www.giallozafferano.com/images/347-34772/hummus-without-tahini_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/hummus-without-tahini.html","pdfPage":185,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03856","name":"Khachapuri","category":"Piatti unici e cucine del mondo","serves":"3 khachapuri","prep":"40 min","cook":"20 min","rest":"lievitazione almeno 2 ore","ingredients":["IMPASTO: farina 00 300 g","latte intero tiepido 200 g","lievito di birra 5 g","zucchero 1 cucchiaino","sale fino 1 pizzico. RIPIENO: provola 300 g","tuorli 3. SPENNELLATURA: tuorlo 1","latte intero q.b."],"steps":["Sciogliere il lievito nel latte tiepido con lo zucchero; aggiungere due cucchiai della farina e attendere cinque minuti.","Incorporare il sale e la farina rimasta, impastare fino a ottenere una massa liscia e lasciare lievitare coperta circa due ore.","Dividere l'impasto in tre palline; stendere ogni porzione in un disco.","Distribuire parte della provola grattugiata lungo i lati, arrotolarli verso l'interno e sigillare le estremità formando una barchetta.","Riempire il centro con la provola, spennellare i bordi con tuorlo e latte e cuocere in forno statico a circa 190 °C per 20–25 minuti.","Aprire una cavità nel formaggio, aggiungere un tuorlo a ogni barchetta e rimettere in forno per circa tre minuti. Servire caldo."],"photo":"https://www.giallozafferano.com/images/335-33593/khachapuri_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/khachapuri.html","pdfPage":186,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03857","name":"Kimchi","category":"Piatti unici e cucine del mondo","serves":"circa 2,7 kg","prep":"1 h 15 min","cook":"5 min","rest":"fermentazione almeno 1 settimana (o 2 in frigorifero)","ingredients":["VERDURE: cavolo cinese 1,8 kg","sale fino 35 g","daikon 350 g","cipollotti 200 g","carote 150 g","“Chinese garlic” 100 g (in procedura: garlic chives)","peperoncino secco 10 g. SALSA DI RISO: farina di riso 25 g","zucchero di canna 30 g","acqua 250 g. PASTA ALLO ZENZERO: cipolle bianche 100 g","zenzero fresco 50 g","aglio 2 spicchi."],"steps":["Lavare e tagliare il cavolo cinese; cospargerlo con il sale e lasciarlo spurgare per 30 minuti, mescolarlo e attendere altri 30 minuti.","Cuocere a fuoco dolce acqua, farina di riso e zucchero fino a ottenere una salsa gelatinosa; lasciarla raffreddare.","Tagliare daikon e carote a bastoncini, i cipollotti a rondelle e l'ingrediente denominato “Chinese garlic” nella lista della fonte a pezzetti.","Frullare cipolla bianca, zenzero e aglio; unire la pasta ottenuta alla salsa di riso con peperoncino e verdure preparate.","Risciacquare accuratamente il cavolo salato, scolarlo e amalgamarlo alla salsa speziata.","Trasferire in un vaso idoneo alla fermentazione, comprimere con un peso alimentare e lasciare fermentare come indicato dalla fonte, almeno una settimana al fresco o due settimane in frigorifero."],"photo":"https://www.giallozafferano.com/images/339-33996/kimchi_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/kimchi.html","pdfPage":187,"description":"Fate il pieno di benessere e salute con una ricetta a base di verdure fermentate che è parte integrante della cultura e dell'identità coreana: kimchi!"},{"id":"GZ-03858","name":"Moussaka","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"50 min","cook":"2 h 50 min","rest":"","ingredients":["RAGÙ: manzo macinato 500 g","maiale macinato 500 g","passata di pomodoro 100 g","concentrato di pomodoro 25 g","cipolla 1","sedano 1 costa","aglio 2 spicchi","zucchero 1/2 cucchiaino","vino rosso 1 bicchiere","alloro 2 foglie","cannella 1 stecca","anice stellato, prezzemolo, noce moscata, olio EVO, sale e pepe a piacere.\nMELANZANE: melanzane 1 kg","farina 00 q.b.","olio di semi di arachide q.b. BESCIAMELLA: latte intero 500 g","yogurt greco 250 g","farina 00 50 g","burro 50 g","noce moscata e pepe q.b. FINITURA: Parmigiano Reggiano, pangrattato, origano secco, olio EVO q.b."],"steps":["Soffriggere cipolla, sedano e aglio nell'olio, aggiungere zucchero e carni macinate; rosolare e sfumare con vino rosso.","Unire spezie, passata, concentrato e prezzemolo; condire e cuocere lentamente il ragù per circa 90 minuti.","Affettare le melanzane per il lungo a circa 1 cm, infarinarle leggermente e friggerle in olio a 180 °C; scolarle.","Preparare un roux con burro e farina, incorporare latte caldo aromatizzato, far addensare; dopo qualche minuto di raffreddamento aggiungere yogurt greco.","In una teglia profonda alternare besciamella, melanzane, Parmigiano, pangrattato, origano e ragù; ripetere, terminando con besciamella e formaggio.","Cuocere in forno statico a 180 °C per circa 45 minuti e servire dopo un breve assestamento."],"photo":"https://www.giallozafferano.com/images/302-30219/moussaka_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/moussaka.html","pdfPage":188,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03859","name":"Pad thai","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"10 min","cook":"20 min","rest":"","ingredients":["Tagliatelle di riso 300 g","gamberi puliti 200 g","germogli di soia 150 g","arachidi 80 g","olio di semi 60 g","acqua 50 g","pasta di pesce 40 g","succo di tamarindo 40 g","salsa di soia 20 g","aglio 3 spicchi","coriandolo q.b.","erba cipollina q.b.","lime 1 per guarnire."],"steps":["Lasciare ammorbidire le tagliatelle di riso in acqua tiepida; tritare coriandolo ed erba cipollina.","Tostare le arachidi nel wok con una parte dell’olio, quindi metterle da parte.","Nel wok profumare il restante olio con l’aglio; aggiungere le tagliatelle scolate e saltarle.","Condire con tamarindo, pasta di pesce e metà della salsa di soia; versare l’acqua e incorporare le erbe e i germogli.","Spostare i noodles su un lato, cuocere brevemente i gamberi nell’area libera con la salsa di soia rimasta; riunire il tutto, aggiungere le arachidi e servire con lime."],"photo":"https://www.giallozafferano.com/images/329-32967/pad-thai_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/pad-thai.html","pdfPage":189,"description":"Provate anche voi a realizzare a casa il famoso pad thai e assaporate l'armonia fra note salate, dolci, amare, acide e piccanti, tipica della cucina thailandese!"},{"id":"GZ-03860","name":"Paella algherese","category":"Piatti unici e cucine del mondo","serves":"6 persone","prep":"20 min","cook":"40 min","rest":"","ingredients":["Fregola sarda 400 (unità non indicata nella fonte EN)","salsiccia 200 g","petto di pollo 300 g","cozze 500 g","calamari 200 g","gamberoni 300 g","cipolla bianca 1","peperone giallo 150 g","pomodori 400 g","zafferano 1 bustina","brodo di pollo 1,5 l","sale q.b.","pepe q.b.","bottarga di muggine 40 g","olio EVO 5 cucchiai","piselli 200 g."],"steps":["Pulire le cozze, farle aprire in casseruola coperta e filtrare il liquido di cottura; tenere entrambi da parte.","Tagliare i calamari ad anelli e il pollo a bocconi; sgranare la salsiccia. Ridurre peperone e pomodori a pezzi e tritare la cipolla.","Soffriggere la cipolla in una paellera con l'olio e poco brodo; rosolare salsiccia e pollo, quindi unire peperone, pomodori e piselli.","Aggiungere lo zafferano sciolto in poco brodo, poi la fregola, il brodo rimanente e il liquido delle cozze. Cuocere a fuoco medio secondo i tempi indicati per la fregola, aggiungendo liquido se necessario.","Dopo circa dieci minuti unire i calamari, cinque minuti dopo i gamberoni e negli ultimi tre minuti le cozze.","Regolare il pepe e servire con bottarga di muggine affettata sottile."],"photo":"","source":"https://www.giallozafferano.com/recipes/paella-algherese.html","pdfPage":190,"description":"La paella algherese viene preparata sostituendo il riso con la fregola abbinata con i classici ingredienti della paella catalana"},{"id":"GZ-03861","name":"Paella alla valenciana","category":"Piatti unici e cucine del mondo","serves":"2 persone","prep":"60 min","cook":"40 min","rest":"circa 3 h per il brodo + 5 min finali","ingredients":["PAELLA: riso Bomba 120 g","coniglio in pezzi 150 g","pollo in pezzi 150 g","fegato di coniglio 50 g","pomodori 2","peperone rosso 1/2","fagiolini piattoni 140 g","carciofi 2","aglio 1 spicchio","zafferano in pistilli 6","polpa di peperone choricero 1 cucchiaino","rosmarino 2 rametti","paprika dolce 1/2 cucchiaio","olio EVO 80 g","sale q.b.\nBRODO: scarti di pollo e coniglio","peperone rosso 1/2","pomodoro 1","porro 1","cipolla bianca 1","carota 1/2","aglio 2 spicchi","alloro 2 foglie","acqua 3,5 l","sale e pepe q.b."],"steps":["Preparare il brodo facendo sobbollire per circa tre ore gli scarti di carne con gli ortaggi e gli aromi; filtrare.","Tagliare fagiolini, peperone e carciofi a pezzi; grattugiare i pomodori e tenere pronta la polpa.","Rosolare pollo e coniglio nella paellera con l'olio; aggiungere fegato tritato e sale, poi le verdure e cuocere per circa dieci minuti.","Unire aglio, pomodoro, paprika e polpa di peperone, poi distribuire il riso e tostarlo brevemente.","Versare brodo caldo e zafferano; cuocere senza più mescolare, passando da fiamma alta a media e infine bassa secondo le indicazioni della fonte.","A fine cottura aumentare brevemente la fiamma per creare il fondo croccante, aromatizzare con rosmarino, coprire e far riposare cinque minuti."],"photo":"","source":"https://www.giallozafferano.com/recipes/valencian-paella.html","pdfPage":191,"description":"La paella alla valenciana è un'istituzione della cucina spagnola: cimentatevi anche voi nella preparazione di questo fantastico piatto a base di riso, carne e verdure!"},{"id":"GZ-03862","name":"Paella de marisco","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"60 min","cook":"35 min","rest":"","ingredients":["Riso Bomba 400 g","cozze 1 kg","calamari 500 g","scampi 8","gamberi 8","cipolle 80 g","aglio 1 spicchio","fumetto di crostacei 750 g","passata di pomodoro 200 g","zafferano 0,25 g (2 bustine)","paprika dolce 5 g","peperoncino dolce 1","olio EVO q.b.","sale q.b.","pepe q.b."],"steps":["Preparare il fumetto di crostacei. Pulire le cozze e farle aprire in casseruola con poco olio; filtrare il liquido, sgusciandone la maggior parte e tenendone alcune intere.","Pulire e affettare i calamari; tritare cipolla e peperoncino, preparare l'aglio. Incidere scampi e gamberi per insaporire la cottura.","Rosolare rapidamente i crostacei nella paellera con olio e aglio, poi toglierli. Appassire la cipolla nello stesso fondo con il peperoncino.","Unire i calamari e, dopo pochi minuti, passata di pomodoro, fumetto caldo e liquido filtrato delle cozze. Insaporire con zafferano e paprika e portare a bollore.","Versare riso e cozze sgusciate, regolare il sale con prudenza e mescolare una sola volta. Cuocere per assorbimento a fuoco basso circa 18 minuti, senza rimestare.","Quando il fondo è asciutto, spegnere e disporre scampi, gamberi e cozze con guscio sulla superficie. Servire immediatamente."],"photo":"","source":"https://www.giallozafferano.com/recipes/Seafood-Paella.html","pdfPage":192,"description":"La paella de marisco è una delle ricette più scenografiche della cucina spagnola: un piatto unico a base di riso con cozze, calamari, gamberi, scampi!"},{"id":"GZ-03863","name":"Paella vegetariana","category":"Piatti unici e cucine del mondo","serves":"3 persone","prep":"20 min","cook":"50 min","rest":"","ingredients":["PAELLA: riso Arborio 250 g","peperone rosso 1","zucchine 130 g","piselli 80 g","carota 1","sedano 1 costa","cipolla bianca 1","passata di pomodoro 100 g","zafferano 1 bustina","paprika 1/2 cucchiaino","olio EVO q.b.","prezzemolo 1 ciuffo","sale q.b.","pepe q.b.","aglio in camicia 1 spicchio.\nBRODO: sedano 1 costa","cipolla bianca 1","carota 1","acqua 1,5 l."],"steps":["Cuocere sedano, cipolla e carota in acqua per circa 30 minuti per ottenere un brodo vegetale.","Tritare cipolla, carota e sedano destinati alla paella; affettare peperone e zucchine.","Rosolare le verdure in una paellera con olio e aglio in camicia; salare e pepare, quindi eliminare l'aglio.","Aggiungere il riso, tostarlo un paio di minuti e coprirlo con brodo caldo. Unire zafferano sciolto in poco brodo, paprika e passata.","Aggiungere i piselli e cuocere 15–20 minuti senza mescolare ulteriormente, rabboccando di brodo se necessario.","Far riposare brevemente fuori dal fuoco e completare con olio a crudo e prezzemolo."],"photo":"","source":"https://www.giallozafferano.com/recipes/vegetable-paella.html","pdfPage":193,"description":"La paella vegetariana è un primo piatto, originario della cucina tradizionale spagnola, che celebra la ricchezza e la varietà delle verdure fresche"},{"id":"GZ-03870","name":"Sushi all'italiana","category":"Piatti unici e cucine del mondo","serves":"3 persone / circa 14 rotoli","prep":"30 min","cook":"30 min","rest":"riposo in frigorifero","ingredients":["RISO: riso per sushi 250 g","acqua 300 ml","aceto di riso 75 ml","zucchero 30 g","sale fino 2 g. ROTOLI: foglie intere di bietola 200 g","filetto di salmone senza lische 100 g (idoneo al consumo crudo, preventivamente abbattuto)."],"steps":["Sciacquare ripetutamente il riso finché l'acqua è limpida; ammollarlo per 15 minuti, scolarlo e lasciarlo riposare altri 15 minuti.","Cuocerlo coperto con l'acqua prevista, prima a bollore per 8-10 minuti e poi a fuoco basso per altri 8-10 minuti; lasciar riposare 10 minuti a fuoco spento.","Scaldare senza bollire aceto, zucchero e sale; raffreddare e distribuire sul riso mescolando delicatamente e ventilando per raffreddarlo.","Tagliare a strisce il salmone già reso sicuro per il consumo crudo. Eliminare le coste dure delle bietole, scottare le foglie al vapore per 2-3 minuti e asciugarle.","Sovrapporre le foglie su pellicola alimentare, distribuire riso e salmone, arrotolare strettamente e far assestare in frigorifero prima di tagliare. Nota sicurezza: utilizzare solo pesce conforme ai requisiti di bonifica per consumo crudo."],"photo":"https://www.giallozafferano.com/images/318-31874/italian-style-sushi_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/italian-style-sushi.html","pdfPage":194,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02319","name":"Bombette di pizza alle melanzane","category":"Pizze e lievitati salati","serves":"6 bombette","prep":"20 min","cook":"45 min","rest":"circa 3 ore di lievitazione","ingredients":["IMPASTO: Farina 0 250 g","Acqua 125 ml","Lievito di birra fresco 6 g","Sale fino ½ cucchiaino.\nFARCIA: Melanzane 1","Pomodorini ciliegino 150 g","Aglio 1 spicchio","Olio di semi di arachide q.b.","Sale fino q.b.","Basilico q.b.\nFINITURA: Olio EVO q.b."],"steps":["Sciogliere il lievito nell’acqua a temperatura ambiente e impastare con farina e sale fino a ottenere una massa liscia. Coprire e lasciare raddoppiare per circa 2–3 ore.","Tagliare melanzana e pomodorini. Friggere la melanzana in olio a circa 170 °C, scolarla; far insaporire in padella i pomodorini con aglio e poco olio, poi aggiungere melanzana, basilico e sale. Raffreddare.","Dividere la pasta lievitata in sei porzioni; appiattirle, distribuire circa due cucchiai di farcia fredda al centro e sigillare.","Sistemare le sfere con la chiusura sotto su teglia foderata; coprire e far lievitare altri 30 minuti.","Spennellare con olio EVO e cuocere in forno statico a 200 °C per circa 30 minuti. Servire calde."],"photo":"https://www.giallozafferano.it/images/222-22283/Bombette-di-pizza-alle-melanzane_450x300.jpg","source":"https://ricette.giallozafferano.it/Bombette-di-pizza-alle-melanzane.html","pdfPage":195,"description":"Al loro interno scoprirete un ripieno esplosivo realizzato con due soli ingredienti... bombette di pizza alle melanzane!"},{"id":"GZ-02322","name":"Calzone di cipolla","category":"Pizze e lievitati salati","serves":"8 porzioni","prep":"25 min","cook":"1 h 10 min","rest":"lievitazione 1 ora","ingredients":["IMPASTO: acqua 300 ml","lievito di birra fresco 25 g","farina 00 500 g","sale fino 15 g.\nRIPIENO: cipolle dorate 750 g","pomodori pelati 300 g","sale e pepe q.b.","uovo 1","pecorino 50 g","uvetta sultanina 50 g","olive nere 100 g","olio EVO q.b."],"steps":["Affettare le cipolle e mescolarle con pomodori pelati, olio, sale e pepe. Cuocerle in forno statico a circa 180 °C per 50 minuti e farle intiepidire.","Sciogliere il lievito in parte dell'acqua; unirlo alla farina, incorporare l'acqua rimanente e il sale e impastare fino a ottenere una massa uniforme.","Dividere in due panetti, coprire e lasciare lievitare un'ora.","Stendere il primo panetto in una teglia oliata di circa 35 cm. Mescolare le cipolle con pecorino, uvetta, olive e uovo e distribuire il ripieno.","Coprire con il secondo disco, sigillare i bordi e praticare un foro centrale; ungere la superficie e cuocere in forno statico a circa 250 °C per 20 minuti. Lasciare assestare prima di tagliare."],"photo":"https://www.giallozafferano.com/images/342-34224/onion-calzone_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/onion-calzone.html","pdfPage":196,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02323","name":"Calzone di sponsali","category":"Pizze e lievitati salati","serves":"8 porzioni / teglia 24–26 cm","prep":"30 min","cook":"40 min","rest":"1–2 ore di lievitazione","ingredients":["Ripieno: sponsali puliti 1 kg, olive verdi denocciolate 15, filetti di acciuga sott’olio 5, olio EVO q.b., sale q.b., acqua q.b.","impasto: farina 00 350 g, acqua 200 ml, sale 6 g, lievito di birra secco 2 g, zucchero 1/2 cucchiaino"],"steps":["Sciogliere lievito e zucchero in una parte dell’acqua tiepida; sciogliere il sale nell’acqua restante. Unire entrambi alla farina e impastare fino a ottenere un panetto morbido.","Lasciare lievitare coperto per 1–2 ore, fino al raddoppio.","Pulire e tagliare gli sponsali; stufarli dolcemente con olio e poca acqua per circa 15 minuti, evitando di farli colorire.","Aggiungere olive e acciughe spezzettate, regolare il sale e far asciugare il fondo; raffreddare il ripieno.","Dividere l’impasto in due dischi, foderare una teglia unta, distribuire il ripieno e chiudere con il secondo disco, sigillando i bordi.","Spennellare con olio e cuocere in forno statico a 180 °C per 30–40 minuti."],"photo":"","source":"https://www.giallozafferano.de/rezepte/calzone-di-sponsali.html","pdfPage":197,"description":"Il calzone di sponsali è una specialità pugliese: una croccante focaccia ripiena di sponsali, piccole cipolle porraie, stufati con olive e alici"},{"id":"GZ-02324","name":"Calzone ripieno","category":"Pizze e lievitati salati","serves":"6 calzoni","prep":"30 min","cook":"15 min","rest":"lievitazioni 15 ore","ingredients":["IMPASTO: farina tipo 0 1 kg (fonte EN: “w 2890-290”, valore probabilmente anomalo, non corretto)","lievito di birra fresco 5 g","acqua 600 g","sale fino 20 g. RIPIENO: radicchio 180 g","mozzarella fior di latte 600 g","gorgonzola 400 g. SUPERFICIE: olio EVO q.b.","Parmigiano Reggiano q.b.","pepe nero q.b."],"steps":["Mescolare farina, lievito e quasi tutta l'acqua; incorporare il sale e lavorare aggiungendo l'acqua rimasta fino a ottenere un impasto liscio.","Lasciare lievitare un'ora a temperatura ambiente, poi trasferire in frigorifero per 12 ore.","Dividere in sei panetti e lasciarli riprendere volume per altre due ore.","Affettare il radicchio, tagliare la mozzarella a bastoncini e farla sgocciolare.","Stendere i panetti in dischi di circa 30 cm e farcirli con gorgonzola, radicchio e mozzarella.","Ripiegare ogni disco a mezzaluna, sigillare bene i bordi e condire la superficie con olio, Parmigiano e pepe.","Cuocere su pietra preriscaldata in forno statico a circa 250 °C per 15 minuti; servire caldo."],"photo":"https://ptps.stbm.it/t/kdjc0o_large.jpg","source":"https://www.giallozafferano.com/recipes/Stuffed-Calzone.html","pdfPage":198,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02327","name":"Casatiello napoletano","category":"Pizze e lievitati salati","serves":"10 porzioni","prep":"60 min","cook":"60 min","rest":"lievitazione almeno 4 ore","ingredients":["IMPASTO: farina tipo 0 1 kg","acqua 600 g","strutto 200 g","sale fino 25 g","lievito di birra 15 g.\nRIPIENO: salame napoletano 400 g","provolone piccante 400 g","cicoli 400 g","pecorino romano 200 g","Parmigiano Reggiano 120 g","pepe nero q.b.\nDECORAZIONE: uova intere 5.\nSTAMPO E SUPERFICIE: strutto q.b."],"steps":["Impastare farina, lievito e acqua; aggiungere sale e strutto e lavorare fino a ottenere una pasta elastica. Far lievitare coperto per tre ore.","Tagliare a cubetti salame, provolone e cicoli. Stendere l'impasto a rettangolo, tenendone da parte poco per le strisce decorative.","Distribuire il ripieno sulla pasta, aggiungere pecorino, Parmigiano e pepe e arrotolare dal lato lungo.","Chiudere a ciambella e trasferire in uno stampo unto di strutto.","Posizionare cinque uova intere sulla superficie, fermandole con striscioline di pasta incrociate. Spennellare con strutto e lasciare lievitare un'altra ora.","Cuocere in forno statico a circa 180 °C per 50 minuti nella parte bassa, poi a 200 °C per circa 10 minuti nella parte alta; far intiepidire prima di servire."],"photo":"","source":"https://www.giallozafferano.com/recipes/Neapolitan-casatiello.html","pdfPage":199,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02396","name":"impasto per la pizza","category":"Pizze e lievitati salati","serves":"3 pizze","prep":"30 min","cook":"","rest":"lievitazione consigliata circa 6 h","ingredients":["Farina Manitoba 200 g","farina 00 300 g","acqua a temperatura ambiente 300 ml","sale fino 10 g","lievito di birra fresco 4 g (oppure secco 1,5 g secondo la nota editoriale)."],"steps":["Mescolare le farine e il lievito sbriciolato, quindi aggiungere una parte dell'acqua e iniziare a lavorare.","Incorporare gradualmente l'acqua rimanente e, quando ne è stata assorbita circa metà, aggiungere il sale.","Impastare sul piano fino a ottenere una massa liscia; coprirla e farla riposare brevemente.","Lasciare lievitare secondo le indicazioni della fonte, indicativamente sei ore complessive; dividere in tre panetti e stenderli delicatamente prima della farcitura."],"photo":"https://ptps.stbm.it/t/r0uqbn_large.jpg","source":"https://www.giallozafferano.com/recipes/Pizza-dough.html","pdfPage":200,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02453","name":"Pinsa con fiori di zucca, alici e crema di formaggio","category":"Pizze e lievitati salati","serves":"4 pinse / 8 porzioni","prep":"10 min","cook":"5 min","rest":"","ingredients":["Per 4 pinse: basi pinsa 4","fiori di zucca 50 g","alici sott’olio 30 g","scorza di limone q.b.","origano fresco q.b. Crema: ricotta vaccina 120 g","formaggio fresco spalmabile 120 g","pomodori secchi sott’olio 30 g","latte intero 20 g","sale fino q.b."],"steps":["Tritare i pomodori secchi e amalgamarli a ricotta, formaggio spalmabile e latte; aggiustare di sale e lavorare con una frusta fino a una crema liscia.","Scaldare le basi pinsa in forno ventilato già caldo a circa 250 °C per 5 minuti.","Pulire i fiori di zucca eliminando il pistillo e affettarli sottilmente; tagliare le alici a piccoli pezzi.","Distribuire la crema sulle basi calde, aggiungere alici e fiori di zucca crudi.","Profumare con scorza di limone grattugiata e origano fresco, quindi servire subito."],"photo":"https://www.giallozafferano.com/images/358-35889/pinsa-with-zucchini-flowers-anchovies-and-cheese-cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/pinsa-with-zucchini-flowers-anchovies-and-cheese-cream.html","pdfPage":201,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02454","name":"Pinsa romana","category":"Pizze e lievitati salati","serves":"6 pinse","prep":"30 min","cook":"30 min","rest":"oltre 24 h","ingredients":["IMPASTO: farina per pinsa 1 kg","lievito di birra fresco 7 g","acqua fredda 750 g","sale fino 20 g","olio EVO 20 g. SPOLVERO: semola rimacinata di grano duro q.b. CONDIMENTO: a scelta, non quantificato nella lista ingredienti della fonte."],"steps":["Unire farina e lievito sbriciolato, versare gradualmente quasi tutta l'acqua molto fredda e impastare. Aggiungere sale, olio e acqua rimanente.","Eseguire pieghe di rinforzo; dopo un breve riposo arrotondare il panetto e farlo lievitare in ciotola oliata circa 2 ore.","Maturare in frigorifero per 24-48 ore. Formare porzioni da circa 250-300 g, chiuderle e lasciarle lievitare a temperatura ambiente altre 3-4 ore.","Stendere ciascun panetto su semola in forma ovale senza schiacciare eccessivamente le bolle.","Cuocere inizialmente su pietra preriscaldata al massimo del forno per 7-8 minuti; condire a piacere e completare la cottura per altri 2-3 minuti. Nota: la fonte descrive come esempio una farcitura alla parmigiana, ma non ne specifica le dosi nella lista principale."],"photo":"https://ptps.stbm.it/t/tz7eon_large.jpg","source":"https://www.giallozafferano.com/recipes/Roman-Pinsa.html","pdfPage":202,"description":"Non una focaccia, non una pizza, ma un lievitato unico nel suo genere da condire con i vostri ingredienti preferiti... pinsa romana!"},{"id":"GZ-02461","name":"pizza al tegamino","category":"Pizze e lievitati salati","serves":"2 pizze da 25 cm","prep":"45 min","cook":"60 min","rest":"circa 2 h 30 min di lievitazione","ingredients":["IMPASTO: farina tipo 0 500 g","acqua 300 g","olio EVO 20 g","lievito di birra 10 g","malto 5 g","sale fino 8 g.\nCREMA DI ZUCCHINE: zucchine 400 g","scalogno 1","aglio 1 spicchio","menta 5 g","olio EVO q.b.","sale q.b.\nZUCCHINE FRITTE: zucchine 300 g","olio di girasole q.b.\nOLIO ALLA MENTA: menta 50 g","olio EVO 80 g","ghiaccio q.b.\nCONDIMENTO: mozzarella per pizza 300 g","sale Maldon q.b.","olio EVO q.b."],"steps":["Sciogliere lievito e malto nell'acqua, aggiungere alla farina e amalgamare; lasciare riposare 45 minuti.","Preparare la crema rosolando scalogno e aglio nell'olio, aggiungendo zucchine a cubetti, menta e sale; cuocere e frullare.","Incorporare il sale nell'impasto con pieghe e attendere altri 45 minuti. Friggere le zucchine affettate sottili e scolarle.","Unire l'olio all'impasto con altre pieghe, lasciar riposare 45 minuti. Sbollentare la menta, raffreddarla nel ghiaccio, strizzarla, frullarla con olio e filtrare.","Dividere l'impasto in due, disporre nei tegamini unti e attendere circa 20 minuti. Stendere con le dita, condire con olio e sale e cuocere a 230 °C per 20 minuti sul ripiano basso.","Distribuire la mozzarella, gratinare altri cinque minuti sul ripiano alto e completare con crema di zucchine, zucchine fritte e olio alla menta."],"photo":"","source":"https://www.giallozafferano.com/recipes/pan-pizza.html","pdfPage":203,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02462","name":"Pizza alla diavola","category":"Pizze e lievitati salati","serves":"6 pizze","prep":"1 h 10 min","cook":"6 min per pizza","rest":"biga 24 h + lievitazioni circa 2 h","ingredients":["BIGA: farina tipo 0 500 g","acqua 250 g","lievito fresco 2 g. IMPASTO: farina tipo 0 500 g","acqua 450 g","sale fino 25 g","olio EVO 30 g","lievito fresco 3 g. FARCITURA: pomodori pelati 400 g","mozzarella per pizza 900 g","salame piccante 200 g","basilico q.b.","olio EVO e sale q.b. LAVORAZIONE: olio EVO e semola rimacinata q.b."],"steps":["Preparare la biga mescolando 500 g di farina, 250 g d'acqua e 2 g di lievito; coprire e far maturare 24 ore in frigorifero.","Spezzettare la biga, impastarla con altra farina, lievito e acqua in più riprese; incorporare sale e olio.","Lasciare riposare, effettuare più serie di pieghe e attendere circa un'ora fino al raddoppio.","Dividere in sei panetti, arrotondarli, ungerli e farli lievitare coperti per circa 30 minuti.","Schiacciare i pelati e condirli con olio, sale e basilico; affettare il salame.","Stendere ogni panetto sulla semola, aggiungere pomodoro, mozzarella e salame; cuocere su pietra refrattaria preriscaldata a circa 250 °C per circa sei minuti.","Completare con basilico fresco e servire subito."],"photo":"https://www.giallozafferano.com/images/295-29562/Pizza-alla-diavola_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Pizza-alla-diavola.html","pdfPage":204,"description":"La pizza alla diavola è condita con pomodoro, mozzarella e salame piccante, una delle versioni preferite al mondo! Scopri la ricetta per farla a casa"},{"id":"GZ-02476","name":"pizza di semola","category":"Pizze e lievitati salati","serves":"2 pizze da circa 40 cm","prep":"50 min","cook":"40 min (due pizze)","rest":"Lievitazione: circa 5 h","ingredients":["POOLISH: farina Manitoba 100 g","acqua a temperatura ambiente 100 g","lievito di birra fresco 10 g. IMPASTO: semola rimacinata 400 g","acqua 280 g","sale fino 15 g. FARCITURA: passata di pomodoro 200 g","mozzarella per pizza 300 g","prosciutto crudo q.b.","rucola q.b.","olio EVO 20 g","sale q.b."],"steps":["Sciogliere il lievito nell’acqua del poolish, incorporare la Manitoba, coprire e lasciare fermentare circa 2 ore.","Unire al poolish acqua e semola; impastare circa 10 minuti, poi aggiungere il sale e lavorare altri 5 minuti fino a massa elastica.","Fare alcune pieghe, dividere in due panetti e lasciare lievitare separatamente per almeno 2 ore o fino al raddoppio.","Stendere ciascun panetto in una teglia leggermente unta da 40 cm, lasciando un bordo più alto; attendere un’ulteriore ora.","Condire la passata con sale e olio. Distribuirla sulle basi e cuocere a 220 °C in forno statico, ripiano basso, per 10 minuti.","Aggiungere la mozzarella a strisce e proseguire la cottura per altri 10 minuti per pizza. Completare fuori dal forno con prosciutto crudo e rucola."],"photo":"","source":"https://ricette.giallozafferano.it/Pizza-di-semola.html","pdfPage":205,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00053","name":"Quiche Lorraine","category":"Pizze e lievitati salati","serves":"6 persone","prep":"50 min","cook":"60 min","rest":"1 h per la pasta","ingredients":["Base: farina 00 250 g","burro freddo 125 g","uovo 52 g (circa 1 medio)","sale grosso 5 g. Ripieno: panna fresca liquida 450 g","pancetta tesa dolce 200 g","Gruyère 150 g","uova 165 g (circa 3)","tuorlo 18 g (circa 1)","sale, pepe e noce moscata q.b."],"steps":["Lavorare rapidamente farina, burro freddo, uovo e sale fino a formare una pasta compatta; avvolgerla e farla riposare in frigorifero almeno un’ora.","Tagliare la pancetta a piccoli pezzi, sbollentarla per circa 50 secondi e scolarla; grattugiare il formaggio.","Mescolare panna, uova e tuorlo con sale, pepe e noce moscata, senza montare eccessivamente.","Stendere la pasta a 3–4 mm e foderare uno stampo da 26 cm; bucherellare il fondo.","Distribuire tre quarti del Gruyère, la pancetta e il composto di panna e uova; completare con il formaggio rimasto.","Cuocere in forno statico a 180 °C per 50–60 minuti; lasciare assestare brevemente prima di tagliare."],"photo":"","source":"https://ricette.giallozafferano.it/Quiche-Lorraine.html","pdfPage":206,"description":"Portate un pezzo di Francia nella vostra cucina con una torta salata che è diventata famosa in tutto il mondo grazie al suo sapore deciso: quiche Lorraine!"},{"id":"GZ-00055","name":"Rustici leccesi","category":"Pizze e lievitati salati","serves":"8 rustici","prep":"30 min","cook":"30 min (forno circa 20 min)","rest":"","ingredients":["Pasta sfoglia 920 g (4 rotoli)","passata di pomodoro 30 g","mozzarella 35 g","olio EVO e sale q.b. Besciamella: latte intero 200 g, farina 00 20 g, burro 20 g, sale, pepe e noce moscata q.b. Per spennellare: uovo 1."],"steps":["Preparare una besciamella densa sciogliendo il burro, incorporando la farina e versando il latte caldo; condire e lasciare intiepidire coperta a contatto.","Tagliare finemente la mozzarella e farla asciugare; insaporire la passata con poco olio e sale.","Dalla sfoglia ottenere sedici dischi da 10 cm e otto da 8 cm; sovrapporre i dischi grandi a coppie con una spennellata di uovo.","Al centro disporre besciamella, passata e mozzarella; coprire con il disco piccolo, sigillare i bordi e spennellare.","Cuocere in forno statico preriscaldato a 200 °C per circa 20 minuti, fino a doratura; servire tiepidi."],"photo":"","source":"https://ricette.giallozafferano.it/Rustici-leccesi.html","pdfPage":207,"description":"Dischi di fragrante pasta sfoglia racchiudono un morbido ripieno di besciamella, pomodoro e mozzarella a cui nessuno può resistere: rustici leccesi!"},{"id":"GZ-00082","name":"Bavette con alici al pesto di finocchietto","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"15 min","cook":"15 min","rest":"","ingredients":["Linguine 320 g","alici pulite 120 g","cipollotti rossi 100 g","peperoncino fresco rosso 30 g","aglio 1 spicchio","olio EVO 10 g. PESTO: finocchietto selvatico 50 g","mandorle pelate 30 g","Parmigiano 40 g","olio EVO 100 g","sale e pepe q.b. CRUMBLE: mollica di pane casereccio 60 g","pistacchi tostati salati 20 g","olio EVO 10 (unità non indicata nella fonte)."],"steps":["Ridurre pane e pistacchi in briciole, condire con l’olio previsto per il crumble e tostarli brevemente in padella.","Frullare il finocchietto privato dei gambi duri con mandorle, Parmigiano, olio, sale e pepe fino a ottenere un pesto.","Affettare sottilmente i cipollotti, l’aglio e il peperoncino. Cuocere la pasta in acqua salata.","Rosolare gli aromi con l’olio per circa 5 minuti; unire le alici e proseguire delicatamente per altri 2 minuti.","Trasferire la pasta al dente nel condimento, amalgamare con il pesto e poca acqua di cottura; completare con il crumble."],"photo":"https://ptps.stbm.it/t/79flxv_large.jpg","source":"https://ricette.giallozafferano.it/Bavette-con-alici-al-pesto-di-finocchietto.html","pdfPage":208,"description":"Date una scossa al solito menu con un primo dal gusto intenso e avvolgente, cremoso e croccante al tempo stesso: bavette con alici al pesto di finocchietto!"},{"id":"GZ-00083","name":"Bavette con crema di cannellini rucola e mollica","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"15 min","cook":"60 min","rest":"12 ore di ammollo","ingredients":["Linguine 320 g","Fagioli cannellini secchi 250 g (500 g reidratati)","Rucola 60 g","Pane integrale multi-cereali 80 g","Alloro 2 foglie","Olio extravergine d’oliva 20 g","Timo q.b.","Sale fino q.b.","Pepe nero q.b."],"steps":["Lasciare i cannellini in ammollo per 12 ore. Sciacquarli e lessarli con l’alloro per circa 40–45 minuti, eliminando l’eventuale schiuma.","Sminuzzare il pane nel mixer con olio, timo, sale e pepe per ottenere briciole grossolane; tostarle in padella asciutta finché diventano dorate.","Tagliare la rucola. Tenere da parte un terzo dei fagioli cotti, togliere l’alloro e frullare il resto fino a ricavare una crema morbida, regolando sale e pepe.","Lessare la pasta al dente, trasferirla nella casseruola con la crema di cannellini e incorporare la rucola e i fagioli interi.","Distribuire nei piatti e completare con le briciole di pane croccanti."],"photo":"https://www.giallozafferano.it/images/168-16812/Bavette-con-crema-di-cannellini-rucola-e-mollica_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Bavette-con-crema-di-cannellini-rucola-e-mollica.html","pdfPage":209,"description":"Le bavette con crema di cannellini, rucola e mollica sono realizzate con ingredienti poveri che quasi per magia danno vita a un primo piatto elegante e vellutato!"},{"id":"GZ-03596","name":"Bavette con pesto di agrumi","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"15 min","cook":"10 min","rest":"","ingredients":["Linguine 320 g (il titolo della ricetta riporta “Bavette”)","Basilico 60 g","Limone 110 g (circa 1)","Arance 470 g (circa 2)","Olio extravergine d’oliva 120 g","Sale fino q.b.","Pepe nero q.b.","Pinoli 30 g","Grana Padano DOP grattugiato 60 g"],"steps":["Pela a vivo le arance e il limone, eliminando anche la parte bianca; ricava gli spicchi privi di membrane.","Pulisci e asciuga delicatamente il basilico.","Frulla basilico, pinoli, formaggio e spicchi di agrumi, aggiungendo l’olio a filo, fino a ottenere un pesto omogeneo.","Cuoci la pasta in acqua bollente salata e scolala al dente.","Versa il pesto in una padella, regola sale e pepe, poi unisci la pasta scolata.","Salta brevemente per distribuire il condimento e servi subito."],"photo":"https://www.giallozafferano.com/images/326-32696/bavette-with-citrus-pesto_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/bavette-with-citrus-pesto.html","pdfPage":210,"description":"Le bavette con pesto di agrumi sono un primo piatto profumato e saporito, condito con un pesto al basilico aromatizzato con arance e limoni"},{"id":"GZ-00084","name":"Bavette scampi e melograno","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"15 min","cook":"10 min","rest":"","ingredients":["Linguine 320 g (così nella lista ingredienti della fonte, pur con titolo \"bavette\")","scampi 500 g","chicchi di melograno 100 g","basilico 4 foglie","aglio 1 spicchio","vino bianco 50 g","sale fino q.b.","pepe nero q.b. Nota: nel procedimento è usato olio senza dose indicata nella lista ingredienti."],"steps":["Lavare e tagliare il basilico a striscioline; pulire gli scampi, privandoli del carapace e del filo intestinale, poi tagliarli a pezzetti.","Lessare la pasta in acqua salata.","In una padella rosolare brevemente l'aglio con l'olio citato nel procedimento e rimuoverlo; aggiungere gli scampi e saltarli a fuoco vivo per circa due minuti.","Regolare sale e pepe, sfumare con il vino bianco e farlo evaporare.","Trasferire la pasta al dente in padella con poca acqua di cottura e terminarne la cottura.","Aggiungere metà melograno e basilico; mescolare e guarnire i piatti con i chicchi rimasti."],"photo":"https://www.giallozafferano.com/images/326-32637/bavette-with-scampi-and-pomegranate_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/bavette-with-scampi-and-pomegranate.html","pdfPage":211,"description":"Cosa inserire nel menu di Capodanno? Vi suggeriamo una ricetta originale e di buon auspicio: bavette scampi e melograno, per una saporita fine e un gustoso principio!"},{"id":"GZ-00086","name":"Bucatini con fiori di zucca, guanciale e zafferano","category":"Primi piatti, pasta e gnocchi","serves":"Non indicato nella fonte","prep":"20 min","cook":"20 min","rest":"","ingredients":["Bucatini 320 g","guanciale 220 g","fiori di zucca 20","Parmigiano Reggiano DOP 80 g","Pecorino 80 g","latte intero 40 g","zafferano 1 pizzico","sale fino q.b.","pepe nero q.b."],"steps":["Pulire i fiori di zucca eliminando il pistillo e tagliarli longitudinalmente.","Mescolare Parmigiano e Pecorino grattugiati con latte, poco sale e pepe.","Tagliare il guanciale a listarelle e farlo dorare in padella senza grassi aggiunti; metterlo da parte conservando il fondo di cottura.","Lessare i bucatini per pochi minuti, poi trasferirli nella padella con il grasso del guanciale.","Sciogliere lo zafferano in acqua della pasta e versarlo sui bucatini, completando la cottura con altra acqua quanto basta.","Fuori dal fuoco mantecare con la crema di formaggi e unire i fiori di zucca crudi; guarnire con guanciale croccante e pepe."],"photo":"https://www.giallozafferano.com/images/257-25782/Bucatini-with-zucchini-flowers-guanciale-and-saffron_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Bucatini-with-zucchini-flowers-guanciale-and-saffron.html","pdfPage":212,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00087","name":"Bucatini con sarde, uvetta e pinoli","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"30 min","cook":"20 min","rest":"","ingredients":["Bucatini 320 g","sarde già eviscerate 160 (numero riportato dalla fonte, unità non indicata)","finocchietto selvatico 40 g","uvetta 50 g","pinoli 50 g","aglio 1 spicchio","zafferano 2 bustine","peperoncino q.b.","olio EVO q.b.","sale q.b."],"steps":["Aprire le sarde a libro, eliminare testa e lisca e sciacquarle.","Pulire il finocchietto, sbollentarlo e tenere da parte la sua acqua.","Tostare i pinoli in padella; aggiungere aglio schiacciato, peperoncino e un filo d'olio.","Cuocere i bucatini in acqua salata. Nel frattempo unire in padella le sarde e poca acqua del finocchietto.","Aggiungere finocchietto, uvetta e zafferano, facendo amalgamare il condimento.","Scolare la pasta un paio di minuti prima del termine, trasferirla in padella e ultimare la cottura. Servire con un filo d'olio a crudo."],"photo":"https://www.giallozafferano.com/images/291-29199/bucatini-with-sardines-raisins-and-pine-nuts_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/bucatini-with-sardines-raisins-and-pine-nuts.html","pdfPage":213,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00088","name":"Bucatini cremosi con zucchine e menta","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"10 min","cook":"20 min","rest":"","ingredients":["Bucatini 320 g","zucchine 300 g","anacardi naturali 100 g","menta q.b.","lievito alimentare in scaglie 5 g","aglio 1 spicchio","scorza di limone q.b.","olio EVO q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Affettare le zucchine e rosolarle in padella con aglio e olio per circa dieci minuti, salando e pepando; tenerne alcune da parte per la guarnizione.","Bollire gli anacardi coperti d'acqua per circa cinque minuti finché si ammorbidiscono.","Cuocere i bucatini in acqua salata.","Frullare anacardi con parte della loro acqua, quasi tutte le zucchine, lievito alimentare, menta e sale; diluire con acqua della pasta se necessario.","Scolare i bucatini al dente, unirli alla crema nella padella e saltarli brevemente.","Guarnire con le zucchine rimaste, menta e scorza di limone."],"photo":"https://www.giallozafferano.com/images/281-28100/Creamy-Bucatini-with-Zucchini-and-Mint_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Creamy-Bucatini-with-Zucchini-and-Mint.html","pdfPage":214,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03980","name":"Caccavelle alla sorrentina","category":"Primi piatti, pasta e gnocchi","serves":"4 caccavelle","prep":"60 min","cook":"60 min","rest":"","ingredients":["Caccavelle di Gragnano 4","olio EVO 3 cucchiai","sale fino q.b.","basilico q.b.","mozzarella 200 g","ricotta vaccina 200 g","Parmigiano Reggiano grattugiato 4 cucchiai","cipollotti freschi 4","passata di pomodoro 1 l","RAGÙ BIANCO: carne suina macinata 150 g","salsiccia 100 g","vino rosso 1 bicchiere","sale fino q.b.","pepe nero q.b.","cipolla rossa 35 g","carota 35 g","sedano 35 g."],"steps":["Tritare i cipollotti e farli stufare con olio per 10-15 minuti; aggiungere la passata, sale e basilico, cuocendo per circa 10 minuti senza restringere troppo la salsa.","Per il ragù bianco rosolare sedano, carota e cipolla tritati con olio; unire salsiccia sbriciolata e carne macinata, sfumare con vino rosso e lasciare evaporare. Regolare sale e pepe.","Cuocere le caccavelle in acqua salata per circa 15 minuti, mantenendo un bollore delicato. Tagliare la mozzarella a cubetti.","Disporre ciascuna caccavella in una cocotte con poca salsa sul fondo; farcire con altra salsa, ricotta, ragù e mozzarella.","Coprire con salsa e Parmigiano, quindi cuocere in forno a circa 200 °C per 30-40 minuti."],"photo":"https://www.giallozafferano.com/images/313-31388/caccavelle-alla-sorrentina_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/caccavelle-alla-sorrentina.html","pdfPage":215,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00092","name":"Cannelloni alla napoletana","category":"Primi piatti, pasta e gnocchi","serves":"6 persone","prep":"30 min","cook":"1 h 10 min","rest":"","ingredients":["Cannelloni all'uovo 250 g","passata di pomodoro 700 g","cipolla dorata 1","olio EVO q.b.","sale q.b. RIPIENO: macinato di vitello 200 g","macinato di maiale 150 g","ricotta vaccina 500 g","fiordilatte 200 g","Parmigiano Reggiano 50 g","vino rosso 40 g","aglio 1 spicchio","sale e pepe q.b."],"steps":["Preparare il sugo facendo appassire la cipolla tritata nell’olio; unire la passata e cuocere a fuoco basso per circa 40 minuti.","In un altro tegame rosolare l’aglio e i due macinati, sfumare con il vino, insaporire e far asciugare; togliere l’aglio e raffreddare.","Mescolare la carne con ricotta, metà fiordilatte tagliato, 20 g di Parmigiano, pepe e due cucchiai di sugo.","Stendere un velo di salsa in pirofila, farcire i cannelloni e sistemarli in un solo strato.","Coprire con salsa, fiordilatte e Parmigiano rimasti; cuocere a 220 °C statico per 20 minuti e gratinare brevemente al grill."],"photo":"https://www.giallozafferano.it/images/274-27429/Cannelloni-alla-napoletana_450x300.jpg","source":"https://ricette.giallozafferano.it/Cannelloni-alla-napoletana.html","pdfPage":216,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00093","name":"Cannelloni alle melanzane","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"30 min","cook":"60 min","rest":"","ingredients":["PASTA: farina 00 400 g","uova 220 g (circa 4).\nRIPIENO: melanzane 400 g","mozzarella 150 g","olio extravergine q.b.","sale q.b.\nSUGO: passata di pomodoro 400 g","cipolla gialla 1","basilico 2 foglie","olio EVO q.b.","sale e pepe q.b.\nBESCIAMELLA: latte intero 300 g","farina 00 30 g","burro 30 g","sale e pepe q.b.\nFINITURA: Grana Padano DOP 30 g."],"steps":["Lavorare farina e uova fino a ottenere una pasta elastica; coprire e lasciar riposare 30 minuti.","Stufare la cipolla affettata in olio, unire la passata, salare e pepare; cuocere coperto circa mezz'ora, poi aggiungere il basilico.","Tagliare le melanzane a dadini di circa 1 cm e saltarle con olio e sale per 5–7 minuti; lasciarle intiepidire.","Per la besciamella, tostare brevemente farina e burro, versare il latte caldo poco per volta e mescolare fino a densità cremosa. Ridurre la mozzarella a cubetti.","Stendere la pasta molto sottile (meno di 1 mm) e ritagliare rettangoli di circa 15 × 10 cm; se più spessi, sbollentarli prima di farcirli.","Distribuire melanzane e mozzarella su ogni rettangolo, arrotolare; adagiare in pirofila con un velo di sugo e besciamella.","Coprire con le salse rimanenti e il Grana, cuocere a 175 °C per circa 30 minuti. Lasciar assestare brevemente prima del servizio."],"photo":"https://www.giallozafferano.com/images/230-23015/Cannelloni-with-eggplant_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Cannelloni-with-eggplant.html","pdfPage":217,"description":"Una variante vegetariana che stuzzicherà l'appetito anche dei più tradizionalisti grazie al suo ripieno morbido e filante... cannelloni alle melanzane!"},{"id":"GZ-00094","name":"Cannelloni di crespelle","category":"Primi piatti, pasta e gnocchi","serves":"8 persone / 8 crespelle","prep":"30 min","cook":"35 min (+3 h ragù)","rest":"","ingredients":["CRESPELLE: uova 3","latte intero 500 g","farina 00 250 g","burro 1 panetto per ungere (fonte: 1 stick).\nRAGÙ: manzo macinato 1 lb (unità originale inglese)","maiale macinato 300 g","sedano 1 costa","carota 1","cipolla bianca 1","sale e pepe q.b.","olio EVO 30 g","passata 300 g","acqua 1 l","piselli in scatola 250 g","scamorza affumicata 150 g","vino bianco 50 g.\nBESCIAMELLA: burro 100 g","farina 00 100 g","latte intero 1 l","sale e noce moscata q.b.\nFINITURA: timo q.b.","pangrattato 3 cucchiai","Parmigiano Reggiano 3 cucchiai."],"steps":["Soffriggere sedano, carota e cipolla tritati in olio; aggiungere le carni macinate, rosolarle e sfumare col vino.","Versare acqua e passata e far restringere il ragù a fuoco dolce per circa 3 ore. Negli ultimi minuti aggiungere i piselli, regolare sale e pepe.","Preparare la besciamella: amalgamare burro e farina, incorporare gradualmente il latte caldo e cuocere fino a consistenza cremosa, insaporendo con sale e noce moscata.","Sbattere uova e latte, unire la farina setacciata; far riposare la pastella 30 minuti in frigorifero. Cuocere 8 crespelle sottili in padella imburrata, circa un minuto per lato.","Amalgamare un poco di besciamella al ragù; tagliare la scamorza a cubetti.","Velare una pirofila di besciamella e pangrattato. Farcire ogni crespella con ragù e scamorza, arrotolarla e disporla nella pirofila.","Coprire con besciamella, timo e Parmigiano; passare in forno statico a 180 °C per circa 10 minuti e gratinare a 240 °C per altri 5 minuti."],"photo":"https://www.giallozafferano.com/images/228-22834/crespelle-crepes-cannelloni-pasta_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/crespelle-crepes-cannelloni-pasta.html","pdfPage":218,"description":"Abbiamo abbinato la ricetta delle crepe al classico ragù di carne per realizzare un ghiotto primo piatto per le occasioni speciali: cannelloni di crespelle!"},{"id":"GZ-00095","name":"Cannelloni giallo oro","category":"Primi piatti, pasta e gnocchi","serves":"6 persone","prep":"15 min","cook":"30 min","rest":"","ingredients":["Cannelloni all'uovo 250 g","uova 6","Parmigiano Reggiano 100 g","Pecorino 100 g","guanciale 100 g","pepe nero q.b.","burro q.b. per la teglia.\nSALSA: panna fresca liquida 150 g","Parmigiano Reggiano 60 g."],"steps":["Eliminare la cotenna dal guanciale, ridurlo a listarelle e rosolarlo in padella senza grassi aggiunti per circa 10 minuti; scolarlo e farlo raffreddare.","Tritarne una parte. Sbattere le uova con Pecorino, Parmigiano (tenendone 10–20 g per la superficie) e pepe; incorporare il guanciale tritato.","Riempire una sac-à-poche con il composto e farcire i cannelloni. Allinearli in una pirofila imburrata.","Scaldare la panna con i 60 g di Parmigiano destinati alla salsa, mescolando fino a scioglimento; versarla sui cannelloni e pepare.","Coprire con alluminio e cuocere in forno statico a 175 °C per 25 minuti.","Scoprire, aggiungere il guanciale rimasto e il Parmigiano tenuto da parte; gratinare per circa 3 minuti a temperatura elevata e servire."],"photo":"https://www.giallozafferano.com/images/352-35232/golden-yellow-cannelloni_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/golden-yellow-cannelloni.html","pdfPage":219,"description":"Uova, guanciale e Pecorino incontrano (forse) per la prima volta la panna per creare un ripieno irresistibilmente cremoso e avvolgente... cannelloni giallo oro!"},{"id":"GZ-00096","name":"Cannelloni ricotta e spinaci","category":"Primi piatti, pasta e gnocchi","serves":"8 cannelloni","prep":"1 h 20 min","cook":"30 min","rest":"","ingredients":["PASTA: farina 00 100 g","uovo medio 1 (55 g).\nRIPIENO: spinaci 250 g","ricotta vaccina 150 g","uovo medio 1","aglio 1 spicchio","olio EVO q.b.","Grana Padano 50 g","noce moscata 1 pizzico","sale e pepe q.b.\nBESCIAMELLA: latte intero 500 g","farina 00 37 g","burro 50 g","sale 1 pizzico","noce moscata q.b.","pepe 1 pizzico.\nGRATINATURA: Grana Padano q.b."],"steps":["Impastare farina e un uovo fino a ottenere una sfoglia elastica; avvolgerla e lasciarla riposare circa un'ora.","Insaporire l'olio con l'aglio, rimuoverlo e stufare gli spinaci puliti e salati per circa 5 minuti; farli raffreddare e tritarli.","Preparare la besciamella con burro, farina e latte caldo; cuocerla 5–6 minuti mescolando e aggiungere sale, pepe e noce moscata.","Mescolare spinaci, ricotta, secondo uovo, Grana, sale, pepe e noce moscata; trasferire in sac-à-poche.","Tirare la pasta a circa 2 mm, tagliare rettangoli 9 × 14 cm e sbollentarli uno per volta per circa un minuto; asciugarli su un telo.","Distribuire il ripieno al centro e arrotolare. Sistemare su un fondo di besciamella e coprire con la salsa restante e Grana.","Cuocere in forno statico a 200 °C per circa 15 minuti, poi gratinare a 230 °C per altri 5 minuti."],"photo":"https://ptps.stbm.it/t/mqnuzu_large.jpg","source":"https://www.giallozafferano.com/recipes/Spinach-and-ricotta-cannelloni.html","pdfPage":220,"description":"I cannelloni di ricotta e spinaci sono un classico primo piatto per il pranzo della domenica o per le feste. Un'alternativa ai classici al ragù!"},{"id":"GZ-00098","name":"Carbonara al forno","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"20 min","cook":"15 min","rest":"","ingredients":["Bucatini 320 g","uovo intero 1","tuorli 4","pancetta affumicata 150 g","Pecorino grattugiato 100 g","panna fresca liquida 200 ml","sale fino q.b.","pepe nero q.b."],"steps":["Portare a bollore l'acqua per la pasta; intanto rosolare i cubetti di pancetta in padella antiaderente senza olio fino a leggera croccantezza.","Sbattere uovo e tuorli, unire gran parte del Pecorino, sale e pepe; incorporare la panna e quasi tutta la pancetta.","Cuocere i bucatini in acqua moderatamente salata e scolarli al dente, dopo circa 10 minuti o secondo consistenza.","Amalgamare la pasta al composto di uova e trasferirla in una pirofila leggermente unta.","Cospargere con pancetta e Pecorino tenuti da parte; gratinare in forno molto caldo per 5–7 minuti e servire subito."],"photo":"https://www.giallozafferano.com/images/293-29392/baked-carbonara_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baked-carbonara.html","pdfPage":221,"description":"La carbonara al forno è un primo piatto molto saporito a base di bucatini, pancetta, uova e pecorino. La pasta viene cotta e poi passata in forno"},{"id":"GZ-00099","name":"Carbonara alla romana cremosa","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"25 min","cook":"15 min","rest":"","ingredients":["Spaghettoni 320 g","guanciale 200 g","tuorli medi 4","Grana Padano DOP 30 g","Pecorino Romano DOP 20 g","pepe nero macinato 20 g (quantità riportata dalla fonte)","Pecorino Romano per servire 20 g."],"steps":["Privare il guanciale della cotenna e delle parti di pepe superficiali, tagliarlo a cubetti e rosolarlo lentamente senza olio; conservare sia il guanciale sia il grasso rilasciato.","Cuocere gli spaghettoni in acqua appena salata. Nel frattempo grattugiare i formaggi e unirli ai tuorli in una ciotola d'acciaio, con il pepe indicato dalla fonte.","Mescolare la crema con una frusta e aggiungere poca acqua di cottura; scaldare dolcemente a bagnomaria senza far rapprendere le uova.","Incorporare parte del grasso del guanciale e continuare a mescolare fino a ottenere una salsa densa e setosa; la fonte indica circa 65 °C per la crema.","Scolare la pasta nella ciotola, mantecare con acqua di cottura e gran parte del guanciale; terminare con il guanciale restante e il Pecorino per il servizio."],"photo":"https://www.giallozafferano.com/images/251-25187/Traditional-carbonara_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Traditional-carbonara.html","pdfPage":222,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00101","name":"Carbonara di mare","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"25 min","cook":"20 min","rest":"","ingredients":["Spaghetti 320 g","tonno fresco 100 g","pesce spada 100 g","salmone 100 g","tuorli 6","Parmigiano Reggiano 60 g","vino bianco 60 g","aglio 1 spicchio","timo 6 rametti","olio EVO q.b.","sale e pepe q.b."],"steps":["Sbattere i tuorli con Parmigiano, pepe, poco sale e foglioline di timo; diluire con una piccola quantità d'acqua di cottura.","Controllare il pesce, eliminare eventuali spine e tagliare tonno, spada e salmone a cubetti regolari.","Mettere a cuocere gli spaghetti in acqua salata, mantenendoli leggermente indietro di cottura.","Scaldare olio e aglio in padella; aggiungere i cubetti di pesce, rosolarli velocemente e sfumare con vino bianco. Quando il vino è evaporato, prelevare il pesce e tenerlo da parte.","Trasferire la pasta in padella con poca acqua di cottura e mescolare per emulsionare il fondo.","Incorporare la crema di tuorli e poi il pesce, regolando la fluidità con altra acqua di cottura. Servire subito con pepe e formaggio secondo la fonte."],"photo":"https://ptps.stbm.it/t/ljy6rd_large.jpg","source":"https://www.giallozafferano.com/recipes/Seafood-carbonara.html","pdfPage":223,"description":"Abbiamo sostituito il guanciale con morbidi cubetti di salmone, tonno e pesce spada per una variante altrettanto ricca e cremosa: carbonara di mare!"},{"id":"GZ-00102","name":"Carbonara di mare con gamberi","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"30 min","cook":"25 min","rest":"","ingredients":["Spaghetti 320 g","tonno 100 g","pesce spada 100 g","gamberi 12","scorza di lime q.b.","sale q.b.","pepe bianco e nero q.b.","olio EVO q.b.\nCREMA: Pecorino 60 g","tuorli 4","pepe bianco q.b.\nFINITURA: bottarga di tonno q.b."],"steps":["Pulire i gamberi separando teste, carapaci e polpa; tritare la polpa, condirla con scorza di lime, sale, pepe bianco e olio e tenerla da parte come tartare.","Mescolare tuorli, Pecorino e pepe bianco; scaldare delicatamente la crema a bagnomaria senza farla coagulare.","Frullare le teste dei gamberi con 1 cucchiaio e mezzo d'olio e 2 cucchiai d'acqua, come specificato nel procedimento ufficiale; filtrare con cura per ricavare il fondo.","Tagliare tonno e spada a cubetti, saltarli con olio, sale e pepe per circa 2 minuti; trasferirli in un piatto.","Cuocere gli spaghetti e scolarli al dente; versarli nella padella con il fondo di gamberi e mantecare con la crema di tuorli.","Riunire il pesce scottato, aggiustare la consistenza con acqua di cottura e impiattare con tartare di gamberi e bottarga. Usare solo materia prima idonea al consumo crudo."],"photo":"https://www.giallozafferano.com/images/293-29386/seafood-carbonara-with-shrimp_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/seafood-carbonara-with-shrimp.html","pdfPage":224,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00103","name":"Carbonara di mare viareggina","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"40 min","cook":"30 min","rest":"","ingredients":["Spaghetti 320 g","cozze 500 g da pulire","vongole 500 g da pulire","calamari 300 g da pulire","gamberi 12","uova intere 2","tuorlo 1","panna fresca 50 g","aglio 2 spicchi","prezzemolo q.b.","olio EVO q.b.","sale e pepe q.b."],"steps":["Pulire calamari, gamberi, cozze e vongole. Tagliare i calamari ad anelli e sgusciare i gamberi.","Scaldare olio e uno spicchio d'aglio; far aprire cozze e vongole in pentola coperta. Filtrare il liquido e sgusciare quasi tutti i molluschi, tenendone alcuni per decorare.","Unire gran parte del liquido dei molluschi all'acqua destinata alla pasta; conservare il resto.","In un'altra padella scaldare olio e aglio, saltare calamari e gamberi per 3–4 minuti, bagnare con il liquido tenuto da parte e aggiungere cozze e vongole.","Sbattere le uova e il tuorlo con panna, sale e pepe. Cuocere gli spaghetti e trasferirli nella padella con il pesce.","Spegnere il fuoco, incorporare rapidamente la crema d'uovo evitando che rapprenda e completare con prezzemolo tritato."],"photo":"https://www.giallozafferano.com/images/293-29388/viareggio-style-seafood-carbonara_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/viareggio-style-seafood-carbonara.html","pdfPage":225,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00104","name":"Carbonara di salmone","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"10 min","cook":"15 min","rest":"","ingredients":["Spaghetti 320 g","filetti di salmone 300 g","uovo medio 1","tuorli medi 3","Pecorino Romano DOP 60 g","aglio 1 spicchio","olio EVO q.b.","sale e pepe q.b."],"steps":["Portare a bollore l'acqua per la pasta. Privare il salmone della pelle, controllare le spine e tagliarlo a cubetti.","Scaldare olio e aglio in padella; aggiungere il salmone e saltarlo a fiamma vivace per 2–3 minuti, poi eliminare l'aglio.","Cuocere gli spaghetti in acqua salata. Intanto sbattere l'uovo intero e i tuorli con Pecorino grattugiato e pepe.","Scolare la pasta al dente e saltarla brevemente con il salmone e un mestolo d'acqua di cottura.","Fuori dal fuoco versare il composto di uova, mescolando rapidamente per ottenere una salsa cremosa; allungare con poca acqua di cottura se necessario e servire subito."],"photo":"https://www.giallozafferano.com/images/293-29390/salmon-carbonara_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/salmon-carbonara.html","pdfPage":226,"description":"La classica cremina a base di uova, pepe e Pecorino viene impreziosita con cubetti di pesce fresco per una variante davvero appetitosa: carbonara di salmone!"},{"id":"GZ-00105","name":"Carbonara vegetariana","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"60 min","cook":"60 min","rest":"","ingredients":["Spaghetti 320 g","peperoni gialli 1,2 kg","tofu 180 g","zafferano 0,3 g (2 bustine da 0,15 g)","peperoncino fresco 1","erba cipollina q.b.","olio EVO q.b.","sale fino q.b.\nDECORAZIONE: tofu q.b."],"steps":["Lavare i peperoni e arrostirli in forno statico molto caldo, circa 250 °C per 50 minuti, finché la pelle risulta brunita.","Tagliare il tofu a cubetti; rosolarlo in padella con olio e peperoncino a rondelle. Sciogliere lo zafferano in poca acqua calda e versarlo sul tofu.","Coprire i peperoni cotti in una ciotola per circa 10 minuti, quindi privarli della pelle e dei semi.","Frullare la polpa dei peperoni con sale e olio fino a ottenere una salsa liscia; unirla al tofu in padella.","Cuocere gli spaghetti in acqua salata, scolarli al dente e mantecarli con la crema, aggiungendo acqua di cottura se occorre.","Completare con erba cipollina tritata e scaglie di tofu, servendo immediatamente."],"photo":"https://www.giallozafferano.com/images/293-29393/vegetarian-carbonara_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/vegetarian-carbonara.html","pdfPage":227,"description":"La più famosa delle paste italiche sfida la sua versione moderna e rigorosamente vegetariana: chi vincerà tra la classica carbonara e la variante con peperoni e tofu?"},{"id":"GZ-00107","name":"Cavatelli","category":"Primi piatti, pasta e gnocchi","serves":"4 persone / circa 500 g di pasta","prep":"15 min","cook":"non indicata","rest":"","ingredients":["Semola rimacinata di grano duro 400 g","acqua a temperatura ambiente 240 g","sale fino q.b."],"steps":["Mescolare semola e sale in una ciotola; versare l'acqua poco per volta impastando fino a completo assorbimento.","Trasferire sulla spianatoia e lavorare per 5–10 minuti, finché la massa risulta omogenea e liscia.","Formare una palla, coprire e lasciare riposare a temperatura ambiente per circa 30 minuti, come indicato nel procedimento.","Prelevare un pezzo alla volta e arrotolarlo in cordoncini di circa 6–7 mm di diametro; tagliarli in tocchetti di circa 1 cm.","Premere ogni tocchetto con il pollice e trascinarlo leggermente in avanti per creare la cavità centrale.","Sistemare i cavatelli su un vassoio infarinato di semola, ben separati, e cuocerli in acqua bollente secondo necessità."],"photo":"https://ptps.stbm.it/t/ahkxj1_large.jpg","source":"https://www.giallozafferano.com/recipes/Cavatelli.html","pdfPage":228,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00108","name":"Cavatelli ai fiori di zucca cozze e zafferano","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"45 min","cook":"15 min","rest":"","ingredients":["CAVATELLI: farina 00 250 g","semola 250 g","acqua 260 ml","olio EVO 2 cucchiaiate.\nSPOLVERO: semola q.b.\nCONDIMENTO: fiori di zucca 200 g","cozze 2 kg","zafferano 1 bustina","aglio 1 spicchio","prezzemolo q.b.","olio EVO q.b.","sale e pepe q.b.\nPASTELLA: acqua frizzante 150 ml","farina 00 50 g","bicarbonato 1/2 cucchiaino","sale q.b.\nFARCIA FIORI: burrata 60 g","pomodori secchi sott'olio 4.\nFRITTURA: olio di arachide 500 ml."],"steps":["Impastare farina 00, semola, acqua e olio; lavorare fino a consistenza elastica e far riposare coperto per circa 30 minuti.","Pulire accuratamente le cozze; farle aprire in padella coperta con olio e aglio per circa 5 minuti. Sgusciarne la maggior parte e conservarne alcune intere per la presentazione.","Sciogliere lo zafferano in poco liquido di cottura delle cozze e unirlo al fondo; regolare sale, pepe e prezzemolo.","Tenere da parte 4 fiori di zucca grandi, farcirli con burrata e pomodori secchi e chiuderli delicatamente. Pulire e tagliare a striscioline gli altri fiori.","Mescolare farina, bicarbonato, acqua frizzante e sale per una pastella liscia; farla riposare al fresco.","Formare cordoncini di pasta, tagliarli a pezzetti e incavarli con le dita per ottenere i cavatelli. Cuocerli in acqua salata per circa 3–4 minuti.","Passare i fiori farciti nella pastella e friggerli nell'olio a circa 180 °C fino a doratura, poi scolarli.","Saltare i cavatelli con cozze e fondo allo zafferano per altri 2 minuti; aggiungere i fiori a striscioline e impiattare con un fiore fritto."],"photo":"https://www.giallozafferano.com/images/318-31842/cavatelli-with-zucchini-flowers-mussels-and-saffron_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/cavatelli-with-zucchini-flowers-mussels-and-saffron.html","pdfPage":229,"description":"I cavatelli ai fiori di zucca cozze e zafferano sono un primo colorato e gustoso, che unisce la bontà del mare a quella dei frutti della terra!"},{"id":"GZ-00109","name":"Cavatelli ai frutti di mare","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"2 h","cook":"30 min","rest":"","ingredients":["CAVATELLI: semola rimacinata 400 g","acqua a temperatura ambiente 240 g","sale fino 1 pizzico.\nSUGO: cozze 500 g","vongole 500 g","cannolicchi 500 g","cockles (denominazione della fonte inglese) 500 g","pomodorini 300 g","peperoncini freschi 2","prezzemolo q.b.","aglio 2 spicchi","olio EVO q.b.","pepe nero q.b."],"steps":["Mettere a spurgare separatamente i diversi molluschi in acqua fredda salata, cambiando l'acqua più volte per circa due ore.","Impastare semola, acqua e sale; lavorare 5–10 minuti e far riposare la pasta coperta per 30 minuti.","Formare cordoncini di circa 1 cm, tagliarli in tocchetti e incavarli con il pollice; disporli su un vassoio con semola.","Tagliare i pomodorini in quarti e farli appassire in padella con olio e poco sale per 10–15 minuti. Pulire le cozze.","Aprire vongole e cannolicchi in una pentola con aglio, olio e peperoncino; in un'altra pentola far aprire cozze e cockles con il restante aglio e peperoncino.","Filtrare e conservare il liquido dei molluschi, sgusciandone la maggior parte; tenere alcuni gusci per il servizio.","Cuocere i cavatelli in acqua salata, scolarli al dente e saltarli con pomodorini e parte del liquido filtrato.","A fuoco spento aggiungere tutti i molluschi, prezzemolo, pepe e un filo d'olio; servire immediatamente."],"photo":"https://www.giallozafferano.com/images/251-25165/Seafood-cavatelli_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Seafood-cavatelli.html","pdfPage":230,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00111","name":"Cavatelli con salsiccia e cime di rapa","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"10 min","cook":"25 min","rest":"","ingredients":["Salsiccia 400 g","cavatelli 320 g","cime di rapa 400 g","aglio 2 spicchi","peperoncino fresco 1","mollica di pane 100 g","olio EVO 40 g","sale fino q.b."],"steps":["Mondare le cime di rapa, separare le foglie più tenere e lavarle; frullare grossolanamente la mollica di pane.","Eliminare il budello della salsiccia, dividerla in piccole polpette e rosolarla in padella calda per circa 10 minuti; metterla da parte.","Tostare la mollica in un altro tegame con olio e peperoncino tritato, mescolando finché risulta dorata.","Nella padella della salsiccia far profumare l'olio con gli spicchi d'aglio, unire le cime di rapa e cuocerle circa 10 minuti; eliminare l'aglio.","Aggiungere la salsiccia alle verdure, regolare il sale e lasciar insaporire.","Lessare i cavatelli in acqua salata, scolarli e saltarli con il condimento; completare con la mollica croccante."],"photo":"https://www.giallozafferano.com/images/239-23990/Cavatelli-with-sausage-and-broccoli-rabes_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Cavatelli-with-sausage-and-broccoli-rabes.html","pdfPage":231,"description":"Un primo piatto saporito ispirato alla cucina del Molise, reso ancora più speciale dalla mollica croccante: cavatelli con salsiccia e cime di rapa!"},{"id":"GZ-00112","name":"Cavatelli con salsiccia e fiori di zucca","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"20 min","cook":"35 min","rest":"","ingredients":["IMPASTO: semola rimacinata 250 g","olio EVO 8 g","acqua tiepida 150 g.\nCONDIMENTO: salsiccia luganega 360 g","fiori di zucca 150 g","timo 3 rametti","finocchietto selvatico 1 cucchiaino","olio EVO 10 g","vino bianco 50 g","aglio 1 spicchio","sale e pepe q.b."],"steps":["Versare l'acqua nella semola poco per volta, aggiungere l'olio e impastare fino a ottenere una pasta elastica; farla riposare coperta per 30 minuti.","Spellare la salsiccia e spezzettarla. Scaldare olio e aglio in padella, eliminare l'aglio dorato e rosolare la salsiccia.","Sfumare con il vino bianco, far evaporare e proseguire brevemente la cottura coperta; profumare con timo e finocchietto.","Formare cordoncini con la pasta, tagliarli a pezzetti e incavarli trascinando le dita; lasciarli riposare su un vassoio con semola per 15–30 minuti.","Lessare i cavatelli in acqua salata per circa 5–6 minuti, verificando la consistenza.","Pulire i fiori di zucca, rimuovere il pistillo e dividerli. Saltare i cavatelli con la salsiccia, unire i fiori solo alla fine e servire caldi."],"photo":"https://www.giallozafferano.com/images/321-32169/cavatelli-with-sausage-and-zucchini-flowers_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/cavatelli-with-sausage-and-zucchini-flowers.html","pdfPage":232,"description":"I cavatelli con salsiccia e fiori di zucca sono un primo piatto sfizioso e molto saporito, con salsiccia luganega e teneri fiori di zucca"},{"id":"GZ-00116","name":"Conchiglioni ripieni","category":"Primi piatti, pasta e gnocchi","serves":"6 persone","prep":"30 min","cook":"1 h 15 min","rest":"","ingredients":["Conchiglioni 300 g","passata di pomodoro 600 g","Parmigiano Reggiano 1/4 tazza da grattugiare (fonte senza peso)","olio EVO q.b.","cipolla gialla 60 g","sale e pepe q.b.\nRIPIENO: maiale macinato 125 g","manzo macinato 125 g","ricotta vaccina 400 g","mozzarella 250 g","Parmigiano Reggiano 30 g","vino rosso 45 g","sale e pepe q.b.","uovo medio 1 (55 g)","aglio 1 spicchio."],"steps":["Tritare la cipolla e farla stufare in olio per circa 10 minuti; aggiungere la passata e cuocere coperto per almeno 45 minuti, regolando sale e consistenza.","Tagliare la mozzarella: tenere alcune fette per la copertura e ridurre il re
