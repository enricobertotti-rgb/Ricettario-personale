i golosi, dal colore candido come la neve e dal gusto delicatamente vanigliato: cioccolata calda bianca!"},{"id":"GZ-03811","name":"Cioccolata calda su stecco","category":"Bevande e cocktail","serves":"10 stecchi","prep":"15 min","cook":"10 min","rest":"frigorifero almeno 2 ore","ingredients":["BASE: cioccolato fondente 430 g","zucchero a velo 45 g","amido di mais 45 g","cacao amaro 22 g.\nMANDORLA/CARDAMOMO: mandorle a lamelle 1 cucchiaino","cardamomo 1 pizzico.\nPISTACCHIO/PEPERONCINO: pistacchi tritati 1 cucchiaino","peperoncino verde 1 pizzico.\nNOCCIOLA/CANNELLA: nocciole tritate 1 cucchiaino","cannella in polvere 1 pizzico.\nCOCCO/ZENZERO: cocco rapè 1 cucchiaino","zenzero in polvere 1 pizzico.\nFIORI/SALE: fleur de sel 1 pizzico","fiori eduli essiccati q.b."],"steps":["Tritare il cioccolato e scioglierlo dolcemente a bagnomaria, evitando il contatto della ciotola con l'acqua.","Setacciare zucchero a velo, amido e cacao e incorporarli poco alla volta al cioccolato fuso.","Trasferire la massa in una tasca da pasticceria e riempire dieci cavità di uno stampo per cubetti.","Mescolare gli abbinamenti aromatici e distribuire una guarnizione diversa su coppie di cubetti.","Inserire uno stecco in ciascuna porzione e far solidificare in frigorifero per almeno due ore.","Per preparare la bevanda, sciogliere uno stecco in latte caldo; se necessario riscaldare ulteriormente per addensare."],"photo":"","source":"https://www.giallozafferano.com/recipes/hot-chocolate-on-a-stick.html","pdfPage":64,"description":"Riscaldate il cuore delle persone a voi più care con un'idea regalo pratica e originale, da aromatizzare nei modi più svariati: cioccolata calda su stecco!"},{"id":"GZ-03812","name":"Crema di limoncello","category":"Bevande e cocktail","serves":"circa 1,3 litri","prep":"10 min","cook":"10 min","rest":"10 giorni macerazione + 15–20 giorni in frigorifero","ingredients":["Scorza di limoni non trattati 5","Alcol puro a 95° 500 g","Latte intero 400 g","Panna fresca liquida 350 g","Zucchero 400 g."],"steps":["Lavare i limoni, prelevare soltanto la scorza gialla e immergerla nell’alcol in un barattolo ben chiuso.","Tenere al buio e al fresco per dieci giorni, agitando il contenitore una o due volte al giorno.","Scaldare latte, panna e zucchero mescolando, fino quasi al bollore; lasciare sciogliere tutto lo zucchero e raffreddare completamente.","Filtrare l’alcol aromatizzato eliminando le scorze.","Unire l’alcol al composto di latte e panna freddo, mescolare e imbottigliare.","Lasciare maturare in frigorifero per almeno 15–20 giorni prima di servire."],"photo":"https://ptps.stbm.it/t/840cye_large.jpg","source":"https://www.giallozafferano.com/recipes/limoncello-cream.html","pdfPage":65,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03815","name":"Hugo spritz","category":"Bevande e cocktail","serves":"4 cocktail","prep":"5 min","cook":"","rest":"","ingredients":["Per 4 cocktail: ghiaccio 500 g","Prosecco 240 ml","sciroppo di fiori di sambuco 180 ml","soda 300 ml","menta 16 foglie. Decorazione: lime 1","menta q.b."],"steps":["Preparare quattro bicchieri ampi e riempirli per metà di ghiaccio.","Distribuire il Prosecco e lo sciroppo di sambuco nei bicchieri secondo le quantità complessive della fonte.","Aggiungere quattro foglie di menta a bicchiere e altro ghiaccio.","Completare con soda, mescolare delicatamente e decorare con una fettina di lime e menta fresca.","Servire immediatamente, ben freddo."],"photo":"https://www.giallozafferano.com/images/303-30391/hugo-spritz_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/hugo-spritz.html","pdfPage":66,"description":"Scopri come preparare l'hugo spritz, un cocktail realizzato con prosecco, sciroppo di fiori di sambuco, soda e foglie di menta... fresco e dissetante!"},{"id":"GZ-03816","name":"Limoncello veloce","category":"Bevande e cocktail","serves":"circa 2,5 l","prep":"20 min","cook":"5 min","rest":"1 giorno macerazione + 10 giorni","ingredients":["Limoni non trattati 10","alcol puro a 96° 1 l","acqua 1,2 l","zucchero 800 g."],"steps":["Lavare accuratamente i limoni e prelevare solo la parte gialla della scorza con un pelapatate.","Coprire completamente le scorze con l'alcol in un recipiente idoneo, chiudere e lasciare macerare al buio per almeno 24 ore.","Scaldare acqua e zucchero mescolando finché lo zucchero è sciolto; far raffreddare completamente lo sciroppo.","Filtrare l'alcol eliminando le scorze, unire lo sciroppo freddo e mescolare.","Chiudere ermeticamente e lasciare riposare in luogo fresco e buio per 10 giorni; servire ben freddo. Prodotto alcolico destinato ad adulti."],"photo":"","source":"https://ricette.giallozafferano.it/Limoncello-veloce.html","pdfPage":67,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03817","name":"Liquore al basilico","category":"Bevande e cocktail","serves":"circa 600 ml","prep":"20 min","cook":"","rest":"40 giorni di macerazione + riposo finale","ingredients":["Basilico 50 g","alcol puro 250 ml (la fonte indica 90°)","acqua 150 g","zucchero 200 g."],"steps":["Lavare e asciugare le foglie di basilico non trattato, metterle in un vaso con chiusura e coprirle con l'alcol.","Lasciare macerare per almeno venti giorni al fresco e lontano dalla luce.","Preparare uno sciroppo sciogliendo lo zucchero nell'acqua portata a bollore; far raffreddare e versarlo nel vaso con basilico e alcol.","Attendere altri venti giorni al riparo dalla luce, quindi filtrare e imbottigliare; lasciare assestare qualche giorno prima di servire."],"photo":"https://www.giallozafferano.com/images/303-30323/basil-liqueur_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/basil-liqueur.html","pdfPage":68,"description":"Un digestivo da tenere sempre in dispensa per offrire ad amici e parenti un dolce e profumato fine pasto color verde smeraldo: liquore al basilico!"},{"id":"GZ-03818","name":"Liquore al caffè","category":"Bevande e cocktail","serves":"circa 1 l (30 porzioni indicate dalla fonte)","prep":"10 min","cook":"6 min","rest":"almeno 2 settimane maturazione","ingredients":["Caffè preparato con moka o espresso 450 g","zucchero 450 g","alcol puro 250 g."],"steps":["Preparare il caffè e trasferirlo in una casseruola; unire lo zucchero e scaldare dolcemente mescolando finché è sciolto.","Versare in una ciotola e far raffreddare completamente.","Incorporare l'alcol, mescolare e distribuire in bottiglie di vetro perfettamente pulite e asciutte.","Chiudere ermeticamente e far riposare almeno due settimane prima di servire."],"photo":"","source":"https://www.giallozafferano.com/recipes/coffee-liqueur.html","pdfPage":69,"description":"Il liquore al caffè fatto in casa è perfetto per un fine pasto coi fiocchi o per preparare delle sfiziose bottigliette da regalare a Natale ai vostri amici!"},{"id":"GZ-03819","name":"Liquore al cioccolato","category":"Bevande e cocktail","serves":"circa 1,3 l","prep":"10 min","cook":"10 min","rest":"maturazione 20-30 giorni","ingredients":["Latte intero 750 g","zucchero 250 g","panna fresca liquida 250 g","alcol puro 150 g","cacao amaro 100 g","cioccolato fondente 100 g."],"steps":["Unire latte, panna e zucchero in una casseruola e scaldare; aggiungere il cacao poco alla volta, mescolando per evitare grumi.","Portare a leggero bollore e continuare a rimestare per circa dieci minuti; aggiungere il cioccolato spezzettato e farlo sciogliere.","Togliere dal fuoco e lasciare intiepidire; incorporare l'alcol e filtrare con un colino fine.","Quando il composto è freddo, imbottigliarlo in recipienti puliti e asciutti. Conservare in frigorifero e attendere 20-30 giorni prima del consumo; agitare prima di servire."],"photo":"","source":"https://www.giallozafferano.com/recipes/chocolate-liqueur.html","pdfPage":70,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03820","name":"Liquore al mandarino","category":"Bevande e cocktail","serves":"circa 2,6 l di liquore","prep":"30 min","cook":"5 min","rest":"macerazione 5 giorni; riposo 10–20 giorni","ingredients":["Mandarini non trattati 20","alcol puro alimentare 96% vol 1 l","acqua 1 l","zucchero 1 kg."],"steps":["Lavare e asciugare con cura i mandarini, quindi prelevare la parte esterna della scorza evitando il più possibile l’albedo.","Immergere le scorze nell’alcol in un recipiente coperto; lasciare macerare al riparo dalla luce per 5 giorni, agitando quotidianamente.","Scaldare acqua e zucchero fino a ottenere uno sciroppo, poi lasciarlo raffreddare completamente.","Unire lo sciroppo all’infusione alcolica e attendere altri 10–20 giorni, scuotendo il contenitore ogni giorno.","Filtrare, imbottigliare e servire freddo. Preparazione alcolica riservata agli adulti."],"photo":"https://www.giallozafferano.com/images/355-35549/mandarin-liqueur_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/mandarin-liqueur.html","pdfPage":71,"description":"Il liquore al mandarino è un ottimo digestivo, ideale da gustare freddo dopo i pasti, oppure da utilizzare per aromatizzare i vostri dolci"},{"id":"GZ-03828","name":"Punch all'arancia","category":"Bevande e cocktail","serves":"10 persone / circa 2 l","prep":"15 min","cook":"10 min","rest":"","ingredients":["Acqua 1 l","zucchero 700 g","Aperol 700 ml","arance non trattate 3."],"steps":["Lavare e asciugare le arance; prelevare le scorze, spremerle e filtrare il succo.","Sciogliere lo zucchero nell'acqua calda a fuoco basso per ottenere uno sciroppo.","Mescolare il succo d'arancia con l'Aperol, aggiungere lo sciroppo e le scorze; lasciare in infusione per qualche minuto.","Servire il punch caldo. Bevanda alcolica destinata ad adulti."],"photo":"https://www.giallozafferano.com/images/353-35347/orange-punch_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/orange-punch.html","pdfPage":72,"description":"Il punch all'arancia è una bevanda alcolica tipica dei paesi anglosassoni, servita calda. E' caratterizzata da un gusto fruttato e dolce"},{"id":"GZ-03835","name":"Vin brulé","category":"Bevande e cocktail","serves":"4 porzioni","prep":"5 min","cook":"10 min","rest":"","ingredients":["Vino rosso corposo 1 l","zucchero 100 g","scorza di limone non trattato 1","scorza di arancia non trattata 1","stecche di cannella 2","chiodi di garofano 8","bacche di ginepro 5","anice stellato 1","noce moscata q.b."],"steps":["Ricavare sottili strisce di scorza dagli agrumi, evitando la parte bianca.","Riunire in una casseruola zucchero, cannella, chiodi di garofano, ginepro, anice stellato, noce moscata e scorze.","Versare il vino e portare lentamente a leggero bollore, mescolando per sciogliere lo zucchero.","Lasciare sobbollire a fiamma bassa per circa cinque minuti; filtrare accuratamente e servire caldo in tazze resistenti al calore.","NOTA SICUREZZA: la fonte prevede un passaggio di flambatura; non eseguirlo in ambienti domestici senza condizioni e competenze adeguate."],"photo":"","source":"https://www.giallozafferano.com/recipes/Mulled-wine.html","pdfPage":73,"description":"Una calda coccola per ritemprarsi nelle giornate più fredde, considerata da molti un antico rimedio per combattere i malanni di stagione... vin brulé!"},{"id":"GZ-00004","name":"Arancini di Carnevale","category":"Biscotti e piccola pasticceria","serves":"22 dolcetti","prep":"20 min","cook":"10 min","rest":"2 h 30 min di lievitazione","ingredients":["Farina 00 300 g","Uovo 53 g (circa 1)","Burro morbido 25 g","Latte intero 125 g","Lievito di birra fresco 10 g","Zucchero 30 g, per l’impasto","Zucchero 100 g, per il ripieno","Scorza di 2 arance","Olio di semi di arachide q.b., per friggere"],"steps":["Intiepidisci il latte e scioglici il lievito.","Riunisci farina, burro, 30 g di zucchero e uovo; incorpora il latte con il lievito e impasta fino a ottenere una massa uniforme.","Copri e lascia lievitare circa 2 ore al caldo, finché il volume aumenta sensibilmente.","Mescola i 100 g di zucchero con la scorza grattugiata delle arance.","Stendi l’impasto in un rettangolo sottile di circa 50 × 35 cm; cospargi con lo zucchero aromatizzato e arrotola dal lato corto.","Taglia fette spesse circa 1 cm, disponile distanziate su un vassoio e lascia riposare altri 30 minuti.","Friggi pochi pezzi alla volta in olio a 170 °C, fino a doratura; scola su carta adatta ai fritti e servi subito."],"photo":"https://www.giallozafferano.com/images/290-29062/carnival-rice-balls_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/carnival-rice-balls.html","pdfPage":74,"description":"Gli arancini di Carnevale sono delle golose girelle di pasta fritta aromatizzata all'arancia, una bontà casalinga tipica delle Marche che rallegrerà grandi e piccini in questo giorno di festa!"},{"id":"GZ-03255","name":"Baci di dama","category":"Biscotti e piccola pasticceria","serves":"125 biscotti accoppiati","prep":"45 min","cook":"12 min","rest":"riposo 2–3 ore","ingredients":["Burro 300 g","zucchero 300 g","farina di mandorle 300 g","farina 00 300 g","albumi 50 g (circa 1 grande)","sale fino 3 g (1 pizzico).\nFARCITURA: cioccolato fondente 375 g, ammorbidito."],"steps":["Lavorare il burro con lo zucchero, poi incorporare la farina di mandorle e gli albumi con il sale sciolto.","Unire la farina 00 setacciata, amalgamare senza lavorare eccessivamente e appiattire la massa. Coprire e refrigerare per 2–3 ore.","Stendere a circa 1 cm di spessore e ricavare piccoli pezzi da 4–5 g; arrotondarli e disporli distanziati su teglia.","Cuocere in forno statico a 180 °C per circa 12 minuti; far raffreddare.","Distribuire il cioccolato morbido sulla faccia piatta di metà biscotti, accoppiare con gli altri e lasciare solidificare."],"photo":"https://www.giallozafferano.com/images/228-22802/baci-di-dama-hazelnut-cookies_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baci-di-dama-hazelnut-cookies.html","pdfPage":75,"description":"Come due bocche intente a darsi un dolcissimo bacio, i baci di dama sono uniti da un velo di cioccolato... scoprite il segreto di tanta bontà con la ricetta di Iginio Massari!"},{"id":"GZ-02544","name":"Bignè con crema di ricotta e pistacchi","category":"Biscotti e piccola pasticceria","serves":"25 pezzi","prep":"40 min","cook":"40 min","rest":"","ingredients":["Per la pasta choux: Uova 105 g (circa 2 medie)","Farina 00 65 g","Burro 50 g","Acqua 100 g","Zucchero 10 g","Sale fino 1 pizzico. Per la crema: Ricotta vaccina 500 g","Zucchero a velo 120 g","Panna fresca liquida 100 g","Granella di pistacchi 80 g","Baccello di vaniglia 1. Per la superficie: Cioccolato bianco 50 g","Granella di pistacchi 60 g."],"steps":["Portare a bollore acqua, burro, zucchero e sale. Versare tutta la farina e mescolare sul fuoco finché la massa si stacca dalla pentola; trasferire in una ciotola e far intiepidire.","Incorporare le uova gradualmente, ottenendo una pasta liscia. Con sac-à-poche e bocchetta liscia formare circa 25 bignè di 3 cm su carta forno, appiattendo le punte.","Cuocere in forno statico preriscaldato a 220 °C per 15 minuti, poi a 190 °C per 10 minuti. Lasciar asciugare altri 10–15 minuti a forno spento con sportello socchiuso.","Lavorare ricotta, zucchero a velo e semi di vaniglia; versare la panna e amalgamare la granella di pistacchi. Farcire i bignè freddi con una sac-à-poche.","Sciogliere il cioccolato bianco, velare la sommità dei bignè e passarla nella granella di pistacchi rimasta. Conservare in frigorifero fino al servizio."],"photo":"https://www.giallozafferano.it/images/221-22108/Bigne-con-crema-di-ricotta-e-pistacchi_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Bigne-con-crema-di-ricotta-e-pistacchi.html","pdfPage":76,"description":"Ci siamo ispirati ai sapori della Sicilia per realizzare dei deliziosi pasticcini dal ripieno morbido e cremoso: bignè con crema di ricotta e pistacchi!"},{"id":"GZ-02546","name":"Bignè senza glutine","category":"Biscotti e piccola pasticceria","serves":"32 bignè","prep":"15 min","cook":"30 min","rest":"","ingredients":["Farina di riso senza glutine 45 g","farina di lupini 30 g","amido di mais senza glutine 30 g","uova 110 g (circa 2)","tuorlo 15 g (circa 1)","acqua 150 g","burro 40 g","sale fino 1 pizzico."],"steps":["Portare a bollore acqua, burro e sale. Allontanare dal fuoco e incorporare insieme farina di riso, amido di mais e farina di lupini. 2. Mescolare con energia e rimettere sul fuoco per circa un minuto, finché l’impasto si compatta. 3. Trasferire nella planetaria e aggiungere le uova una per volta, aspettando l’assorbimento; incorporare il tuorlo. 4. Con una tasca da pasticcere e bocchetta liscia formare 32 bignè distanziati su carta forno. 5. Cuocere in forno ventilato a circa 200 °C per 25-30 minuti, quindi lasciare raffreddare prima di farcire."],"photo":"","source":"https://www.giallozafferano.com/recipes/gluten-free-cream-puffs.html","pdfPage":77,"description":"Farcite i bignè senza glutine con la vostra crema preferita oppure utilizzate questa speciale pasta choux per creare deliziose ricette gluten-free, sia dolci che salate!"},{"id":"GZ-02545","name":"Bigné craquelin","category":"Biscotti e piccola pasticceria","serves":"24 bignè","prep":"40 min","cook":"25 min","rest":"raffreddamento 1 ora circa","ingredients":["PASTA CHOUX: latte intero 130 g","acqua 110 g","burro 90 g","farina 00 150 g","zucchero 15 g","uova 225 g (circa 4 medie)","sale fino 1 pizzico.\nCRAQUELIN: zucchero 80 g","farina 00 80 g","burro 60 g.\nCREMA: panna fresca liquida 300 g","zucchero a velo 60 g","bacca di vaniglia 1/2."],"steps":["Per il craquelin impastare burro freddo, zucchero e farina; compattare e refrigerare un'ora. Stendere sottile e ricavare 24 dischetti da circa 3 cm.","Per la pasta choux portare a leggero bollore latte, acqua, burro, zucchero e sale; fuori dal fuoco unire tutta la farina, poi asciugare sul fuoco mescolando.","Trasferire l'impasto in ciotola e incorporare le uova una per volta fino a ottenere una pasta elastica.","Formare 24 bignè su teglia, sovrapporre i dischi craquelin e cuocere in forno ventilato a circa 180 °C per 25 minuti; raffreddare.","Montare panna, zucchero a velo e semi di vaniglia. Tagliare la calotta dei bignè e farcirli con la crema."],"photo":"","source":"https://www.giallozafferano.com/recipes/craquelin-choux.html","pdfPage":78,"description":"I bignè craquelin sono una deliziosa variante dei classici dolcetti, caratterizzata da una doppia consistenza: noi li abbiamo farciti con una golosa Chantilly... e voi?"},{"id":"GZ-03601","name":"Biscotti glassati a forma di zucca","category":"Biscotti e piccola pasticceria","serves":"6 persone","prep":"20 min","cook":"15 min","rest":"almeno 1 h in frigorifero","ingredients":["FROLLA ALLA NOCCIOLA: nocciole intere spellate 100 g","farina 00 200 g","burro 120 g","uovo medio 1","zucchero 120 g","tuorlo 1.\nGLASSA: zucchero a velo 300 g","acqua bollente q.b.","coloranti alimentari arancione e verde q.b."],"steps":["Tritare finemente le nocciole con una piccola parte dello zucchero; mescolarle con la farina.","Unire lo zucchero restante e il burro freddo a cubetti, lavorare a briciole e incorporare uovo e tuorlo. Formare un panetto e farlo riposare in frigorifero almeno un'ora.","Stendere la frolla a circa 3 mm e ricavare biscotti con un tagliapasta a forma di zucca.","Disporre su carta forno e cuocere in forno ventilato a 180 °C per circa 12–14 minuti. Lasciare raffreddare completamente.","Mescolare zucchero a velo e poca acqua bollente per una glassa densa; dividere e colorare una parte d'arancione e una di verde.","Glassare la superficie d'arancione, attendere che si rassodi e decorare picciolo e nervature con la glassa verde. Lasciare asciugare prima di servire."],"photo":"","source":"https://www.giallozafferano.com/recipes/pumpkin-shaped-glazed-cookies.html","pdfPage":79,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03328","name":"Biscotti senza glutine","category":"Biscotti e piccola pasticceria","serves":"18 pezzi","prep":"30 min","cook":"20 min","rest":"30 min in frigo","ingredients":["Farina di grano saraceno 160 g","farina di riso integrale 140 g","farina di cocco 50 g","fecola di patate 60 g","zucchero 200 g","burro freddo 150 g","cacao amaro 10 g","uova medie fredde 3","lievito per dolci 7 g. FINITURA: zucchero di canna q.b."],"steps":["Riunire farine, fecola, lievito, zucchero e cacao; incorporare il burro freddo a cubetti fino a ottenere briciole sabbiose.","Aggiungere le uova gradualmente e lavorare il minimo necessario per formare un impasto omogeneo.","Avvolgere e lasciare riposare in frigorifero per 30 minuti.","Stendere rapidamente a circa 1 cm di spessore e ricavare 18 rettangoli, praticando piccoli fori sulla superficie.","Disporre distanziati su carta forno, cospargere di zucchero di canna e cuocere in forno statico a 180 °C per circa 20 minuti; far raffreddare."],"photo":"https://www.giallozafferano.it/images/176-17675/Biscotti-senza-glutine_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Biscotti-senza-glutine.html","pdfPage":80,"description":"Deliziosi dolcetti rustici adatti a tutta la famiglia, per ritrovare il piacere di iniziare la giornata seduti attorno al tavolo della colazione: biscotti senza glutine!"},{"id":"GZ-02561","name":"Cannoli di pasta fillo al pistacchio","category":"Biscotti e piccola pasticceria","serves":"circa 35 cannoli","prep":"25 min","cook":"10 min","rest":"12 h di sgocciolamento ricotta + almeno 30 min crema","ingredients":["PER LA CREMA: ricotta di pecora 750 g","pasta di pistacchio 100 g","gocce di cioccolato 80 g","zucchero a velo 350 g.\nPER I GUSCI: pasta fillo 240 g","albume 1","burro 70 g.\nPER DECORARE: granella di pistacchio q.b."],"steps":["Lasciare sgocciolare la ricotta in frigorifero per una notte; setacciarla due volte, amalgamarla con zucchero a velo e pasta di pistacchio. Coprire a contatto e far riposare in frigo almeno mezz'ora.","Fondere il burro. Sovrapporre tre strati di pasta fillo, spennellandoli con burro; tenere coperti gli altri fogli per non farli seccare.","Tagliare quadrati di circa 5 cm, avvolgerli attorno agli stampi per cannoli e sigillare le estremità con albume leggermente sbattuto.","Cuocere su carta forno in forno statico a 200 °C per 8–10 minuti, fino a doratura; lasciare raffreddare e sfilare delicatamente gli stampi.","Incorporare le gocce di cioccolato alla crema poco prima del servizio; farcire con sac à poche e decorare con granella di pistacchio."],"photo":"","source":"https://www.giallozafferano.com/recipes/phyllo-dough-cannoli-with-pistachio.html","pdfPage":81,"description":"I cannoli di pasta fillo al pistacchio sono piccole dolcezze friabili con un ripieno cremoso di ricotta di pecora: ideale come dolce di fine pasto"},{"id":"GZ-02563","name":"Cannoli siciliani","category":"Biscotti e piccola pasticceria","serves":"circa 30 cannoli","prep":"60 min","cook":"15 min","rest":"2 h impasto + scolatura ricotta","ingredients":["Per le cialde: farina 00 250 g","zucchero 30 g","strutto 30 g","Marsala 50 g","uovo medio 1","aceto di vino bianco 10 g","sale 1 pizzico","scorza di 1 arancia","cannella 2 g. Per la crema: ricotta di pecora 1 kg","zucchero 300 g","gocce di cioccolato fondente q.b. Per chiudere: tuorlo q.b. Per friggere: olio vegetale 1 l. Per decorare: zucchero a velo, pistacchi tritati e arancia candita q.b."],"steps":["Scolare la ricotta in frigorifero per una notte. Impastare farina, cannella, strutto, zucchero, scorza, uovo, Marsala e aceto nel quale è stato sciolto il sale; far riposare il panetto coperto in frigorifero per due ore.","Lavorare la ricotta scolata con lo zucchero, setacciarla e incorporare le gocce di cioccolato; conservare al fresco.","Tirare la pasta molto sottile, ricavare dischi e avvolgerli sugli appositi cilindri, sigillando i lembi con poco tuorlo.","Friggere in olio a circa 175 °C fino a doratura, scolare e lasciare raffreddare; sfilare i cilindri e farcire solo al momento di servire. Guarnire con pistacchi, canditi e zucchero a velo."],"photo":"https://ptps.stbm.it/t/k9mn3s_large.jpg","source":"https://www.giallozafferano.com/recipes/sicilian-cannoli.html","pdfPage":82,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-04000","name":"Cantucci al pistacchio e cioccolato bianco","category":"Biscotti e piccola pasticceria","serves":"30 biscotti","prep":"30 min","cook":"35 min","rest":"","ingredients":["Pistacchi sgusciati non salati 150 g","cioccolato bianco 60 g","farina 00 300 g","lievito per dolci 2 g","uova 2","zucchero 80 g","panna fresca liquida 60 g","sale fino 1 pizzico","PER SPENNELLARE: uovo 1."],"steps":["Tostare i pistacchi in forno statico a 160 °C per circa 20 minuti, controllando che non scuriscano. Sciogliere il cioccolato bianco a bagnomaria.","Scaldare la panna e incorporarla al cioccolato per formare una crema liscia, poi lasciarla intiepidire. Montare uova e zucchero e unire la crema.","Setacciare farina, lievito e sale; amalgamarli al composto, quindi aggiungere i pistacchi tostati.","Formare due filoni, spennellarli con l'uovo e cuocerli in forno statico a circa 190 °C per 20 minuti.","Tagliare i filoni ancora caldi a fette diagonali e infornare di nuovo a 170 °C per circa 15 minuti. Far raffreddare su griglia."],"photo":"https://www.giallozafferano.com/images/322-32240/pistachio-and-white-chocolate-cantucci_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/pistachio-and-white-chocolate-cantucci.html","pdfPage":83,"description":"I cantucci sono dei dolci tipici toscani da gustare col Vin Santo. In questa variante li abbiamo preparati con pistacchi e con del buon cioccolato bianco!"},{"id":"GZ-02565","name":"Castagnole","category":"Biscotti e piccola pasticceria","serves":"circa 30 castagnole","prep":"20 min","cook":"20 min","rest":"riposo 30 min","ingredients":["Burro morbido 40 g","farina 00 200 g","uova 2","zucchero 50 g","scorza di limone 1/2","liquore all'anice 1 cucchiaio","sale 1 pizzico","lievito per dolci 8 g","bacca di vaniglia 1.\nPER FINIRE: zucchero q.b.","olio di arachidi per friggere q.b."],"steps":["Amalgamare il burro morbido con i semi di vaniglia e la scorza di limone.","Mescolare farina, zucchero, lievito e sale; aggiungere uova leggermente battute, burro aromatizzato e liquore all'anice.","Lavorare fino a ottenere una pasta uniforme, coprire e far riposare per mezz'ora.","Formare un filoncino, dividerlo in piccoli pezzi e arrotondarli senza farli seccare.","Friggere poche castagnole per volta in olio a circa 170 °C per 2–3 minuti, girandole; scolare e rotolare subito nello zucchero."],"photo":"https://ptps.stbm.it/t/qzejif_large.jpg","source":"https://www.giallozafferano.com/recipes/Castagnole.html","pdfPage":84,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02566","name":"Castagnole al cioccolato","category":"Biscotti e piccola pasticceria","serves":"40 pezzi","prep":"20 min","cook":"10 min","rest":"","ingredients":["Farina 00 170 g","Cacao amaro 30 g","Uova 106 g (circa 2 medie)","Sambuca 10 g","Sale fino 1 pizzico","Baccello di vaniglia 1","Lievito per dolci 8 g","Zucchero 50 g","Burro morbido 40 g","Gocce di cioccolato 90 g.\nFRITTURA: Olio di semi di arachide 700 g.\nFINITURA: Zucchero 200 g."],"steps":["Mescolare farina, cacao, lievito e zucchero. Aggiungere sambuca e semi di vaniglia.","Incorporare uova, sale e burro morbido, impastando fino a ottenere una massa compatta e uniforme.","Aggiungere le gocce di cioccolato e formare un filone.","Tagliare porzioni da circa 12–13 g e arrotondarle in palline.","Friggere pochi pezzi alla volta in olio a 340–350 °F per 2–3 minuti, evitando di raffreddare troppo l’olio.","Scolare su carta assorbente e passare le castagnole nello zucchero quando sono ancora tiepide."],"photo":"https://www.giallozafferano.com/images/295-29591/chocolate-castagnole_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/chocolate-castagnole.html","pdfPage":85,"description":"Le castagnole al cioccolato sono una golosa variante dei classici dolcetti fritti di Carnevale, così morbide e invitanti che una tira l'altra!"},{"id":"GZ-02567","name":"Castagnole di ricotta","category":"Biscotti e piccola pasticceria","serves":"30 pezzi","prep":"20 min","cook":"25 min","rest":"tempo di scolatura della ricotta","ingredients":["Ricotta vaccina 240 g","Farina 00 135 g + q.b. per infarinare le mani","Zucchero 60 g","Uova 55 g (circa 1 medio)","Lievito in polvere per dolci 6 g","Scorza d’arancia da grattugiare 1.\nFRITTURA: Olio di semi di arachide 500 g.\nCOPERTURA: Zucchero q.b."],"steps":["Lasciare sgocciolare la ricotta. Mescolarla con l’uovo fino a eliminare i grumi e profumare con la scorza d’arancia.","Incorporare lo zucchero, poi farina e lievito setacciati poco alla volta, ottenendo un impasto morbido.","Con le mani leggermente infarinate formare palline da circa 16 g e disporle su un vassoio infarinato.","Scaldare l’olio a 160–170 °C e friggere poche castagnole per volta finché assumono un colore nocciola chiaro.","Scolare su carta assorbente e rotolare ancora calde nello zucchero. Servire tiepide o a temperatura ambiente."],"photo":"https://www.giallozafferano.it/images/164-16445/Castagnole-di-ricotta_450x300.jpg","source":"https://ricette.giallozafferano.it/Castagnole-di-ricotta.html","pdfPage":86,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02568","name":"Castagnole ripiene","category":"Biscotti e piccola pasticceria","serves":"circa 20 pezzi","prep":"15 min","cook":"20 min","rest":"raffreddamento crema","ingredients":["IMPASTO: Uova 120 g (circa 2)","Zucchero 50 g","Farina 00 200 g","Burro morbido 40 g","Scorza di limone ½","Liquore all’anice 10 g","Sale fino 1 pizzico","Lievito per dolci 8 g","Baccello di vaniglia 1.\nCREMA: Latte intero 200 g","Panna fresca liquida 50 g","Baccello di vaniglia 1","Tuorli 2","Zucchero 70 g","Amido di mais 22 g.\nFRITTURA: Olio di arachide q.b.\nCOPERTURA: Zucchero q.b."],"steps":["Per la crema scaldare latte e panna con la vaniglia. A parte mescolare tuorli, zucchero e amido.","Versare i liquidi caldi sui tuorli, rimettere sul fuoco basso e addensare mescolando. Coprire a contatto e raffreddare.","Impastare farina, lievito, zucchero, vaniglia, uova, burro, scorza di limone, liquore all’anice e sale fino a massa omogenea.","Formare un filone, tagliare piccoli pezzi e arrotondarli.","Friggere poche palline per volta in olio a 285 °F fino a doratura; scolare su carta assorbente e rotolare nello zucchero.","Inserire la crema fredda con una sac à poche dalla bocchetta stretta e servire."],"photo":"https://www.giallozafferano.com/images/337-33759/filled-castagnole_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/filled-castagnole.html","pdfPage":87,"description":"Abbiamo utilizzato la crema pasticcera per realizzare una variante ancora più golosa e irresistibile dei classici dolcetti fritti e ricoperti di zucchero: castagnole ripiene!"},{"id":"GZ-00020","name":"Cestini di frutta","category":"Biscotti e piccola pasticceria","serves":"22 cestini","prep":"60 min","cook":"30 min","rest":"","ingredients":["Per la frolla: farina 00 300 g","zucchero 3/4 tazza (misura riportata dalla fonte)","burro freddo 150 g","uova 110 g (circa 2 medie)","scorza di 1 limone","lievito per dolci 1 cucchiaino","sale fino 1 pizzico. Per la crema: latte intero 500 g","tuorli 90 g (circa 6)","zucchero 150 g","amido di mais 50 g","bacca di vaniglia 1. Per guarnire: frutta fresca mista a piacere","menta a piacere","confettura di albicocche 50 g","acqua 10 g."],"steps":["Sabbiare farina, lievito e burro freddo, poi incorporare zucchero, sale, scorza di limone e uova. Formare un panetto e raffreddarlo per almeno un'ora.","Stendere la frolla a circa 5 mm, ricavare dischi e foderare 22 stampini da 7 cm. Bucherellare e cuocere a 180 °C per circa 18-20 minuti; lasciare raffreddare.","Scaldare il latte con la vaniglia. Sbattere tuorli, zucchero e amido; temperare con il latte caldo e rimettere sul fuoco, mescolando fino ad addensamento. Raffreddare la crema coperta a contatto.","Farcire i gusci con la crema, decorare con frutta e menta. Scaldare brevemente confettura e acqua e spennellare la frutta."],"photo":"https://ptps.stbm.it/t/k9j29e_large.jpg","source":"https://ricette.giallozafferano.it/Cestini-di-frutta.html","pdfPage":88,"description":"I piccoli gusci di frolla accolgono un ripieno fresco e cremoso per un intramontabile dessert che accontenta sempre tutti: cestini di frutta!"},{"id":"GZ-00021","name":"Cestini panna e fragole","category":"Biscotti e piccola pasticceria","serves":"6 cestini","prep":"20 min","cook":"20 min","rest":"","ingredients":["Pasta sfoglia rettangolare 1 rotolo","fragole 250 g","panna fresca liquida 250 g","zucchero semolato 2 cucchiai","zucchero a velo 1 cucchiaio."],"steps":["Dividere la pasta sfoglia in sei quadrati e sistemarli negli incavi di uno stampo da muffin rivestito con carta forno; bucherellare il fondo.","Cuocere in forno ventilato a 180 °C per circa 18-20 minuti, finché i cestini sono dorati. Lasciarli raffreddare completamente.","Lavare le fragole, tagliarle a pezzi, condirle con lo zucchero semolato e conservarle al fresco.","Montare la panna ben fredda con lo zucchero a velo fino a ottenere una consistenza sostenuta.","Riempire i cestini con la panna e completare con le fragole zuccherate poco prima del servizio."],"photo":"https://www.giallozafferano.com/images/298-29843/strawberry-and-cream-baskets_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Cestini-panna-e-fragole.html","pdfPage":89,"description":"Il più classico degli abbinamenti in un dessert facile e veloce da preparare grazie all'utilizzo della pasta sfoglia già pronta: cestini panna e fragole!"},{"id":"GZ-02620","name":"Chiacchiere","category":"Biscotti e piccola pasticceria","serves":"40 pezzi","prep":"60 min","cook":"20 min","rest":"30 min","ingredients":["Farina 00 500 g","zucchero 70 g","burro 50 g","grappa 30 g","uova medie 3","lievito per dolci 6 g","baccello di vaniglia 1","tuorlo 1","sale fino 1 pizzico. Per friggere: olio di arachidi q.b. Per finire: zucchero a velo q.b."],"steps":["Setacciare farina e lievito; lavorarli con zucchero, sale, uova e tuorlo sbattuti e grappa.","Aggiungere i semi della vaniglia e il burro morbido, quindi impastare fino a ottenere una massa liscia e sostenuta.","Avvolgere e lasciar riposare a temperatura ambiente almeno 30 minuti.","Suddividere l’impasto, passarlo più volte nella macchina per la pasta fino a sfoglie di circa 2 mm; ricavare rettangoli di circa 5 × 10 cm con due incisioni centrali.","Friggere pochi pezzi per volta in olio a 150–160 °C, girandoli fino a doratura; scolare su carta e spolverizzare con zucchero a velo una volta freddi."],"photo":"https://ptps.stbm.it/t/zul9u7_large.jpg","source":"https://www.giallozafferano.com/recipes/chiacchiere-sweet-fried-dough.html","pdfPage":90,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02621","name":"Chiacchiere al forno","category":"Biscotti e piccola pasticceria","serves":"40 chiacchiere","prep":"60 min","cook":"15 min","rest":"30 min riposo impasto","ingredients":["Farina 00 500 g","Zucchero 70 g","Burro morbido 50 g","Uova 175 g (circa 3 medie)","Tuorli 15 g (circa 1)","Grappa 30 g","Lievito in polvere 6 g","Baccello di vaniglia 1","Sale fino 1 pizzico.\nFINITURA: Zucchero a velo q.b."],"steps":["Impastare farina e lievito setacciati con zucchero, sale, uova, tuorlo e grappa.","Incorporare semi di vaniglia e burro morbido, lavorando fino a ottenere una massa soda ma malleabile.","Avvolgere e lasciare riposare a temperatura ambiente per trenta minuti.","Stendere piccole porzioni con la macchina per pasta fino a sfoglia molto sottile; tagliare rettangoli con rotella dentellata e praticare incisioni centrali.","Sbollentare una o due chiacchiere alla volta per pochi secondi, finché salgono in superficie; scolarle.","Sistemarle su carta forno e cuocere in forno ventilato a 392 °F circa cinque minuti per lato. Raffreddare e spolverare di zucchero a velo."],"photo":"https://www.giallozafferano.com/images/337-33757/baked-chiacchiere_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baked-chiacchiere.html","pdfPage":91,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02623","name":"Chiacchiere di Carnevale: fritte, al forno e ripiene","category":"Biscotti e piccola pasticceria","serves":"circa 40 pezzi","prep":"90 min","cook":"15 min","rest":"riposo impasto 30 min","ingredients":["Farina 00 500 g","burro morbido 50 g","zucchero 70 g","uova 3","tuorlo 1","grappa 30 g","sale fino 1 pizzico","lievito in polvere 6 g","baccello di vaniglia 1. Frittura: olio di semi q.b. Ripieno/decorazione: zucchero a velo q.b.","confettura q.b."],"steps":["Riunire farina, lievito e zucchero, poi aggiungere sale, uova, tuorlo e grappa.","Incorporare il burro ammorbidito con i semi di vaniglia e impastare fino a una massa liscia e sostenuta; coprire e riposare 30 minuti.","Tirare porzioni di impasto con la macchina per pasta, assottigliando gradualmente fino a circa 1,5 mm; ricavare rettangoli con tagli centrali.","Per la versione fritta immergere pochi pezzi per volta in olio a circa 150-160 °C, dorarli sui due lati e scolarli; completare con zucchero a velo.","Per la versione al forno sbollentare i rettangoli finché affiorano, scolarli e cuocerli ventilati a circa 200 °C per 5 minuti per lato.","Per quella ripiena tagliare quadrati, porre un cucchiaino di confettura al centro, chiudere a triangolo e friggere a circa 170 °C."],"photo":"https://www.giallozafferano.com/images/295-29586/carnival-chiacchiere-fried-baked-and-filled_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/carnival-chiacchiere-fried-baked-and-filled.html","pdfPage":92,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03242","name":"Zeppole di San Giuseppe al forno","category":"Biscotti e piccola pasticceria","serves":"4 zeppole","prep":"60 min","cook":"50 min","rest":"raffreddamento","ingredients":["PASTA CHOUX: uova 210 g (circa 4)","farina 00 150 g","burro 45 g","acqua 250 ml","sale 1 pizzico. CREMA: latte intero 200 g","zucchero 70 g (la fonte EN riporta anche “1 cup”, misura incoerente)","amido di mais 20 g","panna fresca 50 g","tuorli 2","vaniglia 1/2 bacca. GUARNIZIONE: amarene sciroppate 4","zucchero a velo q.b."],"steps":["Portare a ebollizione acqua e burro, versare la farina in una volta e mescolare sul fuoco finché l'impasto si stacca dalle pareti.","Lasciare intiepidire, incorporare gradualmente le uova sbattute e il sale fino a ottenere una pasta densa e liscia.","Con sac à poche a bocchetta stellata formare quattro ciambelle con due giri sovrapposti.","Cuocere in forno ventilato a 200 °C per circa 25 minuti, quindi altri cinque minuti con sportello leggermente aperto; raffreddare.","Scaldare latte e panna con vaniglia; mescolare tuorli, zucchero e amido, temperare con i liquidi caldi e addensare sul fuoco.","Raffreddare la crema a contatto con pellicola; farcire le zeppole e completare con un ciuffo di crema, un'amarena e zucchero a velo."],"photo":"https://ptps.stbm.it/t/axg8df_large.jpg","source":"https://www.giallozafferano.com/recipes/Baked-Zeppole-di-San-Giuseppe.html","pdfPage":93,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03886","name":"Acai bowl","category":"Colazione e lievitati dolci","serves":"2 persone","prep":"10 min","cook":"non prevista","rest":"","ingredients":["Acai in polvere 5 g","yogurt greco 250 g","latte di cocco 30 g","miele 15 g","cocco fresco 35 g","banana baby 1","corn flakes 30 g."],"steps":["Mescolare yogurt greco e latte di cocco, aggiungere la polvere di acai e amalgamare fino a ottenere una crema dal colore uniforme.","Incorporare il miele e versare il composto nelle ciotole da portata.","Ridurre il cocco fresco in scaglie e affettare sottilmente la banana.","Distribuire i corn flakes sulla crema, completare con banana e cocco e servire immediatamente."],"photo":"https://www.giallozafferano.com/images/327-32777/acai-bowl_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/acai-bowl.html","pdfPage":94,"description":"Iniziate la giornata con l’acai bowl, una ricca macedonia con cereali, frutta secca, yogurt e acai, un frutto dalle qualità prodigiose e dal sapore sorprendente!"},{"id":"GZ-03254","name":"American muffin","category":"Colazione e lievitati dolci","serves":"12 muffin","prep":"15 min","cook":"35 min","rest":"","ingredients":["Uova 2","burro 140 g","zucchero 200 g","farina 00 380 g","lievito in polvere per dolci 16 g","sale fino 1 pizzico","latte intero 250 g","scorza di limone 1","baccello di vaniglia 1."],"steps":["Sciogliere il burro e lasciarlo intiepidire. In una caraffa mescolare latte, uova e burro. 2. Setacciare farina e lievito; aggiungere zucchero, sale, scorza gialla del limone e semi di vaniglia. 3. Unire poco alla volta i liquidi agli ingredienti secchi, mescolando a bassa velocità fino a ottenere un impasto omogeneo. 4. Suddividere il composto in 12 pirottini da muffin sistemati nello stampo. 5. Cuocere in forno statico preriscaldato a circa 175-180 °C per 35 minuti; lasciar raffreddare."],"photo":"https://www.giallozafferano.com/images/285-28533/american-muffin_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/american-muffin.html","pdfPage":95,"description":"E' una ricetta che arriva da oltreoceano e nel giro di poco tempo ha fatto breccia nel cuore di tutti, diventando un must delle colazioni e dei brunch: American muffin!"},{"id":"GZ-02532","name":"banana bread","category":"Colazione e lievitati dolci","serves":"6 persone","prep":"20 min","cook":"60 min","rest":"","ingredients":["Banane mature, polpa 450 g (circa 4)","farina 00 200 g","burro morbido 120 g","zucchero 120 g","uova 110 g (2 medie)","lievito per dolci 6 g","cannella in polvere 1/2 cucchiaino","sale fino 1 pizzico","succo di limone 1/2","PER STAMPO: burro q.b.","farina 00 q.b."],"steps":["Tagliare le banane mature e schiacciarle con il succo di limone per ottenere una purea.","Lavorare il burro morbido con lo zucchero, incorporare le uova e poi la polpa di banana.","Unire la farina setacciata con il lievito, la cannella e il sale; amalgamare senza lavorare eccessivamente.","Versare nello stampo da plumcake imburrato e infarinato (circa 23 x 8 cm).","Cuocere in forno statico preriscaldato a circa 180 °C per circa 60 minuti; verificare la cottura con uno stecchino e lasciar raffreddare prima di sformare."],"photo":"https://www.giallozafferano.com/images/227-22768/banana-bread_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/banana-bread.html","pdfPage":96,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03334","name":"Bomboloni","category":"Colazione e lievitati dolci","serves":"10 pezzi","prep":"60 min","cook":"20 min","rest":"5 ore e 30 min circa di lievitazione","ingredients":["IMPASTO: Farina 00 250 g","Farina Manitoba 250 g","Acqua 140 g","Uova 120 g (2 medie)","Zucchero 40 g","Burro morbido 40 g","Lievito di birra fresco 15 g","Sale fino 6 g.\nFRITTURA: Olio di semi 1 litro.\nFARCIA E FINITURA: Crema pasticcera 500 g","Zucchero a velo q.b."],"steps":["Mescolare le farine, zucchero e lievito sbriciolato in planetaria; aggiungere gradualmente acqua e uova sbattute, poi il sale.","Quando l’impasto prende corpo, incorporare il burro morbido poco per volta e impastare fino a consistenza liscia.","Formare una palla e far lievitare coperta a 78–82 °F per circa 3 ore e mezza, finché triplica.","Stendere a rettangolo, eseguire pieghe a tre e riposi di dieci minuti; ripetere il ciclo tre volte.","Stendere nuovamente, lasciar rilassare la pasta e ricavare dischi con un coppapasta. Farli lievitare ancora circa un’ora e mezza su carta forno.","Friggere a circa 320 °F, pochi per volta, circa quattro minuti complessivi girandoli. Scolare e far intiepidire.","Farcire con crema pasticcera mediante sac à poche e spolverare di zucchero a velo."],"photo":"https://ptps.stbm.it/t/fu7dj7_large.jpg","source":"https://www.giallozafferano.com/recipes/bomboloni.html","pdfPage":97,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03335","name":"Bomboloni al forno","category":"Colazione e lievitati dolci","serves":"10 pezzi","prep":"60 min","cook":"25 min","rest":"circa 5 ore di lievitazione","ingredients":["IMPASTO: Farina 00 250 g","Farina Manitoba 250 g","Uova 120 g (circa 2 medie)","Zucchero 40 g","Acqua 140 g","Burro morbido 40 g","Lievito di birra fresco 15 g","Sale fino 6 g.\nSPENNELLATURA: Tuorli 1","Panna fresca liquida 20 g.\nFARCIA E DECORAZIONE: Confettura di fragole 300 g","Zucchero a velo q.b."],"steps":["In planetaria lavorare le due farine con zucchero e lievito; versare lentamente acqua e uova sbattute, poi il sale.","Incorporare il burro morbido a piccoli pezzi e impastare fino a ottenere una massa liscia ed elastica.","Far lievitare coperta circa tre ore e mezza, fino a triplicare.","Stendere la pasta, fare pieghe a tre intervallate da riposi di dieci minuti; ripetere per tre cicli.","Stendere a circa mezzo pollice di spessore, riposare dieci minuti, quindi coppare dieci dischi. Far lievitare coperti altri 45 minuti.","Spennellare con tuorlo e panna sbattuti e cuocere in forno statico a 347 °F per 20–25 minuti.","Raffreddare leggermente, farcire con confettura e spolverare con zucchero a velo."],"photo":"https://www.giallozafferano.com/images/329-32903/baked-donuts_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baked-donuts.html","pdfPage":98,"description":"Una versione più leggera ma altrettanto stuzzicante dei famosi dolci fritti, un dolce compromesso per concedersi un meritato peccato di gola: bomboloni al forno!"},{"id":"GZ-03337","name":"Bomboloni alla crema","category":"Colazione e lievitati dolci","serves":"10 pezzi","prep":"60 min","cook":"20 min","rest":"5 ore e 30 min di lievitazione, più riposi intermedi","ingredients":["Farina 00 250 g","farina Manitoba 250 g","acqua 140 g","uova 120 g (circa 2 medie)","zucchero 40 g","burro morbido 40 g","lievito di birra fresco 15 g","sale fino 6 g. Per friggere: olio di semi 1 l. Farcitura: crema pasticcera 500 g","zucchero a velo q.b."],"steps":["Mescolare farine, zucchero e lievito sbriciolato; impastare aggiungendo progressivamente acqua e uova sbattute. Unire il sale.","Incorporare il burro morbido a piccoli pezzi, impastando finché il composto diventa elastico e omogeneo.","Formare una palla e far lievitare coperta a 26–28 °C per circa 3 ore e mezza, fino a triplicare il volume.","Stendere l’impasto, eseguire tre cicli di pieghe con 10 minuti di riposo fra uno e l’altro; quindi stendere, far riposare brevemente e ritagliare dieci dischi di circa 10 cm.","Lasciare lievitare i dischi per circa 90 minuti. Friggerli in olio a 160 °C, pochi alla volta, per circa 4 minuti complessivi, girandoli a metà cottura.","Scolare, far intiepidire e farcire con crema pasticcera mediante sac à poche; finire con zucchero a velo."],"photo":"https://ptps.stbm.it/t/fu7dj7_large.jpg","source":"https://www.giallozafferano.com/recipes/bomboloni.html","pdfPage":99,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03339","name":"Brioche","category":"Colazione e lievitati dolci","serves":"18 brioche","prep":"40 min","cook":"20 min","rest":"circa 4,5 h complessive secondo nota editoriale","ingredients":["Farina tipo 0 (W 300) 475 g","zucchero 100 g","lievito di birra fresco 10 g","scorza di 1 limone","vaniglia 1 baccello","acqua 160 g","tuorli 105 g (circa 7)","sale fino 5 g","burro morbido 90 g. Per spennellare: tuorlo 1","panna fresca 2 cucchiai."],"steps":["Impastare farina, zucchero, lievito, vaniglia e scorza di limone; aggiungere lentamente l'acqua, quindi sale e tuorli uno per volta.","Quando l'impasto è elastico incorporare il burro morbido a piccoli pezzi, lavorando fino a completa assorbenza.","Formare una palla e far lievitare coperta per circa un'ora e mezza a 26-28 °C.","Dividere in diciotto pezzi da circa 50 g, arrotondarli e lasciarli lievitare ancora un'ora; spennellare con tuorlo e panna.","Cuocere in forno statico a 180 °C per circa 20 minuti e lasciar raffreddare."],"photo":"","source":"https://www.giallozafferano.com/recipes/Brioches.html","pdfPage":100,"description":"Con la nostra ricetta delle brioche potrete preparare una colazione golosa e genuina che non ha nulla da invidiare a quelle del bar!"},{"id":"GZ-03340","name":"brioche col tuppo","category":"Colazione e lievitati dolci","serves":"circa 10 brioche","prep":"60 min","cook":"30 min","rest":"preimpasto 12 h; lievitazioni","ingredients":["Preimpasto: farina 00 100 g","farina Manitoba 100 g","lievito di birra fresco 4 g","latte intero 120 g. Impasto: farina 00 100 g","farina Manitoba 200 g","zucchero 80 g","uova 165 g","latte intero 100 g","burro 60 g","lievito fresco 4 g","sale fino 2 g. Spennellatura: tuorlo 1","latte 20 g."],"steps":["Sciogliere il lievito del preimpasto nel latte, unirlo alle due farine e impastare; coprire e lasciare in frigorifero circa 12 ore.","Spezzettare il preimpasto nella planetaria con le farine dell'impasto; aggiungere lievito sciolto nel latte, zucchero e uova gradualmente.","Incorporare sale e burro morbido in più riprese; impastare fino a una massa elastica. Fare brevi riposi e pieghe, quindi lievitare circa 2 ore.","Dividere in porzioni grandi di circa 80 g e piccole di circa 15 g; arrotondarle, sistemarle sulle teglie e lasciarle rilassare.","Premere al centro delle sfere grandi e inserire le palline piccole, formando il caratteristico tuppo.","Spennellare con tuorlo e latte, far lievitare ancora 30 minuti e cuocere a 180 °C statico per circa 25 minuti."],"photo":"https://www.giallozafferano.com/images/237-23768/Sicilian-buns_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Sicilian-buns.html","pdfPage":101,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03342","name":"Brioches allo yogurt senza uova","category":"Colazione e lievitati dolci","serves":"circa 27 brioche","prep":"60 min","cook":"20 min","rest":"oltre 12 h lievitazione","ingredients":["Farina Manitoba 280 g","farina 00 260 g","yogurt greco 250 g","latte intero 120 g","burro morbido 60 g","zucchero 60 g","zucchero di canna 30 g","vaniglia 1 baccello","lievito di birra 6 g","sale fino 8 g. Per spennellare: latte intero q.b."],"steps":["Unire le farine setacciate al lievito e allo zucchero; impastare con latte, yogurt, semi di vaniglia e sale, aggiungendo il burro morbido per ultimo.","Formare una palla e far lievitare coperta per circa due ore; stendere, fare alcune pieghe e far maturare in frigorifero per dieci-dodici ore.","Riportare l'impasto a temperatura ambiente per due-tre ore; stenderlo e ricavare triangoli da arrotolare a cornetto oppure quadrati da modellare a fiocco.","Spennellare con latte, completare i fiocchi con zucchero di canna e cuocere in forno statico a 180 °C per circa venti minuti."],"photo":"https://www.giallozafferano.com/images/323-32358/yogurt-brioches-without-eggs_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/yogurt-brioches-without-eggs.html","pdfPage":102,"description":"Le brioches allo yogurt senza uova sono ideali per la colazione: piccole e morbide delizie da gustare semplici o farcite e da tuffare nel latte"},{"id":"GZ-03343","name":"Brioches variegate al cacao","category":"Colazione e lievitati dolci","serves":"8 brioche","prep":"30 min","cook":"25 min","rest":"2 h lievitazione + 20 e 30 min riposi","ingredients":["Impasto: farina Manitoba 300 g","zucchero 80 g","lievito di birra 2 g","latte intero 125 g","uovo medio 1","burro morbido 50 g","vaniglia 1/2 baccello. Blocco al cacao: burro 100 g","cacao amaro 15 g","farina 00 10 g","vaniglia 1/2 baccello. Per gli stampi: burro q.b."],"steps":["Impastare farina, lievito, latte, zucchero e uovo; aggiungere vaniglia e burro morbido e far lievitare coperto per due ore.","Lavorare il burro del blocco con cacao, farina e vaniglia, stenderlo in un rettangolo fra fogli di carta forno e refrigerare per almeno venti minuti.","Stendere l'impasto lievitato, racchiudervi il blocco al cacao, eseguire le pieghe indicate dalla fonte e lasciare riposare in frigorifero per almeno trenta minuti.","Stendere nuovamente, arrotolare e ricavare otto girelle; porle negli stampi imburrati e attendere dieci minuti.","Cuocere in forno statico a 180 °C per circa 25 minuti."],"photo":"","source":"https://www.giallozafferano.com/recipes/variegated-cocoa-brioches.html","pdfPage":103,"description":"Le brioches variegate al cacao sono golosi boccioli di pasta sfoglia perfetti per la colazione o la merenda"},{"id":"GZ-00013","name":"Bruschetta di frutta","category":"Colazione e lievitati dolci","serves":"20 bruschette","prep":"1 h 15 min","cook":"45 min","rest":"80 min di lievitazione (30+50)","ingredients":["Farina Manitoba: 350 g | Farina 00: 150 g | Burro: 150 g | Latte intero: 125 ml | Acqua: 50 ml | Zucchero per impasto: 20 g | Sale: 8 g | Lievito di birra secco: 4 g | Uova: 2 | Tuorlo: 1 | Prugne: 300 g | Fragole: 300 g | Mele: 200 g | Lamponi: 60 g | Zucchero per frutta: 30 g | Limone: 1 (succo e scorza) | Arancia: 1 | Menta: q.b."],"steps":["Sciogliere il lievito nell’acqua tiepida; impastare con le due farine, uova, zucchero e latte per circa 15 minuti.","Incorporare il sale e il burro morbido poco alla volta, continuando a lavorare finché la pasta diventa elastica.","Coprire e lasciare lievitare 30 minuti in luogo tiepido.","Dividere in tre cordoni, intrecciarli e trasferirli in uno stampo da plumcake di circa 28 × 11 cm. Lasciare crescere altri 50 minuti circa.","Spennellare la superficie con il tuorlo e cuocere in forno a 180 °C per circa 40 minuti. Raffreddare il pan brioche.","Ridurre prugne, fragole, mele e arancia in piccoli pezzi; unire lamponi, zucchero, succo e scorza di limone e menta.","Tagliare il pan brioche a fette spesse circa 1,5 cm, dividerle in triangoli e tostarle su entrambi i lati.","Distribuire la macedonia sul pane tostato e servire subito."],"photo":"","source":"https://ricette.giallozafferano.it/Bruschetta-di-frutta.html","pdfPage":104,"description":"La bruschetta di frutta è un fresco dessert preparato con pan brioches e frutta, ideale per la stagione primaverile ed estiva"},{"id":"GZ-03348","name":"Ciambella","category":"Colazione e lievitati dolci","serves":"8 persone; stampo 23 cm","prep":"15 min","cook":"45 min","rest":"raffreddamento","ingredients":["Uova 3","burro 180 g","farina 00 300 g","zucchero 180 g","latte intero 150 g","sale 1 pizzico","lievito per dolci 10 g","scorza di limoni 2","bacca di vaniglia 1."],"steps":["Portare tutti gli ingredienti a temperatura ambiente; montare burro e zucchero per almeno cinque minuti.","Aggiungere le uova una alla volta, aspettando che ciascuna sia assorbita.","Profumare con sale, semi di vaniglia e scorza di limone.","Incorporare gradualmente il latte alternandolo alla farina setacciata con il lievito; lavorare fino a eliminare i grumi.","Versare nello stampo a ciambella imburrato e infarinato e cuocere in forno statico a 175 °C per circa 45 minuti.","Lasciare intiepidire e sformare."],"photo":"https://www.giallozafferano.com/images/354-35463/donut_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/donut.html","pdfPage":105,"description":"Se amate le ricette genuine, una buona ciambella fatta in casa non può mancare sulla vostra tavola: così soffice e golosa, è perfetta sia per la colazione che per la merenda!"},{"id":"GZ-03385","name":"Ciambellone","category":"Colazione e lievitati dolci","serves":"1 ciambellone, stampo da 24 cm","prep":"Non indicato nel testo recuperato","cook":"40 min","rest":"","ingredients":["Farina 00: 375 g | Zucchero: 310 g | Burro morbido: 200 g | Latte intero: 190 g | Uova: 5 | Lievito per dolci: 16 g | Scorza di limone: 1 | Sale: 1 pizzico | Zucchero a velo: q.b."],"steps":["Portare burro, uova e latte a temperatura ambiente; setacciare farina e lievito.","Montare il burro morbido con la scorza di limone, poi incorporare lo zucchero e un pizzico di sale.","Aggiungere le uova una alla volta, montando fino a completo assorbimento.","Alternare la miscela di farina e lievito con il latte, mescolando delicatamente fino a un composto denso e uniforme.","Trasferire nello stampo a ciambella da 24 cm imburrato e livellare la superficie.","Cuocere nel ripiano centrale del forno statico preriscaldato a 180 °C per circa 40 minuti; verificare con stecchino, raffreddare e completare con zucchero a velo."],"photo":"","source":"https://ricette.giallozafferano.it/Ciambellone.html","pdfPage":106,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03597","name":"besciamella","category":"Creme, impasti e preparazioni di base","serves":"circa 1 litro","prep":"10 min","cook":"5–6 min di addensamento","rest":"","ingredients":["Latte intero 1 l | Burro 100 g | Farina 00 100 g | Sale fino 1 pizzico | Noce moscata q.b."],"steps":["Scaldare il latte con sale e noce moscata, senza farlo bollire energicamente. | 2. In un secondo tegame fondere il burro a fiamma moderata e incorporarvi la farina con una frusta, lavorando il roux finché assume una tonalità leggermente dorata. | 3. Diluire il roux prima con poco latte caldo e poi con il resto, sempre mescolando. | 4. Proseguire a fuoco dolce per circa 5–6 minuti, fino a una salsa liscia di densità media."],"photo":"","source":"https://ricette.giallozafferano.it/Besciamella.html","pdfPage":107,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03605","name":"Brodo granulare","category":"Creme, impasti e preparazioni di base","serves":"quantità non indicata","prep":"5 min","cook":"3 h","rest":"","ingredients":["Sale grosso 300 g","scarti edibili di carote q.b.","scarti edibili di zucchine q.b.","scarti edibili di peperoni q.b.","bucce edibili di cipolle q.b.","bucce edibili di patate q.b.","scarti edibili di cipollotti q.b.","scarti edibili di melanzane q.b.\nLa preparazione specifica nel procedimento 760 g complessivi di scarti vegetali, non ripartiti per ingrediente."],"steps":["Selezionare esclusivamente scarti vegetali puliti e commestibili, per un peso complessivo di 760 g.","Frullare gli scarti con il sale grosso fino a ottenere una purea.","Trasferire il composto in un colino e premerlo per eliminare l'acqua in eccesso.","Distribuire la massa in uno strato sottile su una teglia rivestita di carta forno e asciugare in forno statico a 120 °C per circa due ore e mezza.","Lasciare raffreddare completamente, frullare di nuovo fino a ottenere un granulato e conservare in un barattolo a chiusura ermetica secondo le indicazioni della fonte."],"photo":"","source":"https://www.giallozafferano.com/recipes/granular-broth.html","pdfPage":108,"description":"Il brodo granulare è la soluzione ideale per chi non ama i prodotti confezionati: pronto in pochi minuti, è perfetto per cuocere e insaporire i vostri piatti preferiti!"},{"id":"GZ-03611","name":"Caramello","category":"Creme, impasti e preparazioni di base","serves":"resa non indicata","prep":"5 min","cook":"15 min","rest":"","ingredients":["Caramello a secco: zucchero 350 g. Variante all’acqua: zucchero 350 g","acqua 350 g."],"steps":["Per il caramello a secco utilizzare una casseruola d'acciaio dal fondo spesso e scaldare a fiamma molto bassa una piccola parte dello zucchero.","Quando si scioglie, aggiungere altro zucchero poco alla volta, senza mescolare direttamente, finché tutto è caramellato.","Controllare con termometro: per un caramello chiaro fermarsi intorno a 160 °C; per quello scuro intorno a 180 °C, senza superare la soglia.","Per la versione con acqua versare zucchero e acqua insieme in una casseruola e scaldare dolcemente fino a scioglimento e colorazione.","Utilizzare il caramello ancora fluido per decorazioni, lavorando con attenzione per l'elevata temperatura."],"photo":"https://ptps.stbm.it/t/9aen6l_large.jpg","source":"https://www.giallozafferano.com/recipes/Caramel.html","pdfPage":109,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03623","name":"Confettura di albicocche","category":"Creme, impasti e preparazioni di base","serves":"circa 900 g di confettura","prep":"20 min","cook":"30 min","rest":"macerazione 4 ore","ingredients":["Albicocche mature 1 kg","zucchero 250 g."],"steps":["Lavare e asciugare le albicocche, dividerle, eliminare il nocciolo e tagliarle a spicchi senza sbucciarle.","Mescolare la frutta con lo zucchero in una ciotola, coprire e lasciare macerare al fresco per circa quattro ore.","Trasferire tutto in una pentola e portare a bollore, mescolando periodicamente.","Proseguire la cottura per circa 30 minuti, eliminando l'eventuale schiuma; controllare la consistenza con la prova del piattino.","Versare nei vasetti correttamente sanificati e procedere alla chiusura secondo le regole di conservazione sicura."],"photo":"https://ptps.stbm.it/t/l1jl3i_large.jpg","source":"https://www.giallozafferano.com/recipes/Apricot-Jam.html","pdfPage":110,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03630","name":"Confettura di lamponi","category":"Creme, impasti e preparazioni di base","serves":"circa 14 oz di confettura; fonte indica anche 20 porzioni","prep":"15 min","cook":"50 min","rest":"macerazione almeno 4 ore","ingredients":["Lamponi 500 g","zucchero 200 g","succo di limone 20 g."],"steps":["Predisporre vasetti puliti e correttamente sanificati. Lavare e asciugare i lamponi.","Condire la frutta con succo di limone filtrato e zucchero, coprire e lasciare macerare in frigorifero almeno quattro ore, preferibilmente una notte.","Trasferire in pentola, portare a bollore e cuocere per circa 50–60 minuti mescolando e togliendo la schiuma.","Controllare la consistenza con una goccia su un piattino; per un risultato senza semi passare al setaccio.","Versare ancora calda nei vasetti sanificati e chiudere seguendo una procedura di conservazione sicura; verificare correttamente la tenuta. La sola chiusura a caldo non sostituisce una procedura validata per conserve."],"photo":"","source":"https://www.giallozafferano.com/recipes/raspberry-jam.html","pdfPage":111,"description":"Scoprite come realizzare una deliziosa conserva estiva per farcire i vostri dolci preferiti e allietare le colazioni di tutto l'anno: confettura di lamponi!"},{"id":"GZ-03648","name":"Crema spalmabile al pistacchio","category":"Creme, impasti e preparazioni di base","serves":"4 persone","prep":"20 min","cook":"10 min","rest":"12–14 ore a 22–24 °C","ingredients":["Pistacchi sgusciati 80 g","cioccolato bianco 130 g","olio di vinaccioli 50 g","sale fino 1 g."],"steps":["Tostare i pistacchi in forno statico a 185 °C per circa dieci minuti e lasciarli raffreddare.","Tritare e fondere il cioccolato bianco a bagnomaria o al microonde.","Frullare i pistacchi con il sale fino a ridurli in farina; aggiungere poco olio e proseguire a impulsi per ottenere una pasta cremosa, evitando il surriscaldamento.","Unire il cioccolato fuso e l'olio rimanente, mescolando fino a uniformare il composto.","Raffreddare la crema fino a circa 22 °C e lasciarla stabilizzare per 12–14 ore a 22–24 °C, secondo la fonte."],"photo":"https://www.giallozafferano.com/images/250-25025/Pistachio-spread_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Pistachio-spread.html","pdfPage":112,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02539","name":"Bavarese","category":"Dessert al cucchiaio e freddi","serves":"4 persone","prep":"20 min","cook":"11 min","rest":"3–4 ore in frigorifero","ingredients":["Panna fresca liquida 200 g","latte intero 150 g","tuorli 55 g (circa 3)","zucchero 60 g","gelatina in fogli 6 g","baccello di vaniglia 1"],"steps":["Mescolare tuorli e zucchero. Idratare la gelatina in acqua fredda e incidere la vaniglia.","Scaldare il latte con semi e baccello di vaniglia quasi a bollore; filtrarlo sui tuorli, mescolare e riportare in casseruola.","Cuocere la crema inglese mescolando fino a 82 °C, poi togliere dal fuoco e sciogliervi la gelatina scolata. Filtrare.","Raffreddare rapidamente la crema su acqua e ghiaccio. Semimontare la panna e incorporarla con movimenti delicati.","Versare nello stampo e lasciar rassodare in frigorifero 3–4 ore; sformare dopo un breve contatto dello stampo con acqua tiepida."],"photo":"","source":"https://www.giallozafferano.com.br/receitas/bavarois.html","pdfPage":113,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03595","name":"Bavarese al cioccolato bianco e salsa alla menta","category":"Dessert al cucchiaio e freddi","serves":"5 persone / 5 stampi da 5 cm","prep":"25 min","cook":"10 min","rest":"una notte in frigorifero","ingredients":["Per la bavarese: Gelatina in fogli 6 g","Latte intero fresco 300 g","Panna fresca liquida 300 g","Cioccolato bianco 100 g","Zucchero 50 g","Tuorli 3","Baccello di vaniglia 1. Per la salsa: Gelatina in fogli 0,5 g","Panna fresca liquida 100 g","Sciroppo alla menta 10 g","Menta 6 foglie","Colorante alimentare verde 1 g (facoltativo)."],"steps":["Tritare il cioccolato bianco. Lavorare i tuorli con lo zucchero. Scaldare latte e panna con bacca e semi di vaniglia, poi eliminare la bacca.","Temperare i tuorli con parte del latte caldo, riunire nel pentolino e mescolare fino a una crema che vela il cucchiaio, senza farla bollire vigorosamente.","Ammollare 6 g di gelatina in acqua fredda per 10 minuti, strizzarla e scioglierla nella crema calda. Aggiungere il cioccolato bianco e mescolare fino a fusione completa.","Filtrare e distribuire in cinque stampini; lasciare rassodare in frigorifero per una notte.","Per la salsa scaldare 100 g di panna con le foglie di menta; lasciare in infusione un’ora, quindi unire lo sciroppo e, se desiderato, il colorante. Filtrare, incorporare 0,5 g di gelatina ammollata e raffreddare.","Sformare delicatamente le bavaresi, eventualmente scaldando per un istante l’esterno degli stampini, e servire con la salsa alla menta."],"photo":"https://www.giallozafferano.it/images/7-746/Bavarese-al-cioccolato-bianco_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Bavarese-al-cioccolato-bianco.html","pdfPage":114,"description":"La bavarese al cioccolato bianco e salsa alla menta è un dolce al cucchiaio molto fresco e delicato, dalle note esotiche, perfetto a fine pasto!"},{"id":"GZ-02540","name":"Bicchierini cheesecake ai cachi","category":"Dessert al cucchiaio e freddi","serves":"4 bicchierini","prep":"20 min","cook":"5 min","rest":"","ingredients":["BASE: biscotti 150 g","burro 75 g.\nCREMA: formaggio spalmabile 250 g","mascarpone 250 g","panna fresca 250 g","cachi maturi morbidi 2","zucchero a velo 60 g","estratto di vaniglia q.b.\nCACHI SALTATI: cachi mela 2","burro 10 g","zucchero a velo 10 g.\nNOTA FONTE: lamelle di mandorla citate nella finitura, senza dose nell'elenco ingredienti."],"steps":["Prelevare la polpa dei cachi morbidi; sbucciare e ridurre a dadini i cachi mela.","Saltare i dadini con burro e zucchero a velo per circa cinque minuti e lasciar raffreddare.","Montare insieme formaggio spalmabile, mascarpone, panna, zucchero a velo e vaniglia; incorporare la polpa dei cachi morbidi.","Frullare i biscotti con il burro morbido fino a ottenere briciole umide.","Distribuire la base in quattro bicchieri, alternare crema e cachi saltati e terminare con briciole e cubetti di frutta. La fonte menziona anche mandorle a lamelle per decorare, senza quantità indicata."],"photo":"","source":"https://www.giallozafferano.com/recipes/persimmon-cheesecake-cups.html","pdfPage":115,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02552","name":"Budino al cioccolato","category":"Dessert al cucchiaio e freddi","serves":"2 stampini da 150 ml","prep":"10 min","cook":"10 min","rest":"almeno 3 ore in frigorifero","ingredients":["Latte intero 250 g | Cioccolato fondente 70 g | Zucchero 50 g | Burro 40 g | Amido di mais 20 g | Decorazione: amaretti 16 g, cioccolato fondente in scaglie e melagrana q.b."],"steps":["Portare il latte quasi a bollore in un pentolino. | 2. Sciogliere il burro in un altro tegame, aggiungere lo zucchero e il cioccolato spezzettato, mescolando fino a fusione. | 3. Incorporare l’amido setacciato e versare gradualmente il latte caldo, continuando a lavorare con la frusta. | 4. Cuocere finché il composto inizia ad addensarsi; distribuire negli stampi umidi, alternando con un amaretto sbriciolato. | 5. Raffreddare, poi rassodare in frigorifero per almeno tre ore. Sformare e decorare con amaretti, scaglie e melagrana."],"photo":"","source":"https://ricette.giallozafferano.it/Budino-al-cioccolato.html","pdfPage":116,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02553","name":"Budino al cioccolato bianco","category":"Dessert al cucchiaio e freddi","serves":"4 stampi","prep":"15 min","cook":"30 min","rest":"almeno 4 ore in frigorifero","ingredients":["BUDINO: Latte intero 800 ml","Cioccolato bianco 160 g","Latte condensato 70 g","Tuorli 3","Gelatina in fogli 10 g.\nSALSA: Cacao amaro 60 g","Panna fresca liquida 150 g","Acqua 140 g","Zucchero 200 g","Burro 10 g.\nDECORAZIONE: Cioccolato fondente q.b."],"steps":["Ammollare la gelatina in acqua fredda per almeno dieci minuti. Sbattere i tuorli con il latte condensato.","Scaldare il latte a fuoco dolce, aggiungere la miscela di tuorli, il cioccolato bianco e la gelatina ben strizzata; mescolare finché tutto si scioglie.","Versare in quattro stampi e lasciare rassodare in frigorifero per almeno quattro ore.","Per la salsa scaldare panna, acqua e zucchero; incorporare il cacao setacciato poco per volta e il burro. Cuocere mescolando fino a leggero addensamento, circa quindici minuti.","Raffreddare la salsa coperta a contatto. Sformare i budini con un breve passaggio dello stampo in acqua calda.","Servire sulla salsa al cacao, completando con scaglie di fondente."],"photo":"https://www.giallozafferano.com/images/321-32134/white-chocolate-pudding_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/white-chocolate-pudding.html","pdfPage":117,"description":"Il budino al cioccolato bianco è un delizioso dessert accompagnato da una gustosa salsa al cioccolato fondente"},{"id":"GZ-02554","name":"Budino alla vaniglia","category":"Dessert al cucchiaio e freddi","serves":"4 persone","prep":"15 min","cook":"5 min","rest":"4 ore in frigorifero","ingredients":["Zucchero 100 g","Baccello di vaniglia 1","Latte intero 350 ml","Panna fresca liquida 200 ml","Tuorli 4","Gelatina in fogli 9 g."],"steps":["Ammollare la gelatina in acqua fredda per quindici minuti.","Aprire la vaniglia e scaldarne semi e baccello con latte e panna, arrivando lentamente vicino al bollore.","Filtrare il liquido caldo per togliere il baccello, poi sciogliervi la gelatina ben strizzata.","Sbattere i tuorli con lo zucchero e versarvi a filo il composto di latte e panna, continuando a mescolare.","Riempire uno stampo o quattro stampini e raffreddare in frigorifero almeno quattro ore.","Per sformare, immergere brevemente lo stampo in acqua calda e capovolgere sul piatto."],"photo":"https://www.giallozafferano.com/images/277-27777/Vanilla-Pudding_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Vanilla-Pudding.html","pdfPage":118,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02555","name":"budino alle fragole","category":"Dessert al cucchiaio e freddi","serves":"4 budini","prep":"10 min","cook":"10 min","rest":"almeno 2 h in frigorifero","ingredients":["Fragole 500 g","latte intero 250 g","zucchero 150 g","amido di mais 40 g","succo di 1 limone (nel procedimento la fonte impiega inizialmente metà limone)."],"steps":["Lavare e mondare le fragole, frullarle e filtrare la purea per eliminare i semi.","Scaldare in casseruola latte e 300 g di purea, tenendo da parte il resto per la decorazione; unire zucchero e amido con una frusta.","Aggiungere il succo di limone e cuocere mescolando fino a quando la crema raggiunge il bollore e si addensa.","Distribuire in quattro stampini inumiditi, coprire e rassodare in frigorifero per almeno due ore; sformare e completare con la salsa di fragole tenuta da parte."],"photo":"","source":"https://www.giallozafferano.com/recipes/strawberry-pudding.html","pdfPage":119,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02556","name":"budino cacao e cannella","category":"Dessert al cucchiaio e freddi","serves":"4 budini","prep":"10 min","cook":"4 min","rest":"frigorifero circa 3 ore","ingredients":["Latte senza lattosio 500 g","cacao amaro senza lattosio 30 g","amido di mais 45 g","zucchero 135 g","cannella in polvere 1 pizzico."],"steps":["Setacciare zucchero, amido di mais, cacao e cannella e mescolare accuratamente.","Versare il latte freddo in casseruola; incorporare le polveri in tre riprese con una frusta per evitare grumi.","Scaldare mescolando di continuo per circa 3–4 minuti, fino ai primi bollori e all'addensamento.","Inumidire gli stampini, versare la crema calda, lasciar intiepidire per un quarto d'ora e coprire.","Refrigerare per circa tre ore, sformare e servire con una spolverata di cannella."],"photo":"","source":"https://www.giallozafferano.com/recipes/Lactose-Free-Cocoa-and-Cinnamon-Pudding.html","pdfPage":120,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02557","name":"budino cachi e cacao","category":"Dessert al cucchiaio e freddi","serves":"4 persone","prep":"10 min","cook":"","rest":"almeno 8 h in frigorifero","ingredients":["Cachi maturi 700 g","cacao amaro in polvere 40 g. Per decorare: cacao amaro q.b.","mandorle tritate o frutta secca caramellata q.b."],"steps":["Eliminare il picciolo e la buccia dei cachi, raccogliendone la polpa nel frullatore.","Aggiungere il cacao amaro e frullare fino a ottenere una crema omogenea.","Suddividere il composto in quattro stampi, coprire e riporre in frigorifero per almeno otto ore.","Sformare con delicatezza e completare con cacao e frutta secca a piacere."],"photo":"","source":"https://www.giallozafferano.com/recipes/persimmon-and-cocoa-pudding.html","pdfPage":121,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02558","name":"Budino di castagne","category":"Dessert al cucchiaio e freddi","serves":"6 budini da circa 200 g","prep":"60 min","cook":"1 h 30 min","rest":"2 ore in frigorifero","ingredients":["Castagne 1 kg","latte intero 500 g","zucchero 50 g","panna fresca liquida 260 g","cioccolato fondente 150 g","gelatina in fogli 8 g. DECORAZIONE: cioccolato fondente 30 g."],"steps":["Lessare le castagne per circa 30 minuti, tenerle coperte durante il raffreddamento e sbucciarle eliminando anche la pellicina.","Cuocerle nel latte a fuoco moderato per circa un’ora, finché si ammorbidiscono; passarle al passaverdure per ricavarne una purea.","Ammollare la gelatina in acqua fredda. Scaldare la purea con panna e zucchero, poi aggiungere il cioccolato tritato e mescolare fino a scioglierlo.","Frullare per uniformare la crema; incorporare la gelatina ben strizzata e distribuirla in sei stampini.","Lasciar intiepidire e rassodare in frigorifero per circa 2 ore; sformare con un rapido passaggio degli stampi in acqua calda e decorare con scaglie di cioccolato."],"photo":"https://www.giallozafferano.com/images/306-30651/chestnut-pudding_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/chestnut-pudding.html","pdfPage":122,"description":"Il budino di castagne è un delizioso dessert al cucchiaio delicato e raffinato, che racchiude tutto il sapore d'autunno: semplicemente irresistibile!"},{"id":"GZ-02560","name":"Budino di riso","category":"Dessert al cucchiaio e freddi","serves":"12 pezzi","prep":"30 min","cook":"1 h 20 min","rest":"frolla almeno 1 h","ingredients":["FROLLA: farina 00 250 g","burro 150 g","zucchero 60 g","uovo 1","sale 1 pizzico. CREMA DI RISO: riso Originario 100 g","latte 500 g","zucchero 80 g","scorza d'arancia e limone q.b.","estratto di vaniglia 1 cucchiaino","sale 1 pizzico. CREMA PASTICCERA: latte 250 g","tuorli 2","zucchero 60 g","amido di mais 20 g","scorza di limone q.b. DECORAZIONE: zucchero a velo q.b."],"steps":["Lavorare farina, zucchero, sale, uovo e burro per una frolla omogenea; coprire e riposare in frigorifero almeno un'ora.","Cuocere il riso nel latte con vaniglia, scorze di agrumi e sale per 25-30 minuti, finché il liquido è assorbito; eliminare le scorze e far raffreddare.","Mescolare tuorli, zucchero e amido, incorporare il latte e la scorza di limone; addensare a fuoco dolce, eliminare la scorza e raffreddare.","Unire crema pasticcera e riso. Stendere la frolla sottile e rivestire 12 stampini da muffin imburrati e infarinati; riempire con la crema di riso.","Cuocere in forno ventilato a circa 175 °C per 40 minuti, far raffreddare e spolverare con zucchero a velo."],"photo":"https://www.giallozafferano.com/images/347-34753/rice-pudding_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/rice-pudding.html","pdfPage":123,"description":"Il budino di riso è un dessert cremoso e avvolgente, un dolce perfetto per coccolarsi con gusto. Facile da preparare e irresistibile a ogni cucchiaio!"},{"id":"GZ-02576","name":"cheesecake ai fichi","category":"Dessert al cucchiaio e freddi","serves":"8 persone","p
