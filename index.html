nde 1","ceci precotti sgocciolati 460 g","carote 2","cipolla rossa 1","olive taggiasche 80 g","tahina 3 cucchiai","aglio 1 spicchio","olio EVO q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Staccare dieci foglie grandi di verza, sbollentarle per 3 minuti in acqua salata e farle raffreddare. 2. Tritare la cipolla e tagliare le carote a julienne; rosolarle con olio e aglio, aggiungere poca acqua e cuocere circa 8 minuti. 3. Frullare metà dei ceci con tahina, sale e pepe. 4. Rimuovere l’aglio e unire alle verdure la crema di ceci, i ceci interi e le olive, facendo asciugare il ripieno. 5. Farcire le foglie, ripiegare i lati e arrotolare. Disporre in teglia unta, condire con olio, sale e pepe e cuocere in forno ventilato a 180 °C per circa 20 minuti."],"photo":"","source":"https://www.giallozafferano.com/recipes/vegetarian-cabbage-rolls.html","pdfPage":353,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01796","name":"asparagi al forno","category":"Verdure e contorni","serves":"4 persone","prep":"","cook":"","rest":"","ingredients":["Asparagi: 500 g (peso da pulire) | Aglio: 1 spicchio | Parmigiano Reggiano DOP: q.b. | Timo limonato: q.b. | Olio extravergine d'oliva: q.b. | Sale fino: q.b. | Pepe nero: q.b."],"steps":["Lavare gli asparagi ed eliminare la base più fibrosa dei gambi. | Ungere una teglia e mettere uno spicchio di aglio schiacciato. | Sistemare gli asparagi affiancati, senza sovrapporli; distribuire sale, pepe e Parmigiano grattugiato. | Aggiungere un filo d'olio e le foglioline di timo limonato. | Cuocere in forno statico preriscaldato a 180 °C per circa 15-20 minuti, adattando il tempo al calibro degli asparagi. | Eliminare l'aglio e servire caldi."],"photo":"","source":"https://ricette.giallozafferano.it/Asparagi-al-forno.html","pdfPage":354,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01797","name":"Asparagi allo zabaione salato","category":"Verdure e contorni","serves":"4 persone","prep":"30 min","cook":"15 min","rest":"","ingredients":["Asparagi 600 g","tuorli 4","burro 60 g","vino bianco 80 ml","sale fino q.b.","pepe nero q.b."],"steps":["Mondare gli asparagi, eliminare le basi legnose e lessarli legati a mazzetto in acqua salata per 10–15 minuti; devono rimanere compatti.","In una casseruola da bagnomaria sbattere i tuorli con poco sale; mantenere l’acqua sottostante appena fremissante.","Incorporare il burro morbido, quindi versare lentamente il vino continuando a montare fino a ottenere una salsa spumosa e più densa.","Distribuire lo zabaione sugli asparagi caldi, completare con pepe macinato e servire subito."],"photo":"","source":"https://ricette.giallozafferano.it/Asparagi-allo-zabaione-salato.html","pdfPage":355,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01801","name":"Asparagi in padella","category":"Verdure e contorni","serves":"4 persone","prep":"10 min","cook":"20 min","rest":"","ingredients":["Asparagi 500 g","Vino bianco 40 g","Burro q.b.","Sale fino q.b.","Pepe nero q.b."],"steps":["Lava gli asparagi, spezza la base più dura e pela la parte inferiore dei gambi.","Sciogli una noce di burro in padella e disponi gli asparagi senza sovrapporli.","Rosola a fiamma medio-alta per 4–5 minuti, poi girali e prosegui per altri 3–4 minuti.","Sfuma con il vino bianco e lascia evaporare la parte alcolica.","Condisci con sale e pepe, copri e continua la cottura a fuoco più basso fino a quando sono teneri, per circa 20 minuti secondo la fonte."],"photo":"https://www.giallozafferano.com/images/345-34528/asparagus-in-the-pan_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/asparagus-in-the-pan.html","pdfPage":356,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01805","name":"Bastoncini di carote fritte","category":"Verdure e contorni","serves":"4 persone","prep":"10 min","cook":"5 min","rest":"","ingredients":["Carote 500 g\nPER PANATURA: Parmigiano Reggiano DOP 100 g","paprika 2 cucchiai","rosmarino q.b.","timo q.b.","sale fino q.b.\nVERSIONE CROCCANTE FACOLTATIVA: tuorli 2","acqua freddissima q.b.","farina 00 q.b.\nPER FRIGGERE E SERVIRE: olio di semi di arachide q.b.","confettura di mirtilli rossi q.b."],"steps":["Tritare rosmarino e timo e mescolarli con Parmigiano grattugiato e paprika.","Sbucciare le carote e tagliarle a bastoncini di circa 1 cm.","Per la panatura semplice, rivestire direttamente i bastoncini con il composto di formaggio ed erbe.","Friggere pochi bastoncini alla volta in olio a 180 °C finché dorati (circa un minuto), quindi scolare su carta assorbente.","Per la variante croccante, passare le carote asciutte prima nella farina, poi nei tuorli stemperati con poca acqua fredda e infine nella panatura aromatica; friggere allo stesso modo.","Salare e accompagnare con confettura di mirtilli rossi."],"photo":"","source":"https://www.giallozafferano.com/recipes/Carrot-fries.html","pdfPage":357,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01806","name":"Bietole in padella","category":"Verdure e contorni","serves":"4 persone","prep":"15 min","cook":"15 min","rest":"","ingredients":["Bietole 1 kg","aglio 3 spicchi","peperoncini secchi 2","olio EVO 20 g","sale fino q.b."],"steps":["Lavare accuratamente le bietole; separare le foglie dalle coste.","Scaldare l'olio in una padella capiente con l'aglio schiacciato e non sbucciato.","Unire gradualmente le foglie, mescolare e lasciarle appassire per circa 10 minuti.","Aggiungere peperoncino e sale, proseguire la cottura per un paio di minuti e servire; eliminare l'aglio se desiderato. La fonte consiglia di sbollentare prima le coste se si vogliono utilizzare."],"photo":"https://www.giallozafferano.com/images/307-30783/chard-in-the-pan_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/chard-in-the-pan.html","pdfPage":358,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01813","name":"broccoli gratinati","category":"Verdure e contorni","serves":"4 persone","prep":"10 min","cook":"30 min","rest":"","ingredients":["Broccoli 1 kg (da pulire)","Parmigiano Reggiano grattugiato 40 g","pepe nero q.b. BESCIAMELLA: latte intero 250 g","farina 00 25 g","burro 25 g","noce moscata q.b.","sale fino q.b."],"steps":["Preparare una besciamella sciogliendo il burro e cuocendo brevemente la farina; aggiungere il latte in più riprese mescolando con la frusta.","Addensare e insaporire con sale, pepe e noce moscata.","Dividere i broccoli in cimette, lavarli e sbollentarli per circa sei minuti; raffreddarli in acqua e ghiaccio e asciugarli.","Alternare broccoli e besciamella in una pirofila, terminando con Parmigiano grattugiato.","Cuocere in forno statico a 200 °C per 17 minuti e gratinare a 230 °C per altri 4–5 minuti; servire caldi."],"photo":"https://www.giallozafferano.com/images/283-28397/gratinated-broccoli_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/gratinated-broccoli.html","pdfPage":359,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01821","name":"caponata","category":"Verdure e contorni","serves":"6 porzioni","prep":"40 min","cook":"40 min","rest":"riposo in frigorifero","ingredients":["Melanzane 1 kg","sedano 400 g","cipolle bianche 250 g","pomodori ramati 200 g","olive verdi denocciolate 200 g","capperi sotto sale sciacquati 50 g","pinoli 50 g","zucchero 60 g","aceto di vino bianco 60 g","basilico q.b.","concentrato di pomodoro 40 g","olio EVO q.b. (anche per friggere)","sale fino q.b."],"steps":["Affettare cipolle e sedano; tagliare melanzane e pomodori a pezzi e dividere le olive. Tostare brevemente i pinoli.","Friggere le melanzane in più riprese e sgocciolarle su carta assorbente.","In una padella ampia dorare la cipolla nell'olio, aggiungere sedano, capperi, olive, pinoli e pomodori; coprire e cuocere 15–20 minuti.","Mescolare aceto, zucchero e concentrato di pomodoro, versare sulle verdure e far evaporare la nota acetica.","Spegnere il fuoco, incorporare le melanzane e il basilico. Lasciare raffreddare e riposare; servire a temperatura ambiente."],"photo":"https://www.giallozafferano.com/images/227-22754/caponata-eggplant-salad_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/caponata-eggplant-salad.html","pdfPage":360,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01822","name":"Caponata di melanzane con salsa al cacao","category":"Verdure e contorni","serves":"4 porzioni","prep":"30 min","cook":"30 min","rest":"riposo 1 ora e 30 min circa","ingredients":["Melanzane 2","cipolla rossa di Tropea 1","sedano 1 costa","pomodorini 8","peperone rosso 1","capperi sotto sale 1 cucchiaio","olive verdi denocciolate 100 g","uvetta 40 g","pinoli 30 g","miele di zagara 1 cucchiaio","aceto di vino bianco 3 cucchiai","cacao amaro 2 cucchiai","Marsala q.b.","olio EVO, sale, pepe e basilico q.b."],"steps":["Mettere l'uvetta nel Marsala per 30 minuti; dissalare i capperi. Affettare e salare le melanzane, lasciarle spurgare per mezz'ora, poi asciugarle e tagliarle a cubetti.","Preparare cipolla, sedano, peperone e pomodorini; saltare prima il peperone e poi friggere le melanzane, scolando entrambi.","Soffriggere cipolla e sedano; aggiungere capperi, pinoli, uvetta e olive e insaporire per qualche minuto.","Riunire in padella melanzane, peperone e pomodorini, salare e pepare.","Emulsionare aceto, miele e cacao; versare sulle verdure e cuocere per 3–4 minuti. Lasciare riposare almeno un'ora e completare con basilico."],"photo":"https://ptps.stbm.it/t/oc7xgl_large.jpg","source":"https://www.giallozafferano.com/recipes/eggplant-caponata-with-cocoa-sauce.html","pdfPage":361,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01862","name":"Cipolle al forno","category":"Verdure e contorni","serves":"","prep":"","cook":"60-75 min in forno, dopo sbollentatura di 7-8 min","rest":"","ingredients":["Cipolle bianche 500 g","Cipolle rosse 500 g","Sale fino q.b.","Prezzemolo 1 ciuffo","Pangrattato 2 cucchiai","Olio extravergine d'oliva q.b.","Pepe nero q.b."],"steps":["Eliminare la buccia delle cipolle e sbollentarle in acqua salata per circa 7-8 minuti. Scolarle e dividerle a metà.","Ungere una pirofila e sistemare le mezze cipolle con la superficie tagliata rivolta verso l'alto.","Condire con sale, pepe, prezzemolo tritato, pangrattato e un filo di olio extravergine.","Cuocere in forno a 180 °C per circa 60-75 minuti, finché le cipolle risultano tenere e ben colorite.","Per una doratura più intensa, terminare gli ultimi 10 minuti a 200 °C con il grill; servire calde."],"photo":"https://www.giallozafferano.it/images/15-1515/Cipolle-al-forno_650x433_wm.jpg","source":"https://ricette.giallozafferano.it/Cipolle-al-forno.html","pdfPage":362,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00036","name":"Involtini di cavolo alla zucca","category":"Verdure e contorni","serves":"9 involtini","prep":"20 min","cook":"35 min","rest":"","ingredients":["Verza 300 g (circa 5 foglie)","zucca mantovana 700 g","speck in un'unica fetta 150 g","Grana Padano DOP 30 g","olio extravergine d'oliva 10 g","rosmarino q.b.","sale fino q.b.","pepe nero q.b.","burro q.b. per la pirofila."],"steps":["Tagliare la zucca a fette, pulirla e cuocerla su carta forno con olio, rosmarino, sale e pepe a 180 °C per 25-30 minuti.","Staccare le foglie di verza, eliminare la nervatura centrale, dividerle e sbollentarle per circa un minuto; scolarle bene.","Tagliare lo speck a dadini e rosolarlo in padella per 5-10 minuti.","Frullare la zucca cotta fino a ottenere una purea.","Distribuire purea e speck sulle foglie di verza, richiuderle a fagottino e sistemarle in una pirofila imburrata.","Spolverare con Grana Padano e gratinare sotto il grill a circa 220 °C per 5-10 minuti."],"photo":"https://www.giallozafferano.com/images/319-31924/cabbage-rolls-with-pumpkin_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Involtini-di-cavolo-alla-zucca.html","pdfPage":363,"description":"Gli involtini di cavolo alla zucca sono un contorno gustoso realizzato con foglie di cavolo, polpa di zucca mantovana e dadini di speck"},{"id":"GZ-03864","name":"pak choi in wok","category":"Verdure e contorni","serves":"4 persone","prep":"10 min","cook":"10 min","rest":"","ingredients":["Pak choi 450 g","zenzero fresco 50 g","aglio 2 spicchi","salsa di ostriche 1 cucchiaio","semi di sesamo q.b.","olio di semi di arachide (o girasole) 2 cucchiai","sale fino q.b.","pepe nero q.b."],"steps":["Lavare il pak choi, eliminare la base e separare foglie e coste; tagliare queste ultime in quattro nel senso della lunghezza.","Tritare l’aglio e ridurre lo zenzero sbucciato a bastoncini sottili.","Scaldare bene il wok con l’olio, quindi unire aglio, zenzero e coste di pak choi.","Aggiungere le foglie e saltare a fiamma alta; condire con sale, pepe e salsa di ostriche.","Proseguire per circa 8 minuti mescolando, finché le coste diventano tenere; guarnire con semi di sesamo e servire."],"photo":"https://www.giallozafferano.com/images/343-34398/pak-choi-in-wok_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/pak-choi-in-wok.html","pdfPage":364,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02302","name":"Zucchine alla sorrentina","category":"Verdure e contorni","serves":"2 persone","prep":"15 min","cook":"30 min","rest":"","ingredients":["Zucchine 400 g","pomodorini 200 g","basilico 10 foglie","aglio 2 spicchi","olio EVO q.b.","sale fino q.b.","pepe nero q.b.","mozzarella fiordilatte 125 g","Grana Padano DOP grattugiato 10 g."],"steps":["Tagliare il fiordilatte a dadini e lasciarlo scolare. Affettare le zucchine e farle insaporire in padella con olio e aglio per 8-10 minuti, poi tenerle da parte.","Nella stessa padella cuocere i pomodorini dimezzati con basilico, sale e pepe per circa 5 minuti.","In una pirofila unta alternare zucchine, pomodorini, basilico e mozzarella fino a esaurire gli ingredienti.","Cospargere con Grana e gratinare nel forno alla massima temperatura per 8-10 minuti. Servire caldo o tiepido."],"photo":"https://www.giallozafferano.com/images/257-25722/Zucchini-alla-sorrentina_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Zucchini-alla-sorrentina.html","pdfPage":365,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00989","name":"Crema di lenticchie","category":"Zuppe, minestre e vellutate","serves":"4 persone","prep":"","cook":"","rest":"","ingredients":["Lenticchie secche di Castelluccio: 250 (unità da ricontrollare sull'etichetta visualizzata) | Carota: 1 | Sedano: 1 costa | Scalogno: 1 | Curcuma in polvere: 1 cucchiaino | Olio extravergine d'oliva: q.b. | Acqua: 1,5 l | Sale e pepe: q.b. | Pane: 8 fette | Origano per i crostini: q.b."],"steps":["Sciacquare le lenticchie e tagliare grossolanamente carota, sedano e scalogno. | Rosolare le verdure in un tegame con poco olio per 4-5 minuti; incorporare la curcuma e poi le lenticchie, mescolando brevemente. | Versare 1,5 litri di acqua fredda. Coprire e lasciar sobbollire per circa un'ora. | Aggiustare di sale e pepe, lavorare con il frullatore a immersione e proseguire la cottura per circa 40 minuti, fino alla consistenza desiderata. | Nel frattempo condire le fette di pane con olio, sale e origano e dorarle con il grill a 240 °C per circa 3-4 minuti, sorvegliandole. | Distribuire la crema nelle fondine e accompagnare con i crostini."],"photo":"","source":"https://ricette.giallozafferano.it/Crema-di-lenticchie.html","pdfPage":366,"description":"Le lenticchie di Castelluccio sono le protagoniste di un piatto semplice e saporito, per iniziare l'anno all'insegna della genuinità : crema di lenticchie!"},{"id":"GZ-00991","name":"Crema di porri e castagne","category":"Zuppe, minestre e vellutate","serves":"4 persone","prep":"40 min","cook":"1 h 5 min","rest":"","ingredients":["Porri 620 g","castagne 1 kg","acqua 1,1 l","pane 40 g","rosmarino 5 rametti","salvia 8 foglie","noce moscata q.b.","olio EVO q.b.","sale e pepe q.b."],"steps":["Lavare le castagne, metterle in acqua fredda e bollirle per circa 10 minuti; scolarle e pelarle ancora calde.","Tritare rosmarino e salvia; pulire e affettare i porri.","Rosolare brevemente le castagne in poco olio con circa due terzi delle erbe; dopo 7–8 minuti unire i porri e lasciar ammorbidire per altri 6–7 minuti.","Aggiungere l’acqua calda, coprire e cuocere dolcemente per circa 40 minuti.","Nel frattempo tostare i cubetti di pane con poco olio e le erbe rimaste.","Frullare la zuppa calda, regolare consistenza, sale e pepe; servire con crostini e un filo d’olio."],"photo":"https://www.giallozafferano.com/images/307-30777/leek-and-chestnut-cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/leek-and-chestnut-cream.html","pdfPage":367,"description":"La crema di porri e castagne ha una consistenza così morbida e vellutata che migliorerà sicuramente l'umore della vostra giornata!"},{"id":"GZ-00992","name":"crema di porri e patate con pancetta","category":"Zuppe, minestre e vellutate","serves":"4 persone","prep":"60 min","cook":"40 min","rest":"","ingredients":["Porri 700 g","patate 700 g","brodo vegetale 1 l","pancetta affumicata 150 g","olio EVO q.b.","sale fino e pepe nero q.b.","semola 100 g","olio di semi di arachide q.b."],"steps":["Mondare i porri; ricavare da una parte alcune striscioline sottili e metterle in acqua e ghiaccio, tagliare il resto a rondelle.","Pelare le patate e ridurle a cubetti uniformi.","Soffriggere i porri in poco olio, aggiungere le patate, salare e coprire con il brodo; cuocere per circa 30 minuti dal bollore.","Rosolare la pancetta a cubetti in padella fino a renderla croccante e scolarla su carta.","Asciugare i fili di porro, passarli nella semola e friggerli in olio di arachide a circa 175 °C per 3–4 minuti; scolarli.","Frullare porri e patate cotti regolando la densità con il brodo e condendo con sale, pepe e un filo d'olio.","Servire la vellutata con pancetta croccante e porro fritto."],"photo":"https://www.giallozafferano.com/images/291-29121/leek-and-potato-soup-with-bacon_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/leek-and-potato-soup-with-bacon.html","pdfPage":368,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00993","name":"Crema di zucca","category":"Zuppe, minestre e vellutate","serves":"4 persone","prep":"15 min","cook":"35 min","rest":"","ingredients":["Zucca 1 kg (circa 600 g di polpa pulita)","patate 200 g","brodo vegetale 1 l","cipolla bianca 80 g","olio EVO 60 g","sale 1 pizzico","pepe nero 1 pizzico","cannella in polvere 1 pizzico","noce moscata 1 pizzico. Crostini: pane casereccio 100 g","olio EVO 30 g."],"steps":["Preparare il brodo; mondare la zucca e tagliare la polpa a cubetti, quindi pelare e tagliare le patate.","Tritare la cipolla e farla appassire dolcemente nell'olio; aggiungere zucca e patate, mescolando.","Coprire con parte del brodo caldo, condire e cuocere a fuoco basso per circa 25-30 minuti, aggiungendo altro brodo quando necessario.","Frullare le verdure cotte fino a ottenere una crema uniforme; aromatizzare con cannella e noce moscata.","Tagliare il pane a cubetti, irrorarlo con l'olio destinato ai crostini e passarlo sotto il grill per circa 5 minuti; distribuire sulla crema al servizio."],"photo":"https://ptps.stbm.it/t/nxqem3_large.jpg","source":"https://www.giallozafferano.com/recipes/Pumpkin-cream.html","pdfPage":369,"description":"Scoprite il lato più buono dell'autunno con una pietanza calda e confortante, impreziosita con il profumo speziato della cannella... crema di zucca!"},{"id":"GZ-00996","name":"gazpacho","category":"Zuppe, minestre e vellutate","serves":"4 persone","prep":"40 min","cook":"5 min","rest":"almeno 2 h in frigorifero","ingredients":["Pane raffermo 70 g","pomodori ramati 1 kg","peperoni verdi 100 g","peperoni rossi 100 g","cetrioli 100 g","aglio 1 spicchio","acqua fredda 400 g","olio EVO 50 g","aceto di vino bianco 30 g","sale e pepe q.b. Per guarnire: cipolla rossa 50 g","cetriolo 40 g","pomodori 40 g","pane 40 g","olio e pepe q.b."],"steps":["Ammollare il pane in una parte dell'acqua fredda; lavare e ridurre in pezzi pomodori, peperoni e cetrioli.","Frullare gli ortaggi con l'aglio, il pane strizzato, l'acqua rimanente, olio, aceto, sale e pepe.","Passare il composto attraverso un colino fine e farlo raffreddare in frigorifero per almeno due ore.","Tagliare a dadini le verdure della guarnizione e tostare il pane a cubetti. Servire il gazpacho freddo con i dadini e un filo d'olio."],"photo":"https://ptps.stbm.it/t/gov8yv_large.jpg","source":"https://www.giallozafferano.com/recipes/Andalusian-Gazpacho.html","pdfPage":370,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00997","name":"Gazpacho all'anguria","category":"Zuppe, minestre e vellutate","serves":"4 persone","prep":"30 min","cook":"1 min","rest":"circa 1 h in frigorifero","ingredients":["Anguria 1,2 kg (di cui circa 450 g di polpa utilizzata nella preparazione)","pomodori a grappolo 300 g","peperone rosso 100 g","cipolla bianca 120 g","aceto di vino rosso 15 g","olio EVO 25 g","farina di mandorle 60 g","sale e pepe q.b. Per guarnire: caprino fresco 150 g","panna fresca 25 g","mandorle a lamelle 25 g","fiori eduli e menta q.b."],"steps":["Mondare l'anguria e le verdure; tagliare in pezzi la polpa di anguria, pomodori, peperone e cipolla.","Frullare e filtrare per eliminare bucce e semi; condire con aceto, olio, sale, pepe e farina di mandorle.","Riporre al fresco per circa un'ora. Nel frattempo tostare le mandorle e amalgamare caprino e panna.","Versare la zuppa fredda nei piatti e completare con ciuffi di crema di caprino, mandorle, fiori eduli e menta."],"photo":"","source":"https://www.giallozafferano.com/recipes/watermelon-gazpacho.html","pdfPage":371,"description":"Stupite i vostri ospiti con un antipasto fresco e sfizioso che rivisita la tradizionale ricetta spagnola, guarnito con fiori eduli e mandorle tostate... gazpacho all'anguria!"},{"id":"GZ-00999","name":"Gazpacho all’anguria","category":"Zuppe, minestre e vellutate","serves":"4 persone","prep":"30 min","cook":"1 min","rest":"circa 1 h frigorifero","ingredients":["BASE: anguria 1,2 kg (la preparazione indica 450 g di polpa)","pomodori a grappolo 300 g","peperoni rossi 100 g","cipolle bianche 120 g","aceto di vino rosso 15 g","olio EVO 25 g","farina di mandorle 60 g","sale e pepe q.b. GUARNIZIONE: caprino fresco 150 g","panna fresca 25 g","mandorle a lamelle 25 g","fiori eduli q.b.","menta q.b."],"steps":["Eliminare buccia e semi dell'anguria e prelevare 450 g di polpa, come indicato nel procedimento della fonte.","Pulire e tagliare grossolanamente pomodori, peperone e cipolla.","Frullare ortaggi e anguria, poi filtrare il composto per eliminare bucce e residui.","Condire con aceto, olio, sale, pepe e farina di mandorle; amalgamare e raffreddare in frigorifero per circa un'ora.","Tostare brevemente le mandorle a lamelle e lavorare il caprino con la panna fino a ottenere una crema.","Servire il gazpacho freddo con ciuffi di crema di caprino, mandorle, menta e fiori eduli."],"photo":"https://www.giallozafferano.com/images/300-30045/watermelon-gazpacho_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/watermelon-gazpacho.html","pdfPage":372,"description":"Il gazpacho all’anguria è un antipasto fresco e sfizioso che rivisita la tradizionale ricetta spagnola: stupite i vostri ospiti con questa ricetta!"},{"id":"GZ-01000","name":"Gazpacho andaluso","category":"Zuppe, minestre e vellutate","serves":"4 persone","prep":"40 min","cook":"5 min","rest":"almeno 2 h frigorifero","ingredients":["BASE: pane raffermo 70 g","pomodori perini 1 kg","peperoni verdi 100 g","peperoni rossi 100 g","cetrioli 100 g","aglio 1 spicchio","acqua fredda 400 g","olio EVO 50 g","aceto di vino bianco 30 g","sale e pepe q.b. GUARNIZIONE: cipolle rosse 50 g","cetrioli 40 g","pomodori perini 40 g","pane 40 g","olio EVO e pepe q.b."],"steps":["Spezzettare il pane raffermo e ammorbidirlo in una parte dell'acqua prevista.","Lavare e tagliare pomodori, peperoni e cetrioli; trasferirli nel frullatore con aglio e pane strizzato.","Aggiungere acqua rimasta, olio, aceto, sale e pepe; frullare fino a ottenere una miscela omogenea.","Passare al colino fine per eliminare residui di bucce e semi; coprire e lasciare in frigorifero per almeno due ore.","Ridurre a dadini le verdure di guarnizione e tostare i cubetti di pane.","Versare il gazpacho freddo nelle ciotole e completare con verdure, crostini, olio e pepe."],"photo":"https://ptps.stbm.it/t/gov8yv_large.jpg","source":"https://www.giallozafferano.com/recipes/Andalusian-Gazpacho.html","pdfPage":373,"description":"Il gazpacho andaluso è una tipica zuppa fredda spagnola realizzata con ingredienti a crudo: pomodoro, cetrioli, peperoni e pane! Scopri dosi e ricetta"},{"id":"GZ-01014","name":"Minestra di riso e patate","category":"Zuppe, minestre e vellutate","serves":"4 porzioni","prep":"20 min","cook":"35 min","rest":"","ingredients":["Riso Carnaroli 320 g","patate 650 g","passata di pomodoro 100 g","olio EVO q.b.","carota 1","cipolla 1/2","sedano 1/2 costa","sale e pepe q.b.","brodo vegetale 1,5 l","Grana Padano e basilico q.b."],"steps":["Sbucciare le patate e tagliarle a cubetti; tritare carota, sedano e cipolla.","Far appassire il trito nell'olio, aggiungere le patate, la passata, sale e pepe e coprire con brodo vegetale caldo.","Cuocere per circa 20 minuti, finché le patate risultano tenere.","Versare il riso e proseguire fino alla sua cottura, aggiungendo brodo se necessario.","Distribuire nelle fondine e completare con Grana Padano, basilico e un filo d'olio."],"photo":"","source":"https://www.giallozafferano.com/recipes/rice-and-potato-soup.html","pdfPage":374,"description":"La minestra di riso e patate è un primo piatto caldo e avvolgente, per la stagione fredda. Scopri dosi e procedimento per preparare la ricetta"}];
const CATEGORIES=[...new Set(RECIPES.map(r=>r.category))].sort((a,b)=>a.localeCompare(b,'it'));let category='',selected=null,story=false,pantry=false,filter='',stock=[];const root=document.getElementById('app'),el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const items=()=>RECIPES.filter(r=>r.category===category);function pdfLink(r){return 'GialloZafferano_RICETTARIO_CORRENTE.pdf#page='+r.pdfPage}function draw(){el('categories').innerHTML=CATEGORIES.map(c=>`<button class="${c===category&&!pantry?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');el('pantryToggle').textContent=pantry?'▤ Ricettario':'◈ Dispensa';drawStage()}
function ingredientRows(items){return items.flatMap(raw=>{const lines=String(raw||'').split(/\\n|\n/).map(v=>v.trim()).filter(Boolean);return lines.flatMap(line=>{const parts=line.split(/(?=\b(?:PER (?:LA|IL|LO|LE|I|GLI|L'|FINIRE|DECORARE|GUARNIRE|SERVIRE)|INGREDIENTI PER|PER L’|PER L')\s*[^:]{0,55}:)/i).filter(Boolean);return parts.map(part=>{const match=part.match(/^((?:PER\s+[^:]{1,55}|INGREDIENTI PER\s+[^:]{1,55})):\s*(.*)$/i);return match?[{heading:match[1].trim()},...(match[2].trim()?[{value:match[2].trim()}]:[])]:[{value:part.trim()}]})})}).flat().map(row=>row.heading?`<h4 class="ingSection">${esc(row.heading)}</h4>`:`<div class="ing">${esc(row.value)}</div>`).join('')}
function preparationRows(items){return items.map((raw,i)=>{const text=String(raw||'').trim().replace(/^\\s*(?:passaggio\\s*)?\\d+[.)\\-:]\\s*/i,'');return `<div class="step"><i aria-label="Passaggio ${i+1}">${String(i+1).padStart(2,'0')}</i><span>${esc(text)}</span></div>`}).join('')}
function drawStage(){const s=el('stage');if(pantry){const results=RECIPES.map(r=>{const missing=r.ingredients.filter(i=>!stock.some(t=>i.toLowerCase().includes(t.toLowerCase())));return {r,missing}}).sort((a,b)=>a.missing.length-b.missing.length).slice(0,35);s.innerHTML=`<section class="pantry"><h2>Cosa cucino oggi?</h2><p class="small">Inserisci gli ingredienti che hai, separati da virgole. Il confronto utilizza gli ingredienti di tutte le ${RECIPES.length} ricette.</p><div style="display:flex;gap:7px"><input id="ingredientInput" placeholder="Es. broccoli, latte, burro"><button id="addIngredient">Aggiungi</button></div><div style="margin:12px 0">${stock.map((x,i)=>`<button data-remove="${i}" class="pill">${esc(x)} ×</button>`).join('')}</div><div class="notice">Le 35 ricette con meno ingredienti mancanti, secondo un confronto testuale orientativo.</div>${results.map(x=>`<button class="match" data-openid="${esc(x.r.id)}">${esc(x.r.name)} · ${x.missing.length} ingredienti mancanti</button>`).join('')}</section>`;return}
if(!category){s.innerHTML=`<section class="welcome"><div style="font-size:34px;color:#b18a68">✧</div><h2>La tua cucina, da sfogliare.</h2><p>Scegli una categoria nella barra inferiore e apri la ricetta che desideri consultare.</p><p class="notice">${RECIPES.length} ricette complete · ${CATEGORIES.length} categorie</p></section>`;return}
if(!selected){const list=items().filter(r=>r.name.toLowerCase().includes(filter.toLowerCase()));s.innerHTML=`<section class="index"><div class="indexTop"><h2>${esc(category)} <span class="count">${items().length} ricette</span></h2><button id="close" aria-label="Chiudi indice">✕</button></div><input id="search" class="search" placeholder="Cerca una ricetta..." value="${esc(filter)}"><div class="results">${list.map(r=>`<button data-openid="${esc(r.id)}">${esc(r.name)} <span>›</span></button>`).join('')||'<span class="small">Nessun risultato</span>'}</div></section>`;return}
const r=selected;if(story){s.innerHTML=`<section class="story"><div style="font-size:32px;color:#a47856">❧</div><h2>${esc(r.name)}</h2><p>Questa è la sezione editoriale dedicata alla storia e alle origini del piatto. Nel materiale recuperato non è disponibile una ricostruzione storica verificata per ogni ricetta: per questo non ne viene inventata una.</p>${r.description?`<p><strong>Nota d'archivio:</strong> ${esc(r.description)}</p>`:''}<div class="actions"><button id="flip">↶ Torna alla ricetta</button>${r.source?`<a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">Fonte della ricetta ↗</a>`:''}</div></section>`;return}
const image=r.photo?`<img src="${esc(r.photo)}" alt="Fotografia associata alla ricetta" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.classList.remove('hidden')"><div class="emptyPhoto hidden">✦</div>`:`<div class="emptyPhoto">✦</div>`;
s.innerHTML=`<article class="recipe"><section class="photo"><div class="imageWrap">${image}</div><div class="meta"><div class="category">${esc(r.category.toUpperCase())}</div><h2>${esc(r.name)}</h2><div class="small">${r.prep?'Preparazione: '+esc(r.prep)+'<br>':''}${r.cook?'Cottura: '+esc(r.cook)+'<br>':''}${r.rest?'Riposo: '+esc(r.rest)+'<br>':''}${r.serves?'Dosi: '+esc(r.serves):''}</div><div class="actions"><button id="flip">↻ Storia</button><button id="back">☷ Indice</button><a href="${esc(pdfLink(r))}" target="_blank" rel="noopener">PDF ↗</a>${r.source?`<a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">Fonte ↗</a>`:''}</div></div></section><section class="ingredients"><h3>◈ Ingredienti</h3>${ingredientRows(r.ingredients)}</section><section class="steps"><h3>✎ Preparazione</h3>${preparationRows(r.steps)}</section></article>`}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cat!==undefined){category=b.dataset.cat;selected=null;filter='';story=false;pantry=false;draw();return}if(b.dataset.openid!==undefined){const r=RECIPES.find(r=>r.id===b.dataset.openid);if(r){category=r.category;selected=r;story=false;pantry=false;draw()}return}if(b.id==='close'){category='';selected=null;draw();return}if(b.id==='back'){selected=null;filter='';story=false;drawStage();return}if(b.id==='flip'){story=!story;drawStage();return}if(b.id==='pantryToggle'){pantry=!pantry;draw();return}if(b.id==='addIngredient'){const v=el('ingredientInput').value;stock=[...new Set([...stock,...v.split(',').map(x=>x.trim()).filter(Boolean)])];drawStage();return}if(b.dataset.remove!==undefined){stock.splice(+b.dataset.remove,1);drawStage()}});
root.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;drawStage();const input=el('search');input.focus();input.setSelectionRange(filter.length,filter.length)}});root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ingredientInput'){e.preventDefault();el('addIngredient').click()}});draw();</script></body></html>
