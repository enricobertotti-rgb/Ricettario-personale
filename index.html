sto a cubetti; lasciarla scolare.","Rosolare in un'altra padella aglio, carne di manzo e maiale per circa 10 minuti; eliminare l'aglio, sfumare col vino rosso e far evaporare.","Lessare i conchiglioni solo per metà del tempo previsto sulla confezione, scolarli delicatamente e raffreddarli su un vassoio.","Mescolare ricotta setacciata, carne, Parmigiano, uovo sbattuto e cubetti di mozzarella; aggiustare sale e pepe.","Farcire i conchiglioni con un cucchiaino o una sac-à-poche e sistemarli in pirofila su un fondo di salsa.","Coprire con passata, fette di mozzarella e Parmigiano; cuocere a 220 °C per circa 20 minuti, gratinare per pochi minuti e lasciare riposare prima del servizio."],"photo":"https://www.giallozafferano.com/images/227-22776/Stuffed-pasta-shells_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Stuffed-pasta-shells.html","pdfPage":233,"description":"I conchiglioni ripieni sono un primo piatto ricco e appetitoso, ideale per le feste o per una cena sostanziosa... portateli in tavola e sarà una lotta all'ultimo boccone!"},{"id":"GZ-00137","name":"Farfalle al salmone affumicato","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"10 min","cook":"15 min","rest":"","ingredients":["Farfalle 320 g","salmone affumicato 200 g","panna fresca 200 g","scalogno 1/2","concentrato di pomodoro 1 cucchiaio (fonte: 1 spoonful)","vino bianco 1/2 bicchiere","burro 20 g","sale e pepe q.b."],"steps":["Tritare finemente il salmone affumicato e mezzo scalogno.","Sciogliere il burro in padella e far appassire lo scalogno; sfumare con il vino bianco e lasciare evaporare.","Unire il salmone e cuocerlo per circa 2 minuti, poi versare la panna, il concentrato di pomodoro e il pepe.","Mescolare e lasciare insaporire il condimento a fuoco dolce per qualche minuto.","Lessare le farfalle in acqua salata, scolarle al dente e saltarle brevemente nella salsa; completare con pepe macinato e servire."],"photo":"https://www.giallozafferano.com/images/346-34601/farfalle-with-smoked-salmon_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/farfalle-with-smoked-salmon.html","pdfPage":234,"description":"Le farfalle al salmone affumicato sono un primo piatto facile e veloce dal condimento cremoso e delicato, arricchito con panna. Scopri dosi e ricetta!"},{"id":"GZ-00138","name":"Farfalle con crema di Parmigiano, speck e pistacchi","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"15 min","cook":"15 min","rest":"","ingredients":["Farfalle: 360 g | Speck: 150 g | Farina 00: 30 g | Burro: 20 g | Panna fresca liquida: 500 ml | Parmigiano Reggiano DOP grattugiato: 100 g | Granella di pistacchi: 80 g (10 g per finitura) | Pomodorini ciliegino: 6 | Sale e olio extravergine: quanto basta"],"steps":["Tagliare lo speck a striscioline e i pomodorini a piccoli spicchi. Saltare lo speck in poco olio, aggiungere i pomodorini e lasciarli ammorbidire. | 2. A parte fondere il burro dolcemente, incorporare la farina con una frusta e diluire con la panna. Cuocere mescolando per circa 5 minuti, fino a ottenere una salsa cremosa. | 3. Allontanare dal fuoco e sciogliere nella salsa il Parmigiano grattugiato. Unire questa crema alla padella con speck e pomodorini. | 4. Incorporare 70 g di granella di pistacchi, tenendone circa 10 g da parte per la presentazione. | 5. Lessare le farfalle al dente in acqua salata, trasferirle nel condimento e amalgamarle su fiamma tenue. Servire con i pistacchi rimanenti."],"photo":"","source":"https://ricette.giallozafferano.it/Farfalle-con-crema-di-parmigiano-speck-e-pistacchi.html","pdfPage":235,"description":"Un primo piatto ricco e sostanzioso che vi conquisterà con le sue note croccanti e affumicate: farfalle con crema di Parmigiano, speck e pistacchi!"},{"id":"GZ-00139","name":"Fettuccine al tartufo","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"15 min","cook":"15 min","rest":"","ingredients":["Fettuccine all'uovo 250 g","tartufo nero 80 g","aglio 1 spicchio","olio EVO 50 g","sale fino q.b.","burro 40 g."],"steps":["Pulire accuratamente il tartufo sotto acqua fredda, spazzolarlo e asciugarlo; affettarlo molto sottile, conservando alcune lamelle per decorare.","Scaldare a fuoco basso olio e burro; unire lo spicchio d'aglio privato del germoglio e farlo insaporire, poi eliminarlo.","Allontanare la padella dal fuoco e incorporare quasi tutte le lamelle di tartufo.","Cuocere le fettuccine in acqua salata, scolarle al dente e saltarle delicatamente nel condimento, aggiungendo poca acqua di cottura per legare.","Servire subito con il tartufo tenuto da parte."],"photo":"","source":"https://www.giallozafferano.com/recipes/Truffle-fettuccine.html","pdfPage":236,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00140","name":"Fettuccine Alfredo","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"30 min","cook":"5 min","rest":"","ingredients":["Farina 00 400 g","semola rimacinata q.b. per spolverare","uova medie 4","burro 80 g","Parmigiano Reggiano DOP grattugiato 80 g","sale e pepe nero q.b."],"steps":["Impastare farina e uova fino a ottenere una massa liscia ed elastica; formare un panetto e farlo riposare coperto per 30 minuti.","Dividere l'impasto in quattro parti e tirarle progressivamente con la sfogliatrice, fino a una sfoglia sottile; mantenere coperte le porzioni in attesa.","Spolverare le sfoglie con semola, farle asciugare brevemente, arrotolarle senza stringere e tagliarle a strisce di circa 4 mm; aprirle formando nidi.","Cuocere le fettuccine in acqua salata per 2–3 minuti. Intanto sciogliere il burro a fuoco bassissimo in padella e unire un mestolo d'acqua di cottura.","Trasferire la pasta nel burro, aggiungere altra acqua di cottura e mescolare per creare un'emulsione.","Togliere dal fuoco, incorporare il Parmigiano grattugiato, aggiustare sale e pepe e servire immediatamente."],"photo":"https://ptps.stbm.it/t/i89cnb_large.jpg","source":"https://www.giallozafferano.com/recipes/Fettuccine-Alfredo.html","pdfPage":237,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00142","name":"Finta carbonara","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"25 min","cook":"60 min","rest":"","ingredients":["Spaghetti 320 g","peperoni gialli 1,4 kg","mortadella 250 g","olio EVO q.b.","sale fino e pepe nero q.b."],"steps":["Lavare i peperoni e arrostirli in forno statico a circa 250 °C per 40–45 minuti; trasferirli in un sacchetto o recipiente coperto per 10 minuti.","Tagliare la mortadella a cubetti e rosolarla in padella antiaderente senza olio fino a doratura.","Spellare i peperoni, eliminare semi e picciolo, quindi frullare la polpa fino a una crema uniforme.","Versare la crema di peperoni sulla mortadella, mescolare e insaporire qualche minuto a fuoco moderato; regolare sale e pepe.","Cuocere gli spaghetti in acqua salata, scolarli al dente tenendo da parte poca acqua di cottura.","Saltare la pasta con crema e mortadella, ammorbidire con acqua di cottura se serve e completare con un filo d'olio."],"photo":"https://www.giallozafferano.com/images/293-29394/fake-carbonara_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/fake-carbonara.html","pdfPage":238,"description":"La finta carbonara è una rivisitazione della pasta alla carbonara a base di mortadella e crema di peperoni gialli"},{"id":"GZ-00143","name":"Fregola ai frutti di mare","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"60 min","cook":"45 min","rest":"","ingredients":["FREGOLA: fregola sarda 320 g","olio EVO q.b.","concentrato di pomodoro 15 g","prezzemolo 1 mazzetto","cipolle bianche 100 g","acqua 500 g. COZZE: cozze 1 kg","olio EVO q.b.","vino bianco 50 g. VONGOLE: vongole 500 g","olio EVO q.b.","aglio 2 spicchi","vino bianco 50 g. GAMBERI: gamberi 400 g","olio EVO e sale q.b. CALAMARI: calamari 600 g","olio EVO e sale q.b."],"steps":["Pulire i calamari eliminando penna, pelle, interiora e becco; tagliare le sacche ad anelli e tenere i tentacoli.","Pulire le cozze, farle aprire in pentola con olio e vino bianco, quindi filtrare il liquido e sgusciarle, conservandone alcune intere.","Spurgare e lavare le vongole, aprirle con olio, aglio e vino; filtrare anche il loro liquido e unirlo a quello delle cozze e all'acqua prevista.","Sgusciare e pulire i gamberi eliminando il filo intestinale; tagliarli e saltarli brevemente in padella con olio e sale.","Rosolare separatamente tentacoli e anelli dei calamari, cuocendoli per il tempo necessario e tenendoli da parte.","Soffriggere la cipolla tritata con olio e concentrato di pomodoro, tostare la fregola e bagnarla progressivamente con il brodo filtrato dei molluschi.","A cottura ultimata incorporare gamberi, calamari, cozze e vongole; completare con prezzemolo tritato e qualche mollusco nel guscio."],"photo":"https://www.giallozafferano.com/images/346-34610/fregola-with-seafood_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-seafood.html","pdfPage":239,"description":"La fregola ai frutti di mare è un primo dal gusto intenso, con una cottura che esalta la consistenza rustica della pasta. Scoprite dosi e procedimento"},{"id":"GZ-00144","name":"Fregola con arselle","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"30 min","cook":"30 min","rest":"2 ore spurgo vongole","ingredients":["Fregola sarda 250 g","arselle/vongole piccole 1 kg","pomodori pelati a dadini 150 g","vino bianco 50 g","aglio 2 spicchi","sale fino q.b.","pepe nero q.b.","prezzemolo tritato 1 cucchiaio","olio extravergine di oliva q.b."],"steps":["Controllare le vongole ed eliminarne quelle rotte; farle spurgare circa 2 ore in acqua salata, poi sciacquarle. 2. Scaldare olio e aglio, aggiungere le vongole e il vino, coprire e farle aprire a fuoco vivo per 4-5 minuti. Filtrare il liquido di cottura. 3. Sgusciare metà delle vongole, conservando le altre per guarnire. 4. In una casseruola aromatizzare l’olio con l’altro spicchio d’aglio, rimuoverlo e unire i pelati tritati. 5. Aggiungere la fregola e cuocerla bagnando progressivamente con il liquido filtrato delle vongole e, se serve, acqua calda. Regolare sale e pepe. 6. Poco prima della fine incorporare le vongole; spegnere e completare con prezzemolo."],"photo":"https://www.giallozafferano.com/images/279-27957/Fregola-with-Clams_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Fregola-with-Clams.html","pdfPage":240,"description":"La fregola con arselle è una ricetta tipica della cucina sarda: questo particolare formato di pasta è perfetto per assorbire tutto il sapore del condimento di mare!"},{"id":"GZ-00146","name":"Fregola con broccolo romanesco","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"10 min","cook":"30 min","rest":"oltre al tempo del brodo","ingredients":["Fregola 320 g","broccolo romanesco 760 g","scalogno 35 g","brodo vegetale 750 g","timo 1 rametto","olio extravergine di oliva 30 g","sale fino q.b.","pepe nero q.b.","Parmigiano Reggiano DOP 50 g."],"steps":["Preparare il brodo vegetale e mantenerlo caldo. Separare le cimette del romanesco, riducendo quelle più grandi.","Tritare lo scalogno e lasciarlo ammorbidire in casseruola con l’olio per circa 5 minuti.","Aggiungere il broccolo e le foglioline di timo; dopo un paio di minuti versare la fregola.","Cuocere mescolando spesso e bagnando con brodo caldo quando necessario, per 25–30 minuti o secondo le indicazioni della pasta.","A fuoco spento incorporare il Parmigiano, aggiustare di sale e pepe e portare in tavola."],"photo":"https://www.giallozafferano.com/images/326-32699/fregola-with-romanesco-broccoli_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-romanesco-broccoli.html","pdfPage":241,"description":"La fregola con broccolo romanesco è un primo piatto vegetariano molto saporito, a base di un formato di pasta tipico della Sardegna!"},{"id":"GZ-00148","name":"Fregola con funghi portobello","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"5 min","cook":"20 min","rest":"","ingredients":["Fregola sarda 240 g","funghi portobello 370 g","brodo vegetale 1 l","Parmigiano Reggiano DOP 50 g","aglio 1 spicchio","prezzemolo q.b.","timo q.b.","olio extravergine di oliva q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Preparare il brodo e tenerlo caldo; pulire i portobello eliminando la base terrosa, poi tagliarli a piccoli pezzi.","Scaldare l’olio in padella con uno spicchio d’aglio e toglierlo dopo aver profumato il fondo.","Tostare brevemente la fregola, aggiungere i funghi e proseguire la cottura incorporando il brodo caldo un mestolo alla volta, come per un risotto.","A metà cottura regolare il sale e aggiungere il timo; seguire il tempo indicato sulla confezione, circa 20–25 minuti secondo la fonte.","Fuori dal fuoco unire prezzemolo tritato, Parmigiano grattugiato e pepe; servire subito."],"photo":"https://www.giallozafferano.com/images/333-33336/fregola-with-portobello-mushrooms_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-portobello-mushrooms.html","pdfPage":242,"description":"Un primo dai sapori autunnali che si prepara come un risotto, con una profumata mantecatura al formaggio e prezzemolo... fregola con funghi portobello!"},{"id":"GZ-00153","name":"Fregola con ragù di pesce","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"30 min","cook":"20 min","rest":"","ingredients":["Fregola 320 g","salmone 380 g","cozze 1 kg","scampi 320 g","gamberi 300 g","rana pescatrice 220 g","brodo di pesce 1 l","olio extravergine di oliva 10 g","scorza di 1 limone","aglio 1 spicchio","peperoncino fresco 1","prezzemolo 1 ciuffo."],"steps":["Pulire le cozze, sgusciare e privare del filo intestinale gamberi e scampi; ridurre salmone e rana pescatrice a bocconi.","In casseruola scaldare olio, aglio e peperoncino; far aprire le cozze con il coperchio, poi sgusciarle e filtrare accuratamente il loro liquido. Eliminare i molluschi rimasti chiusi.","Portare a temperatura il liquido filtrato e aggiungere la fregola, bagnando progressivamente con brodo di pesce caldo.","Dopo circa 5 minuti unire la rana pescatrice, dopo altri 3 minuti il salmone; introdurre scampi e gamberi verso la fine per non prolungarne troppo la cottura.","Incorporare le cozze, profumare con scorza di limone e prezzemolo e servire il piatto ben caldo."],"photo":"https://www.giallozafferano.com/images/354-35493/fregola-with-fish-ragu_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-fish-ragu.html","pdfPage":243,"description":"Stupite i vostri ospiti con un primo piatto semplice e raffinato che racchiude in sé tutta la bontà del mare... fregola con ragù di pesce!"},{"id":"GZ-00160","name":"Frittatine di pasta napoletane","category":"Primi piatti, pasta e gnocchi","serves":"15 pezzi","prep":"1 h 30 min","cook":"30 min","rest":"almeno 2 h in frigo","ingredients":["Bucatini 500 g","prosciutto cotto 200 g","pisellini 100 g","Parmigiano Reggiano 50 g","aglio 1 spicchio","olio EVO e sale q.b. BESCIAMELLA: latte intero 1 l","farina 00 130 g","burro 100 g","noce moscata e sale q.b. PASTELLA: acqua 500 g","farina 00 225 g. FRITTURA: olio di arachide 1,5 l. Pangrattato: nel procedimento, quantità non specificata nella lista."],"steps":["Preparare una besciamella molto densa con burro, farina e latte caldo; salare, profumare con noce moscata e raffreddare.","Saltare brevemente prosciutto a dadini e piselli con aglio e olio; eliminare l’aglio.","Lessare i bucatini 2–3 minuti meno del tempo indicato, scolarli, tagliarli grossolanamente e amalgamarli a besciamella, ripieno e Parmigiano.","Modellare un rotolo lungo circa 50 cm nella carta forno; lasciarlo rassodare in frigorifero almeno 2 ore.","Preparare una pastella con acqua e farina, tagliare il rotolo in 15 dischi, passarli in pastella e pangrattato e friggerli a 170–180 °C fino a doratura."],"photo":"https://www.giallozafferano.it/images/185-18507/Frittatine-di-pasta-napoletane_450x300.jpg","source":"https://ricette.giallozafferano.it/Frittatine-di-pasta-napoletane.html","pdfPage":244,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00161","name":"Fusilli al pesto di pistacchi e pomodorini","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"20 min","cook":"15 min","rest":"","ingredients":["Fusilli 320 g","pomodorini ciliegino 500 g","porri 80 g","olio EVO 20 g","sale e pepe q.b. PESTO: pistacchi non salati sgusciati 100 g","basilico 2 foglie","acqua 50 ml","scorza di limone 10 g","Parmigiano 15 g","aglio ½ spicchio","olio EVO 50 g","sale e pepe q.b."],"steps":["Sbollentare i pistacchi per 5 minuti, spellarli e frullarli con olio, Parmigiano, scorza di limone, aglio, acqua, basilico, sale e pepe.","Pulire e affettare il porro; stufarlo in padella con l’olio, aggiungendo poca acqua calda quando necessario.","Unire i pomodorini tagliati in quarti, coprire e cuocere circa 10 minuti.","Lessare i fusilli; incorporare il pesto di pistacchi ai pomodorini e allungare con poca acqua della pasta.","Trasferire i fusilli nel condimento e mantecare brevemente prima di servire."],"photo":"https://www.giallozafferano.it/images/169-16944/Fusilli-al-pesto-di-pistacchi-e-pomodorini_450x300.jpg","source":"https://ricette.giallozafferano.it/Fusilli-al-pesto-di-pistacchi-e-pomodorini.html","pdfPage":245,"description":"I fusilli al pesto di pistacchi e pomodorini sono un primo piatto che abbina il sapore intenso dei pistacchi al gusto dolce dei ciliegini"},{"id":"GZ-00167","name":"Fusilloni con crema di cavolo nero","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"20 min","cook":"30 min","rest":"","ingredients":["Fusilloni 320 g","cavolo nero da pulire 300 g","Parmigiano Reggiano da grattugiare 100 g","paprika dolce, olio EVO, sale e pepe q.b."],"steps":["Lavare il cavolo nero e togliere le coste centrali; sbollentare circa tre quarti delle foglie in acqua salata, conservando l’acqua.","Frullare le foglie lessate con olio, paprika, sale e pepe; aggiungere poca acqua di cottura se serve.","Condire le foglie rimaste e farle diventare croccanti in forno statico a 190 °C per circa 10 minuti.","Lessare i fusilloni nell’acqua del cavolo e trasferirli al dente in padella con la crema; finire la cottura con poca acqua della pasta.","Servire con chips di cavolo nero e Parmigiano grattugiato."],"photo":"https://www.giallozafferano.it/images/293-29363/Fusilloni-con-crema-di-cavolo-nero_450x300.jpg","source":"https://ricette.giallozafferano.it/Fusilloni-con-crema-di-cavolo-nero.html","pdfPage":246,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00179","name":"Gnocchetti gorgonzola e noci","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"25 min","cook":"45 min","rest":"","ingredients":["GNOCCHETTI: patate rosse 1 kg","uovo medio 1","farina 00 300 g","sale fino 1 pizzico","semola rimacinata q.b.","SALSA: gorgonzola 200 g","latte intero 100 ml","gherigli di noci 60 g."],"steps":["Lessare le patate finché tenere; schiacciarle ancora calde sulla farina disposta a fontana. Incorporare uovo e sale, impastando quanto basta per ottenere un panetto compatto.","Formare filoncini sottili con poca semola, tagliarli in piccoli gnocchetti di circa 1 cm e disporli su un telo infarinato.","Scaldare il latte con il gorgonzola a pezzi fino a scioglierlo; tritare grossolanamente le noci.","Lessare gli gnocchetti in acqua salata; scolarli quando salgono a galla e condirli con la crema di gorgonzola, completando con le noci."],"photo":"https://www.giallozafferano.com/images/256-25630/Gorgonzola-and-walnut-gnocchetti_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Gorgonzola-and-walnut-gnocchetti.html","pdfPage":247,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00188","name":"Gnocchi al pomodoro e burrata","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"60 min","cook":"1 h 15 min","rest":"","ingredients":["GNOCCHI: patate rosse 1 kg","farina 00 300 g","uova 1","semola rimacinata q.b.","sale fino q.b. SUGO: pomodori pelati fini 400 g","burrata 100 g","cipolla bianca 50 g","basilico q.b.","Parmigiano Reggiano 50 g","sale q.b.","pepe nero q.b.","olio EVO q.b."],"steps":["Lessare le patate 30-40 minuti, schiacciarle ancora calde e impastarle brevemente con farina, uovo e sale.","Formare cordoncini, tagliare gli gnocchi e spolverarli con poca semola.","Appassire la cipolla nell’olio, aggiungere il pomodoro e cuocere a fuoco medio-basso per circa 30-40 minuti; salare.","Lessare gli gnocchi e scolarli appena affiorano, trasferendoli nel sugo.","Spegnere il fuoco, mantecare con Parmigiano e olio; distribuire la burrata, il basilico e il pepe nei piatti."],"photo":"https://www.giallozafferano.com/images/363-36341/gnocchi-with-tomato-and-burrata_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/gnocchi-with-tomato-and-burrata.html","pdfPage":248,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00190","name":"Gnocchi alla romana","category":"Primi piatti, pasta e gnocchi","serves":"5 persone (circa 40 pezzi)","prep":"15 min","cook":"35 min","rest":"","ingredients":["Semolino 250 g","latte intero 1 l","burro 100 g","tuorli 2","Parmigiano Reggiano grattugiato 100 g","Pecorino 40 g","sale fino 7 g","noce moscata q.b."],"steps":["Portare quasi a bollore il latte con circa 30 g di burro, sale e noce moscata; versare il semolino a pioggia mescolando energicamente.","Cuocere pochi minuti fino a ottenere una massa soda; fuori dal fuoco unire tuorli e Parmigiano.","Dividere il composto caldo e modellarlo in due cilindri avvolti in carta forno; raffreddare in frigorifero per circa 20 minuti.","Tagliare i cilindri a dischi e disporli sovrapposti in una teglia imburrata.","Condire con il burro restante e il Pecorino; cuocere a 200 °C per 20-25 minuti e gratinare altri 4-5 minuti."],"photo":"https://ptps.stbm.it/t/gbd2j0_large.jpg","source":"https://www.giallozafferano.com/recipes/Gnocchi-alla-Romana.html","pdfPage":249,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00192","name":"Gnocchi alla sorrentina","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"30 min","cook":"40 min","rest":"","ingredients":["GNOCCHI: patate rosse 1 kg","farina 00 300 g","uovo medio 1","sale fino q.b.","semola q.b. SUGO: passata di pomodoro 600 g","basilico 6 foglie","aglio 1 spicchio","olio EVO q.b.","sale q.b. FINITURA: mozzarella 250 g","Parmigiano Reggiano 70 g."],"steps":["Lessare le patate per circa 30-40 minuti; nel frattempo cuocere la passata con olio, aglio, basilico e sale per circa 30 minuti.","Schiacciare le patate calde sulla farina, aggiungere uovo e sale e impastare brevemente.","Ricavare filoncini, tagliare gli gnocchi e rigarli con forchetta o rigagnocchi; spolverare di semola.","Lessare in acqua salata a piccoli lotti e prelevare gli gnocchi quando salgono in superficie; mescolarli delicatamente al sugo.","Trasferire in pirofila alternando sugo, gnocchi, mozzarella e Parmigiano; gratinare a 250 °C per circa 5 minuti."],"photo":"https://ptps.stbm.it/t/4vq0gx_large.jpg","source":"https://www.giallozafferano.com/recipes/Gnocchi-alla-sorrentina.html","pdfPage":250,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00208","name":"gnocchi di patate","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"20 min","cook":"40 min","rest":"","ingredients":["VERSIONE CON UOVO: patate rosse 1 kg","farina 300 g","uovo medio 1","sale fino q.b.","semola rimacinata q.b.","VERSIONE SENZA UOVO: patate rosse 1 kg","farina 350 g","sale fino 15 g","semola rimacinata q.b."],"steps":["Lessare le patate con la buccia partendo da acqua fredda, per circa 30-40 minuti, finché la forchetta le attraversa senza resistenza.","Schiacciarle ancora calde sulla farina; per la versione classica unire l'uovo sbattuto e il sale. Impastare solo fino a ottenere un composto morbido e consistente.","Formare filoncini sul piano spolverato di semola, tagliare gli gnocchi e rigarli con una forchetta o l'apposita tavoletta.","Lessare in acqua bollente salata pochi per volta, scolandoli quando affiorano.","Per la versione senza uovo lavorare patate, 350 g di farina e 15 g di sale, poi formare e cuocere gli gnocchi con la stessa tecnica."],"photo":"https://www.giallozafferano.com/images/229-22986/Potato-gnocchi_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Potato-gnocchi.html","pdfPage":251,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00216","name":"Gnocchi di zucca alla romana","category":"Primi piatti, pasta e gnocchi","serves":"6 persone (24 gnocchi)","prep":"20 min","cook":"35 min","rest":"","ingredients":["Polpa di zucca 400 g","semolino 250 g","latte intero 1 l","noce moscata q.b.","Parmigiano Reggiano 120 g","sale fino q.b.","tuorli 2","burro 80 g."],"steps":["Cuocere la zucca pulita avvolta in alluminio a circa 200 °C per 40 minuti, quindi ridurla in purea.","Scaldare il latte con parte del burro, sale e noce moscata; versare il semolino a pioggia e cuocere mescolando 3-4 minuti.","Fuori dal fuoco incorporare i tuorli, parte del Parmigiano e la purea di zucca.","Stendere il composto su un vassoio umido a circa 1 cm, raffreddare e ritagliare dischi con coppapasta.","Disporli in pirofila imburrata, distribuire burro e Parmigiano rimanenti e gratinare in forno fino a doratura."],"photo":"https://www.giallozafferano.com/images/307-30764/pumpkin-gnocchi-alla-romana_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/pumpkin-gnocchi-alla-romana.html","pdfPage":252,"description":"Gli gnocchi di zucca alla romana sono un primo piatto gustoso e sostanzioso, perfetto per questa stagione!"},{"id":"GZ-00217","name":"Gnocchi di zucca con crema di gorgonzola","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"50 min","cook":"50 min","rest":"","ingredients":["GNOCCHI: zucca mantovana da pulire 500 g","patate rosse 400 g","tuorli 2","farina 00 150 g","sale fino q.b.","semola rimacinata q.b.","CREMA: gorgonzola dolce 150 g","latte intero 60 g","noce moscata q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Lessare le patate con la buccia; dopo circa 20 minuti aggiungere la zucca pulita a pezzi e proseguire per altri 15 minuti, verificando la consistenza. Conservare l'acqua di cottura.","Schiacciare patate e zucca ancora calde sulla farina; incorporare i tuorli e impastare brevemente, ottenendo un composto morbido e compatto.","Con semola sul piano, ricavare filoncini, tagliare gnocchi piccoli e rigarli con forchetta o rigagnocchi.","Scaldare il latte con il gorgonzola a cubetti; insaporire con noce moscata, sale e pepe e mescolare finché diventa una crema.","Lessare gli gnocchi nell'acqua conservata e salata; scolarli appena affiorano e condirli delicatamente nella crema, fuori dal fuoco."],"photo":"https://www.giallozafferano.com/images/357-35726/pumpkin-gnocchi-with-gorgonzola-cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/pumpkin-gnocchi-with-gorgonzola-cream.html","pdfPage":253,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00223","name":"gnocchi senza glutine alla sorrentina","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"45 min","cook":"1 h 20 min","rest":"riposo impasto 30 min","ingredients":["GNOCCHI SENZA GLUTINE: patate rosse 1 kg","fecola di patate 200 g","sale fino q.b.","noce moscata q.b.","CONDIMENTO: passata di pomodoro 1 kg","mozzarella fiordilatte 400 g","aglio 1 spicchio","basilico q.b.","olio EVO 40 g","sale fino q.b."],"steps":["Lessare le patate partendo da acqua fredda per circa 40 minuti, schiacciarle ancora calde e impastarle con fecola, sale e noce moscata. Lasciar riposare l'impasto coperto per 30 minuti.","Scaldare l'olio con l'aglio, unire passata e basilico e far cuocere dolcemente per 20-30 minuti.","Dividere l'impasto in filoncini, tagliare gli gnocchi e rigarli. Lessarli in acqua salata e trasferirli nel sugo quando affiorano.","Mettere gli gnocchi con il sugo in una pirofila, aggiungere fiordilatte a fettine e gratinare in forno a 200 °C per circa 10 minuti. Completare con basilico."],"photo":"https://www.giallozafferano.com/images/306-30676/gluten-free-sorrentina-gnocchi_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/gluten-free-sorrentina-gnocchi.html","pdfPage":254,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00257","name":"Lasagne ai funghi","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"60 min","cook":"60 min","rest":"","ingredients":["LASAGNE: sfoglie all'uovo 200 g","porcini puliti 200 g","funghi pleurotus puliti 150 g","finferli puliti 70 g","champignon puliti 140 g","pancetta arrotolata a fette 100 g","vino bianco 100 g","timo q.b.","olio EVO q.b.","sale q.b.","pepe q.b.","BESCIAMELLA: latte intero 1 l","burro 100 g","farina 00 100 g","sale q.b.","noce moscata q.b.","SALSA TALEGGIO: panna fresca liquida 360 g","porri 150 g","taleggio 180 g","sale q.b.","pepe q.b."],"steps":["Per la besciamella fondere il burro, unire la farina e incorporare il latte caldo; mescolare fino a consistenza cremosa, poi salare e profumare con noce moscata.","Pulire e affettare le quattro varietà di funghi; saltarle con olio, sfumare con vino bianco e insaporire con timo, sale e pepe.","Affettare i porri e cuocerli dolcemente nella panna per circa 10 minuti; spegnere il fuoco e sciogliervi il taleggio a cubetti.","Distribuire besciamella in una teglia, alternando sfoglie, fonduta di porri e taleggio, besciamella, pancetta e funghi; ripetere gli strati.","Finire con timo e cuocere in forno preriscaldato a 180 °C per circa 40 minuti, completando con pochi minuti di grill."],"photo":"https://www.giallozafferano.com/images/339-33926/lasagna-with-mushrooms_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/lasagna-with-mushrooms.html","pdfPage":255,"description":"Rendete indimenticabile il pranzo della domenica con un piatto dal gusto unico arricchito con pancetta, besciamella e una crema di porri e taleggio: lasagne ai funghi!"},{"id":"GZ-00259","name":"Lasagne al pesto","category":"Primi piatti, pasta e gnocchi","serves":"6 persone","prep":"40 min","cook":"40 min","rest":"","ingredients":["PASTA FRESCA: farina 00 200 g","uova 2 (120 g). PESTO: aglio 1 spicchio","sale grosso 2 pizzichi","olio EVO 200 g","basilico 100 g","Pecorino 60 g","Parmigiano Reggiano 140 g","pinoli 30 g. BESCIAMELLA: burro 100 g","farina 00 100 g","latte intero 1 l","sale q.b.","noce moscata q.b. FINITURA: Parmigiano Reggiano 80 g."],"steps":["Preparare il pesto pestando aglio e sale con basilico, pinoli e formaggi, poi aggiungendo l’olio gradualmente.","Impastare farina e uova per circa 10 minuti e far riposare il panetto avvolto per 30 minuti.","Per la besciamella preparare un roux con burro e farina; incorporare il latte caldo e cuocere 5-6 minuti con sale e noce moscata.","Tirare la sfoglia sottile, ritagliare rettangoli e sbollentarli circa un minuto; scolarli senza sovrapporli.","Alternare in teglia besciamella, pesto, sfoglia e Parmigiano, terminando con le salse e il formaggio.","Cuocere a 180 °C per 15 minuti, poi gratinare altri 5 minuti; far assestare prima di servire."],"photo":"https://www.giallozafferano.com/images/227-22755/Pesto-lasagna_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Pesto-lasagna.html","pdfPage":256,"description":"Le lasagne al pesto sono un primo piatto sostanzioso perfetto per la domenica: strati di sfoglia di pasta all'uovo, besciamella e pesto genovese"},{"id":"GZ-00260","name":"Lasagne al pistacchio","category":"Primi piatti, pasta e gnocchi","serves":"4 persone (teglia 20×30 cm)","prep":"","cook":"","rest":"","ingredients":["Lasagne all’uovo: 320 g | Carne di suino macinata: 500 g | Caciocavallo: 250 g | Grana Padano DOP: 30 g | Rosmarino: 1 rametto | Timo: 1 rametto | Vino bianco: 30 g | Aglio: 1 spicchio | Sale e pepe: q.b. | Besciamella: latte intero 1 l, farina 00 120 g, burro 70 g | Pistacchi non salati per la besciamella: 50 g | Olio EVO per tritare i pistacchi: 20 g | Pistacchi per la finitura: 50 g, con poco olio e sale"],"steps":["Tritare grossolanamente 50 g di pistacchi con 20 g di olio. | Preparare una besciamella sciogliendo il burro e amalgamando la farina; incorporare progressivamente il latte caldo, poi far addensare a fuoco dolce. | Aggiungere alla besciamella il composto di pistacchi e tenere da parte. | Insaporire un poco d’olio con aglio, rosmarino e timo, quindi rosolare il macinato di suino per circa 5 minuti. | Sfumare con il vino bianco e cuocere per altri 5 minuti; eliminare l’aglio e regolare il condimento. | Tostare brevemente i pistacchi della finitura con olio e sale. | In una teglia imburrata alternare besciamella al pistacchio, sfoglie, carne, caciocavallo e pistacchi, fino a ottenere cinque strati. | Terminare con besciamella, carne, formaggi e pistacchi. Cuocere in forno statico a 190 °C per circa 30 minuti e lasciar assestare prima di servire."],"photo":"","source":"https://ricette.giallozafferano.it/Lasagne-al-pistacchio.html","pdfPage":257,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00261","name":"Lasagne al ragù di lenticchie","category":"Primi piatti, pasta e gnocchi","serves":"6 persone","prep":"30 min","cook":"1 h 30 min","rest":"","ingredients":["LASAGNE: sfoglie fresche all'uovo 250 g","provola 200 g","Grana Padano DOP da grattugiare 120 g","RAGÙ: lenticchie secche 250 g","passata di pomodoro 400 g","olio EVO q.b.","sedano 1 costa","carota 1","cipolla rossa 1","concentrato di pomodoro 1 cucchiaio","zenzero in polvere q.b.","pepe nero q.b.","salvia q.b.","BESCIAMELLA: latte intero 500 ml","burro 50 g","farina 00 50 g","sale fino q.b.","noce moscata q.b."],"steps":["Preparare la besciamella: fondere il burro, amalgamare la farina e versare gradualmente il latte caldo mescolando fino ad addensamento; salare e profumare con noce moscata.","Tritare sedano, carota e cipolla; soffriggere con olio per circa 10 minuti, aggiungere concentrato e zenzero, poi lenticchie e passata. Coprire con acqua, profumare con salvia e cuocere circa 40 minuti, regolando sale e pepe.","Tagliare la provola a fettine. Stendere poca besciamella sul fondo della pirofila e alternare sfoglia, besciamella, ragù, provola e Grana, formando tre strati.","Completare con ragù, Grana, pepe e un filo d'olio. Cuocere in forno statico a 180 °C per circa 30 minuti; dorare brevemente con il grill se necessario."],"photo":"https://www.giallozafferano.com/images/345-34597/lasagna-with-lentil-ragu_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/lasagna-with-lentil-ragu.html","pdfPage":258,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00263","name":"Lasagne alla bolognese","category":"Primi piatti, pasta e gnocchi","serves":"8 persone","prep":"2 h","cook":"3 h","rest":"","ingredients":["SFOGLIA VERDE: semola rimacinata 350 g","farina 00 150 g","spinaci 250 g","uova 2","tuorli 3. RAGÙ: manzo macinato 300 g","pancetta 150 g","carote 50 g","sedano 50 g","cipolla dorata 50 g","vino rosso 100 g","passata di pomodoro 300 g","brodo vegetale q.b.","olio EVO 1 cucchiaio","sale e pepe q.b. BESCIAMELLA: burro 70 g","farina 00 70 g","latte intero 1 l","sale 1 pizzico","noce moscata q.b. FINITURA: burro q.b.","Parmigiano Reggiano 270 g."],"steps":["Tritare pancetta, carota, sedano e cipolla; rosolare pancetta e verdure, aggiungere il macinato e farlo colorire.","Sfumare con vino rosso, aggiungere passata e brodo caldo e lasciare sobbollire il ragù per almeno due ore, bagnando quando serve.","Cuocere gli spinaci, strizzarli e frullarli; impastarli con farine, uova e tuorli, poi riposare 30 minuti.","Preparare la besciamella unendo latte caldo a un roux di burro e farina; aromatizzare con sale e noce moscata.","Stendere la pasta molto sottile, tagliarla in rettangoli e sbollentarla per 30-40 secondi; asciugare le sfoglie.","In teglia imburrata alternare cinque strati di sfoglia, ragù, besciamella e Parmigiano; completare con ragù, formaggio e fiocchi di burro.","Cuocere in forno statico a 170 °C per circa 40 minuti; lasciar riposare prima del taglio."],"photo":"https://ptps.stbm.it/t/wp359l_large.jpg","source":"https://www.giallozafferano.com/recipes/Lasagne-alla-Bolognese.html","pdfPage":259,"description":"Le lasagne alla bolognese sono le classiche lasagne al forno con ragù, besciamella, parmigiano e sfoglia fresca all'uovo: scopri la ricetta originale!"},{"id":"GZ-00264","name":"lasagne alla Norma","category":"Primi piatti, pasta e gnocchi","serves":"6 persone","prep":"20 min","cook":"45 min","rest":"","ingredients":["Sfoglie di lasagne all'uovo 250 g","pomodori pelati 1 kg","melanzane 500 g","aglio 1 spicchio","basilico 6 foglie","ricotta salata q.b.","sale fino 1 pizzico","olio EVO q.b.","pepe nero q.b.","CREMA: ricotta vaccina 1 kg","latte intero 200 ml","noce moscata q.b.","sale q.b.","pepe q.b."],"steps":["Preparare un sugo con olio, aglio e pomodori pelati; salare, pepare e aggiungere basilico a fine cottura.","Affettare le melanzane, grigliarle su entrambi i lati e tagliarle a cubetti dopo il raffreddamento.","Lavorare la ricotta vaccina con il latte, sale, pepe e noce moscata fino a ottenere una crema omogenea. Grattugiare la ricotta salata.","In una pirofila alternare salsa, sfoglie, crema di ricotta, melanzane e ricotta salata; proseguire fino a esaurire gli ingredienti.","Terminare con melanzane e ricotta salata, poi cuocere in forno statico a circa 220 °C per 20 minuti."],"photo":"https://www.giallozafferano.com/images/278-27840/Lasagna-alla-Norma_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Lasagna-alla-Norma.html","pdfPage":260,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00300","name":"Linguine con alici marinate e pecorino","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"20 min","cook":"15 min","rest":"marinatura alici 10 min","ingredients":["Linguine 320 g","alici fresche da pulire e bonificare 800 g","pecorino 100 g","colatura di alici q.b.","scorza di limone q.b.","olio EVO q.b.","sale q.b.","pepe q.b.","acqua q.b.","aglio 2 spicchi","succo di limone 1","CITRONETTE: scorza di limone 1","succo di limone 1","prezzemolo q.b.","olio EVO 3 cucchiai","sale q.b.","pepe q.b."],"steps":["Preparare una citronette emulsionando olio, succo e scorza di limone, prezzemolo tritato, sale e pepe.","Pulire e deliscare le alici, lavarle e sottoporle alla bonifica prevista per consumo crudo o marinato. Metterle in acqua con sale e succo di limone per 10 minuti, poi trasferirle nella citronette.","Cuocere le linguine in acqua salata. Intanto scaldare l'olio con aglio, poi togliere l'aglio e aggiungere acqua di cottura, scorza di limone e poca colatura di alici.","Saltare la pasta nel condimento e mantecare con pecorino e altra acqua di cottura fino a ottenere una salsa cremosa.","Distribuire le alici marinate nei piatti, aggiungere le linguine e rifinire con citronette."],"photo":"https://ptps.stbm.it/t/bnx08k_large.jpg","source":"https://www.giallozafferano.com/recipes/linguine-with-marinated-anchovies-and-pecorino.html","pdfPage":261,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00423","name":"Pasta alla sorrentina","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"15 min","cook":"45 min","rest":"","ingredients":["Fusilli 320 g","passata di pomodoro 500 g","mozzarella 125 g","olio EVO 30 g","aglio 1 spicchio","basilico q.b.","sale fino q.b.","Parmigiano Reggiano DOP 65 g."],"steps":["Profumare l'olio con uno spicchio d'aglio, aggiungere la passata, sale e basilico; cuocere coperto a fuoco basso per 30 minuti e rimuovere l'aglio.","Tagliare la mozzarella a cubetti. Cuocere i fusilli al dente e condirli nel sugo.","Disporre metà pasta in una pirofila di circa 25 cm, aggiungere metà mozzarella e Parmigiano; ripetere gli strati.","Gratinare sotto il grill per circa 5 minuti, fino a scioglimento della mozzarella. Guarnire con basilico fresco e servire subito."],"photo":"https://www.giallozafferano.com/images/231-23170/Pasta-alla-sorrentina_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Pasta-alla-sorrentina.html","pdfPage":262,"description":"Un'appetitosa variante della classica ricetta campana condita con un corposo sugo di pomodoro, profumato basilico e mozzarella filante... pasta alla sorrentina!"},{"id":"GZ-00428","name":"Pasta alla zozzona","category":"Primi piatti, pasta e gnocchi","serves":"4 persone","prep":"15 min","cook":"25 min","rest":"","ingredients":["Rigatoni 320 g","guanciale 200 g","salsiccia di solo maiale 250 g","Pecorino Romano DOP grattugiato 60 g + 40 g per mantecare","pomodorini in conserva 350 g","olio EVO q.b.","tuorli medi 4."],"steps":["Tagliare il guanciale a listarelle e la salsiccia privata del budello a pezzi.","Rosolare entrambi in padella con un filo d'olio per circa 15 minuti a fuoco medio-basso; aggiungere i pomodorini e proseguire coperto per 10 minuti.","Mescolare i tuorli con 60 g di Pecorino, diluendo con poca acqua calda di cottura della pasta.","Lessare i rigatoni al dente e trasferirli nel condimento. Spegnere il fuoco, aggiungere la crema di tuorli e Pecorino e mescolare energicamente.","Completare con i restanti 40 g di Pecorino e servire immediatamente."],"photo":"https://www.giallozafferano.com/images/229-22920/pasta-alla-zozzona-carbonara-amatriciana-and-cacio-e-pepe-pasta_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/pasta-alla-zozzona-carbonara-amatriciana-and-cacio-e-pepe-pasta.html","pdfPage":263,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00450","name":"Pasta con broccoli","category":"Primi piatti, pasta e gnocchi","serves":"non indicato nella fonte","prep":"10 min","cook":"30 min","rest":"","ingredients":["Troccoli freschi 320 g","broccoli 450 g","aglio 1 spicchio","olio EVO q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Dividere il broccolo in cimette, lavarle e lessarle per circa 10 minuti in acqua salata, conservando l'acqua di cottura.","Scaldare uno spicchio d'aglio con olio; aggiungere i broccoli, tenendone da parte alcune cimette, e poca acqua di cottura.","Proseguire a fuoco medio-basso fino a ottenere una crema morbida; aggiustare sale e pepe e togliere l'aglio.","Cuocere i troccoli nell'acqua dei broccoli, scolarli al dente e mantecarli nella crema con le cimette conservate e acqua di cottura quanto basta."],"photo":"https://ptps.stbm.it/t/ta7pp9_large.jpg","source":"https://www.giallozafferano.com/recipes/Pasta-with-broccoli.html","pdfPage":264,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00075","name":"Arancini di riso al forno","category":"Risotti, riso e cereali","serves":"10 arancini","prep":"30 min","cook":"1 h 15 min","rest":"raffreddamento riso almeno 2 h; arancini 20 min in frigorifero","ingredients":["Riso: Vialone Nano 500 g, acqua 1,2 l, zafferano in pistilli q.b., caciocavallo stagionato 100 g, burro 30 g, sale 1 pizzico","ragù: maiale macinato 100 g, passata di pomodoro 200 g, piselli 80 g, caciocavallo 50 g, cipolla 1/2, vino rosso 50 g, burro 25 g, olio EVO 2 cucchiai, sale e pepe q.b.","panatura: uova 6, pangrattato e olio EVO q.b."],"steps":["Lessare il riso in 1,2 l di acqua salata per circa 15 minuti, finché il liquido è assorbito; unire zafferano sciolto in poca acqua calda, burro e caciocavallo grattugiato.","Stendere il riso su un vassoio e lasciarlo raffreddare almeno 2 ore.","Stufare la cipolla in burro e olio; rosolare la carne, sfumare con vino e aggiungere passata, sale e pepe. Cuocere coperto per circa 20 minuti, unendo i piselli a metà.","Con le mani bagnate formare dieci palline di riso, farcirle con ragù denso e cubetti di caciocavallo, poi richiuderle.","Passare due volte in uovo sbattuto e pangrattato; raffreddare in frigorifero 20 minuti.","Irrorare con poco olio e cuocere in forno statico a circa 190 °C per 30 minuti, fino a doratura."],"photo":"","source":"https://www.giallozafferano.com/recipes/baked-rice-arancini.html","pdfPage":265,"description":"Una variante più leggera ma altrettanto appetitosa della famosa ricetta siciliana, farcita con ragù e piselli come da tradizione: arancini di riso al forno!"},{"id":"GZ-00077","name":"Arancini di riso venere e pesce","category":"Risotti, riso e cereali","serves":"4 porzioni; 10–12 arancini","prep":"25 min","cook":"45 min","rest":"raffreddamento preparazioni","ingredients":["RISO: riso Venere 300 g","scalogno 1","vino bianco 50 ml","amido di riso 2 cucchiai","olio EVO, sale, pepe e brodo di pesce q.b.\nRIPIENO: gamberi 200 g","scampi 200 g","triglie 200 g","piselli 150 g","aglio 1 spicchio","olio EVO e sale q.b.\nPANATURA: uova medie 2","semi di sesamo nero q.b.\nNOTA FONTE: olio di semi per frittura citato nel procedimento, non quantificato nell'elenco ingredienti."],"steps":["Pulire gamberi, scampi e triglie; usare teste e carapaci per preparare il brodo di pesce, eliminando accuratamente i filamenti intestinali e le lische.","Stufare lo scalogno tritato nell'olio, tostare il riso Venere, sfumare con il vino e portare a cottura aggiungendo gradualmente brodo caldo. Incorporare l'amido di riso verso la fine e lasciare raffreddare.","Insaporire l'aglio in padella, aggiungere il pesce tagliato e cuocerlo brevemente; unire i piselli e completare la cottura. Raffreddare il ripieno.","Ungere leggermente le mani, appiattire una porzione di riso, farcirla e richiuderla a sfera o a punta.","Passare negli albumi e tuorli sbattuti e ricoprire con semi di sesamo nero.","Friggere in olio a temperatura non superiore a circa 170 °C; scolare e servire tiepidi o caldi."],"photo":"","source":"https://www.giallozafferano.com/recipes/venere-rice-and-seafood-arancini.html","pdfPage":266,"description":"Gli arancini di riso venere e pesce sono uno sfizioso antipasto, una rivisitazione dei classici arancini preparati con riso nero, gamberi, scampi e triglie"},{"id":"GZ-00118","name":"cous cous all'italiana","category":"Risotti, riso e cereali","serves":"6 persone","prep":"25 min","cook":"5 min","rest":"","ingredients":["Cozze pulite 1 kg","vongole spurgate 1 kg","couscous 200 g","zafferano 1 bustina","sale q.b.","olio EVO q.b.","aglio 2 spicchi","peperoncino fresco 1","pomodori datterini 300 g","uvetta sultanina 40 g","scorza di 1 limone.\nPESTO: pistacchi tostati non salati 70 g","olio EVO 70 g","sale e pepe q.b.","basilico q.b."],"steps":["Frullare i pistacchi con basilico, olio, sale e pepe fino a ottenere un pesto; tenere da parte.","Rosolare aglio e peperoncino in poco olio; aggiungere cozze e vongole, coprire e farle aprire. Filtrare il liquido di cottura e sciogliervi lo zafferano.","Condire il couscous con sale e olio, coprirlo con il liquido caldo allo zafferano e attendere circa cinque minuti; sgranare con una forchetta.","Ammollare l'uvetta nel liquido rimasto o in poca acqua calda; sgusciare la maggior parte dei molluschi e tagliare i pomodorini.","Riunire couscous, molluschi, pomodorini, uvetta scolata, scorza di limone e basilico. Servire con gocce di pesto al pistacchio."],"photo":"","source":"https://www.giallozafferano.com/recipes/Italian-style-Couscous.html","pdfPage":267,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00121","name":"Couscous ai frutti di mare","category":"Risotti, riso e cereali","serves":"4 persone","prep":"60 min","cook":"30 min","rest":"2 h spurgo vongole","ingredients":["Couscous precotto 300 g","cozze 1 kg","vongole 1 kg","calamari 500 g","gamberi 400 g","olio EVO 50 g","vino bianco secco 40 g","aglio 3 spicchi","peperoncino fresco 2","sale e pepe q.b.","menta tritata q.b.","pomodorini ciliegino 450 g."],"steps":["Spurgare le vongole per 2 ore cambiando l’acqua; pulire cozze, calamari e gamberi. Tagliare i calamari ad anelli.","Aprire cozze e vongole in casseruola con olio, aglio, peperoncino e vino; filtrare il fondo e sgusciare quasi tutti i molluschi.","Scaldare il fondo filtrato e versarne 320 g bollenti sul couscous con un filo d’olio; coprire 5 minuti e sgranare.","Saltare calamari con aglio e peperoncino, aggiungere pomodorini, quindi gamberi e molluschi; regolare di sale e pepe.","Mescolare il couscous al condimento di mare e terminare con menta fresca tritata."],"photo":"https://ptps.stbm.it/t/jtmpfm_large.jpg","source":"https://ricette.giallozafferano.it/Couscous-ai-frutti-di-mare.html","pdfPage":268,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00123","name":"Couscous alla mediterranea","category":"Risotti, riso e cereali","serves":"4 persone","prep":"10 min","cook":"","rest":"","ingredients":["Couscous 200 g","acqua 240 g","olio EVO q.b.","sale fino q.b. Condimento: pomodorini 250 g","olive taggiasche denocciolate 80 g","capperi sotto sale dissalati 30 g","pinoli 20 g","mozzarelline ciliegine 200 g","basilico q.b.","olio EVO q.b.","sale fino q.b."],"steps":["Portare l'acqua a bollore e versarla sul couscous con sale e poco olio.","Coprire e lasciare reidratare per circa 5 minuti, poi sgranare con una forchetta.","Lavare e tagliare i pomodorini, raccoglierli con mozzarelline, olive, capperi risciacquati e pinoli.","Aggiungere basilico, sale e olio, quindi amalgamare il condimento.","Incorporare il couscous sgranato e servire subito o dopo un breve riposo in frigorifero."],"photo":"https://www.giallozafferano.com/images/362-36287/mediterranean-couscous_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/mediterranean-couscous.html","pdfPage":269,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00124","name":"Couscous alle verdure","category":"Risotti, riso e cereali","serves":"4 persone","prep":"25 min","cook":"15 min","rest":"","ingredients":["Couscous precotto 160 g","acqua calda 320 g","olio EVO 10 g","curcuma 1 cucchiaino","sale 1 pizzico. Verdure: carote 180 g","melanzana 180 g","pomodorini 100 g","cipollotti 100 g","zucchine 180 g","taccole 100 g","peperoncino fresco 1","aglio 1 spicchio","zenzero fresco 10 g","olio EVO 20 g","sale q.b."],"steps":["Mondare e tagliare in piccoli pezzi tutte le verdure, tritando anche gli aromi.","Saltare in padella con olio, aglio e peperoncino le verdure più consistenti, poi aggiungere pomodorini e zenzero; cuocere brevemente mantenendo le verdure leggermente croccanti.","Versare il couscous in una ciotola, condire con curcuma, sale e olio; coprire con l'acqua calda e attendere il tempo indicato dalla fonte (circa due minuti).","Sgranare con una forchetta e servire con le verdure saltate."],"photo":"","source":"https://www.giallozafferano.com/recipes/Vegetable-couscous.html","pdfPage":270,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00125","name":"Couscous con piselli e gamberi","category":"Risotti, riso e cereali","serves":"4 persone","prep":"15 min","cook":"35 min","rest":"","ingredients":["PER IL COUSCOUS: couscous precotto 250 g","acqua 270 ml","olio EVO 2 cucchiai","scorza di 1 limone","sale fino q.b.","pepe nero q.b.","burro 30 g.\nPER IL CONDIMENTO: gamberi 300 g","piselli 300 g","olio EVO 6 cucchiai","pomodoro a grappolo 1","cipolla bianca 1/2","scorza di 1/2 limone","timo 1 rametto","maggiorana 1 rametto."],"steps":["Scaldare l'acqua con sale, due cucchiai d'olio e scorza di limone. Versare il couscous, spegnere, aggiungere il burro e lasciare assorbire il liquido per circa due minuti.","Sgusciare i gamberi, condirli con sale e pepe e rosolarli in parte dell'olio per circa cinque minuti; tenerli da parte.","Dividere il pomodoro: frullare semi e polpa con olio, sale, pepe e scorza di limone, tagliando il resto a dadini.","Rosolare la cipolla tritata nell'olio rimasto; unire la salsa di pomodoro, poi i piselli e le erbe aromatiche. Cuocere finché i piselli sono teneri, aggiungendo acqua se necessario.","Sgranare il couscous eliminando la scorza; incorporare dadini di pomodoro, erbe e piselli, quindi aggiungere i gamberi. Servire caldo o freddo."],"photo":"","source":"https://www.giallozafferano.com/recipes/couscous-with-peas-and-shrimp.html","pdfPage":271,"description":"Il couscous con piselli e gamberi Ä"},{"id":"GZ-00145","name":"Fregola con baccalà","category":"Risotti, riso e cereali","serves":"4 persone","prep":"10 min","cook":"25 min","rest":"","ingredients":["Fregola 300 g","baccalà dissalato 500 g","olio EVO 60 g","brodo vegetale 1,2 l","pomodorini 200 g","olive taggiasche 30 g","aglio 1 spicchio","peperoncino fresco 1","timo q.b.","maggiorana q.b.","vino bianco 1/2 bicchiere","scorza di limone 1 (formulazione della fonte)","basilico q.b.","capperi sotto sale 15 g."],"steps":["Controllare che il baccalà sia dissalato, eliminare le spine e tagliarlo a bocconcini.","Far dorare l'aglio schiacciato con parte dell'olio; rimuoverlo, aggiungere il baccalà e sfumare col vino bianco. Cuocere circa 7 minuti e tenere da parte.","Nella stessa padella tostare la fregola con altro olio; cuocerla come un risotto aggiungendo brodo vegetale caldo poco per volta e mescolando.","Sciacquare e ammollare i capperi per eliminare il sale in eccesso. Tagliare i pomodorini e condirli con olio, sale, timo e maggiorana.","Dopo circa 12 minuti di cottura della fregola, incorporare baccalà, pomodorini, capperi e olive; far insaporire ancora un minuto e controllare la cottura.","Completare con peperoncino, basilico, un filo d'olio e scorza di limone grattugiata; servire calda."],"photo":"https://www.giallozafferano.com/images/341-34139/fregola-with-cod_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-cod.html","pdfPage":272,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00147","name":"Fregola con cozze vongole e ceci","category":"Risotti, riso e cereali","serves":"4 persone","prep":"45 min","cook":"2 h","rest":"","ingredients":["Fregola 250 g","cozze 1 kg","vongole 1 kg","ceci secchi 150 g","acqua circa 2 l","sedano 1/2 costa","scalogno 1","passata di pomodoro 40 g","prezzemolo 4 ciuffi","peperoncino fresco 1","aglio 1 spicchio","sale grosso 15 g","sale fino q.b.","pepe bianco q.b.","olio EVO q.b."],"steps":["Mettere in ammollo i ceci per almeno 12 ore. Spurgare le vongole in acqua salata e pulire accuratamente le cozze.","Scaldare un trito di aglio, prezzemolo e peperoncino con poco olio; aprire i molluschi coperti, filtrare il liquido e sgusciarne la maggior parte.","Unire il fondo filtrato all’acqua per ottenere il brodo. Appassire scalogno e sedano tritati, aggiungere ceci e passata e bagnare con brodo.","Cuocere i ceci a fuoco dolce per circa 1 ora e 40 minuti, reintegrando il liquido; schiacciarne una piccola parte per addensare.","Aggiungere la fregola e cuocerla con il brodo come un risotto; unire cozze e vongole negli ultimi 4-5 minuti, regolare sale e pepe."],"photo":"https://www.giallozafferano.com/images/318-31877/fregola-with-mussels-clams-and-chickpeas_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-mussels-clams-and-chickpeas.html","pdfPage":273,"description":"La fregola con cozze vongole e ceci è un ottimo primo piatto dal sapore di mare, con la pasta particolare di semola e acqua che dona un gusto unico"},{"id":"GZ-00150","name":"Fregola con le melanzane","category":"Risotti, riso e cereali","serves":"4 persone","prep":"15 min","cook":"30 min","rest":"","ingredients":["Fregola 200 g","melanzane 400 g","pomodori a grappolo 400 g","aglio 1 spicchio","capperi sotto sale dissalati 10 g","olive verdi denocciolate 30 g","olio EVO 3 cucchiai","sale fino q.b.","pepe nero q.b."],"steps":["Tagliare melanzane e pomodori a cubetti, mantenendoli separati.","Rosolare l’aglio nell’olio, aggiungere le melanzane e cuocere circa 15 minuti a fuoco moderato.","Unire pomodori, sale e pepe; quando le melanzane sono morbide, aggiungere olive a rondelle e capperi dissalati.","Lessare la fregola in acqua salata, scolarla e ripassarla nel condimento per amalgamare i sapori.","Completare con un filo d’olio e servire."],"photo":"https://www.giallozafferano.com/images/315-31566/fregola-with-eggplants_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-eggplants.html","pdfPage":274,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00151","name":"Fregola con lenticchie","category":"Risotti, riso e cereali","serves":"4 persone","prep":"20 min","cook":"1 h 10 min","rest":"","ingredients":["Fregola 320 g","lenticchie secche 250 g","prosciutto crudo 200 g","porri 100 g","passata di pomodoro 400 g","brodo vegetale 1,3 l","olio EVO 30 g","sale, pepe e maggiorana q.b."],"steps":["Preparare il brodo vegetale e sciacquare le lenticchie. Affettare il porro e tagliare il prosciutto a piccoli cubetti.","Far appassire il porro nell’olio per 6–7 minuti, aggiungere il prosciutto e rosolare ancora 2–3 minuti.","Versare passata, lenticchie e circa 500 g di brodo; regolare sale e pepe e cuocere coperto a fiamma dolce per circa 45 minuti.","Aggiungere la fregola e cuocerla come un risotto, incorporando altro brodo caldo quando necessario e mescolando spesso.","Terminare con maggiorana tritata e servire subito."],"photo":"https://www.giallozafferano.it/images/164-16419/Fregola-con-lenticchie_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Fregola-con-lenticchie.html","pdfPage":275,"description":"Diamo il benvenuto al nuovo anno con un piatto della tradizione sarda rivisitato: fregola con lenticchie, per iniziare con gusto il 2016!"},{"id":"GZ-00154","name":"Fregola con scampi e gamberi","category":"Risotti, riso e cereali","serves":"4 persone","prep":"20 min","cook":"30 min","rest":"","ingredients":["Fregola 250 g","gamberi 400 g","scampi 300 g","fumetto di pesce 500 g","polpa di pomodoro 200 g","peperoncino fresco 1/2","aglio 1 spicchio","olio EVO 20 g","scorza di limone 1","basilico q.b.","sale fino q.b."],"steps":["Pulire gamberi e scampi eliminando il filo intestinale; conservare gli scarti per il fumetto di pesce.","Insaporire l’olio con aglio e peperoncino, aggiungere il pomodoro e cuocere per 5 minuti; eliminare l’aglio.","Tostare brevemente la fregola nel condimento e cuocerla aggiungendo gradualmente fumetto caldo.","Dopo circa 10 minuti aggiungere i gamberi; dopo altri 5 minuti unire gli scampi e terminare la cottura.","Regolare di sale e completare con basilico spezzettato e scorza di limone."],"photo":"https://www.giallozafferano.com/images/332-33294/fregola-with-scampi-and-prawns_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-scampi-and-prawns.html","pdfPage":276,"description":"Il tradizionale formato di pasta sardo viene risottato con il fumetto di crostacei per un risultato dal gusto davvero prelibato: fregola con scampi e gamberi!"},{"id":"GZ-00155","name":"Fregola con vongole e bottarga","category":"Risotti, riso e cereali","serves":"4 persone","prep":"10 min","cook":"30 min","rest":"","ingredients":["Fregola 360 g","vongole veraci già spurgate 500 g","bottarga di muggine q.b.","polpa di pomodoro 100 g","vino bianco ½ bicchiere","aglio 1 spicchio","peperoncino fresco 2","prezzemolo 1 mazzetto","olio EVO e sale q.b."],"steps":["Scaldare olio, aglio, gambi di prezzemolo e peperoncino; unire le vongole, sfumare col vino e farle aprire coperte.","Filtrare il fondo e sgusciare quasi tutte le vongole, conservandone alcune per la decorazione.","Tostare la fregola nella padella per circa 2 minuti; bagnare col fondo filtrato e aggiungere la polpa di pomodoro.","Cuocere aggiungendo acqua calda se serve; a fine cottura incorporare le vongole e il prezzemolo tritato.","Mantecare con poco olio e completare i piatti con bottarga grattugiata e vongole intere."],"photo":"https://ptps.stbm.it/t/rxj78m_large.jpg","source":"https://ricette.giallozafferano.it/Fregola-con-vongole-e-bottarga.html","pdfPage":277,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00156","name":"Fregola con vongole e ceci","category":"Risotti, riso e cereali","serves":"4 persone","prep":"25 min","cook":"25 min","rest":"","ingredients":["Fregola 250 g","vongole 1 kg","ceci secchi 100 g","pomodori pelati 200 g","prezzemolo tritato 2 cucchiai","rosmarino 1 rametto","brodo vegetale 1 l","concentrato di pomodoro 1 cucchiaio","sale q.b.","olio EVO q.b."],"steps":["Ammollare i ceci per almeno 12 ore, poi lessarli in acqua salata fino a renderli teneri.","Spurgare e aprire le vongole in padella; conservare il liquido filtrato e sgusciarle, lasciandone alcune intere per decorare.","Insaporire olio e prezzemolo in padella, unire pelati e concentrato diluito nel fondo delle vongole; bagnare con brodo caldo.","Versare la fregola e cuocere 10-15 minuti aggiungendo brodo gradualmente; a metà cottura incorporare i ceci.","Completare con le vongole, altro prezzemolo e olio a crudo; regolare di sale."],"photo":"https://www.giallozafferano.com/images/320-32033/fregola-with-clams-and-chickpeas_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-clams-and-chickpeas.html","pdfPage":278,"description":"La fregola con vongole e ceci è un primo piatto prelibato che si ispira alla tradizione sarda e si prepara con la tipica pasta di semola di grano duro"},{"id":"GZ-00157","name":"fregola con vongole e pomodorini","category":"Risotti, riso e cereali","serves":"4 persone","prep":"30 min","cook":"1 h 30 min","rest":"","ingredients":["FREGOLA FATTA IN CASA: semola grossa 500 g","acqua tiepida 240 g","zafferano 0,15 g","semola rimacinata q.b. CONDIMENTO: vongole già spurgate 1 kg","pomodorini datterini 300 g","aglio 4 spicchi","lime 1 (succo e scorza)","peperoncino fresco 1","prezzemolo q.b.","acqua 400 g","olio EVO q.b.","sale fino q.b."],"steps":["Sciogliere lo zafferano in acqua tiepida; incorporare gradualmente alla semola con movimenti circolari fino a formare piccoli granelli. Spolverare di semola rimacinata.","Asciugare la fregola in forno ventilato a circa 120 °C per un’ora e lasciarla raffreddare.","Aprire le vongole già spurgate con olio, aglio, peperoncino e prezzemolo; filtrare il liquido e sgusciarne la maggior parte.","Saltare i pomodorini tagliati con aglio e olio; versare la fregola e cuocerla come un risotto con il brodo di vongole diluito nell’acqua.","A fine cottura incorporare le vongole, olio a crudo, prezzemolo e succo e scorza di lime."],"photo":"https://www.giallozafferano.com/images/297-29736/fregola-with-clams-and-cherry-tomatoes_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/fregola-with-clams-and-cherry-tomatoes.html","pdfPage":279,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00701","name":"risotto agli asparagi","category":"Risotti, riso e cereali","serves":"4 persone","prep":"60 min","cook":"20 min per il risotto, più il brodo","rest":"2 min prima della mantecatura","ingredients":["Riso Carnaroli 320 g | Asparagi 750 g | Grana Padano 50 g | Burro 50 g | Scalogno 1 | Olio EVO q.b. | Brodo: carote 2, sedano 1 costa, cipolla 1, acqua 2 l, sale, pepe e olio q.b."],"steps":["Separare le estremità dure degli asparagi per il brodo, conservare le punte e affettare i gambi teneri. | 2. Preparare un brodo con scarti di asparago, carote, sedano, cipolla e acqua, facendo sobbollire almeno mezz’ora. | 3. Rosolare lo scalogno con parte delle rondelle, bagnare con brodo e cuocere brevemente; frullare la verdura tiepida con un poco di olio per ottenere una crema. | 4. Sbollentare le punte per un paio di minuti e raffreddarle rapidamente. | 5. Tostare il riso con olio e sale, portarlo a cottura aggiungendo brodo; a metà unire le rondelle rimaste. | 6. Negli ultimi minuti incorporare la crema, quindi lasciar riposare e mantecare con burro e formaggio. Guarnire con le punte."],"photo":"","source":"https://ricette.giallozafferano.it/Risotto-agli-asparagi.html","pdfPage":280,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03609","name":"Burro di mandorle","category":"Salse, sughi e condimenti","serves":"circa 200 g","prep":"20 min","cook":"8 min","rest":"frigorifero 1 h","ingredients":["Per circa 200 g: mandorle pelate 200 g","olio di sesamo 1 cucchiaio","sale fino 1/2 cucchiaino","miele millefiori 1/2 cucchiaino","cannella in polvere 1/4 cucchiaino."],"steps":["Distribuire le mandorle su una teglia e tostarle in forno ventilato a circa 190 °C per 8 minuti.","Versarle ancora tiepide nel mixer e frullare a intervalli, partendo da bassa velocità, finché passano da granella a pasta oleosa.","Aggiungere cannella e sale, poi miele e olio di sesamo.","Continuare a frullare fino a una crema uniforme, facendo pause se il motore si scalda.","Riporre in frigorifero per circa un'ora prima dell'utilizzo."],"photo":"https://www.giallozafferano.com/images/307-30738/almond-butter_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/almond-butter.html","pdfPage":281,"description":"Proprio come quello d'arachidi, il burro di mandorle è ottimo da spalmare su pane e fette biscottate per una colazione ricca ed energizzante!"},{"id":"GZ-03612","name":"Caramello salato","category":"Salse, sughi e condimenti","serves":"quantità non indicata","prep":"10 min","cook":"10 min","rest":"raffreddamento","ingredients":["Zucchero 270 g","burro 130 g","panna fresca liquida 200 g","sale fino 10 g."],"steps":["Scaldare lo zucchero in un tegame dal fondo spesso, a fuoco medio-basso, ruotando il recipiente per favorire una fusione uniforme.","Riscaldare separatamente la panna.","Quando il caramello assume una colorazione ambrata, abbassare la fiamma e incorporare burro e sale con una frusta.","Versare con prudenza la panna calda, continuando a mescolare fino a ottenere una salsa liscia.","Trasferire in un vasetto pulito, raffreddare prima a temperatura ambiente e poi in frigorifero."],"photo":"https://ptps.stbm.it/t/z7ky7p_large.jpg","source":"https://www.giallozafferano.com/recipes/salted-caramel.html","pdfPage":282,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03640","name":"Conserva di pomodorini","category":"Salse, sughi e condimenti","serves":"2 vasetti da circa 340 g","prep":"15 min","cook":"45 min","rest":"","ingredients":["Pomodorini gialli (o di altri colori) 450 g","acqua 500 g","sale fino 15 g."],"steps":["Sanificare i vasetti e predisporre coperchi nuovi seguendo le indicazioni di sicurezza della fonte e le linee guida del Ministero della Salute.","Lavare e asciugare accuratamente i pomodorini, distribuirli nei due vasetti.","Portare a bollore acqua e sale per ottenere una salamoia al 3%; versarla sui pomodorini fino a coprirli.","Applicare i pressini, chiudere i vasetti e immergerli in acqua quasi fino al bordo. Portare a bollore e trattare per 45 minuti.","Lasciare raffreddare i vasetti nell'acqua di trattamento. Verificare la tenuta dei coperchi prima della conservazione; seguire le prescrizioni ufficiali sulla sicurezza delle conserve domestiche."],"photo":"","source":"https://www.giallozafferano.com/recipes/cherry-tomato-preserve.html","pdfPage":283,"description":"La conserva di pomodorini è semplicissima da preparare e potrete gustarla come antipasto su una fetta di pane oppure utilizzarla per condire la pasta!"},{"id":"GZ-03649","name":"Crema spalmabile alla nocciola e cioccolato","category":"Salse, sughi e condimenti","serves":"2 vasetti da circa 200 g","prep":"15 min","cook":"","rest":"rassodamento 20 min","ingredients":["Per 2 vasetti da circa 200 g: cioccolato al latte 250 g","pasta di nocciole 195 g","cacao amaro in polvere 10 g","olio di semi 20 g","sale fino 1 pizzico","baccello di vaniglia 1."],"steps":["Raccogliere la pasta di nocciole in una ciotola e amalgamarla con olio, sale e semi del baccello di vaniglia.","Tritare il cioccolato al latte e scioglierlo a bagnomaria o nel microonde con brevi intervalli, senza surriscaldarlo.","Unire il cioccolato fuso alla pasta di nocciole, poi setacciare e incorporare il cacao.","Mescolare fino a una crema liscia, eventualmente aiutandosi con un frullatore a immersione.","Trasferire in vasetti puliti e idonei, chiudere e lasciare rassodare almeno 20 minuti prima di utilizzare."],"photo":"https://www.giallozafferano.com/images/309-30984/hazelnut-and-chocolate-spread_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/hazelnut-and-chocolate-spread.html","pdfPage":284,"description":"La crema spalmabile alla nocciola e cioccolato è una crema molto golosa ideale da spalmare su fette di pane per una merenda o una colazione sfiziosa"},{"id":"GZ-03851","name":"Hummus di avocado","category":"Salse, sughi e condimenti","serves":"circa 800 g","prep":"10 min","cook":"non prevista","rest":"","ingredients":["Avocado 2","ceci precotti 240 g","tahina 20 g","succo di limone 40 g","olio EVO 50 g","aglio 1 spicchio","semi di sesamo bianchi e neri q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Dividere gli avocado, togliere il nocciolo e ricavare la polpa (la fonte indica circa 450 g di polpa).","Spremere e filtrare il succo di limone.","Frullare i ceci scolati con avocado, aglio privato della buccia, tahina e succo di limone.","Regolare di sale e pepe, incorporare l'olio e continuare a frullare fino a una crema omogenea.","Versare in una ciotola e completare con semi di sesamo bianchi e neri."],"photo":"https://www.giallozafferano.com/images/254-25476/Avocado-hummus_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Avocado-hummus.html","pdfPage":285,"description":"Date un tocco in più ai vostri panini e finger food con l'hummus di avocado, una salsa a base di ceci che unisce i sapori del Medioriente e dell'America Latina!"},{"id":"GZ-03852","name":"Hummus di funghi","category":"Salse, sughi e condimenti","serves":"4 persone","prep":"10 min","cook":"20 min","rest":"","ingredients":["Funghi Portobello 240 g","aglio 1 spicchio","olio EVO, sale, pepe, maggiorana e timo q.b.","ceci già cotti 170 g","tahina 45 g","succo di 1/2 limone."],"steps":["Pulire i funghi, tagliarli e condirli con aglio, erbe aromatiche, sale, pepe e olio.","Cuocere in forno statico a 200 °C per circa venti minuti.","Tenere da parte qualche fungo per la decorazione; frullare gli altri con ceci, tahina, limone, olio e sale fino a ottenere una crema.","Servire in ciotola con i funghi conservati, timo, maggiorana e un filo d'olio."],"photo":"https://www.giallozafferano.com/images/357-35723/mushroom-hummus_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/mushroom-hummus.html","pdfPage":286,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03853","name":"Hummus di pomodorini","category":"Salse, sughi e condimenti","serves":"circa 850 g (6 porzioni)","prep":"10 min","cook":"5 min","rest":"","ingredients":["Pomodorini 350 g","ceci precotti 470 g","tahina 30 g","semi di sesamo 10 g","aglio in camicia 2 spicchi","zucchero 5 g","olio EVO, origano secco, sale e pepe q.b."],"steps":["Lavare i pomodorini e saltarli in padella con olio, aglio in camicia, sale, zucchero e origano per cinque-sei minuti.","Eliminare l'aglio e conservare alcuni pomodorini interi per la finitura.","Frullare i restanti pomodorini con ceci, tahina, sesamo, olio, sale, pepe e origano fino a ottenere una crema liscia.","Servire con pomodorini tenuti da parte, semi di sesamo e un filo d'olio."],"photo":"https://www.giallozafferano.com/images/345-34560/cherry-tomato-hummus_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/cherry-tomato-hummus.html","pdfPage":287,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03854","name":"Hummus di zucca","category":"Salse, sughi e condimenti","serves":"6 persone","prep":"10 min","cook":"30 min","rest":"","ingredients":["Zucca Delica 300 g","ceci già cotti 230 g","tahina 50 g","succo di limone 15 g","olio EVO, sale, paprika e rosmarino q.b."],"steps":["Privare la zucca di semi e filamenti e tagliarla a fette regolari; condirla con olio, rosmarino, paprika e sale.","Cuocere in forno statico a 200 °C per circa 30 minuti, finché la polpa diventa tenera.","Frullare la zucca con ceci cotti, tahina e succo di limone; aggiustare di sale e olio, ammorbidendo con poca acqua solo se necessario.","Servire in una ciotola con un velo di paprika, rosmarino e un filo d'olio."],"photo":"https://www.giallozafferano.com/images/357-35722/pumpkin-hummus_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/pumpkin-hummus.html","pdfPage":288,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00048","name":"mousse di prosciutto","category":"Salse, sughi e condimenti","serves":"circa 400 g","prep":"10 min","cook":"non previsto","rest":"","ingredients":["Prosciutto cotto a fette 200 g","ricotta vaccina 100 g","panna fresca liquida 100 g","timo q.b."],"steps":["Spezzettare il prosciutto cotto in una ciotola e aggiungere la ricotta. 2. Frullare con un mixer a immersione fino a formare una crema. 3. Incorporare la panna fresca e frullare nuovamente per ottenere una mousse uniforme. 4. Trasferire in una ciotola, completare con foglioline di timo e conservare coperta in frigorifero fino al servizio."],"photo":"","source":"https://www.giallozafferano.com/recipes/ham-mousse.html","pdfPage":289,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01114","name":"agnello al forno con patate","category":"Secondi di carne","serves":"4 persone","prep":"20 min","cook":"1 h 30 min","rest":"","ingredients":["Agnello 1,5 kg","Patate novelle 1 kg","Cipolle bianche 200 g","Aglio 1 testa intera","Acqua 500 g","Aceto di vino bianco 500 g","Timo 3 rametti","Rosmarino 2 rametti","Salvia 4 foglie","Alloro 2 foglie","Bacche di ginepro 10","Olio extravergine d’oliva 80 g","Sale fino q.b.","Pepe nero q.b."],"steps":["Metti i pezzi d’agnello in una ciotola con acqua e aceto, lasciandoli immersi mentre prepari gli altri ingredienti.","Lava e asciuga le patate novelle, dividile a metà; taglia le cipolle a spicchi e la testa d’aglio in due.","Distribuisci patate, cipolla e aglio in una teglia; aggiungi timo, rosmarino, salvia, alloro e ginepro.","Scola l’agnello dalla marinatura e sistemalo nella teglia con le verdure.","Condisci con olio, sale e pepe, quindi mescola per distribuire gli aromi.","Cuoci in forno statico preriscaldato a 200 °C per circa 90 minuti, girando la carne ogni 20 minuti. Servi caldo."],"photo":"https://www.giallozafferano.com/images/276-27617/Roasted-Lamb-and-Potatoes_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Roasted-Lamb-and-Potatoes.html","pdfPage":290,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01115","name":"Agnello cacio e ova","category":"Secondi di carne","serves":"4 persone","prep":"30 min","cook":"45 min","rest":"","ingredients":["Polpa di agnello 1 kg","uova 7","pecorino abruzzese grattugiato 150 g","rosmarino 1 rametto","vino bianco secco 100 ml","olio EVO q.b.","sale e pepe q.b.","bacche di ginepro 4","timo 1 rametto","alloro 1 foglia","cipolla dorata 1"],"steps":["Affettare la cipolla e tagliare l’agnello in pezzi regolari. Stufare cipolla e ginepro in poco olio per circa 5 minuti.","Aumentare il fuoco, unire la carne, rosmarino, timo e alloro e rosolare per circa 5 minuti. Salare e pepare.","Sfumare con vino bianco; una volta evaporato aggiungere acqua fino a coprire appena la carne.","Coprire e cuocere a fuoco medio per circa 35 minuti, poi eliminare le erbe.","Sbattere uova e pecorino; abbassare molto la fiamma e versare sulla carne, mescolando per pochi minuti fino a ottenere una crema appena rappresa. Servire subito."],"photo":"","source":"https://www.giallozafferano.com.br/receitas/cordeiro-com-queijo-e-ovos.html","pdfPage":291,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01117","name":"Agnello kleftiko","category":"Secondi di carne","serves":"4 persone","prep":"30 min","cook":"4 h","rest":"30 min marinatura","ingredients":["Cosciotto di agnello con osso 1,3 kg (circa 890 g puliti)","patate 700 g","pomodori ramati 400 g","feta 200 g","cipolla rossa 1","rosmarino 3 rametti","olio EVO, sale e pepe q.b. Marinata: succo di limone 150 g, vino bianco secco 120 g, timo 3 rametti, bacche di ginepro 4, pepe q.b."],"steps":["Disossare e sgrassare l’agnello, riducendo la polpa in bocconi di circa 4–5 cm.","Marinare la carne in frigorifero per 30 minuti con limone, vino, timo, ginepro e pepe.","Tagliare patate, pomodori e cipolla; scolare la carne e mescolarla alle verdure con rosmarino, olio, sale e pepe.","Dividere in quattro porzioni su doppi fogli di carta forno, aggiungere la feta a cubetti e chiudere accuratamente i cartocci.","
