<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#244436"><title>Sapore. — Il tuo ricettario</title><style>
:root{--forest:#244436;--sage:#e7eee2;--terra:#ac7852;--cream:#f3f1e9;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;color:#233e32;background:var(--cream)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #c8a378;outline-offset:2px}.app{width:100%;max-width:1700px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--cream)}.top{background:var(--forest);color:#fff;padding:7px clamp(10px,2vw,22px);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}.branding{display:flex;align-items:baseline;gap:10px}.logo{font:bold clamp(20px,2vw,26px) Georgia,serif}.logo span{color:#e7b881}.tag{font-size:10px;letter-spacing:.5px;color:#cbd8cf}.top button{background:#42614f;border:0;border-radius:7px;color:#fff;padding:7px 10px;font-size:12px}.stage{flex:1;min-height:0;padding:clamp(6px,1vw,13px);display:flex;flex-direction:column}.welcome,.index{background:#fff;border-radius:11px;padding:clamp(12px,2vw,22px);flex:1}.welcome{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}.welcome h2{font:normal clamp(24px,3vw,36px) Georgia,serif;margin:0}.welcome p{font-size:13px;color:#738075;max-width:400px;line-height:1.5}.index{display:flex;flex-direction:column;min-height:0}.index h2{font:normal clamp(20px,2.5vw,30px) Georgia,serif;margin:0}.indexTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.indexTop button{border:0;background:none;font-size:20px;color:#758477}.count{font-size:12px;color:#8a968a;margin-left:8px}.search{width:100%;border:1px solid #dce3d9;padding:10px;border-radius:7px;font-size:13px;margin-bottom:9px}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;overflow:auto;align-content:start;max-height:calc(100dvh - 175px)}.results button{border:0;background:#f6f8f3;color:#304e3b;text-align:left;border-radius:7px;padding:11px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.results button:hover{background:#e5efe2}.recipe{display:grid;grid-template-columns:33% 25% 42%;background:#fff;border-radius:11px;overflow:hidden;flex:1;min-height:0}.photo{background:#e5e4da;min-width:0;display:flex;flex-direction:column;min-height:0}.imageWrap{min-height:0;flex:1;position:relative;overflow:hidden}.photo img{width:100%;height:100%;min-height:180px;max-height:55dvh;object-fit:cover;display:block}.photo .meta{padding:clamp(9px,1.4vw,18px);overflow-wrap:anywhere}.photo h2{font:normal clamp(18px,2.5vw,34px) Georgia,serif;margin:4px 0 8px}.category{font-size:10px;letter-spacing:.5px;font-weight:700;color:#a57551}.small{font-size:clamp(10px,1vw,13px);line-height:1.55;color:#758174}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button,.actions a{border:1px solid #d9ded6;border-radius:7px;background:#fff;color:#345341;padding:6px 9px;font-size:11px;text-decoration:none}.ingredients{background:var(--sage);padding:clamp(9px,1.5vw,21px);min-width:0;overflow:auto}.steps{padding:clamp(9px,1.5vw,21px);min-width:0;overflow:auto}.recipe h3{font-size:clamp(13px,1.4vw,17px);margin:0 0 12px}.ing{border-bottom:1px solid #d4dfd1;padding:7px 0;font-size:clamp(11px,1.05vw,14px);line-height:1.45}.step{display:flex;gap:9px;font-size:clamp(11px,1.1vw,15px);line-height:1.55;margin-bottom:14px}.step i{font-style:normal;color:#ac7852;font-weight:700;flex-shrink:0}.story{background:#ebe5d8;border-radius:11px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:11px}.story h2{font:normal 28px Georgia,serif;margin:0}.story p{font-size:13px;max-width:550px;color:#69796a;line-height:1.65}.story button,.story a{border:0;background:#244436;color:#fff;border-radius:8px;padding:9px 13px;text-decoration:none;font-size:12px}.foot{background:#e9e9e1;border-top:1px solid #dedfd6;padding:6px 9px;flex-shrink:0}.cats{display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}.cats button{flex:0 0 auto;border:1px solid #dfe3d9;border-radius:7px;background:#fff;color:#3c5c48;padding:8px 11px;font-size:11px;white-space:nowrap}.cats button.active{background:#294d3a;color:#fff}.pantry{background:#fff;border-radius:11px;padding:clamp(14px,2vw,25px);flex:1;overflow:auto}.pantry h2{font:normal 25px Georgia,serif;margin:0 0 10px}.pantry input{border:1px solid #d9e1d6;padding:9px;border-radius:7px;width:min(70%,430px)}.pantry button{border:0;border-radius:7px;padding:9px;background:#244436;color:#fff}.pantry .match{display:block;width:100%;text-align:left;margin-top:7px;background:#e7eee2;color:#244436}.emptyPhoto{min-height:180px;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#dce5d6,#e8dfd2);color:#8c9e89;font-size:36px}.notice{font-size:11px;color:#78877a;line-height:1.5}.pill{display:inline-block;background:#e8eee2;border-radius:7px;padding:6px 8px;margin:3px;font-size:11px}.footerinfo{font-size:10px;color:#778679;text-align:right;margin:4px 4px 0}.hidden{display:none!important}@media(min-width:700px) and (orientation:landscape){.app{height:100dvh}.stage{overflow:hidden}.recipe{height:100%}.photo img{max-height:none}.imageWrap{flex:1}.results{max-height:none;flex:1}}@media(max-width:650px){.recipe{grid-template-columns:32% 26% 42%}.photo h2{font-size:16px}.photo .meta,.ingredients,.steps{padding:8px}.recipe h3{font-size:12px}.ing,.step{font-size:10px}.results{grid-template-columns:1fr}.stage{padding:6px}.tag{font-size:9px}.actions button,.actions a{padding:5px;font-size:10px}.photo img{min-height:140px}}@media(max-width:850px) and (orientation:landscape){.top{padding:4px 10px}.logo{font-size:19px}.foot{padding:4px 7px}.cats button{padding:6px 9px}.photo img{min-height:90px}.recipe{min-height:0}.step{margin-bottom:8px}.ing{padding:4px 0}}@media(orientation:portrait) and (max-width:650px){.app{min-height:100dvh}.recipe{min-height:65dvh}.photo img{max-height:34dvh}}

.ingredients h3,.steps h3{position:sticky;top:0;z-index:1;padding:0 0 12px;background:inherit;border-bottom:1px solid #cbd7c9}.steps h3{background:#fff;border-bottom-color:#e6e6df}.ingSection{font-size:12px;letter-spacing:.055em;text-transform:uppercase;color:#835c42;margin:18px 0 7px;padding:0 0 6px;border-bottom:2px solid #b7cbb5;font-weight:750}.ingSection:first-of-type{margin-top:8px}.ing{padding:9px 0;line-height:1.55;overflow-wrap:break-word}.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:0 0 16px;margin:0 0 17px;border-bottom:1px solid #ecece6;break-inside:avoid}.step:last-child{border-bottom:0;margin-bottom:0}.step i{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#f3ede4;color:#946747;font-style:normal;font-size:12px;font-weight:750}.step span{padding-top:4px;line-height:1.65;overflow-wrap:break-word}.ingredients,.steps{scrollbar-gutter:stable}@media(max-width:650px){.step{grid-template-columns:25px minmax(0,1fr);gap:7px;padding-bottom:11px;margin-bottom:11px}.step i{width:24px;height:24px;font-size:10px}.ingSection{font-size:10px;margin-top:12px}}

<script>const RECIPES=[{"id":"GZ-03895","name":"Albicocche in sfoglia","category":"Antipasti e aperitivi","serves":"6 pezzi","prep":"10 min","cook":"18 min","rest":"","ingredients":["Albicocche 6","pasta sfoglia rotonda 230 g","scamorza 30 g.\nPER FINIRE: tuorlo 1","latte intero 10 g","semi di lino 1 cucchiaino","pepe rosa in grani 1 cucchiaino."],"steps":["Tagliare la scamorza a cubetti. Lavare le albicocche, asciugarle, dividerle a metà e togliere il nocciolo.","Ricavare sei dischi di pasta sfoglia di circa 10 cm di diametro.","Sistemare metà albicocca al centro di ogni disco, riempire la cavità con scamorza e richiudere con l'altra metà.","Avvolgere ciascun frutto nella sfoglia sigillando le giunzioni, disporre su una teglia con carta forno e spennellare con tuorlo e latte.","Praticare piccoli fori in superficie, cospargere con semi di lino e pepe rosa e cuocere in forno statico a 200 °C per 15–18 minuti, fino a doratura."],"photo":"","source":"https://www.giallozafferano.com/recipes/apricots-in-puff-pastry.html","pdfPage":10,"description":"Un antipasto accattivante e insolito che racchiude al suo interno un segreto di formaggio filante... lasciatevi stupire dalle albicocche in sfoglia!"},{"id":"GZ-00002","name":"Antipasto crudo e avocado","category":"Antipasti e aperitivi","serves":"12 pezzi","prep":"15 min","cook":"15 min","rest":"","ingredients":["Avocado sodi 2","farina di ceci 50 g","farina 00 50 g","lievito istantaneo salato 1/4 cucchiaino","acqua 120 g","sale 5 g","prosciutto crudo 12 fette","marmellata di arance 2 cucchiai."],"steps":["Riunire le due farine, il lievito e il sale; incorporare l’acqua a filo lavorando con una frusta fino a ottenere una pastella uniforme.","Cuocere dodici piccoli blinis in padella antiaderente, circa 2–3 minuti per lato, e tenerli da parte.","Tagliare gli avocado a fettine sottili; per ogni pezzo sovrapporre e avvolgere circa dieci fettine formando una rosa.","Disporre su ogni blinis una fetta di prosciutto e una rosa di avocado. Servire con la marmellata di arance leggermente lavorata."],"photo":"","source":"https://ricette.giallozafferano.it/Antipasto-crudo-e-avocado.html","pdfPage":11,"description":"Stuzzicate l'appetito dei vostri ospiti con un accattivante finger food dai sapori esotici che li conquisterà al primo morso: antipasto crudo e avocado!"},{"id":"GZ-00003","name":"Arancini al ragù bianco","category":"Antipasti e aperitivi","serves":"12 pezzi","prep":"60 min","cook":"45 min","rest":"raffreddamento riso circa 2 ore","ingredients":["RISO: riso Vialone Nano 500 g","acqua 1200 g","caciocavallo grattugiato 100 g","burro 30 g","zafferano 0,45 g","sale fino q.b.\nRAGÙ: manzo macinato 50 g","maiale macinato 50 g","piselli 80 g","sedano 1 costa","carota 1","cipolla dorata 1","Parmigiano Reggiano 50 g","vino bianco 40 g","olio EVO, sale e pepe q.b.\nRIPIENO: caciocavallo a cubetti 50 g.\nPASTELLA: farina 00 200 g","acqua fredda 340 g","sale 1 pizzico.\nPANATURA: pangrattato q.b.","olio di arachidi q.b."],"steps":["Lessare il riso nell'acqua salata fino ad assorbimento; condirlo con zafferano sciolto in poca acqua calda, burro e caciocavallo grattugiato.","Stendere il riso su un vassoio, coprirlo e lasciarlo raffreddare completamente per circa due ore.","Rosolare sedano, carota e cipolla tritati; unire le carni, sfumare con il vino e cuocere dolcemente. A metà cottura aggiungere i piselli; alla fine incorporare il Parmigiano e raffreddare.","Con le mani inumidite formare una cavità nel riso, inserire ragù e cubetti di caciocavallo, richiudere e modellare a punta.","Mescolare farina, acqua fredda e sale in una pastella liscia. Rivestire ogni arancino e poi passarlo nel pangrattato.","Friggere pochi pezzi per volta in olio a circa 170 °C, scolare su carta assorbente e servire caldi."],"photo":"","source":"https://www.giallozafferano.com/recipes/white-ragu-arancini.html","pdfPage":12,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00005","name":"arancini di riso","category":"Antipasti e aperitivi","serves":"Circa 12 arancini","prep":"60 min","cook":"50 min","rest":"Circa 2 h di raffreddamento del riso","ingredients":["Riso Vialone Nano 500 g","Acqua 1,25 l, per il riso","Caciocavallo stagionato grattugiato 100 g","Burro 30 g","Zafferano 0,15 g","Sale grosso 1 cucchiaio","Carne macinata di maiale 150 g, per il ragù","Passata di pomodoro 200 g","Piselli 80 g","Cipolla bianca 50 g","Vino rosso 50 g","Olio extravergine d’oliva q.b.","Sale fino q.b.","Pepe nero q.b.","Caciocavallo fresco 50 g, per il ragù","Prosciutto cotto 120 g, per il ripieno bianco","Mozzarella 120 g, per il ripieno bianco","Farina 00 200 g, per la pastella","Acqua 350 g, per la pastella","Sale fino 1 pizzico, per la pastella","Pangrattato 200 g","Olio di semi 3 l, per friggere"],"steps":["Cuoci il riso in acqua salata finché il liquido viene assorbito; verso fine cottura unisci lo zafferano.","Manteca con burro e caciocavallo stagionato, poi stendi su un vassoio e fai raffreddare completamente.","Per il ragù, rosola cipolla e macinato nell’olio, sfuma col vino, aggiungi passata e piselli e cuoci finché il sugo è denso.","Taglia a cubetti mozzarella, prosciutto e caciocavallo fresco.","Con mani inumidite forma cavità in porzioni di riso; farcisci metà con prosciutto e mozzarella e metà con ragù e caciocavallo.","Chiudi bene e modella i pezzi; prepara una pastella fluida con farina, acqua e un pizzico di sale.","Immergi gli arancini nella pastella, ricoprili di pangrattato e friggi pochi pezzi alla volta a 160–170 °C fino a doratura."],"photo":"https://www.giallozafferano.com.br/images/5-515/Arancini-de-arroz_780x520_wm.jpg","source":"https://www.giallozafferano.com.br/receitas/Arancini-de-arroz.html","pdfPage":13,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00076","name":"Arancini di riso al pistacchio","category":"Antipasti e aperitivi","serves":"12 arancini","prep":"Non precisato nella fonte consultata","cook":"Risotto circa 18-20 min; frittura a 170 °C (durata non precisata)","rest":"","ingredients":["Risotto: riso Carnaroli 300 g | scalogno 50 g | olio EVO 30 g | vino bianco 50 g | brodo vegetale 800 g | zafferano 1 bustina | Grana Padano DOP 65 g | sale e pepe q.b. || Ripieno: burro 15 g | farina 00 15 g | latte intero 150 g | noce moscata e sale q.b. | granella di pistacchi 30 g | caciocavallo 55 g || Panatura/frittura: farina 00 130 g | acqua 195 g | pangrattato 150 g | olio di arachide 800 g | sale q.b. || Finitura: farina di pistacchi 10 g"],"steps":["Preparare il brodo e tenerlo caldo. Ammorbidire lo scalogno tritato nell'olio, tostare il riso e sfumare con il vino. | 2. Cuocere il risotto aggiungendo il brodo gradualmente; verso la fine incorporare lo zafferano sciolto in poco brodo e il Grana. Stendere il riso su un vassoio e raffreddarlo completamente. | 3. Per il ripieno, ottenere una besciamella densa con burro, farina e latte caldo, insaporendo con sale e noce moscata; farla raffreddare. | 4. Dividere il caciocavallo in piccoli cubetti. Appiattire circa 75 g di riso per pezzo e inserire al centro besciamella, pistacchi tritati e formaggio. Chiudere con cura formando 12 sfere. | 5. Mescolare farina, acqua e sale per ottenere una pastella fluida e omogenea; passarvi gli arancini e rivestirli di pangrattato. | 6. Friggere pochi pezzi per volta in olio di arachide a circa 170 °C fino a doratura; sgocciolare su carta assorbente. | 7. Terminare con farina di pistacchi e servire caldi."],"photo":"","source":"https://ricette.giallozafferano.it/Arancini-di-riso-al-pistacchio.html","pdfPage":14,"description":"Gli arancini di riso al pistacchio sono una variante del classico street food siciliano con una fragrante panatura dorata e un cuore avvolgente e cremoso!"},{"id":"GZ-00078","name":"Arancini di spaghetti","category":"Antipasti e aperitivi","serves":"20 arancini","prep":"60 min","cook":"60 min","rest":"","ingredients":["Pasta: spaghetti 500 g","burro 35 g","tuorli 3","Grana Padano DOP 250 g","zafferano 1 bustina","olio EVO q.b.","sale q.b.","pepe q.b. Ragù: burro 25 g","manzo macinato 200 g","cipolla bianca 1/2","olio EVO q.b.","pepe q.b.","piselli surgelati 100 g","concentrato di pomodoro 40 g","sale q.b.","scamorza 100 g","vino rosso 100 ml. Pastella: pangrattato 500 g","farina 00 150 g","acqua 360 g","sale 1 pizzico. Frittura: olio di arachidi q.b."],"steps":["Per il ragù, stufare la cipolla nel burro e olio, rosolare la carne, sfumare con il vino e aggiungere il concentrato diluito; cuocere circa venti minuti, poi unire i piselli e far raffreddare.","Lessare gli spaghetti, colorarli con zafferano sciolto in acqua di cottura, scolarli e raffreddarli.","Condirli con burro, Grana, tuorli, sale e pepe; tagliarli grossolanamente e farli rassodare in frigorifero, preferibilmente una notte.","Modellare porzioni di spaghetti a pallina, farcirle con ragù e cubetti di scamorza, quindi chiuderle e raffreddarle ancora dieci minuti.","Mescolare farina, acqua e sale per una pastella; passarvi gli arancini e poi nel pangrattato.","Friggere in olio caldo per circa 5-6 minuti, finché sono dorati, e scolare."],"photo":"https://www.giallozafferano.com.br/images/142-14218/arancini-de-espaguete_1200x800.jpg","source":"https://www.giallozafferano.com.br/receitas/arancini-de-espaguete.html","pdfPage":15,"description":"Gli arancini di spaghetti sono una gustosa alternativa ai classici arancini di riso, preparati con spaghetti e un gustoso ripieno di ragÄ± e scamorza. <http://ricette.giallozafferano.it/Arancini-di-spaghetti.html>"},{"id":"GZ-01802","name":"Asparagi in sfoglia con crudo","category":"Antipasti e aperitivi","serves":"4 persone","prep":"30 min","cook":"25 min","rest":"","ingredients":["Asparagi 800 g","Pasta sfoglia 250 g","Prosciutto crudo 8 fette","Grana Padano DOP a scaglie 30 g","Uova 1."],"steps":["Eliminare le estremità dure degli asparagi e pulire i gambi. Legarli a mazzetto e lessarli in acqua salata per 8–10 minuti, lasciandoli ancora consistenti. Scolare e asciugare.","Stendere la sfoglia e tagliarla in otto strisce larghe circa tre centimetri.","Distribuire le scaglie di Grana sulle fette di prosciutto e avvolgerle attorno agli asparagi.","Arrotolare su ogni porzione una striscia di sfoglia a spirale. Spennellare con l’uovo sbattuto.","Disporre su teglia foderata e cuocere nel forno preriscaldato a 392 °F per circa 15 minuti, finché la sfoglia è dorata. Servire caldi."],"photo":"https://www.giallozafferano.com/images/313-31394/asparagus-in-puff-pastry-with-prosciutto_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/asparagus-in-puff-pastry-with-prosciutto.html","pdfPage":16,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01463","name":"Avocado, uova e salmone","category":"Antipasti e aperitivi","serves":"4 persone","prep":"3 min","cook":"10 min","rest":"","ingredients":["Avocado 2","uova medie 4","salmone affumicato 90 g","erba cipollina 6 steli","lime 1","sale fino q.b.","pepe nero q.b.","pepe rosa in grani q.b.","olio EVO q.b."],"steps":["Grattugiare la scorza del lime, tritare l'erba cipollina e tenere da parte.","Dividere gli avocado a metà, togliere il nocciolo e irrorare la polpa con succo di lime; incidere la polpa con un coltellino.","Disporre una porzione di salmone affumicato su ogni mezzo avocado e insaporire con sale, pepe e scorza di lime.","Scaldare poco olio in padella e cuocere le uova al tegamino per circa 2–3 minuti, mantenendo i tuorli interi.","Adagiare un uovo su ogni mezzo avocado e completare con pepe rosa ed erba cipollina; servire subito."],"photo":"https://www.giallozafferano.com/images/328-32820/avocado-eggs-and-salmon_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/avocado-eggs-and-salmon.html","pdfPage":17,"description":"Una sfiziosa ricetta per il brunch che può diventare anche un originale antipasto, ideale per fare il pieno di gusto ed energie: avocado, uova e salmone!"},{"id":"GZ-01477","name":"Baccalà in pastella","category":"Antipasti e aperitivi","serves":"4 persone","prep":"10 min","cook":"10 min","rest":"15 min per raffreddare farina e ciotola","ingredients":["Baccalà dissalato 1 filetto","Farina 00 fredda 300 g","Birra ghiacciata 300 g","Paprika dolce 1 cucchiaino","Sale fino ½ cucchiaino","Pepe nero q.b.","Per la salsa: maionese 50 g","Ketchup 30 g","Senape 1 cucchiaino","Cetriolini sottaceto 2","Tabasco® q.b."],"steps":["Mettere per 15 minuti in congelatore la ciotola e la farina, così da mantenerle ben fredde.","Preparare la salsa amalgamando maionese, ketchup, cetriolini tritati, senape, un poco del liquido dei cetriolini e Tabasco; conservarla a parte.","Privare il baccalà dissalato della pelle e tagliarlo in cubi di circa 4 cm.","Mescolare farina, sale, pepe e paprika; versare lentamente la birra molto fredda, lavorando con una frusta fino a ottenere una pastella liscia.","Scaldare l'olio per friggere a 180 °C, immergere pochi cubi alla volta nella pastella e friggerli per circa 5-8 minuti, finché dorati.","Scolare su carta assorbente, salare a piacere e servire subito con la salsa preparata."],"photo":"https://www.giallozafferano.it/images/234-23496/Baccala-in-pastella_450x300.jpg","source":"https://ricette.giallozafferano.it/Baccala-in-pastella.html","pdfPage":18,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02318","name":"Barchette di pane ripiene","category":"Antipasti e aperitivi","serves":"8 barchette","prep":"30 min","cook":"15 min (scheda fonte); 25 min (procedimento)","rest":"","ingredients":["Panini multicereali 8","uova 6","ricotta 40 g","Parmigiano Reggiano 20 g","erba cipollina q.b.","sale e pepe q.b.","olio EVO 3 cucchiai","pancetta 70 g","melanzana 140 g","prosciutto cotto 100 g","zucchine 200 g. Per spennellare: uovo 1."],"steps":["Tagliare la parte superiore dei panini e scavare la mollica, lasciando un fondo sufficientemente robusto.","Tagliare zucchina e melanzana a dadini; saltarle in padella con l’olio per circa 10 minuti e lasciarle raffreddare.","Sbattere le sei uova con ricotta, Parmigiano, erba cipollina, ortaggi raffreddati, prosciutto cotto e pancetta a dadini; regolare sale e pepe.","Riempire i panini con il composto senza eccedere con la parte liquida. Spennellare la superficie con l’uovo rimasto.","Cuocere in forno ventilato preriscaldato a circa 175 °C per 25 minuti, finché il ripieno risulta rappreso e dorato. Servire tiepidi o freddi."],"photo":"https://www.giallozafferano.com/images/315-31526/bread-boats-stuffed_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/bread-boats-stuffed.html","pdfPage":19,"description":"Le barchette di pane ripiene sono una ricetta golosa e saporita, ottima come contorno o servita ad un aperitivo"},{"id":"GZ-00085","name":"Bicchierini di riso venere e spada","category":"Antipasti e aperitivi","serves":"10 bicchierini","prep":"15 min","cook":"40 min","rest":"","ingredients":["Riso Venere 200 g","pesce spada 250 g","scorza di limone 1","olio EVO q.b.","pepe nero q.b.","sale fino q.b. Crema: porri 100 g","zenzero fresco 20 g","basilico 15 g","olio EVO 30 g","sale fino q.b. Guarnizione: menta q.b.","olio EVO q.b."],"steps":["Lessare il riso Venere in abbondante acqua salata per circa quaranta minuti.","Tagliare porro e zenzero; farli insaporire in un pentolino con poco olio per alcuni minuti, poi frullare con basilico, 30 g d'olio e sale fino a una crema liscia.","Eliminare la pelle del pesce spada, ridurlo a dadini e saltarlo a fuoco vivo con olio per circa cinque minuti, aggiungendo scorza di limone, sale e pepe.","Scolare il riso e condirlo con poco olio e pepe.","In ciascun bicchierino disporre riso, crema di porro e basilico, dadini di spada e un secondo strato di riso; completare con olio e menta."],"photo":"https://www.giallozafferano.com/images/332-33215/venus-rice-and-swordfish-cups_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/venus-rice-and-swordfish-cups.html","pdfPage":20,"description":"Affondate la forchetta strato dopo strato per andare alla scoperta di un conturbante gioco di sapori, aromi e colori... bicchierini di riso venere e spada!"},{"id":"GZ-00007","name":"Bocconcini di prugne e bacon","category":"Antipasti e aperitivi","serves":"8 bocconcini (circa 4 persone)","prep":"5 min","cook":"25 min","rest":"","ingredients":["Prugne secche denocciolate: 8 | Bacon: 8 fette | Salvia fresca: 8 foglie"],"steps":["Stendere le fette di bacon e collocare una prugna denocciolata a un'estremità di ciascuna. | 2. Arrotolare il bacon intorno alla frutta per formare otto involtini compatti. | 3. Disporli separati su una placca foderata di carta forno e cuocere in forno statico preriscaldato a 180 °C per circa 25 minuti, finché il bacon diventa dorato. | 4. Far riposare brevemente fuori dal forno e guarnire con una foglia di salvia per pezzo."],"photo":"https://www.giallozafferano.es/images/152-15269/bocaditos-de-ciruelas-y-bacon_1200x800.jpg","source":"https://ricette.giallozafferano.it/Bocconcini-di-prugne-e-bacon.html","pdfPage":21,"description":"Arrotolare e infornare: bastano due semplici mosse per portare in tavola un antipasto sfizioso dai sapori contrastanti... bocconcini di prugne e bacon!"},{"id":"GZ-00008","name":"Bocconcini di quinoa","category":"Antipasti e aperitivi","serves":"30 bocconcini","prep":"15 min","cook":"25 min (oltre alla cottura della quinoa)","rest":"","ingredients":["Quinoa: 150 g | Zucchine piccole: 2 | Uovo: 1 | Grana Padano DOP grattugiato: 50 g | Scorza grattugiata: 1 limone | Zenzero fresco grattugiato: quanto basta | Sale e pepe: quanto basta"],"steps":["Sciacquare la quinoa sotto acqua fredda per eliminare il retrogusto amaro. Lessarla in acqua leggermente salata secondo la confezione (indicativamente 15-20 minuti), quindi scolarla e raffreddarla. | 2. Grattugiare le zucchine e unirle in una terrina alla scorza di limone e a poco zenzero fresco. | 3. Aggiungere la quinoa cotta, il Grana e l'uovo. Regolare di sale e pepe e mescolare per ottenere un impasto uniforme. | 4. Distribuire circa 20 g di composto per stampino mini-muffin o pirottino piccolo, pressando leggermente. | 5. Cuocere in forno statico già caldo a 180 °C per circa 25 minuti (oppure ventilato a 160 °C per circa 20 minuti) e servire tiepido."],"photo":"https://www.giallozafferano.it/images/28-2817/Bocconcini-di-quinoa_780x520.jpg","source":"https://ricette.giallozafferano.it/Bocconcini-di-quinoa.html","pdfPage":22,"description":"I bocconcini di quinoa con zucchine, zenzero e parmigiano sono un antipasto sfizioso e veloce da preparare, perfetto da gustare nei mesi estivi"},{"id":"GZ-00009","name":"Bocconcini di sfoglia con formaggio e miele","category":"Antipasti e aperitivi","serves":"20 pezzi","prep":"20 min","cook":"10 min","rest":"","ingredients":["Pasta sfoglia tonda: 230 g | Caprino: 80 g | Miele di castagno: 60 g | Timo: q.b. | Olio extravergine di oliva: q.b. | Sale fino e pepe nero: q.b. | Tuorlo: 1 | Latte intero: 1 cucchiaio"],"steps":["Rendere cremoso il caprino mescolandolo con poco olio, sale e pepe.","Dalla sfoglia ricavare 40 dischetti di 3,5 cm; sistemarne 20 su una teglia con carta forno.","Con un coppapasta da 2,5 cm svuotare gli altri 20 dischetti, ottenendo anelli; bucherellare i fondi.","Sbattere tuorlo e latte, spennellare i fondi e sovrapporre a ciascuno un anello.","Distribuire un cucchiaino di caprino al centro di ogni bocconcino; cuocere a 200 °C in forno statico per 10 minuti.","Lasciar intiepidire; aromatizzare il miele con foglioline di timo e distribuirlo al momento del servizio."],"photo":"https://www.giallozafferano.it/images/206-20639/Bocconcini-di-sfoglia-con-formaggio-e-miele_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Bocconcini-di-sfoglia-con-formaggio-e-miele.html","pdfPage":23,"description":"Un grazioso finger food in perfetto equilibrio fra dolce e salato, ideale per stuzzicare l'appetito... bocconcini di sfoglia con formaggio e miele!"},{"id":"GZ-00010","name":"bruschetta caprese","category":"Antipasti e aperitivi","serves":"4 persone","prep":"10 min","cook":"5 min","rest":"","ingredients":["Pane casereccio 4 fette","mozzarella di bufala 250 g","pomodorini 10","olive nere 12","basilico 8 foglie","aglio 1 spicchio","origano 2 pizzichi","olio EVO e sale q.b."],"steps":["Tagliare quattro fette di pane di circa 2 cm e tostarle su entrambi i lati.","Strofinare le fette ancora calde con uno spicchio d’aglio.","Scolare bene la mozzarella e tagliarla a cubetti; dividere i pomodorini in quarti.","Mescolare mozzarella, pomodori e olive con basilico spezzettato, origano, sale e olio.","Distribuire il condimento sul pane e servire subito con un filo d’olio."],"photo":"","source":"https://ricette.giallozafferano.it/Bruschetta-caprese.html","pdfPage":24,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00011","name":"Bruschetta con fichi e crudo dolce","category":"Antipasti e aperitivi","serves":"4 bruschette","prep":"10 min","cook":"5 min","rest":"","ingredients":["Pane pugliese 200 g (4 fette)","fichi 200 g","prosciutto crudo dolce 100 g (8 fette)","robiola 200 g","erba cipollina 5 fili","miele di acacia 20 g","sale fino q.b.","pepe nero q.b."],"steps":["Affettare il pane in quattro parti uguali e tostarlo su una griglia ben calda da entrambi i lati.","Lavare e tritare l'erba cipollina, unirla alla robiola e insaporire con sale e pepe.","Pulire i fichi, tagliarli a spicchi e spennellarli con il miele; passarli brevemente sulla griglia calda.","Spalmare la crema di robiola sul pane, aggiungere due fette di prosciutto per bruschetta e completare con gli spicchi di fico. Servire subito."],"photo":"https://www.giallozafferano.com/images/359-35904/bruschetta-with-figs-and-sweet-prosciutto_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Bruschetta-con-fichi-e-crudo-dolce.html","pdfPage":25,"description":"La bruschetta con i fichi e il crudo dolce è un ottimo finger food da proporre per aperitivo, come un facile e veloce antipasto in una cena tra amici"},{"id":"GZ-00089","name":"Budini di riso salati","category":"Antipasti e aperitivi","serves":"12 pezzi","prep":"30 min","cook":"1 h 20 min","rest":"frolla 40 min","ingredients":["PASTA BRISÉE: burro freddo 100 g","farina 00 200 g","acqua ghiacciata 70 ml","sale fino q.b. RISOTTO: riso Carnaroli 300 g","piselli 150 g","prosciutto cotto a cubetti 100 g","Taleggio 100 g","brodo vegetale 500 ml","vino bianco 100 ml","burro 50 g","scalogno 1","concentrato di pomodoro triplo 1 cucchiaio","olio EVO e sale q.b."],"steps":["Sabbiare farina e burro freddo, unire il sale e acqua ghiacciata fino a formare un impasto compatto; avvolgerlo e lasciarlo riposare in frigorifero almeno 40 minuti.","Appassire lo scalogno tritato nell'olio, tostare il riso, sfumare con vino bianco e cuocere aggiungendo gradualmente brodo e concentrato di pomodoro sciolto in poco brodo.","A metà cottura unire i piselli. Mantenere il riso molto al dente, quindi mantecare con burro e Taleggio e incorporare il prosciutto cotto; lasciar raffreddare.","Stendere la brisée a circa 3 mm, ritagliare dischi e rivestire uno stampo da muffin imburrato. Riempire con il risotto e cuocere in forno statico a 175 °C per circa 60 minuti."],"photo":"https://www.giallozafferano.com/images/320-32035/savory-rice-pudding_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/savory-rice-pudding.html","pdfPage":26,"description":"I budini di riso sono uno sfizioso antipasto: un guscio croccante di pasta brisè ripieno di risotto al pomodoro arricchito con piselli, prosciutto e taleggio"},{"id":"GZ-00015","name":"Canapè","category":"Antipasti e aperitivi","serves":"30 canapè (10 pane bianco, 20 pane di segale)","prep":"60 min","cook":"5 min","rest":"","ingredients":["Crema gamberi: gamberi 130 g, aglio 1 spicchio, formaggio spalmabile 50 g, olio EVO, basilico facoltativo, sale e pepe q.b. Crema erbe: formaggio spalmabile 60 g, erba cipollina, sale e pepe q.b. Canapè bianchi: pane bianco 90 g, prosciutto cotto 1 fetta, salmone affumicato 40 g, zucchine 8 rondelle, scorza di limone 1, basilico, erba cipollina e pepe q.b. Canapè integrali/segale: pane di segale 150 g, cetriolini 5, gamberi con coda 5, pomodorini 4, salame 2 fette, prosciutto crudo 1 fetta, oliva nera 1, zucchine 10 rondelle, maionese 30 g, basilico q.b."],"steps":["Frullare 60 g di formaggio fresco con erba cipollina e condire; per la seconda crema saltare i gamberi con aglio e olio, poi frullarli con 50 g di formaggio, basilico e pepe.","Tagliare il pane bianco in dieci forme; grigliare brevemente le zucchine e preparare striscioline di salmone e prosciutto.","Assemblare cinque canapè al salmone con crema alle erbe, zucchine e scorza di limone; altri cinque con prosciutto e crema alle erbe.","Ricavare venti basi dal pane di segale. Farcirne cinque con crema di gamberi e gambero intero, cinque con crema di gamberi e zucchine, cinque con crema alle erbe e prosciutto crudo, cinque con maionese e salame.","Decorare con pomodorini, cetriolini, olive e basilico secondo le varianti; mantenere al fresco e servire appena preparati."],"photo":"","source":"https://ricette.giallozafferano.it/Canape.html","pdfPage":27,"description":"I canapè sono deliziose tartine formate da fette di pane o pancarrè, private della crosta, spalmate di burro e farcite con i più svariati ingredienti"},{"id":"GZ-00018","name":"carpaccio di ananas e speck","category":"Antipasti e aperitivi","serves":"4 persone","prep":"20 min","cook":"Non prevista","rest":"","ingredients":["Ananas 1","speck affettato sottile 200 g","origano q.b.","Grana Padano DOP in scaglie 50 g","gelatina d'uva q.b. (accompagnamento)","taralli q.b. (accompagnamento)."],"steps":["Eliminare ciuffo e buccia dell'ananas, poi affettare la polpa molto sottilmente.","Distribuire le fette sui piatti alternandole a quelle di speck.","Ricavare scaglie sottili di Grana Padano e cospargerle sul carpaccio con l'origano.","Servire immediatamente accompagnando con taralli e gelatina d'uva in ciotoline separate."],"photo":"https://www.giallozafferano.com/images/300-30050/pineapple-and-speck-carpaccio_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Carpaccio-di-ananas-e-speck.html","pdfPage":28,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00022","name":"Chupitos di melone con fagottini di feta","category":"Antipasti e aperitivi","serves":"4 chupitos e 16 fagottini","prep":"20 min","cook":"3 min","rest":"","ingredients":["CHUPITOS: Melone 460 g","Olio extravergine d’oliva 10 g","Sale fino q.b.","Pepe nero q.b.\nFAGOTTINI: Pasta fillo 150 g (4 fogli da 48×34 cm)","Feta 100 g","Pomodorini datterini 80 g","Olive nere 25 g","Cipolla rossa di Tropea 60 g","Erba cipollina q.b.","Olio EVO 10 g","Sale q.b.","Olio di semi di arachide per friggere q.b."],"steps":["Pulire il melone, ridurne la polpa a pezzi e frullarla con l’olio e poco sale. Tenere il composto in frigorifero.","Tritare cipolla ed erba cipollina; tagliare pomodorini e feta a piccoli cubetti, affettare le olive. Unire e condire con olio e poco sale.","Sovrapporre due fogli di pasta fillo e ricavare otto strisce larghe circa 6 cm; inumidirle leggermente.","Mettere un poco di ripieno all’estremità di ogni striscia e ripiegarla più volte a triangolo, sigillando con acqua. Ripetere con gli altri fogli fino a 16 fagottini.","Friggere pochi pezzi per volta in olio a 170–180 °C, circa mezzo minuto per lato. Scolare.","Versare il frullato di melone in quattro bicchierini, pepare e accompagnare con i fagottini caldi."],"photo":"https://www.giallozafferano.it/images/158-15810/Chupitos-di-melone-con-fagottini-di-feta_450x300.jpg","source":"https://ricette.giallozafferano.it/Chupitos-di-melone-con-fagottini-di-feta.html","pdfPage":29,"description":"I chupitos di melone con fagottini di feta sono un modo originale di gustare all'ora dell'aperitivo o come antipasto un nuovo classico dell'estate...melone e feta!"},{"id":"GZ-00023","name":"Crocchette cacio e pepe","category":"Antipasti e aperitivi","serves":"20 crocchette","prep":"20 min","cook":"60 min","rest":"","ingredients":["Patate rosse 1 kg","Pecorino Romano stagionato 100 g","pepe nero in grani 2 cucchiaini","pepe bianco 2 cucchiaini","uovo 1. Panatura: uova 3","pangrattato 100 g. Frittura: olio di semi q.b."],"steps":["Lessare le patate con la buccia per circa 40 minuti, poi scolarle e schiacciarle.","Pestare insieme pepe nero e bianco e grattugiare il pecorino.","Quando le patate sono tiepide, impastarle con pecorino, pepe e un uovo.","Con le mani umide formare una ventina di crocchette cilindriche.","Passarle due volte nell'uovo sbattuto e nel pangrattato per una crosta più consistente.","Friggerne poche alla volta in olio a circa 170 °C per circa tre minuti, scolarle e servire calde."],"photo":"https://www.giallozafferano.fr/images/94-9405/croquettes-cacio-e-pepe_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Crocchette-cacio-e-pepe.html","pdfPage":30,"description":"Le crocchette cacio e pepe nascono da due delle ricette più amate della nostra cucina e sono perfette da accompagnare a un bicchiere di bollicine!"},{"id":"GZ-00024","name":"Crocchette di prosciutto","category":"Antipasti e aperitivi","serves":"10 crocchette","prep":"25 min","cook":"25 min","rest":"","ingredients":["Prosciutto crudo affettato 160 g","latte intero 500 g","burro 70 g","farina 00 90 g","sale fino 1 cucchiaino","noce moscata 1 cucchiaino","cipolla gialla 1. Per impanare e friggere: uova 3","pangrattato 100 g","olio di semi di girasole q.b."],"steps":["Tritare la cipolla e farla appassire lentamente nel burro per circa dieci minuti.","Tagliare il prosciutto a striscioline, unirlo alla cipolla e cuocere un minuto.","Aggiungere la farina e tostarla per un paio di minuti, poi versare il latte in tre riprese mescolando con cura. Insaporire con noce moscata e sale.","Proseguire finché la besciamella diventa molto densa; stenderla in una teglia, raffreddarla e metterla in frigorifero per almeno due ore.","Dividere il composto in dieci porzioni, modellarle con le mani umide e impanarle con uovo e pangrattato.","Friggere in olio a 170 °C per circa tre minuti, poche crocchette per volta; scolare e servire."],"photo":"https://www.giallozafferano.com/images/341-34186/ham-croquettes_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Crocchette-di-prosciutto.html","pdfPage":31,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00130","name":"Crocchette di riso al forno","category":"Antipasti e aperitivi","serves":"26 pezzi","prep":"60 min","cook":"50 min","rest":"brodo circa 1 h 30 min","ingredients":["Riso Carnaroli 500 g","scalogno 80 g","olio EVO 30 g","vino bianco 100 g. BRODO: acqua 1 l","carote 100 g","sedano 100 g","cipolle bianche 200 g","pepe nero in grani 10 g. PANATURA: pangrattato 200 g","uova medie 4","sale q.b. RIPIENO: prosciutto cotto 220 g","pisellini 180 g","provola affumicata 150 g."],"steps":["Cuocere un brodo con acqua, sedano, carota, cipolla e pepe per circa 90 minuti, quindi filtrare.","Appassire lo scalogno nell’olio, tostare il riso, sfumare con vino e cuocere aggiungendo brodo caldo; stendere il risotto e raffreddarlo.","Tagliare prosciutto e provola a cubetti e cuocere brevemente i piselli a vapore.","Suddividere il riso freddo in 26 porzioni, schiacciarle, farcirle con prosciutto, piselli e provola e chiuderle a crocchetta.","Passare due volte nelle uova sbattute e nel pangrattato; disporre in teglia con poco olio e cuocere a 200 °C statico per 30–35 minuti, fino a doratura."],"photo":"https://www.giallozafferano.it/images/154-15400/Crocchette-di-riso-al-forno_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Crocchette-di-riso-al-forno.html","pdfPage":32,"description":"Le crocchette di riso al forno sono un'ottima variante alle solite crocchette fritte, ma in egual modo croccanti. Ideali da servire per un aperitivo o come sfizioso spuntino"},{"id":"GZ-00025","name":"Croque monsieur finger food con sfoglia classica","category":"Antipasti e aperitivi","serves":"12 pezzi","prep":"30 min","cook":"25 min","rest":"","ingredients":["Sfoglie croccanti al forno 24","Prosciutto cotto 60 g","Groviera 90 g.\nBESCIAMELLA: Latte intero 250 ml","Burro 25 g","Farina 00 25 g","Sale fino q.b.","Pepe nero q.b.","Noce moscata q.b."],"steps":["Sciogliere il burro, amalgamare la farina e versare gradualmente il latte caldo, mescolando con una frusta. Salare, pepare, profumare con noce moscata e far addensare dolcemente per circa 15 minuti.","Grattugiare il groviera e ridurre il prosciutto in piccoli quadrati.","Condire dodici sfoglie con poca besciamella e formaggio. Sulle altre dodici distribuire besciamella, prosciutto e groviera.","Accoppiare le sfoglie a due a due, con la parte condita rivolta verso l’interno, formando piccoli sandwich.","Sistemare su una teglia rivestita e gratinare a 180 °C o sotto il grill per 1–2 minuti. Servire subito."],"photo":"https://www.giallozafferano.it/images/22-2263/Croque-monsieur-finger-food-con-sfoglia-classica_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Croque-monsieur-finger-food-con-sfoglia-classica.html","pdfPage":33,"description":"Il croque monsieur finger food con sfoglia classica è uno stuzzichino semplice e gustoso ispirato al sandwich francese"},{"id":"GZ-01559","name":"Crostini con baccalà mantecato","category":"Antipasti e aperitivi","serves":"4 persone","prep":"15 min","cook":"25 min","rest":"","ingredients":["BACCALÀ: baccalà dissalato 300 g","olio EVO 100 g","sale e pepe nero q.b. CROSTINI: pane tipo ciabatta o baguette 8 fette","olio EVO q.b. FINITURA: prezzemolo tritato q.b.","scorza di 1 limone."],"steps":["Immergere il baccalà dissalato in acqua fredda, portare a bollore e cuocere per 15-20 minuti, eliminando la schiuma.","Tagliare e tostare le fette di pane con poco olio in forno ventilato a circa 200 °C.","Scolare il pesce, farlo intiepidire, eliminare pelle e spine e spezzettarlo.","Montare il baccalà con frusta o planetaria aggiungendo l'olio a filo; se serve, regolare la cremosità con poca acqua di cottura. Salare e pepare.","Formare quenelle di crema sui crostini e guarnire con prezzemolo e scorza di limone."],"photo":"https://ptps.stbm.it/t/264azk_large.jpg","source":"https://www.giallozafferano.com/recipes/crostini-with-creamed-salt-cod.html","pdfPage":34,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00133","name":"Crostini rustici di polenta","category":"Antipasti e aperitivi","serves":"12 crostini","prep":"40 min","cook":"40 min","rest":"almeno 1 ora per rassodare","ingredients":["Polenta istantanea 250 g","acqua 1 l","olio EVO 1 cucchiaio","sale q.b. Per salsiccia e stracchino: salamella q.b.","stracchino q.b.","olio EVO q.b. Per cavolo e funghi: cavolo nero q.b.","champignon q.b.","toma q.b.","nocciole q.b.","burro q.b.","aglio 2 spicchi","timo q.b.","sale e olio EVO q.b. Per spinaci: spinaci novelli q.b.","Roquefort q.b.","melagrana q.b.","aglio 1 spicchio","sale e olio EVO q.b."],"steps":["Portare a bollore acqua, olio e sale; versare la farina istantanea mescolando con una frusta e cuocere fino a consistenza. 2. Distribuire la polenta in uno stampo da plumcake unto, livellare e far rassodare almeno un’ora. 3. Nel frattempo rosolare le salamelle; saltare cavolo nero con aglio, funghi con burro/aglio/timo e spinaci con aglio. 4. Sformare la polenta, tagliare 12 fette spesse e spennellarle con olio. Grigliare su entrambi i lati. 5. Comporre tre varianti: salamella con stracchino; spinaci con Roquefort e melagrana; funghi con cavolo, toma e nocciole tostate."],"photo":"https://www.giallozafferano.com/images/285-28595/rustic-polenta-crostini_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/rustic-polenta-crostini.html","pdfPage":35,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00026","name":"Crostino vegano","category":"Antipasti e aperitivi","serves":"4 crostini","prep":"20 min","cook":"5 min","rest":"","ingredients":["Pane casereccio 200 g (4 fette)","olio extravergine d'oliva 100 g (per il paté)","tofu 100 g","pistacchi non salati 50 g","basilico 10 g","sale fino q.b.","pomodorini gialli 100 g","olive taggiasche 30 g","carote 80 g","germogli di barbabietola 30 g. Per il pane: origano q.b.","olio EVO q.b. Per guarnire: basilico q.b."],"steps":["Condire il pane con olio e origano e passarlo sotto il grill a 240 °C per circa cinque minuti.","Tagliare il tofu a cubetti, conservandone alcuni per la guarnizione. Frullare il resto con pistacchi, basilico, sale e i 100 g di olio, versato gradualmente, fino a ottenere un paté cremoso.","Ridurre le carote in julienne e dividere i pomodorini gialli a spicchi.","Spalmare il paté sui crostini; distribuire carote, germogli, pomodorini e tofu tenuto da parte.","Completare con olive taggiasche, basilico e poco olio. Servire appena montati."],"photo":"https://www.giallozafferano.com/images/279-27914/Vegan-Crostino_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/antipasto-vegano.html","pdfPage":36,"description":"Il crostino vegano è un antipasto sfizioso con ingredienti insoliti e scenografici che si incontrano in una raffinata girandola di gusto e di colore!"},{"id":"GZ-00028","name":"Fagottini di fiori di zucca","category":"Antipasti e aperitivi","serves":"16 fiori (numero porzioni non esposto)","prep":"40 min","cook":"30 min","rest":"","ingredients":["Fiori di zucca 16","zucchine 3","patate 3","aglio 1 spicchio","origano fresco q.b.","prezzemolo q.b.","olio EVO q.b.","sale fino q.b.","uovo 1","Parmigiano Reggiano 50 g","pangrattato 20 g","provola 50 g."],"steps":["Pulire i fiori eliminando gambo, pistillo e sepali; aprirli in petali. 2. Tagliare a dadini zucchine e patate; far dorare l’aglio nell’olio, unire le verdure, salare e aromatizzare con origano. Cuocere coperto per circa 15 minuti. 3. Eliminare l’aglio, lasciare raffreddare e schiacciare grossolanamente le verdure. 4. Incorporare uovo, Parmigiano, prezzemolo e pangrattato. 5. Formare palline di ripieno attorno a un cubetto di provola; avvolgerle con i petali dei fiori. 6. Adagiare su carta forno, condire con olio e sale e cuocere in forno statico a 200 °C per 15-20 minuti."],"photo":"","source":"https://www.giallozafferano.com/recipes/Zucchini-flower-bundles.html","pdfPage":37,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00030","name":"falafel","category":"Antipasti e aperitivi","serves":"circa 50 pezzi","prep":"30 min","cook":"20 min","rest":"ammollo almeno 12 h; riposo almeno 1 h","ingredients":["Per circa 50 falafel: ceci secchi 500 g","cipolla 1","aglio 1 spicchio","prezzemolo 1 mazzetto","cumino 1 pizzico","sale fino 1 pizzico","pepe nero 1 pizzico. Per friggere: olio di semi di arachide 1 l."],"steps":["Mettere i ceci secchi in ammollo in acqua fredda per almeno 12 ore; scolarli, risciacquarli e asciugarli molto bene.","Frullare i ceci crudi reidratati con cipolla a pezzi, aglio, cumino, sale e pepe fino a ottenere un composto lavorabile.","Tritare il prezzemolo a parte, unirlo al composto, mescolare e compattare in un contenitore; coprire e riposare in frigorifero per almeno un'ora.","Formare circa 50 piccole polpette ben pressate e leggermente appiattite.","Scaldare l'olio a circa 170 °C e friggere pochi falafel per volta finché dorati; scolare e servire subito."],"photo":"https://www.giallozafferano.com/images/276-27604/Chickpea-Falafel_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Chickpea-Falafel.html","pdfPage":38,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01917","name":"Falafel di ceci (Felafel)","category":"Antipasti e aperitivi","serves":"circa 50 pezzi","prep":"30 min","cook":"20 min","rest":"ammollo almeno 12 h; riposo almeno 1 h","ingredients":["Ceci secchi 500 g","cipolla 1","aglio 1 spicchio","prezzemolo 1 mazzetto","cumino 1 pizzico","sale fino 1 pizzico","pepe nero 1 pizzico","PER FRIGGERE: olio di arachide 1 l."],"steps":["Mettere i ceci secchi in ammollo per almeno 12 ore, scolarli e asciugarli con cura.","Frullare i ceci non cotti con cipolla, aglio, cumino, sale e pepe; aggiungere il prezzemolo tritato separatamente e amalgamare.","Compattare il composto in un recipiente, coprire e lasciarlo riposare in frigorifero almeno un'ora.","Formare circa 50 falafel piccoli e leggermente appiattiti; friggerli pochi per volta in olio a 170 °C fino a doratura.","Scolare su carta assorbente e servire caldi."],"photo":"https://www.giallozafferano.com/images/276-27604/Chickpea-Falafel_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Chickpea-Falafel.html","pdfPage":39,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00031","name":"Falafel di fave","category":"Antipasti e aperitivi","serves":"40 falafel","prep":"30 min","cook":"5 min","rest":"","ingredients":["Fave secche 500 g","acqua 35 g","farina 00 20 g","prezzemolo 10 g","cipolla 1","aglio 1 spicchio","sale fino 5 g","cardamomo 2 g","bicarbonato 2 g","cumino 1 g","pepe nero q.b.","olio di arachidi q.b. per friggere."],"steps":["Tenere le fave secche in ammollo per circa dodici ore, quindi scolarle accuratamente.","Frullare le fave con cipolla, aglio e prezzemolo fino a ottenere un composto granuloso e lavorabile.","Incorporare acqua, farina, sale, cardamomo, bicarbonato, cumino e pepe, amalgamando bene.","Modellare circa quaranta piccole polpette con l'apposito stampo o con le mani.","Friggerle in olio di arachidi ben caldo finché sono dorate e croccanti; scolarle e servirle calde."],"photo":"https://www.giallozafferano.de/images/56-5694/falafel-aus-favabohnen_1200x800.jpg","source":"https://ricette.giallozafferano.it/Falafel-di-fave.html","pdfPage":40,"description":"I falafel di fave sono un tipico piatto mediorientale costituito da polpettine di fave speziate fritte in padella"},{"id":"GZ-00032","name":"Falafel di lupini","category":"Antipasti e aperitivi","serves":"16 falafel","prep":"20 min","cook":"10 min","rest":"","ingredients":["Lupini 300 g","pangrattato 80 g","tahina 40 g","uovo 1","semi di sesamo 10 g","cumino in polvere 1/4 cucchiaino","paprika dolce 1/2 cucchiaino","curcuma in polvere 1/2 cucchiaino","prezzemolo q.b.","aneto q.b.","sale fino q.b.","olio di arachidi q.b. per friggere."],"steps":["Frullare i lupini con tahina e spezie fino a ottenere una purea grossolana.","Aggiungere sale, uovo, prezzemolo e aneto tritati; incorporare pangrattato e semi di sesamo.","Lavorare fino a ottenere un impasto uniforme, poi formare circa sedici polpette leggermente schiacciate.","Scaldare l'olio a circa 180 °C e friggere pochi falafel alla volta per circa tre minuti, fino a doratura.","Scolare su carta assorbente e servire caldi."],"photo":"https://www.giallozafferano.com.br/images/301-30131/falafel-de-tremocos_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Falafel-di-lupini.html","pdfPage":41,"description":"Una sfiziosa variante delle famose polpette speziate mediorientali, ideale da accompagnare con una fresca salsa allo yogurt: falafel di lupini!"},{"id":"GZ-00033","name":"Felafel (Falafel)","category":"Antipasti e aperitivi","serves":"50 pezzi","prep":"30 min","cook":"20 min","rest":"almeno 12 h ammollo e 1 h frigo","ingredients":["Ceci secchi 500 g","cipolla piccola 1","aglio 1 spicchio","prezzemolo 1 mazzetto","cumino in polvere 1 pizzico","sale 1 pizzico","pepe nero 1 pizzico. PER FRIGGERE: olio di semi di arachide 1 l."],"steps":["Lasciare i ceci secchi in acqua fredda per almeno 12 ore; scolarli, risciacquarli e asciugarli molto bene, senza cuocerli.","Tritare ceci, cipolla, aglio, cumino, sale e pepe; aggiungere il prezzemolo tritato separatamente.","Compattare l’impasto in un contenitore, coprire e riposare almeno un’ora in frigorifero.","Formare circa 50 polpettine schiacciate, pressandole accuratamente affinché non si sfaldino.","Friggere poche per volta a circa 170 °C finché dorate, quindi scolare e servire calde."],"photo":"https://ricette.giallozafferano.it/images/ricette/1/102/felafel-falafel_1.jpg","source":"https://ricette.giallozafferano.it/Felafel-Falafel.html","pdfPage":42,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00034","name":"Finger food di cetrioli e hummus","category":"Antipasti e aperitivi","serves":"16 pezzi","prep":"15 min","cook":"5 min","rest":"","ingredients":["Cetrioli 165 g","piadine grandi 2","peperoncino fresco 10 g","finocchietto selvatico q.b. Per l'hummus: ceci precotti sgocciolati 100 g","tahina 30 g","succo di limone 10 g","olio extravergine 10 g","sale fino q.b."],"steps":["Con un coppapasta ricavare sedici dischi dalle piadine e tostarli sulla griglia, circa due minuti da un lato e uno dall'altro.","Affettare il cetriolo con la buccia in rondelle spesse circa un centimetro.","Frullare ceci, tahina, succo di limone, olio e sale fino a ottenere una crema liscia.","Privare il peperoncino dei semi e tritarlo finemente.","Disporre su ogni disco di piadina una rondella di cetriolo, un cucchiaino di hummus, poco peperoncino e un ciuffetto di finocchietto. Servire subito."],"photo":"https://www.giallozafferano.com/images/335-33588/cucumber-and-hummus-finger-food_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Finger-food-di-cetrioli-e-hummus.html","pdfPage":43,"description":"Giusto il tempo di assemblare gli ingredienti e in pochi minuti avrete pronto un appetizer degno dei migliori cocktail bar... finger food di cetrioli e hummus!"},{"id":"GZ-00037","name":"Involtini di pancarrè prosciutto e formaggio","category":"Antipasti e aperitivi","serves":"8 involtini","prep":"10 min","cook":"10 min","rest":"1 ora in frigorifero","ingredients":["Pancarrè senza crosta 8 fette","Prosciutto cotto 8 fette","Emmentaler 90 g","Latte intero 150 g","Pangrattato 100 g","Uova 1","Pepe nero q.b.","Olio extravergine d’oliva q.b."],"steps":["Appiattire le fette di pancarrè con il mattarello e tagliare l’Emmentaler a fettine più piccole del pane.","Farcire ogni fetta con prosciutto e formaggio; arrotolare strettamente aiutandosi con pellicola, sigillare le estremità e raffreddare per un’ora.","Sbattere l’uovo con il latte e il pepe. Togliere la pellicola, bagnare gli involtini nella miscela e passarli nel pangrattato.","Scaldare poco olio in padella e dorare i rotolini su tutti i lati per circa dieci minuti.","Scolare l’eventuale grasso su carta assorbente e portare in tavola caldi."],"photo":"https://www.giallozafferano.it/images/240-24081/Involtini-di-pancarre-prosciutto-e-formaggio_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Involtini-di-pancarre-prosciutto-e-formaggio.html","pdfPage":44,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00044","name":"Involtini di verza ripieni di verdura","category":"Antipasti e aperitivi","serves":"18 pezzi","prep":"30 min","cook":"25 min","rest":"","ingredients":["Verza 900 g","Porri 100 g","Zucchine 200 g","Carote 150 g","Zucca mantovana 250 g","Noci sgusciate 80 g","Pancetta affumicata 100 g","Olio EVO 30 g","Sale fino q.b.","Pepe nero q.b.\nPER LEGARE: Porri q.b."],"steps":["Lavare le verdure e tagliare carote, zucchine e zucca in dadini piccoli. Affettare il porro.","Rosolare porro, carote e zucca con olio per quattro minuti; aggiungere le zucchine e proseguire per altri 4–5 minuti. Condire.","Dorare separatamente una parte della pancetta, tritarla e dividere le verdure in due ciotole: aggiungere noci a entrambe e pancetta a una sola.","Sbollentare nove foglie di verza per cinque minuti, raffreddarle, eliminare la costa dura e dividerle a metà.","Farcire le mezze foglie e chiuderle a pacchetto. Avvolgere quelle con pancetta in una fetta della stessa; legare quelle vegetariane con strisce di porro sbollentate.","Rosolare brevemente gli involtini in padella con poco olio, circa un minuto per lato, e servire caldi."],"photo":"https://www.giallozafferano.it/images/152-15269/Involtini-di-verza-ripieni-di-verdura_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Involtini-di-verza-ripieni-di-verdura.html","pdfPage":45,"description":"Gli involtini di verza ripieni di verdura sono un antipasto o un secondo piatto molto sfizioso; bocconcini di verdure miste e pancetta affumicata"},{"id":"GZ-00047","name":"Mini quiche ai funghi, porri e prosciutto","category":"Antipasti e aperitivi","serves":"12 mini quiche","prep":"30 min","cook":"20 min","rest":"","ingredients":["Funghi champignon 250 g","Porro 1","Prosciutto cotto 130 g","Pasta sfoglia 460 g (2 confezioni)","Uova 4","Grana Padano DOP 70 g, da grattugiare","Panna fresca liquida 200 ml","Aglio 1 spicchio","Olio extravergine d’oliva 4 cucchiai","Sale fino q.b.","Pepe nero q.b."],"steps":["Pulisci gli champignon e tagliali a pezzetti; rosolali con aglio e parte dell’olio, poi regola sale e pepe.","Affetta sottilmente il porro e cuocilo in un’altra padella con olio per circa 15–20 minuti.","Sbatti le uova con la panna, incorpora il Grana grattugiato e aggiusta il condimento.","Rivesti stampini da circa 8 cm con dischi di pasta sfoglia leggermente più grandi dello stampo.","Distribuisci funghi, porro e prosciutto a dadini; versa sopra il composto di uova e panna.","Cuoci in forno ventilato a 180 °C per circa 20 minuti, finché le quiche risultano dorate. Servi calde."],"photo":"https://www.giallozafferano.es/images/204-20417/mini-quiche-de-champinones-puerros-y-jamon_1200x800.jpg","source":"https://www.giallozafferano.es/recetas/mini-quiche-de-champinones-puerros-y-jamon.html","pdfPage":46,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-04536","name":"Olive nere al forno","category":"Antipasti e aperitivi","serves":"4 persone","prep":"10 min","cook":"40 min","rest":"","ingredients":["Olive nere mature 500 g","origano essiccato 2 cucchiai","aglio 2 spicchi","olio EVO q.b.","sale fino q.b."],"steps":["Scegliere olive nere ben mature, lavarle accuratamente e immergerle in acqua bollente per circa 5 minuti.","Scolare e asciugare bene le olive su un canovaccio pulito.","Condire con poco olio, origano, aglio tritato e sale, mescolando per distribuire gli aromi.","Allargare su una teglia rivestita di carta forno e cuocere a 160 °C in forno statico già caldo per circa 35–40 minuti.","Lasciare raffreddare completamente; prima del servizio aggiungere un filo di olio per ammorbidire la superficie."],"photo":"","source":"https://ricette.giallozafferano.it/Olive-nere-al-forno.html","pdfPage":47,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00051","name":"quiche alla zucca e bieta","category":"Antipasti e aperitivi","serves":"6 persone","prep":"20 min","cook":"1 h 20 min","rest":"","ingredients":["Brisée: farina 00 200 g","burro freddo 170 g","acqua fredda 70 g","sale 1 pizzico","timo 1 rametto. Ripieno: zucca 1 kg","bieta 700 g","uova medie 3","panna fresca 100 g","Grana Padano DOP 70 g","olio extravergine 40 g","sale q.b.","pepe q.b.","rosmarino 1 rametto","aglio 2 spicchi."],"steps":["Impastare farina, burro freddo, acqua, sale e timo fino a una brisée omogenea. Avvolgerla e lasciarla riposare in frigorifero per almeno quaranta minuti.","Tagliare la zucca a cubetti e stufarla coperta con uno spicchio d'aglio, rosmarino e metà dell'olio per circa venti minuti; togliere l'aglio.","Appassire la bieta con l'altro spicchio d'aglio e il resto dell'olio per 5-6 minuti, quindi strizzarla bene.","Sbattere uova, panna, Grana Padano, sale e pepe.","Stendere la brisée a circa 2 mm e foderare uno stampo da 24 cm. Distribuire bieta e zucca, quindi versare la miscela di uova.","Cuocere in forno statico a 170 °C per circa un'ora e lasciare assestare prima di servire."],"photo":"https://www.giallozafferano.com.br/images/219-21909/quiche-de-abobora-e-acelga_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Quiche-alla-zucca-e-bieta.html","pdfPage":48,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00052","name":"quiche con pere, salvia e fontina","category":"Antipasti e aperitivi","serves":"6 persone","prep":"30 min","cook":"50 min","rest":"30 min impasto","ingredients":["Brisée alla salvia: farina 00 200 g","burro freddo 100 g","acqua fredda 30 g","tuorlo 1","salvia 8 foglie","sale 1 pizzico. Ripieno: pere Kaiser 500 g (peso da pulire)","fontina 250 g","latte intero 100 g","panna fresca 100 g","uovo 1","tuorlo 1","burro 30 g","sale e pepe q.b."],"steps":["Impastare rapidamente farina, burro freddo a cubetti, salvia tritata, tuorlo, acqua fredda e sale. Avvolgere e far riposare in frigorifero 30 minuti. 2. Sbucciare e tagliare le pere a spicchi; saltarle per pochi minuti nel burro e lasciarle intiepidire. 3. Sbattere uovo, tuorlo, latte e panna con sale e pepe; affettare la fontina. 4. Stendere la brisée e rivestire uno stampo da crostata, rifilare e bucherellare il fondo. 5. Disporre pere e fontina, versare il composto di uova e panna. 6. Cuocere in forno statico preriscaldato a 180 °C per 40-45 minuti; lasciare assestare prima di servire."],"photo":"","source":"https://www.giallozafferano.com/recipes/pear-sage-and-fontina-quiche.html","pdfPage":49,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00054","name":"Quiche svuotafrigo","category":"Antipasti e aperitivi","serves":"4 persone","prep":"20 min","cook":"60 min","rest":"","ingredients":["Pasta brisée rotonda 1 rotolo","peperoni 100 g","zucchine 100 g","carote 100 g","scamorza bianca 150 g","prosciutto cotto a cubetti 200 g","Parmigiano Reggiano DOP 100 g","panna fresca 200 g","uova medie 3","sale fino q.b.","pepe nero q.b.","noce moscata q.b.","olio EVO q.b.","erba cipollina q.b. Per spennellare: panna fresca q.b."],"steps":["Mondare e tagliare carote, peperoni e zucchine a cubetti di circa un centimetro.","Saltare le verdure in padella con olio, sale e pepe per circa otto minuti e lasciarle raffreddare.","Sbattere uova e panna, aggiungere Parmigiano grattugiato e noce moscata; unire prosciutto, scamorza a cubetti, verdure ed erba cipollina.","Foderare con la brisée uno stampo da 24 cm, bucherellare il fondo e versare il ripieno.","Ripiegare i bordi e spennellarli con panna. Cuocere a 180 °C nella parte bassa del forno per circa quaranta minuti, poi altri dieci minuti in ventilato."],"photo":"https://www.giallozafferano.com.br/images/49-4951/quiche-esvazia-geladeira_1200x800.jpg","source":"https://ricette.giallozafferano.it/Quiche-svuotafrigo.html","pdfPage":50,"description":"La quiche svuota frigo è una torta salata che si prepara con gli avanzi del frigorifero: formaggio, prosciutto uova e verdure diventano un ripieno gustoso all’interno di un guscio di pasta briseè"},{"id":"GZ-02200","name":"Rotolini di zucchine con crudo e robiola","category":"Antipasti e aperitivi","serves":"12 involtini","prep":"10 min","cook":"10 min","rest":"","ingredients":["Zucchine 2","robiola 100 g","prosciutto crudo 120 g","erba cipollina q.b.","pepe nero q.b.","sale fino q.b."],"steps":["Lavare le zucchine e ricavarne 12 fette sottili, spesse circa 2-3 mm.","Grigliarle per circa 5 minuti per lato e lasciarle intiepidire.","Lavorare la robiola con sale, pepe ed erba cipollina tritata.","Spalmare il formaggio sulle fette di zucchina, aggiungere prosciutto crudo e arrotolare formando dodici involtini. Servire."],"photo":"https://www.giallozafferano.com/images/329-32975/zucchini-rolls-with-prosciutto-and-robiola_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/zucchini-rolls-with-prosciutto-and-robiola.html","pdfPage":51,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00059","name":"Spiedini di melone, feta e rucola","category":"Antipasti e aperitivi","serves":"12 spiedini (4 persone)","prep":"15 min","cook":"Non prevista","rest":"","ingredients":["Melone cantalupo: 1 da circa 1,2 kg | Feta: 300 g | Rucola: 15 g"],"steps":["Tagliare il melone a metà, eliminare i semi e ricavare palline con uno scavino.","Tagliare la feta in cubetti di circa 2 cm; lavare e asciugare la rucola.","Comporre 12 spiedini alternando palline di melone, foglie di rucola ripiegate e cubetti di feta, fino a tre porzioni di melone e feta per stecchino.","Disporre sul piatto da portata e servire freschi."],"photo":"https://www.giallozafferano.it/images/8-849/Spiedini-di-melone-feta-e-rucola_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Spiedini-di-melone-feta-e-rucola.html","pdfPage":52,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00062","name":"supplì cacio e pepe","category":"Antipasti e aperitivi","serves":"circa 10 supplì","prep":"30 min","cook":"10 min","rest":"","ingredients":["Tonnarelli 500 g","Pecorino Romano 100 g","Parmigiano Reggiano DOP 100 g","pepe nero q.b. Pastella e panatura: farina 00 200 g","acqua 300 g","pangrattato rustico 150 g","sale fino q.b. Frittura: olio di girasole 1 l."],"steps":["Mescolare farina, acqua e sale per preparare una pastella liscia; tenere da parte.","Cuocere i tonnarelli al dente; mescolare i formaggi grattugiati con un mestolo di acqua della pasta e abbondante pepe.","Condire i tonnarelli con la crema di formaggi, stenderli in una teglia, coprirli a contatto e farli rassodare in frigorifero per almeno due ore.","Con le mani bagnate prelevare porzioni di pasta e modellarle in cilindri.","Immergere nella pastella e rivestire con il pangrattato.","Friggere pochi pezzi alla volta in olio a circa 160 °C per circa quattro minuti; scolare e servire caldi."],"photo":"https://www.giallozafferano.es/images/151-15152/suppli-cacio-e-pepe_780x520_wm.jpg","source":"https://www.giallozafferano.es/recetas/suppli-cacio-e-pepe.html","pdfPage":53,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00063","name":"Supplì mozzarella e pomodoro","category":"Antipasti e aperitivi","serves":"10 supplì","prep":"40 min","cook":"45 min","rest":"2 h in frigorifero","ingredients":["Riso Carnaroli 320 g","Cipolla ramata ½","Passata di pomodoro 250 g","Brodo vegetale già salato 1 l","Mozzarella per pizza 150 g","Grana Padano DOP grattugiato 30 g","Olio extravergine d’oliva q.b.","Sale fino q.b.","Pepe nero q.b.","Uova 3, per impanare","Pangrattato 300 g","Olio di mais q.b., per friggere"],"steps":["Trita la cipolla e rosolala con un filo d’olio; unisci il riso e tostalo per qualche minuto.","Versa il brodo vegetale caldo poco alla volta e incorpora la passata di pomodoro; cuoci fino a ottenere un riso asciutto.","Spegni, manteca con Grana, aggiungi pepe e regola il sale solo se necessario.","Stendi il riso su un vassoio, fai raffreddare e lascia compattare in frigorifero per circa 2 ore.","Taglia la mozzarella a cubetti; con le mani inumidite forma dieci supplì allungati con la mozzarella al centro.","Passa ogni supplì nell’uovo sbattuto e nel pangrattato; ripeti la doppia panatura.","Friggi pochi pezzi alla volta in olio a 165–170 °C fino a doratura uniforme. Scola e servi caldi."],"photo":"https://www.giallozafferano.com.br/images/17-1749/suppli-mozzarella-e-tomate_780x520_wm.jpg","source":"https://www.giallozafferano.com.br/receitas/suppli-mozzarella-e-tomate.html","pdfPage":54,"description":"Una variante semplice e appetitosa della tradizionale ricetta \"al telefono\", amata da tutti per il suo effetto super filante: supplì mozzarella e pomodoro!"},{"id":"GZ-00064","name":"Tartare di carne su bruschetta","category":"Antipasti e aperitivi","serves":"12 pezzi","prep":"15 min","cook":"8 min","rest":"","ingredients":["Tartare: filetto di manzo freschissimo 120 g","olio extravergine 20 g","sale q.b.","erba cipollina q.b.","pepe nero q.b. Salsa: senape di Digione 50 g","miele di acacia 20 g","succo di limone 20 g","Tabasco q.b. Base: baguette 60 g","olio EVO q.b.","origano q.b."],"steps":["Tagliare la baguette a fette oblique sottili; modellarle delicatamente a barchetta e condirle con olio e origano.","Tostare in forno ventilato a circa 190 °C fino a doratura (la fonte indica circa dieci minuti) e lasciare raffreddare.","Rifilare il filetto molto fresco, tagliarlo prima a strisce e poi a cubetti, infine batterlo finemente al coltello.","Condire la carne con olio, sale, pepe ed erba cipollina tritata.","Emulsionare senape, miele, succo di limone e poche gocce di Tabasco.","Riempire le bruschette con la tartare, completare con qualche goccia di salsa e servire immediatamente."],"photo":"https://www.giallozafferano.com/images/279-27916/Beef-Tartare-on-Bruschetta_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Tartare-di-carne-su-bruschetta.html","pdfPage":55,"description":"La tartare di carne su bruschetta è un antipasto raffinato e originale, insaporito da una delicata salsa alla senape, che delizierà anche i palati più esigenti!"},{"id":"GZ-00067","name":"Tris di tartine","category":"Antipasti e aperitivi","serves":"40 tartine","prep":"30 min","cook":"nessuna","rest":"","ingredients":["Pane bianco 10 fette","ricotta vaccina 140 g","stracchino 60 g","scorza di limone 1","olio EVO, sale e pepe q.b. Variante salmone: salmone affumicato 70 g, erba cipollina e pepe rosa q.b. Variante mortadella: mortadella 50 g, granella di pistacchio 10 g. Variante vegetariana: pomodori secchi sott’olio 2, mandorle a lamelle 10 g, timo e pepe q.b."],"steps":["Eliminare i bordi del pane e ricavare quattro quadratini da ciascuna delle dieci fette.","Frullare ricotta e stracchino con scorza di limone, sale, pepe e un filo d’olio; dividere la crema in tre parti.","Per la versione al salmone spalmare la crema base e aggiungere salmone, erba cipollina e pepe rosa.","Per quella alla mortadella incorporare granella di pistacchio in una porzione di crema, distribuire sul pane e completare con mortadella.","Per la versione vegetariana unire timo e mandorle alla terza crema, poi aggiungere pomodori secchi ben scolati e un poco di pepe."],"photo":"","source":"https://ricette.giallozafferano.it/Tris-di-tartine.html","pdfPage":56,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00068","name":"Vol-au-vent fantasia","category":"Antipasti e aperitivi","serves":"12 vol-au-vent","prep":"30 min","cook":"15 min","rest":"","ingredients":["Gusci: pasta sfoglia rettangolare 3 rotoli, uovo 1. Gamberi (4 pezzi): gamberetti 50 g, maionese 30 g, ketchup 50 g, erba cipollina q.b. Rucola (4 pezzi): robiola 50 g, rucola 10 g, olio EVO 2 cucchiai. Prosciutto (4 pezzi): prosciutto cotto 170 g, ricotta vaccina 150 g, granella di pistacchi q.b."],"steps":["Ricavare dalla pasta sfoglia dodici dischi interi da 6 cm e ventiquattro anelli, ottenuti forando altrettanti dischi con un coppapasta da 4 cm.","Montare ogni guscio con un disco pieno e due anelli, spennellando gli strati con uovo sbattuto.","Cuocere a 200 °C in forno statico per circa 15 minuti e lasciare raffreddare su una griglia; schiacciare leggermente il centro per creare l’incavo.","Frullare robiola, rucola e olio per il primo ripieno. Saltare i gamberi, farli intiepidire e mescolarli con maionese, ketchup ed erba cipollina per il secondo.","Frullare ricotta e prosciutto per il terzo ripieno. Riempire quattro gusci per variante e servire subito."],"photo":"","source":"https://ricette.giallozafferano.it/Vol-au-vent-fantasia.html","pdfPage":57,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03805","name":"Bellini cocktail","category":"Bevande e cocktail","serves":"1 flûte","prep":"10 min","cook":"0","rest":"","ingredients":["Prosecco brut 10 cl | Purea di pesca bianca 5 cl | Ghiaccio q.b. per raffreddare il bicchiere"],"steps":["Raffreddare una flûte con ghiaccio e poi eliminarlo. | 2. Versare 5 cl di purea di pesca bianca nel bicchiere e aggiungere circa metà del prosecco. | 3. Amalgamare delicatamente con un cucchiaio da bar, con un movimento verticale. | 4. Completare con il prosecco rimasto, senza mescolare ulteriormente, e servire subito."],"photo":"","source":"https://ricette.giallozafferano.it/Bellini-cocktail.html","pdfPage":58,"description":"Il Bellini cocktail ideato da Giuseppe Cipriani, è un long drink a base prosecco e purea di pesche da servire nella flûte. Scopri come si prepara!"},{"id":"GZ-00983","name":"Bloody Mary gazpacho","category":"Bevande e cocktail","serves":"4 bicchieri","prep":"30 min","cook":"0","rest":"circa 1 ora di marinatura","ingredients":["Pomodorini datterini 500 g | Peperone rosso già mondato 120 g | Vodka 120 g | Succo di limone: dose indicata come “2” nella fonte (unità non esplicitata) | Olio extravergine 70 g | Tabasco 1 cucchiaino | Sale e pepe q.b. | Decorazione: 2 datterini rossi, 2 pomodorini gialli, 4 ciuffi di sedano, pepe"],"steps":["Tagliare pomodorini e peperone pulito, quindi condire con limone, olio, Tabasco, sale e pepe. | 2. Lasciare insaporire il composto coperto in frigorifero per circa un’ora. | 3. Frullare fino a ottenere una crema e passarla al colino per renderla più omogenea. | 4. Distribuire nei quattro bicchieri con ghiaccio, versare 30 g di vodka in ciascuno e mescolare. | 5. Guarnire con sedano e pomodorini bicolore; completare con pepe macinato."],"photo":"","source":"https://ricette.giallozafferano.it/Bloody-Mary-gazpacho.html","pdfPage":59,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03806","name":"Bombardino al limoncello","category":"Bevande e cocktail","serves":"4 bicchieri","prep":"30 min","cook":"5 min","rest":"","ingredients":["Tuorli 90 g (circa 5 uova medie)","zucchero 25 g","Moscato 35 g","limoncello 40 g. Decorazione: scorza di limone 1","panna fresca liquida 300 g."],"steps":["Lavare il limone, ricavare striscioline di scorza e immergerle in acqua e ghiaccio; grattugiare il resto della scorza nella panna.","Montare la panna aromatizzata e conservarla in frigorifero in una sac à poche.","Scaldare a fuoco basso Moscato, limoncello e metà zucchero fino a dissoluzione.","In una ciotola posta a bagnomaria, montare i tuorli con lo zucchero rimanente; versare poco alla volta lo sciroppo caldo, continuando a lavorare fino a ottenere uno zabaione spumoso a circa 82 °C.","Suddividere lo zabaione caldo nei quattro bicchieri, completare con la panna montata distribuendola prima lungo il bordo, quindi guarnire con le scorze. Servire subito."],"photo":"https://www.giallozafferano.com/images/333-33395/bombardino-al-limoncello_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/bombardino-al-limoncello.html","pdfPage":60,"description":"Il famoso drink alcolico a base di zabaione e chantilly si veste a nuovo e si arricchisce di un tocco di calore del sud... bombardino al limoncello!"},{"id":"GZ-03808","name":"cioccolata calda","category":"Bevande e cocktail","serves":"2 tazze","prep":"10 min","cook":"5 min","rest":"","ingredients":["Latte intero 500 g","Cioccolato fondente 60–69% 120 g","Cacao amaro in polvere 20 g","Amido di mais 20 g","Zucchero 20 g"],"steps":["Trita finemente il cioccolato fondente e fallo sciogliere a bagnomaria, mescolando.","Versa il latte in un pentolino; incorpora con una frusta l’amido di mais e il cacao setacciati.","Scalda continuando a mescolare e aggiungi lo zucchero.","Quando la miscela arriva a bollore, unisci il cioccolato fuso e amalgama fino alla densità desiderata.","Distribuisci immediatamente nelle tazze e servi calda."],"photo":"https://www.giallozafferano.com/images/238-23829/Hot-chocolate_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Hot-chocolate.html","pdfPage":61,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03809","name":"Cioccolata calda al caffè","category":"Bevande e cocktail","serves":"2 persone","prep":"5 min","cook":"10 min","rest":"","ingredients":["Latte intero 400 g","Cioccolato fondente 120 g","Caffè da moka 30 g","Cacao amaro in polvere 20 g","Amido di mais 20 g","Zucchero 20 g","Brandy 10 g","Panna fresca liquida 80 g, per decorare"],"steps":["Prepara il caffè con la moka e trita il cioccolato fondente.","Riunisci latte, amido di mais, cacao e zucchero in un pentolino, mescolando con una frusta.","Scalda a fuoco medio fino al bollore, continuando a girare per circa 4–5 minuti.","Unisci il cioccolato tritato e mescola finché si scioglie completamente.","Togli dal fuoco e incorpora il caffè e il brandy.","Monta la panna, versa la cioccolata nelle tazze e completa con un ciuffo di panna."],"photo":"https://www.giallozafferano.com/images/334-33443/coffee-hot-chocolate_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/coffee-hot-chocolate.html","pdfPage":62,"description":"Un peccato di gola denso e avvolgente, perfetto da condividere in due o per consolare i cuori solitari... cioccolata calda al caffè!"},{"id":"GZ-03810","name":"Cioccolata calda bianca","category":"Bevande e cocktail","serves":"4 tazze","prep":"10 min","cook":"10 min","rest":"","ingredients":["Latte intero 800 g","cioccolato bianco 75 g","zucchero 25 g","amido di mais 35 g"],"steps":["Grattugiare finemente il cioccolato bianco e miscelarlo con zucchero e amido di mais.","Per la versione sul fornello scaldare il latte a fiamma dolce, poi versare gradualmente il preparato mescolando con una frusta.","Proseguire a fuoco basso per circa 5 minuti, finché la bevanda diventa vellutata e densa.","Distribuire nelle quattro tazze e servire subito.","Alternativa al microonde: suddividere il preparato secco in quattro tazze, aggiungere 200 g di latte tiepido ciascuna e scaldare circa 2 minuti a 900 W, mescolando ogni 40 secondi."],"photo":"","source":"https://www.giallozafferano.com.br/receitas/chocolate-quente-branco.html","pdfPage":63,"description":"Oggi vi proponiamo una ricetta pensata per gli inguaribil
