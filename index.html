Cuocere in forno statico a 150 °C per circa 4 ore; aprire, amalgamare delicatamente i succhi e servire caldo."],"photo":"","source":"https://ricette.giallozafferano.it/Agnello-kleftiko.html","pdfPage":292,"description":"L’agnello kleftiko è una ricetta greca dalle origini molto antiche: la lenta cottura nel cartoccio insieme a patate, pomodori, cipolle e feta rende la carne incredibilmente tenera e succosa!"},{"id":"GZ-01118","name":"Ali di pollo e patate saporite","category":"Secondi di carne","serves":"4 porzioni","prep":"20 min","cook":"50 min","rest":"","ingredients":["Alette di pollo 8","patate 500 g.\nPANATURA: pangrattato 200 g","farina 00 50 g","Parmigiano Reggiano 50 g","uova 2","prezzemolo tritato q.b.","olio EVO e sale fino q.b."],"steps":["Passare le alette nella farina e scuotere l'eccesso.","Mescolare pangrattato, Parmigiano grattugiato e prezzemolo; sbattere le uova a parte.","Passare le alette prima nell'uovo e poi nella miscela di pangrattato, premendo perché aderisca.","Pelare le patate, tagliarle a cubetti, condirle con olio e sale e mescolarle con la panatura avanzata.","Sistemare alette e patate in teglia, irrorare con olio e cuocere in forno ventilato a 200 °C per 40 minuti; terminare con 10 minuti di grill. Servire ben cotto e caldo."],"photo":"","source":"https://www.giallozafferano.com/recipes/tasty-chicken-wings-with-potatoes.html","pdfPage":293,"description":"Le ali di pollo e patate saporite sono cotte al forno per ottenere un risultato morbido e succulento, reso ancora più buono da una speciale panatura!"},{"id":"GZ-01119","name":"Ali di pollo fritte","category":"Secondi di carne","serves":"4 persone","prep":"30 min","cook":"20 min","rest":"30 min marinatura","ingredients":["Alette di pollo 1 kg. MARINATURA: paprika dolce 2 cucchiaini","succo di limone 1 (unità non indicata nella fonte)","sale e pepe q.b. PASTELLA: uova 2","farina 00 4 cucchiai","sale e pepe q.b. PANATURA: panko 150 g","pangrattato 150 g. FRITTURA: olio di arachide 1 l. SALSA: yogurt bianco 160 g","senape 2 cucchiai","succo di limone 2 cucchiai","miele 1 cucchiaio","erba cipollina, sale e pepe q.b."],"steps":["Eliminare le punte e le piume residue dalle alette, pulirle e asciugarle accuratamente. Condire con limone, paprika, sale e pepe; marinare in frigo 30 minuti.","Mescolare uova e farina con sale e pepe per ottenere una pastella; in un altro recipiente unire panko e pangrattato.","Passare le alette nella pastella e poi nelle briciole, ricoprendole in modo uniforme.","Preparare la salsa amalgamando yogurt, senape, miele, limone, erba cipollina, sale e pepe.","Friggere poche alette per volta nell’olio a 180 °C fino a completa doratura e cottura; scolare e servire con la salsa."],"photo":"https://ptps.stbm.it/t/z4424k_large.jpg","source":"https://ricette.giallozafferano.it/Ali-di-pollo-fritte.html","pdfPage":294,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01120","name":"Anatra all'arancia","category":"Secondi di carne","serves":"4 persone","prep":"30 min","cook":"1 h 45 min","rest":"","ingredients":["ANATRA: Anatra intera pulita 2 kg","Arance 5 fette","Succo d’arancia 50 g","Liquore all’arancia 100 g","Vino bianco 100 g","Acqua 100 g","Timo q.b.","Rosmarino 1 rametto","Burro 40 g","Olio EVO 20 g","Sale q.b.","Pepe q.b.\nSALSA: Succo d’arancia 150 g","Scorza d’arancia 2","Amido di mais 10 g.\nPATATE: Patate 800 g","Aglio 3 spicchi","Rosmarino q.b.","Olio EVO 30 g","Sale q.b.","Pepe q.b."],"steps":["Pulire l’anatra da eventuali residui di piume. Farcirla con timo, rosmarino e cinque fette d’arancia, salare e pepare, quindi legarla con spago.","Rosolare la superficie in casseruola con burro e olio; sfumare con vino bianco e liquore all’arancia. Unire 50 g di succo e acqua.","Coprire e cuocere in forno statico a 392 °F per 90 minuti, bagnando con il fondo ogni venti minuti.","Nel frattempo condire patate a spicchi con aglio, rosmarino, olio, sale e pepe; cuocere in forno circa 30 minuti.","Filtrare il fondo dell’anatra. Sbollentare le scorze d’arancia e tagliarle a filetti.","Amalgamare succo d’arancia e amido, unire al fondo caldo e far addensare. Aggiungere le scorze e servire la salsa sull’anatra con le patate."],"photo":"https://www.giallozafferano.com/images/287-28776/duck-with-orange_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/duck-with-orange.html","pdfPage":295,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01123","name":"Arrosto al latte","category":"Secondi di carne","serves":"4 persone","prep":"20 min","cook":"1 h 20 min","rest":"","ingredients":["Noce di vitello 1 kg","latte intero 1 l","vino bianco secco 100 ml","burro 70 g","carota 1","cipolla 1","sedano 1 costa","alloro 2 foglie","aglio 2 spicchi","farina 00 1 cucchiaio","sale e pepe q.b."],"steps":["Rifilare e legare il pezzo di vitello; tritare sedano, carota e cipolla.","Rosolare l'arrosto su tutti i lati in parte del burro e metterlo da parte; nel fondo rimasto ammorbidire il trito di verdure con il burro restante, aglio e alloro.","Rimettere la carne in casseruola, sfumare con vino bianco e versare il latte già caldo; salare, pepare e cuocere coperto per circa cinquanta minuti, verificando la cottura.","Eliminare aglio e alloro, frullare il fondo e addensarlo con la farina stemperata in acqua fredda; affettare l'arrosto e servire con la salsa calda."],"photo":"https://www.giallozafferano.com/images/287-28779/roast-with-milk_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/roast-with-milk.html","pdfPage":296,"description":"L'arrosto al latte è un secondo piatto di carne ricco dal gusto unico grazie alla presenza del latte che crea un saporito fondo di cottura"},{"id":"GZ-01131","name":"Arrosto di vitello all'uva","category":"Secondi di carne","serves":"8 persone","prep":"20 min","cook":"2 h","rest":"riposo prima del taglio","ingredients":["CARNE: “Pork – veal nut about 1 kg” (dicitura incoerente della fonte EN: noce di vitello circa 1 kg nel procedimento)","uva bianca 300 g","uva nera 300 g","vino bianco 250 ml","olio EVO q.b.","burro 50 g","sedano 2 coste","carote 2","cipolle 2","aglio 3 spicchi","rosmarino 1 rametto","bacche di ginepro 3","salvia 3 foglie","prezzemolo 1 ciuffo","sale e pepe q.b."],"steps":["Rifilare e legare il taglio di carne indicato nel procedimento come noce di vitello; sistemare rosmarino e salvia sul pezzo.","Rosolare la carne in olio e burro, girandola su tutti i lati, poi bagnare con il vino bianco.","Trasferire l'arrosto e il fondo di rosolatura in una teglia; aggiungere sedano, carote, cipolle, aglio, ginepro, prezzemolo, sale e pepe.","Cuocere in forno a 180 °C per circa un'ora, girando periodicamente.","Lavare e dividere gli acini d'uva, eliminando i semi; togliere le verdure e le erbe dalla teglia e aggiungere l'uva al fondo.","Proseguire la cottura per circa 20 minuti a 180 °C, fare riposare, affettare e servire con l'uva e il sugo."],"photo":"https://www.giallozafferano.com/images/312-31221/veal-roast-with-grapes_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/veal-roast-with-grapes.html","pdfPage":297,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00984","name":"Braciole di maiale con crema di zucca e taleggio","category":"Secondi di carne","serves":"4 persone","prep":"20 min","cook":"45 min","rest":"","ingredients":["Crema: zucca 500 g","patate 100 g","brodo vegetale 500 ml","cipolla bianca 40 g","olio EVO 30 g","sale, pepe, cannella e noce moscata un pizzico ciascuno. Braciole: braciole di maiale 600 g (4 pezzi)","taleggio 200 g","salvia 3 g","rosmarino 3 g","olio EVO 40 g","timo 2 rametti","sale un pizzico."],"steps":["Preparare il brodo; mondare zucca, patate e cipolla e ridurre tutto a piccoli pezzi.","Rosolare la cipolla con l’olio destinato alla crema, aggiungere zucca e patate, bagnare con il brodo e cuocere dolcemente 25–30 minuti, reintegrando il liquido quando serve.","Frullare le verdure cotte fino a ottenere una crema omogenea e insaporire con sale, pepe, cannella e noce moscata.","Assottigliare le braciole con un batticarne; scaldare l’olio con salvia e rosmarino tritati, quindi rosolare la carne circa 5 minuti per lato.","Trasferire la crema nella padella della carne, rimettere le braciole e lasciarle insaporire per 5 minuti. Disporre il taleggio a fette sopra la carne e attendere circa 2 minuti perché fonda; completare con il timo."],"photo":"https://www.giallozafferano.com/images/307-30768/pork-chops-with-pumpkin-cream-and-taleggio_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/pork-chops-with-pumpkin-cream-and-taleggio.html","pdfPage":298,"description":"Le braciole con crema di zucca e taleggio uniscono la tenerezza della braciola con la delicatezza della crema di zucca e il sapore irresistibile del taleggio fuso"},{"id":"GZ-01200","name":"Cotechino con lenticchie","category":"Secondi di carne","serves":"4 persone","prep":"15 min","cook":"50 min","rest":"ammollo lenticchie 2 ore","ingredients":["Cotechino precotto 300 g","LENTICCHIE: lenticchie secche 300 g","sedano 1 costa","carota media 1","cipolla bianca 1","olio EVO 35 g","alloro 3 foglie","rosmarino 2 rametti","brodo vegetale 500 g","sale fino q.b.","pepe nero q.b."],"steps":["Lasciare le lenticchie in ammollo in acqua fredda per 2 ore, quindi scolarle e sciacquarle.","Cuocere il cotechino precotto secondo le istruzioni della confezione (nella fonte circa 20 minuti dal bollore).","Tritare sedano, carota e cipolla; soffriggere con l'olio, unire le lenticchie e profumare con rosmarino e alloro.","Coprire con brodo vegetale caldo e far sobbollire circa 20 minuti o fino alla consistenza desiderata, aggiungendo brodo se necessario. Regolare sale e pepe.","Eliminare le erbe, estrarre il cotechino dalla confezione, privarlo del budello se previsto e servirlo a fette con le lenticchie."],"photo":"https://www.giallozafferano.com/images/227-22760/cotechino-pork-sausage-with-lentils_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/cotechino-pork-sausage-with-lentils.html","pdfPage":299,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02397","name":"Involtini alla pizzaiola","category":"Secondi di carne","serves":"4 involtini","prep":"","cook":"Cottura nel sugo: circa 20 min","rest":"","ingredients":["Fettine di manzo 4 (80–90 g ciascuna)","mozzarella 250 g","olive nere 30 g","passata di pomodoro 300 g","aglio 1 spicchio","olio EVO 4 cucchiai","prezzemolo tritato 1 cucchiaio","origano tritato 1 cucchiaino","sale fino e pepe nero q.b."],"steps":["In un tegame scaldare l’olio con lo spicchio d’aglio schiacciato, unire la passata, salare, pepare e insaporire con origano e prezzemolo.","Appiattire delicatamente le fettine di manzo; tagliare la mozzarella a fette sottili e lasciarla scolare. Tritare le olive nere.","Disporre su ogni fettina di carne la mozzarella e una parte delle olive. Arrotolare dal lato corto e fissare con stecchini.","Immergere gli involtini nel sugo, coprire e lasciar sobbollire a fuoco dolce per circa 20 minuti.","Controllare la sapidità e, se il condimento è troppo liquido, togliere temporaneamente gli involtini e restringere il sugo. Servire ben caldi."],"photo":"","source":"https://ricette.giallozafferano.it/Involtini-alla-pizzaiola.html","pdfPage":300,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00043","name":"Involtini di verza ripieni","category":"Secondi di carne","serves":"8 persone","prep":"30 min","cook":"20 min","rest":"","ingredients":["Verza 8 foglie","carne di suino macinata 400 g","salsiccia 200 g","porri 150 g","carote 70 g","Parmigiano Reggiano 35 g","pancetta affumicata 180 g","vino bianco 50 g","olio EVO q.b.","sale e pepe q.b.","timo q.b."],"steps":["Spellare e sbriciolare la salsiccia; tritare porro e carota. Rosolare le verdure con poco olio, unire salsiccia e carne macinata e cuocere circa 10 minuti. 2. Trasferire il ragù in una ciotola, aggiungere Parmigiano, timo, sale e pepe e lasciar intiepidire. 3. Sbollentare otto foglie di verza per circa 5 minuti, raffreddarle in acqua fredda, asciugarle e togliere la nervatura dura. 4. Farcire ciascuna foglia con 2-3 cucchiai di ragù, ripiegare e arrotolare. 5. Avvolgere gli involtini con la pancetta, rosolarli in padella da tutti i lati, quindi tenerli in caldo. 6. Sfumare il fondo di cottura con vino bianco e usare la salsa ridotta per servire."],"photo":"","source":"https://www.giallozafferano.com/recipes/cabbage-rolls-stuffed.html","pdfPage":301,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01320","name":"Pollo al latte di cocco e curry","category":"Secondi di carne","serves":"4 persone","prep":"15 min","cook":"40 min","rest":"","ingredients":["Per il brodo: latte di cocco 400 g","Zenzero fresco 20 g","Peperoncino fresco 1","Lemongrass stelo 1","Sale grosso 1 cucchiaio","Pepe in grani 1 cucchiaio","Lime (succo e scorza) 1","Zucchero di canna 10 g","Per il pollo: petto di pollo 800 g","Farina di riso 30 g","Curry thai verde 20 g","Olio di semi 10 g","Aglio 1 spicchio","Peperoncino fresco 1","Sale fino q.b.","Erba cipollina q.b."],"steps":["Per il brodo aromatico dividere un peperoncino, sbucciare lo zenzero e spezzare il lemongrass.","Riunire in un tegame il latte di cocco, lo zucchero, il sale grosso, il pepe in grani, lo zenzero, il peperoncino, il lemongrass, il succo e la scorza di lime; far sobbollire circa 30 minuti, quindi filtrare.","Tagliare il petto di pollo a cubetti, infarinarlo leggermente con la farina di riso e scuotere quella in eccesso. Affettare il peperoncino destinato alla carne.","Scaldare l'olio in un wok, aggiungere peperoncino e aglio e rosolare il pollo per circa un minuto.","Incorporare il curry verde, saltare ancora 2-3 minuti e versare il brodo al cocco filtrato.","Proseguire per circa 5 minuti, finché il fondo diventa cremoso; aggiustare di sale, completare con erba cipollina e servire caldo."],"photo":"","source":"https://ricette.giallozafferano.it/Pollo-al-latte-di-cocco-e-curry.html","pdfPage":302,"description":"Il pollo al latte di cocco e curry è una variante del tradizionale pollo al curry, un secondo piatto dai sapori esotici, facile e veloce da realizzare!"},{"id":"GZ-01423","name":"Straccetti di pollo alla sorrentina","category":"Secondi di carne","serves":"4 persone","prep":"20 min","cook":"35 min","rest":"","ingredients":["Petto di pollo 500 g","passata di pomodoro 300 g","mozzarella 100 g","scalogno 1","basilico 4 foglie","farina 00 q.b. per infarinare","Parmigiano Reggiano DOP grattugiato 20 g","olio EVO q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Tritare lo scalogno e farlo appassire con olio, unire la passata, sale e un mestolo d'acqua; cuocere coperto per circa 20 minuti.","Tagliare il pollo a striscioline, infarinarlo e rosolarlo in padella con olio per 2-3 minuti, finché dorato.","Unire il sugo al pollo e insaporire ancora 2 minuti. Spegnere e aggiungere mozzarella a dadini, basilico e pepe.","Trasferire in una pirofila, cospargere di Parmigiano e gratinare sotto il grill a circa 240 °C per 8-10 minuti, fino a lieve doratura."],"photo":"https://www.giallozafferano.com/images/233-23370/Chicken-strips-alla-sorrentina_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Chicken-strips-alla-sorrentina.html","pdfPage":303,"description":"Non lasciatevi ingannare dall'apparenza, potrebbero sembrare gnocchi ma non lo sono... oggi per pranzo straccetti di pollo alla sorrentina!"},{"id":"GZ-01457","name":"Alici fritte","category":"Secondi di pesce","serves":"4 persone","prep":"15 min","cook":"10 min","rest":"","ingredients":["Alici già pulite 500 g | Farina 00, olio di arachide e sale q.b. | Salsa: yogurt greco 150 g, aglio 1 spicchio, succo di limone 1 cucchiaio, aneto e olio EVO q.b. | Insalata: rucola 100 g, pomodorini 200 g, cetriolo 1, olive taggiasche 50 g, olio EVO, limone, sale e pepe q.b."],"steps":["Per l’insalata tagliare cetriolo e pomodorini e unirli a rucola e olive; condire e mantenere fresco. | 2. Per la salsa mescolare yogurt, aglio e aneto tritati, limone, olio, sale e pepe. | 3. Asciugare accuratamente le alici e passarle nella farina, eliminando quella in eccesso. | 4. Friggere poche alici alla volta in olio a circa 180 °C per 3–4 minuti, finché risultano dorate. | 5. Scolare su carta assorbente, salare e servire subito con salsa e insalata."],"photo":"","source":"https://ricette.giallozafferano.it/Alici-fritte.html","pdfPage":304,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01458","name":"alici imbottite","category":"Secondi di pesce","serves":"4 persone","prep":"40 min","cook":"10 min","rest":"","ingredients":["Alici da pulire 600 g","mollica di pane 200 g","uovo medio 1","pecorino grattugiato 30 g","succo di limone 10 g","scorza di limone 0,5 g","menta 3 foglie","sale q.b.","per la panatura: farina 00 100 g, uova 165 g (circa 3), pangrattato 100 g, sale e pepe q.b.","per friggere: olio di arachidi 1 l"],"steps":["Pulire le alici eliminando testa, viscere e lisca, poi aprirle a libro e asciugarle.","Sbriciolare il pane e mescolarlo con pecorino, uovo, succo e scorza di limone, menta e un pizzico di sale.","Sistemare una porzione di ripieno tra due alici, mantenendo la pelle all’esterno. Ripetere fino a esaurimento.","Passare ogni pezzo nella farina, nell’uovo sbattuto e infine nel pangrattato.","Friggere pochi pezzi alla volta in olio a circa 170 °C finché dorati. Scolare e servire caldi."],"photo":"","source":"https://www.giallozafferano.com/recipes/stuffed-anchovies.html","pdfPage":305,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01459","name":"Alici in friggitrice ad aria","category":"Secondi di pesce","serves":"2 persone","prep":"15 min","cook":"8 min","rest":"","ingredients":["Alici fresche da pulire 400 g","farina 00 q.b.","olio extravergine d’oliva q.b.","sale q.b."],"steps":["Staccare testa e interiora delle alici, aprirle a libro, rimuovere la lisca e risciacquarle. Asciugarle accuratamente.","Infarinare pochi pesci per volta, scuotere la farina superflua e condire con un velo d’olio.","Disporre in un solo strato nel cestello senza sovrapporle. Cuocere a 190 °C per 7–8 minuti, adattando il tempo alla dimensione.","Salare soltanto dopo la cottura e servire subito."],"photo":"","source":"https://ricette.giallozafferano.it/Alici-in-friggitrice-ad-aria.html","pdfPage":306,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01460","name":"alici marinate","category":"Secondi di pesce","serves":"4 porzioni","prep":"30 min","cook":"non prevista","rest":"marinatura almeno 5 ore secondo la fonte","ingredients":["Alici 500 g (preventivamente congelate secondo indicazioni di sicurezza)","aglio 4 g","succo di limone 150 g","prezzemolo 20 g","olio EVO 140 g","pepe nero q.b.","aceto di vino bianco 20 g","sale fino q.b."],"steps":["Frullare il prezzemolo con l'aglio e una parte dell'olio. Emulsionare a parte succo di limone, olio rimasto, sale e pepe; unire il trito aromatico.","Pulire le alici eliminando testa, interiora e lisca, aprirle a libro e sciacquarle con delicatezza.","Disporre i filetti in un recipiente, coprirli con la marinata e lasciarli insaporire; la fonte indica almeno cinque ore.","Aggiungere l'aceto, mescolare con cautela, sgocciolare i filetti e presentarli come antipasto.","SICUREZZA: la marinatura non elimina il rischio di parassiti. Utilizzare pesce già bonificato per consumo crudo e mantenere refrigerato durante la marinatura; la fonte cita congelamento a -18 °C per almeno 96 ore in congelatore domestico idoneo."],"photo":"","source":"https://www.giallozafferano.com/recipes/marinated-anchovies.html","pdfPage":307,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01461","name":"Anelli di calamari al forno","category":"Secondi di pesce","serves":"4 persone","prep":"30 min","cook":"30 min","rest":"","ingredients":["Calamari medi 750 g","Pangrattato 150 g","Paprika dolce 20 g","Olio EVO q.b.","Sale fino q.b."],"steps":["Pulire i calamari e tagliarli in anelli dello spessore indicato nella fonte, circa ¾ di pollice.","Mescolare pangrattato, paprika e sale in una pirofila.","Passare gli anelli nella panatura fino a rivestirli bene e distribuirli su una teglia senza sovrapporli.","Condire con olio e cuocere in forno statico preriscaldato a 350 °F per 25 minuti.","Attivare la ventilazione per altri cinque minuti, fino a doratura, e servire immediatamente."],"photo":"https://www.giallozafferano.com/images/289-28975/baked-calamari-rings_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baked-calamari-rings.html","pdfPage":308,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01462","name":"Anelli di calamari e patate","category":"Secondi di pesce","serves":"4 persone","prep":"15 min","cook":"40 min","rest":"","ingredients":["Calamari puliti 1 kg","Patate 700 g","Aglio 1 spicchio","Pomodori pelati 200 g","Vino bianco 80 g","Acqua 200 g","Origano fresco q.b.","Salvia q.b.","Sale fino q.b.","Pepe nero q.b.","Olio EVO q.b."],"steps":["Pelare le patate e tagliarle a pezzi irregolari. Scaldare poco olio con l’aglio in padella.","Aggiungere patate e salvia, insaporire brevemente e sfumare con vino bianco.","Unire i pomodori pelati e, se desiderato, l’acqua prevista; coprire e stufare a fiamma bassa per 30–35 minuti, fino a patate morbide.","Tagliare i calamari puliti ad anelli. Eliminare l’aglio e aggiungere i calamari alle patate.","Salare, pepare e cuocere ancora 5–6 minuti. Completare con origano fresco e servire caldo."],"photo":"https://www.giallozafferano.com/images/279-27960/Calamari-Rings-and-Potatoes_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Calamari-Rings-and-Potatoes.html","pdfPage":309,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01465","name":"Baccalà ai peperoni","category":"Secondi di pesce","serves":"4 persone","prep":"10 min","cook":"40 min","rest":"","ingredients":["Baccalà già dissalato 500 g","peperone verde 1","peperone rosso 1","peperone giallo 1","cipolla rossa 140 g","pomodorini 120 g","vino bianco 150 g","acqua 150 g","concentrato di pomodoro 20 g","basilico q.b.","menta q.b.","olio EVO q.b.","sale fino q.b."],"steps":["Tagliare il baccalà dissalato a pezzi; pulire i peperoni e ricavarne striscioline (la fonte usa circa 150 g complessivi).","Affettare la cipolla e sciogliere il concentrato nel vino bianco.","Appassire la cipolla nell’olio, unire pomodorini interi, peperoni, menta e basilico; salare leggermente.","Versare vino con concentrato e acqua, coprire e cuocere circa 20 minuti.","Aggiungere il baccalà, proseguire coperto per 10 minuti e poi scoperto per altri 5, muovendo il tegame senza rompere il pesce."],"photo":"https://www.giallozafferano.com/images/332-33207/cod-with-peppers_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/cod-with-peppers.html","pdfPage":310,"description":"Assaporate la rustica bontà del baccalà ai peperoni, un secondo di mare ricco e succulento che conquisterà anche chi non ama il pesce!"},{"id":"GZ-01466","name":"Baccalà al forno","category":"Secondi di pesce","serves":"4 persone","prep":"15 min","cook":"40 min","rest":"","ingredients":["Baccalà già dissalato 680 g","cavoletti di Bruxelles 250 g","rosmarino 2 rametti","salvia 1 rametto","porro 1/2","senape 40 g","vino bianco 90 g","olio EVO 90 g","pepe nero q.b.","sale fino q.b."],"steps":["Dividere il baccalà già dissalato in quattro tranci; lavare e affettare il porro.","Mondare i cavoletti e tagliarli a metà; tritare salvia e rosmarino.","Emulsionare con un frullatore a immersione vino bianco, senape, olio e metà delle erbe.","Condire porro e cavoletti con parte della salsa, aggiungendo poco sale perché il baccalà rimane sapido.","Disporre le verdure in una teglia unta, adagiare al centro i tranci e irrorarli con l’emulsione restante; aggiungere pepe ed erbe.","Cuocere in forno statico a 200 °C per circa 35–40 minuti, verificando la cottura in base allo spessore del pesce. Servire caldo."],"photo":"https://www.giallozafferano.com/images/330-33079/baked-cod_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baked-cod.html","pdfPage":311,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01467","name":"baccalà alla livornese","category":"Secondi di pesce","serves":"4 persone","prep":"20 min","cook":"55 min","rest":"","ingredients":["Baccalà dissalato 600 g","patate 250 g","farina 00 100 g","vino bianco 40 g","sale q.b.","pepe nero q.b.","olio EVO q.b. SALSA: pomodori pelati 800 g","cipolla dorata 1","aglio 1 spicchio","sale e pepe q.b.","olio EVO q.b."],"steps":["Affettare la cipolla e farla appassire con aglio e olio, aggiungendo poca acqua; unire i pelati schiacciati e cuocere coperto circa 15 minuti.","Tagliare il baccalà dissalato a tranci regolari, infarinarli e rosolarli delicatamente in un’altra padella con olio.","Sfumare con vino bianco e lasciarlo evaporare; togliere l’aglio dalla salsa e unirla al baccalà.","Cuocere coperto a fuoco dolce circa 20 minuti, quindi aggiungere le patate a cubetti.","Proseguire altri 20 minuti senza spezzare il pesce; aggiustare il condimento e servire caldo."],"photo":"https://www.giallozafferano.com/images/328-32868/cod-livorno-style_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/cod-livorno-style.html","pdfPage":312,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01468","name":"Baccalà alla vicentina","category":"Secondi di pesce","serves":"6 persone","prep":"20 min","cook":"6 h","rest":"ammollo stoccafisso 3 giorni + asciugatura 1 notte","ingredients":["Stoccafisso tipo ragno già ammollato 1 kg","cipolle bianche 300 g","sardine sotto sale dissalate 40 g","farina 00 q.b.","sale grosso q.b.","latte intero 180 g","Grana Padano DOP 20 g","pepe nero q.b.","olio EVO 180 g","prezzemolo q.b."],"steps":["Utilizzare stoccafisso ammollato per circa 3 giorni e lasciato asciugare una notte; preparare le cipolle tritate e dissalare le sardine.","Cuocere cipolle e sardine in parte dell'olio a fiamma dolce per 50-60 minuti, finché formano una crema.","Aprire il filetto di stoccafisso disliscato lasciando la pelle; distribuire parte del soffritto, condire con sale e pepe, infarinare leggermente, richiudere e tagliare in pezzi.","Sistemare i pezzi in verticale, ravvicinati, su un letto di soffritto in casseruola; coprire con il resto, farina, Grana e latte.","Versare l'olio rimanente e cuocere a fiamma bassissima per 4-5 ore, senza mescolare energicamente; la superficie deve sobbollire appena.","Completare con prezzemolo tritato e servire, tradizionalmente con polenta."],"photo":"https://www.giallozafferano.com/images/285-28511/vicenza-style-cod_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/vicenza-style-cod.html","pdfPage":313,"description":"Il baccalà alla vicentina è un secondo piatto di pesce, una ricetta tipica veneta a base di merluzzo, olio d'oliva e latte!"},{"id":"GZ-01469","name":"Baccalà arracanato","category":"Secondi di pesce","serves":"4 persone","prep":"10 min","cook":"35 min","rest":"","ingredients":["Baccalà già dissalato 800 g","mollica di pane raffermo 150 g","aglio 1 spicchio","pinoli 20 g","succo di 1 limone","uvetta 30 g","origano q.b.","pangrattato 1 cucchiaio","olio extravergine d'oliva q.b."],"steps":["Sciacquare l'uvetta e lasciarla rinvenire in acqua fredda; asciugare il baccalà dissalato e dividerlo in porzioni.","Sbriciolare la mollica e mescolarla con pinoli, uvetta strizzata, origano, aglio grattugiato e olio.","Versare nella pirofila il succo di limone e circa due cucchiai d'acqua; sistemare il pesce e coprirlo con il composto aromatico.","Distribuire un velo di pangrattato e altro olio; cuocere in forno statico a 180 °C per circa 35 minuti."],"photo":"https://www.giallozafferano.com/images/336-33618/arracanato-cod_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/arracanato-cod.html","pdfPage":314,"description":"Tipico del Molise, è realizzato con una panatura a base di pane raffermo, origano, pinoli e uvetta che vi farà innamorare... baccalà arracanato!"},{"id":"GZ-01470","name":"Baccalà con i ceci","category":"Secondi di pesce","serves":"3 persone","prep":"10 min","cook":"35 min","rest":"","ingredients":["Baccalà dissalato 540 g","ceci precotti 400 g","pomodori pelati 400 g","acqua 180 g","cipolla rossa 70 g","peperoncino fresco piccolo 1","rosmarino e salvia q.b.","olio EVO, sale e pepe q.b.","timo q.b. per decorare."],"steps":["Tagliare il baccalà dissalato in sei porzioni e affettare la cipolla; tritare peperoncino, rosmarino e salvia.","Rosolare brevemente gli aromi in olio, poi unire pomodori pelati, ceci scolati e acqua; regolare di sale e pepe e cuocere coperto per circa dieci minuti.","Sistemare il baccalà nel sugo e proseguire la cottura con coperchio per altri dieci minuti.","Prelevare una parte del condimento, frullarla e rimetterla in pentola per addensare; completare la cottura scoperta per circa dieci minuti e servire con timo."],"photo":"https://www.giallozafferano.com/images/290-29037/cod-with-chickpeas_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/cod-with-chickpeas.html","pdfPage":315,"description":"Il baccalà con i ceci è la dimostrazione che con ingredienti poveri si può ottenere una pietanza incredibilmente appetitosa, oltre che nutriente e genuina!"},{"id":"GZ-01471","name":"Baccalà con patate e olive","category":"Secondi di pesce","serves":"4 persone","prep":"20 min","cook":"25 min","rest":"","ingredients":["Baccalà già dissalato 800 g","patate 700 g","olive nere 200 g","brodo vegetale 350 g","farina 00 100 g","cipolla dorata 1","olio extravergine di oliva 5 cucchiai","alloro 3 foglie","sale fino q.b.","pepe nero q.b."],"steps":["Asciugare il baccalà già dissalato, dividerlo in pezzi e infarinarli su entrambi i lati; affettare la cipolla.","Appassire la cipolla con metà dell’olio per circa 5 minuti, aggiungere il pesce e rosolarlo girandolo con delicatezza.","Pelare le patate e ricavarne spicchi; trasferirle in una seconda padella con l’olio rimasto e il brodo.","Coprire e cuocere le patate per circa 10 minuti, quindi aggiungere il baccalà e i suoi succhi, le olive e l’alloro.","Continuare a fuoco medio per circa 15 minuti, aggiungendo poco brodo se necessario; servire pesce, patate e olive con il fondo di cottura."],"photo":"https://ptps.stbm.it/t/52skny_large.jpg","source":"https://www.giallozafferano.com/recipes/cod-with-potatoes-and-olives.html","pdfPage":316,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01474","name":"Baccalà confit su crema di ceci","category":"Secondi di pesce","serves":"4 persone","prep":"20 min","cook":"30 min","rest":"","ingredients":["BACCALÀ: baccalà dissalato pulito 480 g","olio extravergine di oliva 1 l","alloro 2 foglie. CREMA: ceci precotti 520 g","cipolle bianche 150 g","rosmarino 2 rametti","brodo vegetale q.b.","olio EVO 60 g","sale q.b. CECI CROCCANTI: ceci precotti 180 g","rosmarino 1 rametto","salvia 3 foglie","alloro 2 foglie","olio EVO, sale e pepe q.b. FINITURA: maggiorana, pomodori secchi e olio EVO q.b."],"steps":["Tritare la cipolla e farla appassire con un rametto di rosmarino e poco olio; aggiungere 520 g di ceci e cuocere circa 10 minuti, bagnando con brodo.","Eliminare il rosmarino e frullare i ceci con i 60 g di olio fino a ottenere una crema omogenea; regolare il sale.","In un’altra padella saltare i 180 g di ceci con salvia, rosmarino e alloro, fino a renderli croccanti.","Dividere il baccalà in pezzi simili; portare l’olio di cottura con l’alloro a 58 °C, controllando con termometro, e immergere il pesce per 10–12 minuti. Scolarlo su griglia.","Disporre la crema sul piatto, adagiarvi il baccalà, completare con ceci croccanti, pomodori secchi a filetti, maggiorana e poco olio."],"photo":"https://ptps.stbm.it/t/dsr0qn_large.jpg","source":"https://www.giallozafferano.com/recipes/confit-cod-on-chickpea-cream.html","pdfPage":317,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01475","name":"Baccalà fritto","category":"Secondi di pesce","serves":"4 persone","prep":"10 min","cook":"10 min","rest":"","ingredients":["Baccalà già dissalato 500 g","farina 00 q.b.","pepe nero q.b.","lime q.b.","olio di semi di arachide 1 l per friggere."],"steps":["Sciacquare il baccalà dissalato e asciugarlo accuratamente. Rimuovere pelle e spine, poi tagliarlo a strisce e in bocconi regolari.","Infarinare i pezzi su tutti i lati, eliminando la farina in eccesso.","Scaldare l'olio a 180–190 °C e friggere pochi pezzi per volta per circa 3–5 minuti, in funzione dello spessore, fino a doratura.","Scolare su carta per fritti e completare con pepe macinato e, a piacere, fettine di lime. Servire subito."],"photo":"","source":"https://www.giallozafferano.com/recipes/fried-cod.html","pdfPage":318,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-00985","name":"Brodetto fanese","category":"Secondi di pesce","serves":"4 persone","prep":"40 min","cook":"30 min","rest":"","ingredients":["Olio EVO 70 ml","aceto di vino bianco 60 ml","acqua o fumetto di pesce 500 ml","cipolla 50 g","aglio 1 spicchio","concentrato di pomodoro 80 g","sale e pepe q.b. Pesci e crostacei puliti: seppie 200 g","calamari 200 g","scampi 200 g","gamberi 200 g","palombo 300 g","rana pescatrice 250 g","canocchie 200 g","gallinella 150 g","nasello 200 g","sogliola 300 g","triglie 150 g. Pane toscano 6 fette."],"steps":["Pulire seppie, calamari, pesci e crostacei: tagliare a pezzi quelli grandi e lasciare interi i pesci piccoli.","Tritare la cipolla e farla appassire con l’aglio nell’olio, a fiamma dolce, per circa 15 minuti. Sfumare con l’aceto e unire il concentrato di pomodoro.","Aggiungere prima seppie e calamari e lasciarli insaporire circa 10 minuti; versare l’acqua calda o il fumetto e coprire.","Sistemare nella casseruola gallinella, palombo, rana pescatrice e nasello. Da questo momento muovere delicatamente la pentola senza mescolare con utensili.","Completare con scampi, canocchie, triglie, sogliole e infine gamberi; cuocere ancora non oltre 10 minuti. Regolare sale e pepe e servire con il pane."],"photo":"https://www.giallozafferano.com/images/317-31747/brodetto-fanese_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/brodetto-fanese.html","pdfPage":319,"description":"Il brodetto fanese è una deliziosa zuppa di pesce, tipica di Fano, a base di pesci diversi, dalle seppie alla gallinella, servito con crostini di pane"},{"id":"GZ-01506","name":"Calamari alle olive","category":"Secondi di pesce","serves":"4 persone","prep":"30 min","cook":"15 min","rest":"","ingredients":["Calamari: 1 kg | Olive nere: 200 g | Passata di pomodoro: 80 g | Scalogno: 1 | Vino bianco secco: 100 ml | Burro: 50 g | Prezzemolo: 4 rametti | Aglio: 1 spicchio | Olio extravergine di oliva: 3 cucchiai | Sale fino e pepe nero: q.b."],"steps":["Pulire i calamari separando testa e mantello, rimuovendo cartilagine, interiora e pelle; sciacquarli accuratamente.","Tagliare i mantelli in anelli spessi circa 1 cm; tritare scalogno, aglio e prezzemolo.","Scaldare burro e olio in una padella e far insaporire il trito aromatico.","Unire i calamari e rosolarli a fiamma media per circa 5 minuti.","Sfumare con il vino bianco, lasciarlo evaporare e aggiungere passata e olive.","Proseguire a fuoco dolce per circa 10 minuti, aggiungendo poca acqua calda se necessario; regolare sale e pepe e servire caldi."],"photo":"","source":"https://ricette.giallozafferano.it/Calamari-alle-olive.html","pdfPage":320,"description":"I calamari alle olive sono un secondo piatto di pesce gustoso e saporito che si realizza in poco tempo con pochi e semplici ingredienti"},{"id":"GZ-00090","name":"Calamari ripieni di couscous","category":"Secondi di pesce","serves":"4 persone","prep":"30 min","cook":"20 min","rest":"5 min","ingredients":["Couscous precotto 100 g","calamari 500 g","carota 1","zucchina piccola 1","cipollotto fresco piccolo 1","peperone rosso 1/2","aglio 1 spicchio","acqua 100 ml","vino bianco secco 1 bicchiere","scorza di lime 1","olio extravergine di oliva 4 cucchiai","menta q.b.","timo q.b.","pepe nero q.b.","sale fino q.b."],"steps":["Bagnare il couscous salato con 100 ml di acqua bollente e un filo di olio; coprire e lasciare gonfiare. 2. Pulire i calamari, tenere integre le sacche e tritare i tentacoli. Ridurre carota, zucchina e peperone a dadini e affettare il cipollotto. 3. Rosolare aglio e cipollotto in parte dell’olio; unire carota e peperone, cuocere circa 5 minuti, aggiungere zucchina e tentacoli per altri 2 minuti. 4. Mescolare le verdure al couscous con scorza di lime e menta. Riempire le sacche per circa due terzi e chiuderle con uno stecchino. 5. Rosolare i calamari nell’olio rimasto circa 5 minuti per lato, sfumare con il vino, fare evaporare e completare con timo."],"photo":"","source":"https://www.giallozafferano.com/recipes/stuffed-squid-with-couscous.html","pdfPage":321,"description":"I calamari ripieni di couscous sono un secondo sfizioso, che unisce il calamaro e il sapore esotico del couscous, perfetti anche come fingerfood!"},{"id":"GZ-00990","name":"Crema di patate con seppioline","category":"Secondi di pesce","serves":"4 persone","prep":"15 min","cook":"35 min","rest":"","ingredients":["Per la crema: Patate 800 g","Porri 1","Brodo vegetale 400 ml","Olio extravergine d’oliva q.b.","Sale fino q.b. Per le seppioline: Seppioline 300 g","Peperoni verdi 50 g","Peperoni rossi 50 g","Aglio 1 spicchio","Scorza di limone 1","Succo di limone ½","Timo 2 rametti","Olio extravergine d’oliva q.b.","Sale fino q.b.","Pepe nero q.b."],"steps":["Preparare il brodo vegetale. Affettare il porro e tagliare le patate sbucciate a dadini.","Far appassire il porro in poco olio a fuoco dolce per 10–15 minuti. Unire le patate, coprire con il brodo e cuocere con coperchio per circa 15 minuti, regolando di sale.","Pulire e tagliare i peperoni a strisce sottili; ridurre le seppioline a striscioline. Ricavare scorza e succo dal limone.","Profumare l’olio con l’aglio, saltare i peperoni lasciandoli croccanti e rimuovere l’aglio. Unire le seppioline, il timo, la scorza e il succo di limone; salare, pepare e cuocere brevemente.","Frullare le patate cotte fino a ottenere una crema densa. Versarla nei piatti e completare con le seppioline e un filo d’olio a crudo."],"photo":"https://www.giallozafferano.it/images/39-3914/Crema-di-patate-con-seppioline_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Crema-di-patate-con-seppioline.html","pdfPage":322,"description":"La crema di patate con seppioline è un secondo piatto di mare, saporito e raffinato, ideale per i vostri menu estivi!"},{"id":"GZ-00038","name":"Involtini di spada a beccafico con lime e zenzero","category":"Secondi di pesce","serves":"4 persone","prep":"30 min","cook":"10 min","rest":"","ingredients":["Pesce spada a fette 840 g","succo di lime 35 ml","zenzero fresco 10 g","pinoli 30 g","mollica di pane 115 g","uvetta 30 g","alloro 15 foglie","olio extravergine d'oliva 40 ml","sale e pepe secondo indicazioni del procedimento (dosi non specificate)."],"steps":["Sciacquare l'uvetta e ammollarla per almeno dieci minuti in parte del succo di lime, conservando il liquido.","Frullare la mollica senza crosta e mescolarla con uvetta scolata, pinoli, zenzero grattugiato, sale e pepe.","Condire il ripieno con il liquido dell'ammollo e una parte dell'olio.","Eliminare la pelle dalle fette sottili di spada, salarle leggermente e farcirle; arrotolarle e fissarle con uno stecchino.","Disporre gli involtini ravvicinati in una pirofila oliata, coprirli con il ripieno avanzato e inserire le foglie di alloro tra i pezzi.","Bagnare con il succo di lime rimasto e cuocere in forno statico a 180 °C per circa dieci minuti."],"photo":"https://www.giallozafferano.com/images/322-32213/swordfish-rolls-with-lime-and-ginger_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Involtini-di-spada-a-beccafico-con-lime-e-zenzero.html","pdfPage":323,"description":"Gli involtini di spada a beccafico con lime e zenzero sono un secondo piatto di pesce, che si ispira alla ricetta siciliana delle sarde a beccafico"},{"id":"GZ-00040","name":"Involtini di spada con salsa al mango","category":"Secondi di pesce","serves":"8 involtini","prep":"15 min","cook":"5 min","rest":"","ingredients":["Pesce spada 480 g (8 fette). Ripieno: mollica di pane casereccio 100 g","scorza di limone 1","basilico q.b.","olio extravergine d'oliva 10 g","sale fino q.b.","pepe nero q.b. Salsa: mango maturo 1","zenzero fresco 30 g","olio EVO 10 g","sale fino q.b.","pepe nero q.b."],"steps":["Sbucciare il mango e frullarlo con lo zenzero grattugiato, olio, sale e pepe fino a una salsa liscia.","Tritare la mollica con basilico, scorza di limone, olio, sale e pepe.","Distribuire il ripieno sulle fette di pesce spada lasciando libero il bordo; ripiegare i lati e arrotolare.","Rosolare gli involtini in padella antiaderente con un filo d'olio, iniziando dal lato della chiusura; girarli e completare la cottura in 2-3 minuti complessivi.","Servire con la salsa di mango e qualche foglia di basilico."],"photo":"https://ptps.stbm.it/t/9fniiq_large.jpg","source":"https://ricette.giallozafferano.it/Involtini-di-spada-con-salsa-al-mango.html","pdfPage":324,"description":"Gli involtini di spada con salsa al mango sono un raffinato secondo piatto di pesce dal profumo agrumato: scopri questa ricetta facile e veloce!"},{"id":"GZ-02529","name":"Alberi di Natale brownies","category":"Torte e dolci da forno","serves":"10 pezzi","prep":"30 min","cook":"20 min","rest":"","ingredients":["BASE: cioccolato fondente 200 g","burro 175 g","cacao amaro 2 cucchiai","lievito per dolci 1 cucchiaino","nocciole pelate 60 g","sale 1 pizzico","uova medie 2","zucchero 200 g","farina 00 100 g. GHIACCIA REALE: succo di limone alcune gocce","albume 1 (circa 30 g)","zucchero a velo 150 g","colorante alimentare q.b. DECORAZIONE: zucchero a velo q.b.","confettini colorati q.b."],"steps":["Sciogliere a bagnomaria burro, cioccolato tritato e cacao; lasciar intiepidire.","Montare uova e zucchero, incorporare il cioccolato; unire farina, lievito e sale setacciati, quindi le nocciole tritate.","Versare in uno stampo rettangolare foderato e cuocere in forno statico a 180 °C per circa 20 minuti; raffreddare.","Ricavare dieci alberelli con uno stampino oppure tagliare triangoli regolari.","Montare albume, zucchero a velo e limone; colorarne una parte e decorare gli alberelli con ghiaccia e confettini."],"photo":"https://www.giallozafferano.com/images/287-28774/christmas-tree-brownies_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/christmas-tree-brownies.html","pdfPage":325,"description":"Gli alberi di Natale brownies sono dei deliziosi dessert monoporzione di grande effetto: stupiranno i vostri ospiti sulla tavola natalizia!"},{"id":"GZ-00074","name":"Amor polenta","category":"Torte e dolci da forno","serves":"Stampo 20 × 7,5 cm","prep":"20 min","cook":"60 min","rest":"","ingredients":["Uova 63 g (circa 1)","Tuorli 50 g (circa 2)","Zucchero 115 g","Sale fino 1 g","Baccello di vaniglia 1","Scorza di limone 1","Farina di mandorle 68 g","Farina 00 45 g","Lievito in polvere per dolci 4 g","Farina di mais fioretto 38 g","Burro 125 g, per l’impasto","Burro 12 g e farina di mandorle 13 g, per il composto iniziale"],"steps":["Frulla 12 g di burro con 13 g di farina di mandorle fino a formare una crema; tienila da parte.","Fondi delicatamente i 125 g di burro e lasciali intiepidire.","Monta uovo, tuorli e zucchero; profuma con semi di vaniglia, scorza di limone e sale.","Incorpora il composto di burro e mandorle.","Mescola e setaccia le farine con il lievito; uniscile delicatamente alla massa montata.","Versa il burro fuso e amalgama senza smontare il composto.","Trasferisci nello stampo scanalato imburrato e infarinato; cuoci a 165 °C statico per 60 minuti.","Fai raffreddare prima di sformare. La fonte suggerisce zucchero a velo per finire, senza quantità in elenco ingredienti."],"photo":"https://www.giallozafferano.com/images/228-22806/amor-polenta-polenta-sponge-cake_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/amor-polenta-polenta-sponge-cake.html","pdfPage":326,"description":"Iginio Massari ci presenta il tradizionale dolce di Varese a base di farina di mais, caratterizzato da un'eccezionale fragranza e un profumo delicato: amor polenta!"},{"id":"GZ-02530","name":"Avocado brownies","category":"Torte e dolci da forno","serves":"teglia 20 × 20 cm","prep":"non esposto nel risultato","cook":"25 min","rest":"","ingredients":["Avocado 300 g","cioccolato fondente 150 g","farina 00 150 g","farina di frutta secca 50 g","olio di cocco 60 g","nocciole sgusciate 50 g","zucchero muscovado 50 g","lievito per dolci 3 g","sale fino 1 pizzico."],"steps":["Sciogliere il cioccolato a bagnomaria o al microonde e lasciarlo intiepidire. 2. Togliere il nocciolo all’avocado e schiacciarne la polpa. 3. Mescolare farina 00, farina di frutta secca, lievito e zucchero; aggiungere sale, olio di cocco e cioccolato fuso. 4. Unire la polpa di avocado e amalgamare fino a impasto uniforme. 5. Versare nello stampo 20 × 20 cm rivestito di carta forno, distribuire le nocciole tritate e cuocere circa 25 minuti in forno statico preriscaldato. Lasciar raffreddare e tagliare a quadrotti."],"photo":"","source":"https://www.giallozafferano.com/recipes/avocado-brownies.html","pdfPage":327,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02533","name":"Banana bread al cioccolato","category":"Torte e dolci da forno","serves":"6 persone; stampo 20 × 7 cm","prep":"20 min","cook":"30 min a 180 °C statico","rest":"raffreddamento prima della glassatura","ingredients":["Banane mature 250 g | Farina 00 100 g | Zucchero di canna 85 g | Cacao amaro 50 g | Uova 2 | Burro di arachidi 75 g | Gocce di cioccolato 30 g | Latte 30 g | Lievito per dolci 7 g | Cannella 1/2 cucchiaino | Sale 1 pizzico | Decorazione: cioccolato al latte 100 g e altre gocce di cioccolato q.b."],"steps":["Ridurre le banane mature in purea con una forchetta e amalgamare uova, burro di arachidi, zucchero, cannella e sale. | 2. Incorporare farina, cacao e lievito setacciati; correggere la consistenza con il latte previsto. | 3. Unire le gocce di cioccolato e trasferire l’impasto nello stampo rivestito. | 4. Cuocere in forno statico a 180 °C per circa 30 minuti, controllando il centro con uno stecchino. | 5. Lasciar raffreddare e finire con cioccolato al latte fuso e gocce."],"photo":"","source":"https://ricette.giallozafferano.it/Banana-bread-al-cioccolato.html","pdfPage":328,"description":"Il banana bread al cioccolato fondente è un dolce soffice e goloso per la colazione, arricchito con gocce di cioccolato. Scopri questa facile ricetta!"},{"id":"GZ-02534","name":"Banana bread al cocco","category":"Torte e dolci da forno","serves":"6 porzioni / stampo plumcake 20 × 10 cm","prep":"20 min","cook":"55 min","rest":"","ingredients":["Latte di cocco 250 g","banane mature 200 g","farina 00 200 g","zucchero di canna 100 g","olio di cocco 60 g","gocce di cioccolato fondente 60 g","cocco rapè 30 g","lievito per dolci 10 g","per stampo e decorazione: olio di cocco, farina, scaglie di cocco e frutta secca q.b."],"steps":["Schiacciare le banane mature e mescolarle con lo zucchero di canna.","Incorporare l’olio di cocco e il latte di cocco, lavorando con una frusta.","Aggiungere farina, lievito e cocco rapè, mescolando fino a impasto omogeneo; unire le gocce di cioccolato.","Versare nello stampo unto e infarinato, completare con scaglie di cocco e frutta secca a piacere.","Cuocere in forno statico preriscaldato a 175 °C per circa 50–55 minuti; raffreddare prima di sformare."],"photo":"https://www.giallozafferano.com/images/341-34168/coconut-banana-bread_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/coconut-banana-bread.html","pdfPage":329,"description":"Il banana bread al cocco è una variante senza burro e senza uova del plumcake alla banana americano, una ricetta ideale per la merenda o la colazione!"},{"id":"GZ-02535","name":"Banana bread light","category":"Torte e dolci da forno","serves":"6 porzioni","prep":"20 min","cook":"55 min","rest":"","ingredients":["Polpa di banane mature 300 g","farina tipo 0 250 g","sciroppo d'acero 85 g","olio di cocco 85 g","latte di riso 80 g","tuorli 30 g (circa 2)","lievito per dolci 9 g.\nPER STAMPO: olio di cocco e farina tipo 0 q.b.\nFINITURA: noci pecan 20 g."],"steps":["Schiacciare le banane mature fino a ridurle in purea; amalgamare lo sciroppo d'acero e i tuorli.","Incorporare l'olio di cocco a temperatura ambiente, poi farina e lievito setacciati.","Versare il latte di riso e lavorare fino a ottenere un impasto omogeneo.","Trasferire nello stampo da plumcake preparato, praticare un taglio longitudinale con un coltello oliato e cospargere con le noci pecan tritate.","Cuocere in forno statico a 180 °C per 50–55 minuti; verificare con uno stecchino e lasciar raffreddare prima di sformare."],"photo":"","source":"https://www.giallozafferano.com/recipes/light-banana-bread.html","pdfPage":330,"description":"Il banana bread light è un plumcake alla banana senza zucchero e senza lattosio, perfetto per una colazione energetica e nutriente! Scopri la ricetta"},{"id":"GZ-02536","name":"Banana Bread ricetta originale americana","category":"Torte e dolci da forno","serves":"6 persone","prep":"20 min","cook":"60 min","rest":"","ingredients":["Banane mature sbucciate 450 g","farina 00 200 g","burro morbido 120 g","zucchero 120 g","uova 110 g (circa 2 medie)","lievito per dolci 6 g","cannella 1/2 cucchiaino","sale 1 pizzico","succo di 1/2 limone","burro e farina q.b. per lo stampo."],"steps":["Affettare le banane, bagnarle con il succo di limone e schiacciarle fino a ottenere una purea.","Lavorare burro morbido e zucchero; incorporare un uovo alla volta, poi lievito e sale.","Unire la purea di banana e la cannella, quindi la farina setacciata, mescolando solo finché l'impasto è uniforme.","Trasferire in uno stampo da plumcake imburrato e infarinato, praticare una lieve incisione centrale e cuocere in forno statico a 180 °C per circa 60 minuti; controllare con uno stecchino e lasciare raffreddare."],"photo":"https://www.giallozafferano.com/images/227-22768/banana-bread_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/banana-bread.html","pdfPage":331,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02537","name":"Banana bread senza burro","category":"Torte e dolci da forno","serves":"Stampo 25 × 11 cm; 6 porzioni","prep":"20 min","cook":"40 min","rest":"","ingredients":["Banane mature 450 g (circa 3), per l’impasto","Farina di riso 220 g","Zucchero 120 g","Latte di soia 100 g","Lievito per dolci 16 g","Cannella in polvere 1 cucchiaino","Banana 1, per decorare","Zucchero a velo q.b., per decorare"],"steps":["Sbuccia le tre banane mature, spezzettale e schiacciale fino a ottenere una purea.","Versa il latte di soia nella purea; incorpora zucchero e cannella, lavorando con le fruste.","Aggiungi farina di riso e lievito, poi mescola fino a uniformare l’impasto.","Rivesti con carta forno uno stampo da plumcake di 25 × 11 cm e versa il composto.","Taglia longitudinalmente la banana destinata alla decorazione e appoggia le due metà sulla superficie.","Cuoci in forno ventilato preriscaldato a 180 °C per circa 40 minuti. Lascia intiepidire e spolvera con zucchero a velo."],"photo":"https://www.giallozafferano.es/images/149-14913/pan-de-platano-sin-mantequilla_780x520_wm.jpg","source":"https://www.giallozafferano.es/recetas/pan-de-platano-sin-mantequilla.html","pdfPage":332,"description":"Il banana bread senza burro è una versione light senza lattosio, senza uova e senza glutine del soffice plumcake alla banana! Scopri dosi e ricetta"},{"id":"GZ-02547","name":"Brownie vegan","category":"Torte e dolci da forno","serves":"8 porzioni","prep":"20 min","cook":"35 min (scheda fonte); 20–25 min (cottura brownie)","rest":"","ingredients":["Cioccolato fondente 70% 120 g","nocciole tritate 120 g","farina 00 150 g","cacao amaro 75 g","zucchero di canna 150 g","zucchero integrale tipo Dulcita 150 g","olio di semi di girasole 90 g","acqua 150 g","sale fino 1 pizzico","cremor tartaro 12 g. Coulis: fragole 500 g","lamponi 100 g","zucchero 50 g","succo di limone 50 g. Per decorare: zucchero a velo q.b."],"steps":["Tritare il cioccolato; mescolare in una ciotola farina, due tipi di zucchero, cacao, cremor tartaro e nocciole.","Unire il cioccolato, poi acqua e olio; aggiungere il sale e lavorare fino a ottenere un composto denso e uniforme.","Distribuire in una teglia di circa 35 × 28 cm rivestita di carta forno e cuocere a 180 °C in forno ventilato per circa 20–25 minuti.","Per la salsa, scaldare zucchero e poca acqua, unire il succo di limone, poi fragole a pezzi e lamponi; cuocere circa 10 minuti. Frullare e filtrare la coulis, quindi lasciarla raffreddare.","Raffreddare il brownie, pareggiare i bordi, dividere in otto porzioni e servire con zucchero a velo e coulis."],"photo":"https://www.giallozafferano.com/images/352-35233/vegan-brownie_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/vegan-brownie.html","pdfPage":333,"description":"Niente uova e burro, bensì avocado e olio di cocco in aggiunta all'immancabile cioccolato e a una cascata di nocciole croccanti... brownie vegan!"},{"id":"GZ-02548","name":"Brownies","category":"Torte e dolci da forno","serves":"8 persone","prep":"30 min","cook":"30 min","rest":"","ingredients":["Cioccolato fondente 55% 260 g","nocciole intere pelate 170 g","zucchero 160 g","burro 150 g","uova 2 (circa 110 g)","farina 90 g","cacao amaro 20 g","sale 1 pizzico."],"steps":["Sciogliere il cioccolato tritato e il burro separatamente, unirli e lasciar intiepidire.","Tostare le nocciole; montare uova e zucchero con un pizzico di sale.","Incorporare il composto di cioccolato, poi farina e cacao setacciati e infine le nocciole.","Versare in una teglia di circa 21 x 28 cm rivestita di carta forno.","Cuocere a 175 °C per circa 25 minuti; raffreddare completamente e tagliare a quadrotti."],"photo":"https://ptps.stbm.it/t/74szft_large.jpg","source":"https://www.giallozafferano.com/recipes/Brownies.html","pdfPage":334,"description":"I brownies al cioccolato sono dolcetti tipicamente americani molto ricchi e golosi, realizzati con cioccolato fondente e nocciole!"},{"id":"GZ-02549","name":"brownies in friggitrice ad aria","category":"Torte e dolci da forno","serves":"8 pezzi","prep":"15 min","cook":"30 min","rest":"","ingredients":["Cioccolato fondente 50% 240 g","zucchero 120 g","burro 120 g","uova circa 2 (110 g)","farina 00 90 g","gocce di cioccolato fondente 50 g","cacao amaro 20 g","sale 1 pizzico."],"steps":["Sciogliere il cioccolato tritato e il burro, mescolarli e farli intiepidire.","Montare per circa 10 minuti le uova con zucchero e sale, fino a ottenere un composto chiaro.","Incorporare cioccolato e burro, quindi setacciare e amalgamare farina e cacao.","Versare in stampo di circa 20 x 20 cm foderato con carta forno umida e strizzata; cospargere di gocce di cioccolato.","Cuocere in friggitrice ad aria a 160 °C per 30 minuti in modalità dolci; far raffreddare e tagliare a quadrotti."],"photo":"https://www.giallozafferano.com/images/350-35018/air-fryer-brownies_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/air-fryer-brownies.html","pdfPage":335,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02550","name":"brownies paradiso","category":"Torte e dolci da forno","serves":"9 pezzi","prep":"20 min","cook":"40 min","rest":"","ingredients":["BASE: cioccolato fondente 55% 230 g","burro 220 g","zucchero 220 g","uova 4","farina 00 140 g","cacao amaro 20 g","lievito per dolci 5 g","sale 1 pizzico. CREMA AL LATTE: panna fresca liquida 250 g","mascarpone 150 g","latte condensato 80 g","miele millefiori 20 g."],"steps":["Sciogliere cioccolato, burro e sale a bagnomaria e far intiepidire.","Montare uova e zucchero, incorporare il cioccolato e aggiungere farina, cacao e lievito setacciati.","Stendere in teglia di circa 25 x 25 cm e cuocere in forno statico a 175 °C per 30-35 minuti; raffreddare.","Montare mascarpone, panna e miele, quindi incorporare delicatamente il latte condensato.","Spalmare la crema sul brownie freddo, lasciare in frigorifero almeno 2 ore e tagliare in nove quadrati."],"photo":"https://www.giallozafferano.com/images/297-29749/paradise-brownies_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/paradise-brownies.html","pdfPage":336,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02551","name":"brownies zucca e cioccolato","category":"Torte e dolci da forno","serves":"9 persone","prep":"30 min","cook":"1 h 40 min","rest":"","ingredients":["BROWNIE: cioccolato fondente 55% 225 g","burro 110 g","farina 00 100 g","zucchero 80 g","zucchero di canna 80 g","uova grandi 2","lievito per dolci 4 g","zenzero in polvere q.b.","cannella q.b.","noce moscata q.b.","sale 1 pizzico. CREMA: polpa di zucca 600 g","formaggio spalmabile 120 g","uovo grande 1","zucchero 40 g","zenzero, cannella e noce moscata q.b."],"steps":["Cuocere la zucca pulita a fette in forno statico a 175 °C per 60-70 minuti; frullare la polpa asciutta.","Sciogliere cioccolato e burro, lasciare intiepidire e mescolare con i due zuccheri, le uova e il sale.","Unire 125 g di purea di zucca, farina e lievito; tenere da parte 40 g di impasto e stendere il resto in stampo 20 x 20 cm.","Mescolare formaggio spalmabile, zucchero, spezie, uovo e la quantità di purea indicata dalla fonte per la crema (160 g).","Distribuire la crema sulla base, creare venature con l’impasto al cioccolato conservato e cuocere a 175 °C per 40-45 minuti; raffreddare e tagliare."],"photo":"https://www.giallozafferano.com/images/348-34823/pumpkin-and-chocolate-brownies_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/pumpkin-and-chocolate-brownies.html","pdfPage":337,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02573","name":"Charlotte alle mele","category":"Torte e dolci da forno","serves":"6 persone","prep":"30 min","cook":"50 min","rest":"intiepidimento","ingredients":["Burro 70 g","latte intero 150 ml","brandy 50 ml","zucchero 50 g","scorza di limone 1","bacca di vaniglia 1","confettura di albicocche 150 g","mele renette 1 kg","cannella 1 cucchiaino","savoiardi 250 g. SPENNELLATURA: confettura di albicocche 1 cucchiaiata."],"steps":["Sbucciare le mele renette, eliminare i torsoli e tagliarle sottili.","Sciogliere una parte del burro in padella, aggiungere le mele e sfumare con brandy; insaporire con zucchero, vaniglia, cannella e scorza di limone.","Cuocere a fuoco dolce finché le mele diventano morbide; unire la confettura di albicocche.","Imburrare e foderare uno stampo alto da circa 18 cm; rifilare i savoiardi, inumidirli appena nel latte e disporli lungo pareti e fondo.","Riempire con le mele, pareggiare la superficie, cospargere con ritagli di savoiardi e con il burro rimasto fuso.","Cuocere in forno statico a 175 °C per 35–40 minuti; intiepidire, sformare e lucidare con altra confettura setacciata."],"photo":"https://www.giallozafferano.com/images/353-35340/apple-charlotte_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/apple-charlotte.html","pdfPage":338,"description":"La caratteristica forma della charlotte è data da una corona di savoiardi, farcita al suo interno con un composto a base di frutta, solitamente mele, pere o fragole"},{"id":"GZ-02579","name":"Cheesecake al cioccolato","category":"Torte e dolci da forno","serves":"10 persone; stampo 22 cm","prep":"30 min","cook":"60 min","rest":"1 h base + 2 h frigorifero","ingredients":["BASE: biscotti secchi al cioccolato 250 g","burro 100 g. CREMA: ricotta vaccina 450 g","formaggio spalmabile 250 g","cioccolato fondente 55% 200 g","zucchero 120 g","uova 110 g (circa 2)","amido di mais 50 g","cacao amaro 20 g","bacca di vaniglia 1. GUARNIZIONE: cioccolato fondente q.b."],"steps":["Polverizzare i biscotti al cioccolato e unirli al burro fuso e raffreddato.","Pressare la base sul fondo e sui bordi di uno stampo apribile da 22 cm; far rassodare almeno un'ora in frigorifero.","Fondere il cioccolato e lasciarlo intiepidire.","Lavorare ricotta, formaggio spalmabile, semi di vaniglia e zucchero; incorporare cacao e amido setacciati.","Aggiungere le uova e il cioccolato fuso, mescolare fino a ottenere una crema uniforme e versarla sulla base.","Cuocere a circa 165 °C in forno statico per 60 minuti, con un recipiente d'acqua in forno.","Raffreddare nello stampo e riporre in frigorifero per almeno due ore; decorare con riccioli di cioccolato."],"photo":"https://www.giallozafferano.com/images/280-28077/Chocolate-Cheesecake_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Chocolate-Cheesecake.html","pdfPage":339,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02625","name":"Chiffon cake","category":"Torte e dolci da forno","serves":"8 persone","prep":"25 min","cook":"60 min","rest":"raffreddamento capovolta","ingredients":["Zucchero extrafine 300 g","farina 00 290 g","acqua 200 g","olio di semi di girasole 120 g","uova grandi 6","vaniglia 1 bacca","scorza di 1 limone non trattato","lievito per dolci 1 cucchiaino","cremor tartaro 8 g","sale fino 2 g. FINITURA: zucchero a velo q.b."],"steps":["Setacciare farina e lievito, aggiungere zucchero e sale. Separare tuorli e albumi.","Amalgamare tuorli con acqua, olio, scorza di limone e semi di vaniglia; unirli alle polveri mescolando fino a ottenere un impasto liscio.","Montare gli albumi, incorporando il cremor tartaro quando sono spumosi; amalgamarli all'impasto in più riprese senza smontarli.","Versare in stampo da chiffon cake non unto e cuocere in forno statico a 160 °C per circa 60 minuti sul ripiano basso.","Capovolgere subito lo stampo, lasciar raffreddare completamente, sformare e spolverare con zucchero a velo."],"photo":"https://ptps.stbm.it/t/l99kd3_large.jpg","source":"https://www.giallozafferano.com/recipes/Chiffon-cake.html","pdfPage":340,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02626","name":"Chiffon cake arancia e cioccolato","category":"Torte e dolci da forno","serves":"8 persone","prep":"35 min","cook":"50 min","rest":"","ingredients":["IMPASTO: farina 00 280 g","zucchero 280 g","acqua 180 g","albumi 240 g (circa 6-7 uova)","tuorli 120 g (circa 6-7 uova)","olio di semi di girasole 120 g","lievito per dolci 16 g","scorza di 1 arancia non trattata","cremor tartaro 8 g","sale 1 pizzico.\nGLASSA: cioccolato fondente 55% 240 g","panna fresca liquida 200 g. DECORAZIONE: arancia candita a piacere."],"steps":["Setacciare farina e lievito, unirvi zucchero e sale. In un'altra ciotola amalgamare acqua, olio, scorza d'arancia e tuorli.","Versare i liquidi nelle polveri e lavorare fino a eliminare i grumi. Montare gli albumi, aggiungendo il cremor tartaro quando iniziano a diventare spumosi.","Incorporare gli albumi in più riprese con movimenti delicati; versare nello stampo da chiffon cake non imburrato.","Cuocere sul ripiano basso in forno statico preriscaldato a 160 °C per circa 55 minuti, controllando la cottura; capovolgere lo stampo e lasciar raffreddare completamente.","Scaldare la panna e versarla sul cioccolato tritato, mescolare per ottenere una glassa liscia; ricoprire la torta sformata e completare con scorze d'arancia candite."],"photo":"https://www.giallozafferano.com/images/319-31985/chiffon-cake-orange-and-chocolate_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/chiffon-cake-orange-and-chocolate.html","pdfPage":341,"description":"La chiffon cake arancia e cioccolato è una versione ancora più golosa della ciambella soffice, con gocce di cioccolato e una glassa all'arancia"},{"id":"GZ-03071","name":"Torta dolce di zucchine","category":"Torte e dolci da forno","serves":"1 torta, stampo da 24–26 cm","prep":"20 min","cook":"60 min","rest":"","ingredients":["Zucchine: 300 g | Farina 00: 250 g | Farina di mandorle: 100 g | Uova: 3 | Olio di semi di mais: 200 ml | Zucchero: 250 g | Lievito per dolci: 1 bustina | Baccello di vaniglia: 1"],"steps":["Lavare, spuntare e grattugiare le zucchine con grattugia a fori larghi; strizzarle leggermente.","Montare uova e zucchero fino a ottenere una massa chiara e spumosa.","Unire farina 00, farina di mandorle, lievito setacciato e semi di vaniglia.","Incorporare l’olio, poi le zucchine grattugiate, mescolando fino a ottenere un impasto uniforme.","Versare in uno stampo da 24–26 cm rivestito di carta forno oppure imburrato e infarinato.","Cuocere in forno statico a 180 °C per circa 60 minuti, controllando la cottura con uno stecchino; raffreddare prima di sformare."],"photo":"","source":"https://ricette.giallozafferano.it/Torta-dolce-di-zucchine.html","pdfPage":342,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01837","name":"carciofi ripieni di uova e formaggio","category":"Uova e secondi vegetariani","serves":"4 porzioni","prep":"30 min","cook":"40 min","rest":"","ingredients":["Carciofi 4 (circa 300 g ciascuno)","uova 4","provola 120 g","pecorino 50 g","pane 90 g","aglio 2 spicchi","sale fino e pepe nero q.b.","sale grosso 1 cucchiaino","limone 1","olio EVO e timo q.b."],"steps":["Mondare i carciofi, eliminare le foglie esterne dure e il fieno, aprirli delicatamente e sbollentarli per otto minuti in acqua salata acidulata con limone. Scolare capovolti.","Frullare grossolanamente il pane con timo e sale; mescolare uova, pecorino e provola grattugiati, conservando un poco di provola per la superficie.","Incorporare il pane alle uova fino a ottenere un composto soffice ma sostenuto; regolare di sale e pepe.","Scaldare olio, aglio in camicia e timo in una padella adatta al forno; insaporire i carciofi per qualche minuto e lasciarli intiepidire.","Riempire i carciofi con il composto, distribuire la provola tenuta da parte e cuocere in forno statico a circa 180 °C per 25 minuti, fino a doratura."],"photo":"","source":"https://www.giallozafferano.com/recipes/Egg-and-Cheese-Stuffed-Artichoke.html","pdfPage":343,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01930","name":"Fiori di peperoni con uova","category":"Uova e secondi vegetariani","serves":"4 persone","prep":"15 min","cook":"10 min","rest":"","ingredients":["Uova 8","Peperoni verdi mezzo","Peperoni rossi mezzo","Peperoni gialli mezzo","Olio extravergine d’oliva 2 cucchiai","Sale fino q.b.","Pepe nero q.b."],"steps":["Lavare i peperoni e tagliarli trasversalmente in rondelle spesse circa 2 cm, scegliendo sezioni con bordo ondulato. Eliminare semi e parti bianche interne.","Scaldare poco olio in una padella antiaderente e scottare brevemente le rondelle su entrambi i lati.","Rompere ogni uovo prima in una ciotolina, poi farlo scivolare delicatamente al centro di un anello di peperone senza rompere il tuorlo.","Coprire e cuocere a calore medio fino alla consistenza desiderata dell’albume e del tuorlo. Regolare di sale e pepe e servire subito."],"photo":"https://www.giallozafferano.it/images/17-1767/Fiori-di-peperoni-con-uova_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Fiori-di-peperoni-con-uova.html","pdfPage":344,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01937","name":"Frittata ai fiori di zucca","category":"Uova e secondi vegetariani","serves":"4 persone","prep":"15 min","cook":"30 min","rest":"","ingredients":["Uova 8","Fiori di zucca “20 cups (600 g)” come riportato nella fonte EN","Scalogno ½","Aglio 1 spicchio","Erba cipollina q.b.","Olio EVO 4 cucchiaini","Sale fino q.b.","Pepe nero q.b."],"steps":["Eliminare base e pistillo dei fiori di zucca, quindi dividerli delicatamente in striscioline.","Scaldare olio, aglio e scalogno tritato in padella; eliminare l’aglio, aggiungere i fiori e poco sale. Cuocere per circa cinque minuti, aggiungendo acqua se necessario.","Sbattere le uova con sale, pepe ed erba cipollina tritata.","Versare le uova sui fiori ammorbiditi e distribuire il composto uniformemente.","Coprire e cuocere a fiamma medio-bassa per 20–25 minuti, finché la frittata è rappresa; girarla se si desidera colorare entrambi i lati."],"photo":"https://www.giallozafferano.com/images/347-34776/frittata-with-zucchini-flowers_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/frittata-with-zucchini-flowers.html","pdfPage":345,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01939","name":"Frittata ai ravanelli","category":"Uova e secondi vegetariani","serves":"6 persone / teglia 24 cm","prep":"30 min","cook":"55 min","rest":"","ingredients":["Ravanelli 360 g","Carote 250 g","Asparagi 500 g","Uova 8","Grana Padano DOP 60 g","Olio extravergine d’oliva 40 g","Timo q.b.","Sale fino q.b.","Pepe nero q.b."],"steps":["Pulire carote, asparagi e ravanelli. Tagliare a rondelle le carote e i gambi degli asparagi, conservando le punte; affettare finemente i ravanelli.","Stufare le carote con poco olio, aggiungere i gambi degli asparagi e il timo e proseguire per qualche minuto. Salare, pepare e lasciare intiepidire.","Sbattere le uova con sale, pepe e Grana grattugiato. Incorporare le verdure cotte e le rondelle di ravanello.","Versare in una teglia di 24 cm rivestita di carta forno, decorare con le punte degli asparagi e cuocere in forno a 180 °C per circa 55 minuti.","Lasciare intiepidire prima di tagliare e servire."],"photo":"https://www.giallozafferano.it/images/154-15426/Frittata-ai-ravanelli_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Frittata-ai-ravanelli.html","pdfPage":346,"description":"La frittata ai ravanelli è una ricetta sfiziosa per gustare una delle verdure di stagione più fresche; ottima come antipasto o secondo piatto!"},{"id":"GZ-01940","name":"frittata al forno","category":"Uova e secondi vegetariani","serves":"4 persone","prep":"10 min","cook":"25 min","rest":"","ingredients":["Uova 8","panna fresca 150 g","origano 2 rametti","Gruyère DOP 100 g","sale e pepe q.b. Per le cipolle: cipolle rosse 350 g","olio EVO 1 cucchiaio","sale q.b."],"steps":["Affettare le cipolle e farle appassire in padella con olio e sale, coperte, per circa dieci minuti; lasciarle intiepidire.","Tagliare il Gruyère a cubetti. Sbattere le uova con panna, origano, sale e pepe, quindi incorporare le cipolle.","Versare il composto in una teglia rettangolare rivestita di carta forno e distribuire il formaggio.","Cuocere in forno statico a circa 190 °C per circa 30 minuti secondo il procedimento della fonte, completando con un breve passaggio al grill se serve."],"photo":"","source":"https://www.giallozafferano.com/recipes/Baked-Frittata.html","pdfPage":347,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01941","name":"Frittata al forno ai ceci","category":"Uova e secondi vegetariani","serves":"4 persone","prep":"20 min","cook":"1 h 20 min","rest":"","ingredients":["Ceci precotti 250 g","olio EVO 70 g","sale q.b.","pepe q.b.","prezzemolo 3 ciuffi","timo 3 rametti","uova 8","ricotta vaccina 150 g","pomodori 180 g","semi di finocchio 1 cucchiaino","cipolla rossa 70 g","peperoncino fresco 1/2","piselli surgelati 150 g."],"steps":["Tritare cipolla, prezzemolo, timo e peperoncino; tagliare i pomodori a cubetti.","Rosolare la cipolla con parte dell'olio, aggiungere semi di finocchio e peperoncino, quindi ceci scolati, piselli scongelati e pomodori. Cuocere circa dieci minuti.","Sbattere le uova, amalgamare ricotta ed erbe aromatiche e incorporare il composto di verdure.","Rivestire una pirofila rotonda di circa 28 cm con carta forno inumidita e strizzata; versare il composto.","Cuocere in forno ventilato a 190 °C per circa un'ora. Servire tiepida o a temperatura ambiente."],"photo":"","source":"https://www.giallozafferano.com/recipes/baked-chickpea-omelette.html","pdfPage":348,"description":"La frittata al forno ai ceci è una frittata leggera e ricca di verdure, che si può anche preparare in anticipo e servire a temperatura ambiente"},{"id":"GZ-01942","name":"Frittata al forno con ricotta e spinaci","category":"Uova e secondi vegetariani","serves":"4 persone","prep":"20 min","cook":"40 min","rest":"","ingredients":["Uova medie 5","spinaci puliti 500 g","ricotta vaccina 250 g","Emmentaler 100 g","porri 150 g","Grana Padano DOP 30 g","olio extravergine di oliva 3 cucchiai","burro q.b.","pangrattato q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Lavare e mondare gli spinaci; affettare sottilmente il porro e farlo appassire in padella con l’olio.","Aggiungere gli spinaci, coprire e cuocere fino a renderli morbidi; scolarli, strizzarli e tritarli.","Sbattere le uova con sale e pepe, incorporare la ricotta e i due formaggi grattugiati.","Unire gli spinaci al composto e versare in uno stampo rotondo di circa 23 cm imburrato e spolverato di pangrattato.","Cuocere in forno statico preriscaldato a circa 180 °C per 30–40 minuti, finché il centro è rassodato; servire calda o tiepida."],"photo":"https://www.giallozafferano.com/images/313-31320/baked-omelette-with-ricotta-and-spinach_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baked-omelette-with-ricotta-and-spinach.html","pdfPage":349,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01943","name":"Frittata con le cipolle","category":"Uova e secondi vegetariani","serves":"4 persone","prep":"10 min","cook":"20 min","rest":"","ingredients":["Uova medie 6","cipolle rosse 400 g","maggiorana q.b.","olio EVO q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Pulire le cipolle e tagliarle a fette spesse circa 1 cm.","Farle stufare in padella antiaderente con poco olio e sale, coperte, per 7-8 minuti.","Sbattere le uova con maggiorana, sale e pepe.","Versare le uova sulle cipolle e cuocere coperto a fiamma bassa per 6-8 minuti.","Quando la frittata è quasi rappresa, capovolgerla con l'aiuto di un piatto e cuocere l'altro lato per 3-4 minuti senza coperchio."],"photo":"https://www.giallozafferano.com/images/277-27790/Onion-frittata_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Onion-frittata.html","pdfPage":350,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01946","name":"frittata di asparagi","category":"Uova e secondi vegetariani","serves":"4 persone","prep":"15 min","cook":"20 min","rest":"","ingredients":["Uova medie 6","asparagi da pulire 500 g","aglio 2 spicchi","Grana Padano DOP grattugiato 40 g","olio EVO 3 cucchiaiate","sale fino e pepe nero q.b."],"steps":["Pulire gli asparagi eliminando la parte legnosa; dividere longitudinalmente i gambi più spessi.","In una padella antiaderente di circa 28 cm scaldare l'olio con gli spicchi d'aglio, aggiungere gli asparagi e salare; cuocere coperto per 5-7 minuti scuotendo la padella.","Sbattere le uova con Grana, sale e pepe. Eliminare l'aglio e disporre gli asparagi in un solo strato.","Versare le uova, coprire e cuocere circa 8 minuti a fiamma moderata; girare la frittata aiutandosi con un piatto e proseguire per circa 2 minuti."],"photo":"https://ptps.stbm.it/t/z88ejz_large.jpg","source":"https://www.giallozafferano.com/recipes/Asparagus-Frittata.html","pdfPage":351,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-01951","name":"Frittata di patate al forno","category":"Uova e secondi vegetariani","serves":"4 persone; teglia 20×26 cm","prep":"10 min","cook":"50 min","rest":"","ingredients":["Uova 6","patate 400 g","pangrattato 50 g","Grana Padano grattugiato 50 g","sale fino q.b.","olio EVO q.b.","pepe nero q.b.","origano fresco q.b. PER LA TEGLIA: olio EVO q.b.","pangrattato q.b."],"steps":["Sbucciare le patate e ridurle a cubetti piuttosto piccoli.","Sbattere le uova con sale e pepe; incorporare pangrattato, Grana Padano e origano.","Aggiungere le patate crude tagliate e amalgamare.","Ungere una teglia da 20×26 cm e cospargerla di pangrattato.","Versare il composto e cuocere in forno statico a circa 170 °C per 50 minuti.","Dorare brevemente la superficie con grill o ventilazione a temperatura più alta, lasciare intiepidire e servire."],"photo":"https://www.giallozafferano.com/images/354-35451/baked-potato-frittata_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baked-potato-frittata.html","pdfPage":352,"description":"Se quando preparate la frittata avete sempre paura di fare un pasticcio, questa ricetta vi salverà da ogni impiccio: frittata di patate al forno!"},{"id":"GZ-00045","name":"Involtini di verza vegetariani","category":"Uova e secondi vegetariani","serves":"4 persone","prep":"20 min","cook":"30 min","rest":"","ingredients":["Verza gra
