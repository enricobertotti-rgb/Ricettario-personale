rep":"40 min","cook":"5 min","rest":"circa 4,5 h di raffreddamento","ingredients":["BASE (stampo 20 cm): biscotti 150 g","gherigli di noce 110 g","burro 65 g.\nCREMA: yogurt bianco naturale 350 g","panna fresca liquida fredda 200 g","latte intero 90 g","zucchero 60 g","miele millefiori 20 g","gelatina in fogli 10 g.\nDECORAZIONE: fichi 4","miele millefiori 20 g","gherigli di noce 10 g."],"steps":["Ridurre biscotti e noci in briciole, amalgamarli al burro fuso e compattare sul fondo di uno stampo rivestito. Mettere in frigorifero almeno 20 minuti.","Ammollare la gelatina in acqua fredda. Scaldare il latte con zucchero e miele, sciogliervi la gelatina strizzata e lasciare intiepidire.","Mescolare il latte aromatizzato con lo yogurt; montare la panna fredda e incorporarla delicatamente.","Versare la crema sulla base, livellare e lasciare rassodare in frigorifero almeno quattro ore.","Sformare, decorare con fichi a spicchi, noci tritate e il miele previsto."],"photo":"","source":"https://www.giallozafferano.com/recipes/fig-cheesecake.html","pdfPage":124,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02577","name":"Cheesecake ai frutti di bosco","category":"Dessert al cucchiaio e freddi","serves":"6 persone","prep":"30 min","cook":"10 min","rest":"raffreddamento e rassodamento","ingredients":["Base: biscotti secchi 180 g","burro 100 g. Crema: ricotta vaccina 500 g","formaggio fresco spalmabile 250 g","panna fresca 100 g","zucchero a velo 150 g","gelatina in fogli 10 g","scorza di limone 1. Frutti: more 190 g","mirtilli 180 g","lamponi 180 g","ribes 135 g","zucchero a velo 100 g","succo di limone 70 g. Copertura: amido di mais 35 g","frutti di bosco 280 g. Decorazione: frutti di bosco 50 g","menta q.b. Nota: il procedimento editoriale menziona latte per sciogliere la gelatina, ma la lista ingredienti non ne indica la quantità."],"steps":["Tritare finemente i biscotti e amalgamarli al burro fuso intiepidito. Pressare in uno stampo da circa 20 cm foderato e raffreddare almeno 30 minuti.","Ammorbidire la gelatina in acqua fredda. Cuocere brevemente more, mirtilli, lamponi e ribes con succo di limone e zucchero a velo, quindi separare i frutti dal liquido conservandoli entrambi.","Sciogliere la gelatina strizzata nel liquido caldo indicato nel procedimento della fonte (latte, dose non riportata nell'elenco); lasciare intiepidire.","Setacciare la ricotta e unirla a formaggio spalmabile, scorza di limone e zucchero a velo; incorporare la gelatina sciolta; la panna compare negli ingredienti, ma il procedimento editoriale non ne chiarisce l'impiego.","Versare metà crema sulla base, distribuire i frutti scolati, coprire con la crema rimanente e refrigerare circa 2 ore.","Addensare sul fuoco il succo dei frutti tenuto da parte con amido di mais, lasciarlo raffreddare e completare la superficie con copertura, frutti freschi e menta."],"photo":"https://ptps.stbm.it/t/kttomx_large.jpg","source":"https://www.giallozafferano.com/recipes/Wild-berry-cheesecake.html","pdfPage":125,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02580","name":"Cheesecake al cocco","category":"Dessert al cucchiaio e freddi","serves":"8 persone; stampo 20 cm","prep":"15 min","cook":"non prevista","rest":"30 min + 2–3 h frigorifero","ingredients":["BASE: biscotti Digestive 200 g","burro 100 g. CREMA: formaggio spalmabile 500 g","panna fresca liquida 200 g","yogurt al cocco 100 g","cocco rapè 30 g","zucchero a velo 70 g. DECORAZIONE: cocco fresco 40 g."],"steps":["Frullare finemente i biscotti e amalgamarli con il burro fuso e lasciato intiepidire.","Rivestire uno stampo apribile da 20 cm; pressare il composto sul fondo e raffreddare per 30 minuti.","Montare insieme panna, zucchero a velo, formaggio spalmabile e yogurt al cocco, senza lavorare eccessivamente.","Incorporare il cocco rapè e distribuire la crema sulla base livellandola.","Lasciare rassodare in frigorifero per 2–3 ore; sformare con delicatezza e decorare con fettine sottili di cocco fresco."],"photo":"https://www.giallozafferano.com/images/365-36522/coconut-cheesecake_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/coconut-cheesecake.html","pdfPage":126,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02581","name":"Cheesecake al limone","category":"Dessert al cucchiaio e freddi","serves":"6 persone","prep":"40 min","cook":"6 min","rest":"frigorifero almeno 5 h","ingredients":["Base: burro 100 g","biscotti secchi 200 g. Crema: ricotta vaccina 500 g","formaggio spalmabile 250 g","succo di limone 100 g","zucchero a velo 150 g","scorza di limoni 2","panna fresca 100 g","gelatina in fogli 10 g. Copertura: succo di limone 60 g","curcuma in polvere 1/4 cucchiaino","zucchero 80 g","acqua 100 g","amido di mais 15 g. Decorazione: limone 1","menta q.b.","zucchero 100 g","acqua (quantità non indicata nella fonte)."],"steps":["Frullare i biscotti e unirli al burro fuso; pressare in uno stampo a cerniera di circa 20 cm e refrigerare per 30 minuti.","Ammorbidire la gelatina in acqua fredda; lavorare ricotta e formaggio con scorza, zucchero a velo e succo di limone.","Scaldare la panna senza farla bollire e sciogliervi la gelatina strizzata; lasciar intiepidire e incorporare alla crema.","Versare sulla base fredda e riporre in frigorifero per almeno 2 ore.","Scaldare acqua, zucchero, succo di limone e amido di mais per la copertura, mescolando fino al bollore; aggiungere la curcuma, far raffreddare e versare sulla cheesecake.","Refrigerare per altre 2 ore; preparare le fette di limone nello sciroppo della decorazione (acqua senza quantità in fonte) e guarnire con limone e menta."],"photo":"https://ptps.stbm.it/t/7nz8ko_large.jpg","source":"https://www.giallozafferano.com/recipes/Lemon-cheesecake.html","pdfPage":127,"description":"La cheesecake al limone è un dessert fresco, perfetto per una merenda o per concludere un pranzo. Il gusto dolcemente agrumato conquisterà a tutti!"},{"id":"GZ-00027","name":"Fagottini di crepes alle fragole","category":"Dessert al cucchiaio e freddi","serves":"6 persone","prep":"25 min","cook":"15 min","rest":"riposo pastella almeno 30 min","ingredients":["CREPE (circa 6): uova 2","farina 00 125 g","latte intero 250 ml","sale 1 pizzico","burro 20 g","zucchero 30 g","baccello di vaniglia 1. RIPIENO: fragole 200 g","mascarpone 350 g","zucchero a velo 100 g. GANACHE: panna fresca 125 ml","cioccolato fondente 125 g","burro 15 g. PER LA PADELLA: burro 30 g."],"steps":["Preparare una pastella liscia con farina, latte, burro fuso, zucchero, vaniglia, uova e sale; far riposare in frigo almeno 30 minuti.","Cuocere circa sei crepe sottili in padella leggermente imburrata, girandole su entrambi i lati.","Mescolare mascarpone e zucchero a velo, quindi incorporare le fragole pulite e tagliate a pezzetti.","Disporre una porzione di crema al centro di ciascuna crepe, raccogliere i bordi e legarli con striscioline della bacca di vaniglia.","Scaldare panna e burro, sciogliervi il cioccolato fino a ottenere una ganache; distribuirla sui piatti e adagiarvi i fagottini."],"photo":"https://www.giallozafferano.it/images/39-3934/Fagottini-di-crepes-alle-fragole_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Fagottini-di-crepes-alle-fragole.html","pdfPage":128,"description":"I fagottini di crepes alle fragole sono un dessert raffinato: uno scrigno di crepes ripieno di crema al mascarpone e fragole su ganache al cioccolato!"},{"id":"GZ-02800","name":"Mousse al cioccolato","category":"Dessert al cucchiaio e freddi","serves":"Circa 900 g, 5 porzioni","prep":"25 min","cook":"5 min","rest":"","ingredients":["Cioccolato fondente al 70% 200 g","panna fresca liquida 550 g","tuorli 160 g (circa 10)","latte intero 100 g","miele di acacia 20 g."],"steps":["Tritare finemente il cioccolato e raccoglierlo in una ciotola resistente al calore.","Mescolare tuorli, miele e latte in un pentolino; scaldare lentamente, sempre mescolando, fino a raggiungere 82 °C, verificando con un termometro.","Versare la crema inglese calda sul cioccolato, mescolare fino a fusione completa e uniformare con un frullatore a immersione.","Montare i 550 g di panna solo fino a consistenza morbida, senza renderla troppo soda.","Unire prima una piccola parte di panna al composto al cioccolato, poi incorporare delicatamente il resto in due riprese. Distribuire nelle coppette e mantenere al fresco fino al servizio."],"photo":"","source":"https://ricette.giallozafferano.it/Mousse-al-cioccolato.html","pdfPage":129,"description":"Scopri come preparare una mousse al cioccolato cremosa con pochi ingredienti. Ricetta facile, veloce e irresistibile, ideale per ogni occasione"},{"id":"GZ-02835","name":"Profiteroles al cioccolato","category":"Dessert al cucchiaio e freddi","serves":"Circa 20 bignè, 6 persone","prep":"60 min","cook":"40 min","rest":"","ingredients":["PASTA CHOUX: acqua 62 g","latte intero 62 g","burro 55 g","sale fino 3 g","zucchero 8 g","farina 00 77 g","uova 120 g. PER SPENNELLARE: 1 tuorlo","acqua q.b. CHANTILLY: panna fresca liquida 35% grassi 250 g","zucchero a velo 50 g","1 baccello di vaniglia. COPERTURA: acqua 200 g","cioccolato fondente 450 g","panna fresca liquida 80 g","zucchero 150 g","1 pizzico di fiocchi di sale."],"steps":["Portare a bollore acqua, latte, burro, zucchero e sale. Aggiungere tutta la farina, mescolare energicamente e asciugare la massa sul fuoco per 2–3 minuti.","Far intiepidire la pasta, poi incorporare gradualmente le uova pesate. Formare con sac à poche circa 20 bignè su teglia rivestita, appiattire le punte e spennellare con tuorlo diluito.","Cuocere in forno statico a 220 °C per circa 15 minuti senza aprire; proseguire a 180 °C per 15–20 minuti con piccolo sfiato, quindi raffreddare.","Per la salsa bollire acqua e zucchero, unire la panna, poi sciogliere il cioccolato in due aggiunte. Salare leggermente e lasciar raffreddare a 30–32 °C.","Montare la panna fredda con zucchero a velo e semi di vaniglia. Farcire i bignè freddi dal fondo con la crema chantilly.","Immergere i bignè farciti nella salsa temperata, lasciar sgocciolare e disporre a piramide. Refrigerare fino al servizio."],"photo":"","source":"https://ricette.giallozafferano.it/Profiteroles-al-cioccolato.html","pdfPage":130,"description":"Un dessert francese che trae le sue origini in Italia... proprio come Denny Imbroisi, lo chef che lo ha preparato per noi, bigné dopo bigné: profiteroles al cioccolato!"},{"id":"GZ-04717","name":"Risolatte","category":"Dessert al cucchiaio e freddi","serves":"4 persone","prep":"20 min","cook":"40 min","rest":"","ingredients":["Riso Carnaroli 300 g","latte intero 1 l","zucchero 90 g","scorza di 1 limone","vaniglia 1/2 bacca","sale fino 1 pizzico. FINITURA: cacao amaro in polvere o cannella in polvere q.b."],"steps":["Scaldare il latte in una casseruola alta con i semi e la mezza bacca di vaniglia, la scorza di limone, lo zucchero e il sale.","Quando il latte inizia a sobbollire, versare il riso e cuocerlo dolcemente per circa 30 minuti, mescolando spesso; aggiungere poco latte caldo se asciuga troppo.","Eliminare scorza e bacca di vaniglia, distribuire il risolatte cremoso in coppette e completare con cannella oppure cacao. Servire caldo o freddo."],"photo":"https://www.giallozafferano.com/images/317-31752/Rice-pudding-Risolatte_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Rice-pudding-Risolatte.html","pdfPage":131,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-04718","name":"Risolatte allo zafferano","category":"Dessert al cucchiaio e freddi","serves":"6 bicchieri","prep":"20 min","cook":"60 min","rest":"","ingredients":["Riso Vialone Nano 300 g","latte di mandorla non zuccherato 1,5 l","zafferano in pistilli 0,3 g","zucchero 85 g","vaniglia 1/2 bacca","semi di finocchio 1 cucchiaio","sale fino q.b. DECORAZIONE: mandorle a lamelle 20 g","pistilli di zafferano q.b."],"steps":["Scaldare dolcemente il latte di mandorla con semi di finocchio e vaniglia (bacca e semi) per 10 minuti, senza bollire; filtrare.","Sciogliere lo zucchero nel latte aromatizzato, aggiungere il riso e cuocere a fuoco moderato per circa 25 minuti, mescolando.","Unire i pistilli di zafferano, tenendone alcuni per decorare; proseguire per altri 25 minuti fino a consistenza cremosa.","Tostare le mandorle a lamelle in padella; distribuire il risolatte in sei bicchieri e guarnire con mandorle e zafferano."],"photo":"https://www.giallozafferano.com/images/333-33346/Saffron-Rice-Pudding_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Saffron-Rice-Pudding.html","pdfPage":132,"description":"Il tradizionale dolce casalingo preparato dalle nonne diventa un raffinato dessert al cucchiaio grazie a un sapiente mix di spezie e aromi... risolatte allo zafferano!"},{"id":"GZ-03580","name":"Torta biscotto senza cottura","category":"Dessert al cucchiaio e freddi","serves":"8 persone, stampo da 20 cm","prep":"30 min","cook":"Senza forno","rest":"Almeno 4 h in frigorifero","ingredients":["Biscotti al cacao per base: 250 g | Cioccolato fondente per base: 130 g | Burro: 50 g | Panna fresca liquida: 200 g (100 g freddi + 100 g da scaldare) | Formaggio fresco spalmabile: 750 g | Gelatina in fogli: 10 g | Zucchero a velo: 100 g | Estratto di vaniglia: 1 cucchiaino | Biscotti al cacao nella crema: 100 g | Cioccolato fondente per finitura: 100 g (quantità indicata nel procedimento, assente nell’elenco ingredienti)"],"steps":["Frullare 250 g di biscotti al cacao; sciogliere 130 g di cioccolato e amalgamarlo con il burro fuso.","Mescolare il cioccolato ai biscotti tritati, pressare nello stampo da 20 cm e riporre in frigorifero.","Mettere in ammollo la gelatina in acqua fredda.","Lavorare il formaggio con vaniglia, zucchero a velo e 100 g di panna fino a ottenere una crema liscia.","Scaldare i restanti 100 g di panna e sciogliervi la gelatina strizzata; lasciare intiepidire e incorporare alla crema.","Unire i 100 g di biscotti sbriciolati a mano, versare sulla base e lasciare rassodare in frigorifero per almeno 4 ore.","Sformare, fondere 100 g di cioccolato destinato alla finitura, distribuirlo sulla sommità e rimettere in frigorifero finché si solidifica."],"photo":"","source":"https://ricette.giallozafferano.it/Torta-biscotto-senza-cottura.html","pdfPage":133,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02735","name":"Gelato al cioccolato","category":"Gelati, sorbetti e granite","serves":"circa 1,75 lb di gelato","prep":"40 min","cook":"5 min","rest":"almeno 2 ore frigorifero + congelamento indicato in fonte","ingredients":["SCIROPPO: Acqua 150 g","Zucchero 350 g.\nGELATO: Latte intero 510 g","Tuorli 60 g","Cacao amaro 35 g","Cioccolato fondente 75% 120 g","Farina di semi di carrube 5 g.\nPer la miscela: sciroppo preparato 9,5 oz (quantità riportata dalla fonte EN)."],"steps":["Scaldare acqua e zucchero per lo sciroppo fino a 185 °F; spegnere ai primi bollori e lasciar raffreddare.","Prelevare 9,5 oz dello sciroppo preparato, unirlo al latte e ai tuorli in casseruola.","Incorporare cacao e farina di semi di carrube, mescolando con una frusta. Scaldare a 140 °F.","Aggiungere il cioccolato tritato e portare la miscela a 185 °F, fino a renderla omogenea e densa.","Trasferire in ciotola, coprire a contatto, raffreddare e lasciare in frigorifero almeno due ore.","Versare nella gelatiera e mantecare secondo la macchina, quindi servire o trasferire in congelatore."],"photo":"https://www.giallozafferano.com/images/277-27799/Chocolate-Ice-Cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Chocolate-Ice-Cream.html","pdfPage":134,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02736","name":"Gelato al cocco senza gelatiera","category":"Gelati, sorbetti e granite","serves":"circa 550 g per gusto (fonte: 19,5 oz)","prep":"10 min","cook":"2 min","rest":"circa 12 ore congelatore","ingredients":["Base cocco: latte di cocco 400 g (18% grassi)","acqua 100 g","zucchero 100 g. Variante pistacchio: latte di cocco 400 g","acqua 100 g","zucchero 100 g","pistacchi 80 g. Variante cioccolato: latte di cocco 400 g","acqua 100 g","zucchero 100 g","cioccolato fondente 80 g."],"steps":["Per ciascuna versione, sciogliere lo zucchero nell’acqua portando a bollore e lasciando sobbollire per circa 2 minuti.","Frullare lo sciroppo con il latte di cocco e versare in stampi per cubetti di ghiaccio; congelare per circa 10 ore.","Frullare i cubetti ghiacciati fino a ottenere una crema; trasferirla in un contenitore e rimetterla in freezer per altre 2 ore.","Per la variante al pistacchio, frullare i cubetti insieme ai pistacchi e lasciare rassodare 2–3 ore.","Per quella al cioccolato, sciogliere il fondente e unirlo ai cubetti durante la frullatura, poi far rassodare 2–3 ore."],"photo":"https://www.giallozafferano.com/images/279-27940/Coconut-Milk-Ice-Cream-Without-an-Ice-Cream-Maker_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Coconut-Milk-Ice-Cream-Without-an-Ice-Cream-Maker.html","pdfPage":135,"description":"Il gelato al cocco senza gelatiera è un dessert senza lattosio fresco, goloso e colorato, da gustare anche nella versione al pistacchio e al cioccolato!"},{"id":"GZ-02737","name":"Gelato al fiordilatte","category":"Gelati, sorbetti e granite","serves":"circa 1,5 kg / 15 porzioni dichiarate","prep":"10 min","cook":"5 min","rest":"4–12 ore in frigorifero; mantecatura circa 40–50 min","ingredients":["Latte intero 1 l","panna fresca liquida fredda 190 g","zucchero 230 g","baccello di vaniglia 1","farina di semi di carrube 2,5 g"],"steps":["Scaldare il latte con i semi della vaniglia, mescolando, fino ai primi segni di bollore.","Miscelare bene zucchero e farina di semi di carrube; versarli a pioggia nel latte caldo fuori dal fuoco, lavorando con una frusta.","Riportare brevemente a leggero bollore e raffreddare velocemente la base in un bagno di acqua e ghiaccio.","Sotto i 30 °C incorporare la panna fredda. Coprire e far maturare in frigorifero per 4–12 ore.","Rimescolare e mantecare nella gelatiera secondo la capacità della macchina, indicativamente 40–50 minuti, poi servire."],"photo":"","source":"https://www.giallozafferano.com.br/receitas/gelato-de-leite.html","pdfPage":136,"description":"Lo chef Ugo Alciati ha preparato per noi il gelato fiordilatte: 5 ingredienti per una bontà unica!"},{"id":"GZ-02738","name":"Gelato al latte di cocco","category":"Gelati, sorbetti e granite","serves":"circa 500 g / 4 porzioni","prep":"5 min","cook":"30 min dichiarati","rest":"almeno 30 min in frigorifero","ingredients":["Latte di cocco 300 g (tenore di grassi inferiore al 18%)","latte di mandorla 100 g","zucchero di canna 50 g","cioccolato fondente 100 g"],"steps":["Scaldare il latte di mandorla con lo zucchero finché completamente sciolto.","Mescolare la miscela dolce con il latte di cocco, coprire e refrigerare per almeno 30 minuti.","Versare nella gelatiera e mantecare per circa 25 minuti.","Sciogliere il cioccolato e versarlo a filo mentre la macchina continua a lavorare, per ottenere scaglie sottili.","Proseguire la mantecatura per circa 10 minuti, quindi servire o riporre in congelatore."],"photo":"","source":"https://www.giallozafferano.com/recipes/Coconut-milk-ice-cream.html","pdfPage":137,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02739","name":"Gelato al latte di cocco senza gelatiera","category":"Gelati, sorbetti e granite","serves":"circa 19,5 oz di gelato (base)","prep":"10 min","cook":"2 min","rest":"congelamento circa 12 ore","ingredients":["BASE: latte di cocco (18% grassi) 400 g","acqua 100 g","zucchero 100 g.\nVARIANTE PISTACCHIO: latte di cocco 400 g","acqua 100 g","zucchero 100 g","pistacchi 80 g.\nVARIANTE CIOCCOLATO: latte di cocco 400 g","acqua 100 g","zucchero 100 g","cioccolato fondente 80 g."],"steps":["Sciogliere lo zucchero nell'acqua, portare a ebollizione e lasciar sobbollire circa due minuti.","Frullare il latte di cocco con lo sciroppo e versare in stampi per cubetti; congelare per una notte, almeno dieci ore.","Frullare i cubetti congelati fino a ottenere una consistenza cremosa, trasferire in un contenitore e rimettere in freezer per altre due ore.","Per la variante al pistacchio, frullare i cubetti con i pistacchi; per quella al cioccolato, aggiungere il cioccolato precedentemente fuso. Congelare nuovamente per 2–3 ore."],"photo":"","source":"https://www.giallozafferano.com/recipes/Coconut-Milk-Ice-Cream-Without-an-Ice-Cream-Maker.html","pdfPage":138,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02740","name":"Gelato al limone senza gelatiera con 3 ingredienti","category":"Gelati, sorbetti e granite","serves":"4 persone / circa 1 kg","prep":"15 min","cook":"","rest":"una notte in freezer","ingredients":["Panna fresca liquida fredda 500 g","latte condensato 400 g","succo di limone 80 g. DECORAZIONE: scorza di limone e menta q.b."],"steps":["Versare panna ben fredda e latte condensato in una ciotola; montare con fruste elettriche fino a consistenza semimontata.","Incorporare il succo di limone e continuare a montare finché il composto diventa sodo e stabile.","Distribuire in una pirofila, livellare e lasciare nel congelatore per una notte.","Prima del servizio ammorbidire per 20-30 minuti a temperatura ambiente (oppure circa un'ora in frigorifero), porzionare e guarnire con scorza di limone e menta. Nota: la pagina presenta indicazioni di conservazione fra loro discordanti; non sono riportate come prescrizione."],"photo":"https://www.giallozafferano.com/images/363-36354/three-ingredient-no-churn-lemon-ice-cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/three-ingredient-no-churn-lemon-ice-cream.html","pdfPage":139,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02741","name":"Gelato al pistacchio senza gelatiera","category":"Gelati, sorbetti e granite","serves":"circa 700 g / 4 persone","prep":"15 min","cook":"","rest":"congelamento una notte + 6 h","ingredients":["Per circa 700 g: latte intero 200 g","panna fresca 200 g","acqua 100 g","zucchero 100 g","pistacchi 100 g."],"steps":["Scaldare acqua e zucchero in un pentolino a fiamma dolce fino a bollore, quindi lasciare raffreddare lo sciroppo.","Unire latte e panna, aggiungere lo sciroppo e frullare con mixer a immersione.","Distribuire il composto in stampi di silicone e congelare per una notte.","Estrarre i cubetti congelati e frullarli in un robot fino a ottenere una consistenza cremosa.","Aggiungere i pistacchi e frullare ancora; trasferire in un contenitore adatto e rimettere in freezer per almeno 6 ore.","Prima di servire lasciare a temperatura ambiente per 5-10 minuti e lavorare con il cucchiaio per ammorbidire."],"photo":"https://www.giallozafferano.com/images/255-25502/Easy-pistachio-ice-cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Easy-pistachio-ice-cream.html","pdfPage":140,"description":"Il gelato al pistacchio senza gelatiera è un'idea sfiziosa per l'estate, una ricetta perfetta da preparare a casa per ottenere una cremosità unica!"},{"id":"GZ-02744","name":"Gelato alla fragola","category":"Gelati, sorbetti e granite","serves":"circa 1 kg","prep":"40 min","cook":"15 min","rest":"freezer almeno 4 h","ingredients":["Per circa 1 kg di gelato: latte intero 500 ml","fragole 500 g","zucchero 150 g","panna fresca liquida 100 g","albumi medi 2."],"steps":["Lavare e mondare le fragole, frullarle e passarle al colino per eliminare i semi.","Scaldare il latte con lo zucchero, mescolando finché quest'ultimo si scioglie.","Sbattere panna e albumi, unirli al latte zuccherato e portare il composto a circa 83 °C per pastorizzarlo.","Raffreddare rapidamente il composto, poi incorporare la purea di fragole.","Mantecare in gelatiera per 30-35 minuti, oppure mettere in freezer mescolando periodicamente.","Trasferire in un contenitore e lasciare rassodare in freezer per almeno 4 ore prima del servizio."],"photo":"https://www.giallozafferano.com/images/278-27833/Strawberry-Ice-Cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Strawberry-Ice-Cream.html","pdfPage":141,"description":"Il gelato alla fragola è un rinfrescante dessert ideale per una merenda estiva. E' un gelato semplice da realizzare con ingredienti freschi e genuini"},{"id":"GZ-02746","name":"Gelato alla pesca","category":"Gelati, sorbetti e granite","serves":"4 persone","prep":"45 min","cook":"","rest":"circa 2 h raffreddamento","ingredients":["Pesche gialle 500 g (la pagina riporta anche 2,5 lb, discordanti con il valore metrico)","zucchero 130 g","latte intero 70 g","panna fresca liquida 120 g. Per decorare: pesca gialla 1."],"steps":["Lavare, sbucciare e denocciolare le pesche; tagliare la polpa a pezzetti.","Frullare le pesche con zucchero, latte e panna fino a ottenere una miscela liscia, filtrandola se necessario.","Versare nella gelatiera e mantecare per circa trenta minuti; in alternativa porre in freezer e mescolare periodicamente.","Trasferire in un contenitore basso e lasciar rassodare al freddo per circa due ore; prima del servizio ammorbidire per dieci minuti e guarnire con pesca fresca."],"photo":"https://www.giallozafferano.com/images/278-27870/Peach-Ice-Cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Peach-Ice-Cream.html","pdfPage":142,"description":"Il gelato alla pesca è un dessert delizioso dal gusto vellutato e dolce, realizzato con uno dei frutti più prelibati della stagione estiva: impossibile resistere!"},{"id":"GZ-02748","name":"Gelato alla stracciatella","category":"Gelati, sorbetti e granite","serves":"circa 1 kg di gelato","prep":"40 min","cook":"5 min","rest":"raffreddamento; almeno 3 ore in freezer","ingredients":["Latte intero 600 ml","cioccolato fondente 100 g","panna fresca liquida 250 g","zucchero 250 g","bacca di vaniglia 1."],"steps":["Aprire la bacca di vaniglia e raccogliere i semi. Versare latte e panna in un pentolino con zucchero, semi e bacca.","Scaldare dolcemente per pochi minuti, mescolando fino a sciogliere lo zucchero senza prolungare il bollore; eliminare il baccello e raffreddare il composto.","Trasferire la miscela nella gelatiera e mantecare per circa 30 minuti o fino a consistenza cremosa.","Tritare finemente il cioccolato fondente; aggiungerlo nell’ultimo minuto di mantecatura e distribuirlo nel gelato.","Riporre in un contenitore chiuso in freezer per almeno 3 ore prima di servire. La base è documentata anche nella ricetta ufficiale del gelato alla vaniglia."],"photo":"https://www.giallozafferano.com/images/278-27801/Stracciatella-Ice-Cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Stracciatella-Ice-Cream.html","pdfPage":143,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02749","name":"Gelato allo yogurt","category":"Gelati, sorbetti e granite","serves":"700 g di gelato","prep":"40 min","cook":"10 min","rest":"2 h frigorifero + 3–4 h freezer","ingredients":["Yogurt 500 ml","panna fresca liquida 125 ml","latte intero 125 ml","zucchero 120 g","glucosio 10 g","farina di semi di carrube 5 g."],"steps":["Riunire latte, panna, zucchero, glucosio e farina di carrube in una casseruola, mescolando per sciogliere le polveri.","Scaldare il composto fino a 80–85 °C; raffreddarlo immediatamente immergendo il recipiente in acqua e ghiaccio.","Coprire e trasferire in frigorifero per almeno due ore.","Unire lo yogurt ben freddo alla miscela, amalgamare e mantecare nella gelatiera per circa 30 minuti, finché il gelato è cremoso.","Riporre in un contenitore chiuso e lasciare rassodare in congelatore per 3–4 ore prima di servire."],"photo":"https://www.giallozafferano.com/images/278-27803/Yogurt-Ice-Cream_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Yogurt-Ice-Cream.html","pdfPage":144,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03814","name":"Granita al caffè con panna","category":"Gelati, sorbetti e granite","serves":"2 porzioni (circa 400 g di granita)","prep":"45 min","cook":"","rest":"","ingredients":["GRANITA: caffè espresso 250 ml","acqua 250 ml","zucchero 70 g.\nCOPERTURA: panna fresca liquida 200 ml","zucchero a velo 30 g."],"steps":["Preparare l'espresso e farlo raffreddare; sciogliervi lo zucchero, quindi unire l'acqua a temperatura ambiente.","Trasferire il composto in gelatiera per circa 30 minuti. Senza gelatiera, congelarlo in un contenitore largo, rompendo periodicamente i cristalli con una forchetta.","Montare la panna molto fredda con lo zucchero a velo fino a consistenza soda.","Suddividere la granita in due bicchieri e completare con la panna montata."],"photo":"","source":"https://www.giallozafferano.com/recipes/coffee-granita-with-whipped-cream.html","pdfPage":145,"description":"La granita al caffè, tipica della città di Messina, è un dessert dolce e rinfrescante, perfetto come dopo pasto ma anche per una merenda all'insegna della freschezza!"},{"id":"GZ-02764","name":"Granita al limone","category":"Gelati, sorbetti e granite","serves":"4 persone / circa 500 g","prep":"10 min","cook":"5 min","rest":"raffreddamento 60 min","ingredients":["Acqua 335 g","zucchero 90 g","succo di limone 75 g (circa 2 limoni)","scorza di 2 limoni."],"steps":["Scaldare acqua e zucchero a fuoco basso per circa 5 minuti fino a ottenere uno sciroppo; lasciarlo raffreddare.","Grattugiare la scorza di due limoni, spremerli e filtrare 75 g di succo.","Unire succo e scorza allo sciroppo ormai freddo.","Versare in gelatiera e mantecare per circa 35-40 minuti, finché la granita è cremosa ma consistente; servire."],"photo":"https://www.giallozafferano.com/images/278-27873/Lemon-Granita_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Lemon-Granita.html","pdfPage":146,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02316","name":"Bagel farciti","category":"Pane, focacce e panini","serves":"6 bagel farciti","prep":"50 min","cook":"40 min","rest":"lievitazione circa 5 ore","ingredients":["IMPASTO: acqua 205 g","farina tipo 0 350 g","sale fino 6 g","lievito di birra 4 g","malto 10 g","semi di sesamo q.b.\nFARCITURA CARNE: roast beef 70 g","caprino fresco 80 g","zucchine 100 g","pomodori 65 g","lattughino 50 g","sale e pepe q.b.\nFARCITURA PESCE: salmone affumicato 100 g","caprino fresco 80 g","zucchine 100 g","pomodori 65 g","lattughino 50 g","sale e pepe q.b.\nFARCITURA VEGETALE: caprino fresco 80 g","zucchine 100 g","pomodori 65 g","lattughino 50 g","ravanelli 25 g","carote 65 g","cetrioli 60 g."],"steps":["Impastare farina, lievito, malto e acqua; unire il sale, lavorare fino a ottenere una massa liscia e far lievitare coperto per circa 4 ore al tiepido.","Dividere in sei pezzi, arrotondarli, far riposare 10 minuti e aprire il centro formando gli anelli. Far lievitare altri 40–50 minuti.","Sbollentare ciascun anello per circa 20 secondi per lato, cospargere di sesamo e cuocere in forno statico a circa 220 °C per 30 minuti; lasciare intiepidire.","Grigliare le zucchine e affettare pomodori, carote, cetrioli e ravanelli.","Tagliare i bagel a metà e distribuire caprino, zucchine, lattuga e pomodoro; completarne due con roast beef, due con salmone e due con le altre verdure. Richiudere e servire."],"photo":"https://www.giallozafferano.com/images/327-32781/stuffed-bagel_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/stuffed-bagel.html","pdfPage":147,"description":"Divertitevi a preparate i bagel farciti per un brunch o aperitivo in perfetto American style scegliendo fra tre sfiziose alternative di ripieno, adatte a tutti i gusti!"},{"id":"GZ-02317","name":"Bagels","category":"Pane, focacce e panini","serves":"6 bagel da circa 90 g","prep":"30 min","cook":"30 min a 220 °C statico, oltre alla bollitura","rest":"circa 5 ore di lievitazione","ingredients":["Farina 0 350 g | Acqua a temperatura ambiente 205 g | Lievito di birra secco 4 g | Malto 10 g | Sale fino 6 g | Semi di sesamo q.b."],"steps":["Impastare farina, lievito, malto e acqua, incorporando il sale dopo la prima amalgama. | 2. Lavorare l’impasto fino a renderlo liscio e lasciarlo lievitare coperto per circa quattro ore a 28–30 °C. | 3. Dividere in sei porzioni da circa 90 g, formare palline e farle riposare dieci minuti. | 4. Aprire un foro centrale in ogni pezzo, allargarlo e lasciare lievitare ancora 40–50 minuti. | 5. Immergere i bagel in acqua bollente per circa 20 secondi per lato, poi scolarli. | 6. Cospargere di sesamo e cuocere in forno statico a 220 °C per circa 30 minuti, fino a doratura."],"photo":"","source":"https://ricette.giallozafferano.it/Bagels.html","pdfPage":148,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03594","name":"Baguette con lievito madre","category":"Pane, focacce e panini","serves":"6 baguette","prep":"60 min","cook":"30 min","rest":"12 ore biga + circa 4 ore lievitazioni","ingredients":["Impasto: farina tipo 0 340 g","farina 00 300 g","acqua 400 g","lievito madre 50 g","lievito di birra fresco 2 g","sale fino 16 g. Biga: farina tipo 0 160 g","acqua 80 g","lievito di birra fresco 5 g."],"steps":["La sera prima, sciogliere i 5 g di lievito nell’acqua della biga e impastare con 160 g di farina tipo 0; coprire e lasciare fermentare circa 12 ore.","Il giorno dopo dividere l’acqua dell’impasto: in metà sciogliere il sale, nell’altra il lievito fresco. Mescolare le due farine previste per l’impasto.","Unire alle farine biga e lievito madre, poi incorporare gradualmente acqua con lievito e acqua salata; impastare fino a consistenza morbida e liscia. Far raddoppiare per circa 2 ore.","Dividere in sei porzioni da circa 200 g, appiattire e arrotolare; lasciar riposare 45–60 minuti, poi stendere e modellare baguette di circa 35 cm.","Disporre su telo infarinato e far lievitare un’altra ora. Scaldare il forno a 250 °C con un recipiente d’acqua per generare vapore.","Incidere i pani, inumidirli leggermente e cuocere su teglia calda a 240 °C per circa 30 minuti; asciugare la crosta lasciando uscire il vapore e attendere altri 10 minuti nel forno spento. Raffreddare su griglia."],"photo":"https://www.giallozafferano.com/images/316-31629/baguette-with-sourdough_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/baguette-with-sourdough.html","pdfPage":149,"description":"La baguette con lievito madre è un pane francese, croccante fuori e soffice dentro, dalla tipica forma allungata a lievitazione naturale"},{"id":"GZ-02320","name":"Bretzel","category":"Pane, focacce e panini","serves":"5 bretzel","prep":"40 min","cook":"20 min","rest":"1 h 30 min di lievitazione e riposo","ingredients":["Farina 00 340 g","Acqua 185 g, per l’impasto","Sale fino 5 g","Lievito di birra secco 2 g","Burro 15 g, a temperatura ambiente","Fiocchi di sale q.b.","Bicarbonato di sodio 35 g, per il bagno","Acqua 2 l, per il bagno"],"steps":["Mescola farina, lievito e burro nell’impastatrice; versa gradualmente 185 g d’acqua.","Lavora fino a formare un impasto compatto, unisci il sale e continua finché è liscio.","Dividi in cinque porzioni di circa 100 g, forma cordoni lunghi circa 50 cm e intreccia le estremità nella tipica forma a nodo.","Sistema su un vassoio infarinato; fai lievitare 30 minuti e lascia poi in frigorifero per 1 ora.","Porta a ebollizione 2 l d’acqua con il bicarbonato; immergi ogni bretzel per 30–40 secondi e scola.","Trasferisci su carta forno, incidi la parte più spessa, cospargi con fiocchi di sale e cuoci a 220 °C statico per circa 20 minuti."],"photo":"https://www.giallozafferano.es/images/248-24822/bretzel_780x520_wm.jpg","source":"https://www.giallozafferano.es/recetas/bretzel.html","pdfPage":150,"description":"Il tipico pane di origine alsaziana dalla caratteristica forma annodata, ottimo per accompagnare formaggi e salumi insieme a una bella birra: bretzel!"},{"id":"GZ-02321","name":"Burger buns (panini da burger)","category":"Pane, focacce e panini","serves":"8 panini","prep":"45 min","cook":"30 min","rest":"circa 5 ore di lievitazione complessiva","ingredients":["Biga: farina Manitoba 100 g, acqua 50 g, lievito di birra fresco 5 g","impasto: farina Manitoba 200 g, farina 00 200 g, latte intero 200 g, miele di acacia 15 g, sale 15 g, burro morbido 25 g, uovo 55 g, tuorlo 15 g, olio EVO 25 g","finitura: 1 tuorlo, latte 30 g, semi di sesamo q.b."],"steps":["Mescolare acqua, lievito e 100 g di Manitoba, ottenendo una biga grossolana. Coprire e lasciar maturare circa 2 ore, fino al raddoppio.","Nell’impastatrice unire le altre farine, biga, miele e latte. Incorporare uovo e tuorlo, poi olio e sale; terminare con il burro morbido a piccoli pezzi.","Lavorare fino a impasto elastico e liscio; formare una palla e lasciar lievitare coperta altre 2 ore o fino al raddoppio.","Dividere in otto porzioni di circa 110 g, pirlare e disporre su teglia. Lasciar lievitare altri 30 minuti.","Spennellare con tuorlo e latte, aggiungere il sesamo e cuocere in forno statico preriscaldato a 190 °C per 25–30 minuti."],"photo":"","source":"https://www.giallozafferano.es/recetas/burger-buns-panecillos-para-hamburguesas.html","pdfPage":151,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02571","name":"Challah","category":"Pane, focacce e panini","serves":"4 persone (dose editoriale)","prep":"30 min","cook":"30 min","rest":"lievitazioni: 30 min + 3 ore + 30–45 min","ingredients":["PREIMPASTO: farina tipo 0 170 g","acqua tiepida 110 ml","lievito di birra secco 4 g. IMPASTO: farina Manitoba 520 g","zucchero 80 g","olio extravergine di oliva 65 g","miele 40 g","acqua tiepida 30 ml","uova 150 g (circa 3 medie)","tuorli 3","sale fino 15 g. PER SPENNELLARE: tuorlo 1","acqua q.b."],"steps":["Sciogliere il lievito nell’acqua tiepida, unirlo alla farina del preimpasto e lavorare fino a ottenere un panetto; far lievitare coperto circa 30 minuti.","Nella planetaria mescolare preimpasto, zucchero e miele; incorporare gradualmente la Manitoba, le uova e i tuorli.","Aggiungere l’olio a filo e infine l’acqua in cui è stato sciolto il sale; impastare fino a una massa liscia, poi far lievitare coperta per almeno 3 ore.","Suddividere in cinque cordoni di spessore simile e intrecciarli; ripiegare le estremità sotto il pane.","Far lievitare ancora 30–45 minuti, spennellare con tuorlo e acqua e cuocere in forno statico a circa 190 °C per 30–40 minuti, fino a doratura."],"photo":"https://www.giallozafferano.com/images/320-32002/challah_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/challah.html","pdfPage":152,"description":"La challah è una treccia di pasta lievitata, un pane dolce dalla consistenza simile al panbrioche, usato per celebrare lo shabbat ebraico"},{"id":"GZ-04053","name":"Ciabatta","category":"Pane, focacce e panini","serves":"10 ciabatte da circa 150–160 g","prep":"50 min","cook":"20 min","rest":"Lievitazione indicata dalla fonte: circa 6 h","ingredients":["POOLISH: farina Manitoba 200 g","farina 00 100 g","acqua 300 ml","lievito di birra secco 2 g. IMPASTO: farina Manitoba 400 g","farina 00 200 g","acqua 350 ml","lievito di birra secco 3 g","malto 10 g","sale fino 20 g","semola rimacinata q.b. per spolverare."],"steps":["Sciogliere 2 g di lievito in 300 ml d’acqua, unirli alle farine del poolish e mescolare fino a ottenere una massa uniforme e molto morbida. Coprire e lasciare fermentare circa 3 ore.","Per l’impasto finale sciogliere il lievito restante e il malto nei 350 ml d’acqua. Mescolare con le farine e con il poolish; lavorare fino a sviluppare una struttura elastica, quindi incorporare il sale.","Spostare la massa sul piano e praticare pieghe di rinforzo. Dividerla in 10 porzioni da circa 150–160 g, usando semola per evitare che si attacchi.","Lasciare lievitare i pezzi infarinati, coperti, per 60–90 minuti in ambiente tiepido, fino a evidente aumento di volume.","Capovolgere delicatamente i panetti, allungarli e adagiarli su una teglia già calda. Vaporizzare poca acqua nel forno per creare vapore.","Cuocere in forno statico a 240–250 °C per 8 minuti; abbassare a 200 °C per altri 8 minuti e completare per 3–4 minuti con lo sportello appena socchiuso. Raffreddare su una griglia."],"photo":"","source":"https://ricette.giallozafferano.it/Ciabatta.html","pdfPage":153,"description":"La ciabatta è un tipo di pane dalla forma allungata, di origini venete, dall'impasto idratato che presenta, dopo la cottura, una perfetta alveolatura"},{"id":"GZ-02332","name":"Cracker ai semi","category":"Pane, focacce e panini","serves":"30 cracker","prep":"10 min","cook":"25 min","rest":"","ingredients":["Farina di farro 130 g","farina integrale 120 g","semi di girasole 90 g","semi di lino 100 g","sesamo nero 90 g","sesamo bianco 60 g","olio EVO 150 g","acqua 130 g","sale fino q.b.","sale in fiocchi q.b."],"steps":["Riunire in una ciotola le due farine e tutte le varietà di semi, quindi mescolare.","Aggiungere sale fino e olio, amalgamare e incorporare l’acqua fino a ottenere un impasto compatto.","Dividere il composto in due e stendere ogni metà tra due fogli di carta forno fino a circa 2–3 mm di spessore. Regolarizzare la superficie e cospargere con sale in fiocchi.","Cuocere in forno ventilato a 180 °C per 13–15 minuti. Estrarre, incidere o tagliare in rettangoli e rimettere in forno per altri 4–5 minuti.","Lasciare raffreddare completamente prima di servire o riporre in una scatola di latta."],"photo":"https://www.giallozafferano.com/images/260-26083/Seed-crackers_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/Seed-crackers.html","pdfPage":154,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02333","name":"Cracker alla barbabietola","category":"Pane, focacce e panini","serves":"15–20 pezzi","prep":"20 min","cook":"10 min","rest":"","ingredients":["PER I CRACKER: farina di riso 100 g","fiocchi d'avena 40 g","barbabietola precotta 80 g","olio EVO 30 g","sale fino q.b.","semi misti 60 g.\nPER LA CREMA: formaggio fresco spalmabile 150 g","erba cipollina q.b.","olio EVO q.b.","sale fino q.b.","pepe nero q.b."],"steps":["Frullare la barbabietola precotta con l'olio fino a ottenere una purea uniforme.","Incorporare farina di riso, fiocchi d'avena, semi e sale; lavorare il composto fino a renderlo compatto.","Stendere l'impasto molto sottile tra due fogli di carta forno e tagliarlo in piccoli rettangoli.","Cuocere in forno statico preriscaldato a 200 °C per circa dieci minuti e lasciare raffreddare.","Mescolare il formaggio con erba cipollina tritata, olio, sale e pepe e servire come accompagnamento."],"photo":"","source":"https://www.giallozafferano.com/recipes/beetroot-crackers.html","pdfPage":155,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02334","name":"Cracker di farro","category":"Pane, focacce e panini","serves":"circa 40 cracker","prep":"15 min","cook":"25 min","rest":"","ingredients":["Per circa 40 cracker: farina di farro 250 g","vino bianco secco 80 g","olio EVO 50 g","burro freddo 25 g","timo 3 rametti","sale fino 6 g. Superficie: acqua q.b.","sale grosso 8 g (facoltativo)","semi di papavero 5 g","semi di girasole 5 g","semi di lino 5 g."],"steps":["Mescolare farina di farro, sale fino e foglioline di timo; sbriciolarvi il burro freddo.","Versare vino e olio, lavorando fino a ottenere un impasto compatto.","Stendere una sfoglia di circa 5 mm, bucherellarla e tagliarla in quadrati di circa 4 cm.","Riunire semi e sale grosso in una ciotola.","Sistemare i quadrati su teglia foderata, spennellare con poca acqua e far aderire il mix di semi.","Cuocere in forno statico a circa 170 °C per 25 minuti, quindi lasciare raffreddare."],"photo":"https://www.giallozafferano.com/images/331-33165/spelt-crackers_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/spelt-crackers.html","pdfPage":156,"description":"Uno snack sfizioso e ricco di fibre per attacchi di fame fuori orario, ideale da sgranocchiare a metà mattina o a metà pomeriggio... cracker di farro!"},{"id":"GZ-02336","name":"Crackers","category":"Pane, focacce e panini","serves":"circa 60 cracker","prep":"30 min","cook":"15 min","rest":"circa 2 h lievitazione","ingredients":["Farina 00 500 g","olio EVO 120 g","lievito di birra 4 g","sale fino 10 g","acqua 180 ml. Per spennellare: olio EVO 3 cucchiai","acqua 2 cucchiai","sale fino q.b."],"steps":["Setacciare la farina; sciogliere il lievito in poca acqua della dose e incorporarlo alla farina.","Aggiungere olio e il resto dell'acqua in cui è stato sciolto il sale; lavorare fino a ottenere un impasto liscio e farlo lievitare coperto per circa due ore.","Tirare sfoglie molto sottili, tagliarle in rettangoli e forarle con una forchetta o uno stecchino.","Disporre su carta forno, spennellare con acqua e olio, salare a piacere e cuocere in forno statico a 200 °C per circa 12-15 minuti; raffreddare su una griglia."],"photo":"","source":"https://www.giallozafferano.com/recipes/cracker.html","pdfPage":157,"description":"I crackers sono sfoglie sottili e croccanti di pasta di pane, conosciuti in tutto il mondo: oggi vi mostriamo come farli in casa!"},{"id":"GZ-02338","name":"Crescia al formaggio","category":"Pane, focacce e panini","serves":"12 porzioni","prep":"20 min","cook":"50 min","rest":"circa 4 ore di lievitazione","ingredients":["LIEVITINO: Farina 0 100 g","Latte intero 100 g","Lievito di birra fresco 10 g.\nIMPASTO: Farina 0 400 g","Uova 275 g (circa 5 medie)","Pecorino Romano DOP 150 g","Parmigiano Reggiano DOP 150 g","Strutto 130 g","Pepe nero 2 cucchiaini","Sale fino q.b.\nSTAMPO: Olio EVO q.b.","Farina 00 q.b."],"steps":["Sciogliere il lievito nel latte tiepido e incorporare i 100 g di farina del lievitino. Coprire e attendere circa due ore, finché raddoppia.","Riunire farina, formaggi grattugiati e pepe. Incorporare lievitino, uova appena sbattute e strutto morbido a pezzetti.","Impastare per circa dieci minuti; aggiungere il sale verso la fine. Eseguire pieghe e formare una palla.","Ungere e infarinare lo stampo alto, trasferirvi l’impasto e lasciare lievitare circa due ore, o finché arriva vicino al bordo.","Cuocere in forno statico a 320 °F per 40 minuti, poi a 338 °F per altri dieci. Controllare con uno stecchino.","Sformare dopo un breve raffreddamento e tagliare solo quando completamente fredda."],"photo":"https://www.giallozafferano.com/images/342-34292/cheese-crescia_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/cheese-crescia.html","pdfPage":158,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02342","name":"Focaccia ad alta idratazione","category":"Pane, focacce e panini","serves":"6 persone (teglia 38×25 cm)","prep":"60 min","cook":"40 min","rest":"circa 13 h, inclusa maturazione","ingredients":["IMPASTO: farina tipo 1 400 g","acqua fredda 320 g","sale fino 8 g","olio EVO 15 g","lievito di birra fresco 6 g.\nSUPERFICIE: olio EVO q.b.","sale q.b.\nPER SPOLVERARE: farina di mais q.b."],"steps":["Setacciare la farina e unirvi circa 270 g dell'acqua prevista, lavorando brevemente fino a idratarla. Coprire e attendere un'ora.","Sciogliere il lievito nell'acqua rimasta e incorporarlo gradualmente con le fruste a gancio; aggiungere il sale e infine l'olio a filo.","Lasciare riposare dieci minuti, eseguire un giro di pieghe nella ciotola e attendere 40 minuti. Ripetere le pieghe.","Far maturare in frigorifero per circa dodici ore oppure a temperatura ambiente per circa due ore e mezza, fino a triplicare il volume.","Ungere e infarinare con farina di mais una teglia di circa 38×25 cm. Distendere delicatamente l'impasto e trasferirlo in teglia senza schiacciarlo troppo.","Condire la superficie con olio e sale, cuocere in forno ventilato preriscaldato a 200 °C per 35–40 minuti e raffreddare su una griglia."],"photo":"","source":"https://www.giallozafferano.com/recipes/high-hydration-focaccia.html","pdfPage":159,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-02344","name":"Focaccia al miglio","category":"Pane, focacce e panini","serves":"4 persone / stampo 24 cm","prep":"25 min","cook":"35 min","rest":"circa 2 h 30 min","ingredients":["IMPASTO: farina 00 100 g","farina integrale di miglio bruno 70 g","Manitoba 90 g","acqua 150 g","lievito fresco 5 g","malto 20 g","sale fino 15 g","olio EVO 25 g. COPERTURA: bietole 80 g","olio EVO q.b.","aglio 1 spicchio","provola affumicata 50 g","sale Maldon q.b. SALAMOIA: olio EVO 25 g","acqua 25 g."],"steps":["Sciogliere il lievito nell'acqua, unirlo alle farine e al malto; impastare e incorporare olio e sale.","Eseguire pieghe brevi, far riposare cinque minuti, ripetere e lasciare lievitare in ciotola oliata per circa due ore.","Appassire le bietole in padella con olio e aglio. Stendere l'impasto in una teglia rotonda da 24 cm, disporre le bietole al centro e spennellare il bordo con emulsione di acqua e olio.","Lasciare lievitare altri 20 minuti, aggiungere sale Maldon e cuocere in forno statico a 210 °C per 30 minuti.","Distribuire le fettine di provola e rimettere in forno per circa cinque minuti, finché il formaggio fonde."],"photo":"https://www.giallozafferano.com/images/335-33536/millet-focaccia_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/millet-focaccia.html","pdfPage":160,"description":"La focaccia al miglio è davvero una gustosa scoperta: provatela al naturale o farcita con erbette e provola affumicata come nella ricetta che vi proponiamo!"},{"id":"GZ-02345","name":"Focaccia alla genovese","category":"Pane, focacce e panini","serves":"8 persone; 2 teglie 30×40 cm","prep":"30 min","cook":"15 min","rest":"lievitazioni circa 3 ore","ingredients":["IMPASTO: farina 00 400 g (W=280)","farina Manitoba 250 g (W=400)","acqua 335 g","sale fino 13 g","malto 10 g","lievito di birra fresco 18 g","olio EVO 30 g. TEGLIE: olio EVO 30 g. SUPERFICIE: olio EVO 60 g. SALAMOIA: sale 10 g","acqua 200 g."],"steps":["Mescolare le farine, aggiungere gradualmente l'acqua, il malto e il sale; incorporare il lievito sbriciolato.","Lavorare energicamente l'impasto e incorporare l'olio; proseguire fino a ottenere una massa elastica e omogenea, circa 13–15 minuti.","Dividere in due porzioni, eseguire le pieghe, coprire e lasciare riposare circa 30 minuti.","Ungere due teglie; allargare ogni impasto, sistemarlo in teglia e lasciare rilassare 20–30 minuti. Distendere fino ai bordi e far lievitare un'altra ora.","Preparare la salamoia sciogliendo il sale nell'acqua; creare con le dita le fossette sulla superficie.","Distribuire su ogni focaccia circa 30 g di olio e 90 g di salamoia; attendere ancora 40–45 minuti.","Cuocere in forno statico preriscaldato a 230 °C per circa 15 minuti; intiepidire prima di tagliare."],"photo":"https://www.giallozafferano.com/images/229-22904/focaccia-fugassa-alla-genovese-genoa-style-focaccia_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/focaccia-fugassa-alla-genovese-genoa-style-focaccia.html","pdfPage":161,"description":"Morbida e fragrante allo stesso tempo, alta circa 2 cm e lucida d'olio... è così che si deve presentare la focaccia alla genovese! Siete pronti a mettere le mani in pasta?"},{"id":"GZ-02346","name":"Focaccia allo yogurt","category":"Pane, focacce e panini","serves":"4 persone","prep":"35 min","cook":"25 min","rest":"lievitazioni circa 4 h 30 min","ingredients":["IMPASTO: farina tipo 0 400 g","acqua 220 g","miele 1 cucchiaino","lievito di birra fresco 4 g","yogurt bianco naturale 125 g","sale fino 8 g","olio EVO 40 g. SALAMOIA: acqua 10 ml","olio EVO 10 ml","sale fino 1 cucchiaino. SUPERFICIE: rosmarino 1 rametto."],"steps":["Sciogliere il lievito nell'acqua e aggiungere il miele.","Unire la miscela alla farina e al sale, impastare; incorporare yogurt e olio fino a ottenere una massa omogenea.","Coprire e lasciare lievitare in ambiente tiepido per circa tre ore, fino a triplicare il volume.","Dare rapidamente forma all'impasto e lasciarlo lievitare nuovamente per circa un'ora.","Stendere delicatamente in una teglia con carta forno; spennellare con una salamoia di acqua, olio e sale e cospargere di rosmarino.","Lasciare riposare 30 minuti e cuocere in forno statico a 200 °C per circa 25 minuti, finché dorata."],"photo":"https://www.giallozafferano.com/images/338-33848/yogurt-focaccia_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/yogurt-focaccia.html","pdfPage":162,"description":"Preparare i lievitati in casa è sempre una grande soddisfazione: oggi vi proponiamo la focaccia allo yogurt, morbida e saporita al punto giusto!"},{"id":"GZ-02347","name":"Focaccia arrotolata","category":"Pane, focacce e panini","serves":"6 persone","prep":"20 min","cook":"30 min","rest":"almeno 12 h","ingredients":["Manitoba 350 g","farina 00 150 g","acqua 300 g","olio EVO 40 g","lievito di birra fresco 1,5 g","sale fino 10 g. COPERTURA: pomodori secchi sott'olio 15 g","olive verdi denocciolate 10 g","olive nere denocciolate 10 g","origano secco 2 cucchiaini","sale 2 cucchiaini","olio EVO 2 cucchiaiate."],"steps":["Amalgamare farine, lievito e acqua, poi aggiungere olio e sale; impastare brevemente e formare una palla.","Trasferire in una ciotola oliata, coprire e far lievitare al riparo da correnti d'aria per almeno 12 ore.","Stendere l'impasto in un rettangolo lungo circa 50 cm e dividerlo in due strisce longitudinali. Condire con olio, origano e sale.","Attorcigliare le strisce su se stesse e avvolgerle a spirale in una teglia unta, collegando la seconda alla prima.","Inserire nelle scanalature olive e pomodori secchi, condire con altro olio e cuocere in forno statico a 200 °C per circa 35 minuti."],"photo":"https://www.giallozafferano.com/images/332-33209/rolled-focaccia_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/rolled-focaccia.html","pdfPage":163,"description":"La focaccia arrotolata è uno sfizio originale da condividere con i propri amici personalizzandola con gli ingredienti che la fantasia vi suggerisce!"},{"id":"GZ-02348","name":"Focaccia col formaggio (di Recco)","category":"Pane, focacce e panini","serves":"8 persone / 2 teglie","prep":"20 min","cook":"15 min","rest":"1 h 30 min circa","ingredients":["IMPASTO (2 teglie): farina Manitoba W 360-380 800 g","acqua 420 g","sale fino 16 g","olio EVO 40 g. FARCITURA E FINITURA: crescenza 800 g","olio EVO circa 20 g."],"steps":["Impastare farina, acqua, sale e olio fino a ottenere una massa liscia; fare alcune pieghe e lasciare riposare coperto 20 minuti.","Suddividere in quattro panetti, due maggiori per le basi e due minori per le coperture. Formare le palline, coprirle e riporle in frigorifero per circa un'ora; riportarle poi 10 minuti a temperatura ambiente.","Stendere sottilissima una porzione grande e adagiarla su teglia oliata, lasciando sporgere i bordi; distribuire metà crescenza a pezzetti.","Stendere una sfoglia ancora più sottile con un panetto piccolo, coprire il formaggio e sigillare i bordi; praticare fori sopra la farcitura.","Spennellare con olio o una leggera emulsione di acqua, olio e sale; rifilare e cuocere a circa 250 °C per 7-8 minuti, regolando in base al forno. Ripetere per la seconda focaccia."],"photo":"https://www.giallozafferano.com/images/229-22905/focaccia-recco-cheese-focaccia_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/focaccia-recco-cheese-focaccia.html","pdfPage":164,"description":"La focaccia col formaggio è una specialità ligure ed è nata a Recco: è una focaccia sottile ripiena di crescenza. Scopri le dosi e come si prepara!"},{"id":"GZ-02356","name":"Focaccia con zucchine","category":"Pane, focacce e panini","serves":"6 persone","prep":"50 min","cook":"25 min","rest":"poolish 12 h + lievitazioni","ingredients":["POOLISH: Manitoba 100 g","acqua 100 g","lievito di birra fresco 1 g. IMPASTO: farina 00 400 g","acqua 200 g","sale fino 10 g","malto 1 cucchiaino","olio EVO 20 g","lievito fresco 4 g. COPERTURA: zucchine 100 g","olio EVO 10 g","sale e pepe q.b."],"steps":["Mescolare Manitoba, acqua e lievito del poolish; coprire e lasciare a temperatura ambiente per 12 ore.","Incorporare al poolish acqua, lievito, farina, malto, olio e sale; impastare per circa 10 minuti e far lievitare in ciotola oliata per 3 ore.","Dare alcune pieghe, trasferire l'impasto in una teglia oliata di circa 38 x 28 cm e far riposare 30 minuti.","Stendere con le dita, attendere altri 30 minuti; distribuire le zucchine tagliate sottilissime e attendere 15 minuti.","Condire con olio, sale e pepe, cuocere in forno ventilato a 210 °C per circa 25 minuti; raffreddare leggermente su griglia."],"photo":"https://www.giallozafferano.com/images/335-33583/focaccia-with-zucchini_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/focaccia-with-zucchini.html","pdfPage":165,"description":"Soffice e fragrante al tempo stesso, la focaccia con zucchine attirerà tutti a tavola col suo profumo irresistibile!"},{"id":"GZ-00225","name":"gnocco fritto","category":"Pane, focacce e panini","serves":"50 pezzi","prep":"60 min","cook":"2 min","rest":"da 1 a 12 ore","ingredients":["Strutto 35 g","farina tipo 0 500 g","zucchero 5 g","sale fino 15 g","acqua circa 125 g","latte intero 100 g","lievito istantaneo per preparazioni salate 12 g","PER FRIGGERE: olio di semi q.b."],"steps":["Mescolare acqua e latte. In una ciotola riunire farina, lievito, zucchero e sale; incorporare lo strutto e poi i liquidi, lavorando fino a un impasto compatto.","Coprire e far riposare in luogo fresco da almeno 1 ora fino a 12 ore.","Dividere l'impasto e stenderlo molto sottile; ricavare rettangoli di circa 8 x 7 cm, riutilizzando i ritagli.","Friggere pochi pezzi per volta in olio a circa 170 °C, girandoli quando dorati. Scolare su carta assorbente e servire caldi."],"photo":"https://www.giallozafferano.com/images/227-22790/gnocco-fritto-fried-dough_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/gnocco-fritto-fried-dough.html","pdfPage":166,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03889","name":"Acquasale","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"20 min","cook":"non previsto","rest":"","ingredients":["Friselle 4","sedano 60 g","pomodorini 125 g","cipolla rossa di Tropea 50 g","cetrioli bianchi piccoli 80 g","olio extravergine di oliva 40 g","acqua 100 g","sale fino q.b."],"steps":["Lavare tutte le verdure. Privare il sedano dei filamenti e tagliarlo a listarelle; affettare finemente la cipolla. 2. Dividere i pomodorini in piccoli spicchi e i cetrioli in mezze rondelle. 3. In un piatto fondo capiente emulsionare l’acqua con l’olio e un pizzico di sale. 4. Incorporare pomodorini, cetrioli, cipolla e sedano e mescolare. 5. Disporre le friselle attorno alle verdure e servire; aggiungerle all’ultimo per preservarne la consistenza."],"photo":"","source":"https://www.giallozafferano.com/recipes/acquasale.html","pdfPage":167,"description":"Pomodori, cetrioli, cipolle e freselle fanno subito estate... festeggiamo questa giornata di vacanza e relax con un piatto povero tipico del meridione: acquasale!"},{"id":"GZ-03917","name":"Arepas ripiene di carne","category":"Piatti unici e cucine del mondo","serves":"8 arepas","prep":"60 min","cook":"2 h 50 min","rest":"Marinatura almeno 2 h","ingredients":["AREPAS: farina di mais bianco precotta 320 g","acqua 400 g","olio di semi di mais 1 cucchiaio","sale fino 1 cucchiaino. CARNE: punta di petto di manzo 1.350 g","cipolle 350 g","peperoni rossi 350 g","aglio 1 spicchio","acqua 500 g","rum 40 g","olio EVO 2 cucchiai","paprika affumicata 1 cucchiaio","cumino 1 cucchiaio","sale fino 1 cucchiaio","pepe nero 1 cucchiaio. GUACAMOLE: avocado 2","succo di 1 lime","olio EVO 1 cucchiaio","sale q.b. FINITURA: Edamer 120 g","prezzemolo q.b."],"steps":["Condire la punta di petto con sale, paprika, cumino e pepe. Lasciare insaporire almeno due ore; per sicurezza alimentare effettuare la marinatura in frigorifero.","Rosolare la carne in casseruola per circa 10 minuti. Metterla da parte; nello stesso recipiente stufare cipolle, peperoni e aglio per circa 5 minuti, sfumare con il rum e rimettere la carne.","Unire 500 g di acqua, coprire e cuocere a calore moderato per circa 2 ore e mezza. Sfilacciare il manzo cotto e amalgamarlo con il suo fondo e le verdure.","Per le arepas mescolare 400 g di acqua con sale e olio, incorporare la farina di mais e far riposare la massa 3 minuti. Dividere in otto parti da circa 90 g e formare dischi spessi circa 1,5 cm.","Cuocere i dischi in padella con poco olio di semi, circa 4 minuti su un lato e 3 sull’altro. Schiacciare la polpa di avocado con lime, olio e sale.","Aprire le arepas, farcirle con carne sfilacciata, guacamole, Edamer grattugiato e prezzemolo. Servire calde."],"photo":"","source":"https://ricette.giallozafferano.it/Arepas-ripiene-di-carne.html","pdfPage":168,"description":"Le arepas ripiene di carne sono delle tipiche focaccine a base di farina di mais con una ricca farcitura che si ispira ai sapori del Venezuela!"},{"id":"GZ-03837","name":"Burrito","category":"Piatti unici e cucine del mondo","serves":"4 burrito","prep":"60 min","cook":"2 h 20 min","rest":"30 min impasto","ingredients":["Tortillas: farina 00 350 g, acqua tiepida 190 g, strutto 30 g, lievito istantaneo salato 6 g, sale 6 g. Chili: manzo macinato 450 g, fagioli neri precotti 400 g (peso non scolato), peperone rosso 150 g, passata 250 g, brodo di carne 500 g, cipolla rossa 150 g, aglio 1 spicchio, peperoncino fresco 1, coriandolo macinato 1 cucchiaino, cumino 1 cucchiaino, zucchero di canna 1 cucchiaino, olio EVO/sale/pepe q.b. Farcitura: Edamer 150 g, mais 160 g, avocado 1, lime 1, sale q.b."],"steps":["Rosolare il macinato in poco olio; aggiungere una parte del brodo, farlo evaporare e tenere la carne da parte.","Nella stessa casseruola cuocere peperone, cipolla, aglio e peperoncino con spezie e zucchero; unire la carne, la passata e il brodo rimasto.","Stufare coperto a fuoco moderato per circa 60 minuti; aggiungere i fagioli con il liquido e proseguire per altri 40 minuti.","Per le tortillas impastare farina, strutto, lievito, sale e acqua tiepida; riposare 30 minuti, dividere in quattro dischi sottili da circa 27 cm.","Cuocere ogni tortilla circa 40 secondi per lato su piastra calda, conservandola coperta.","Farcire con chili, formaggio, mais e avocado condito con lime; ripiegare i lati e arrotolare, quindi dorare i burrito in padella con la chiusura verso il basso."],"photo":"","source":"https://ricette.giallozafferano.it/Burrito.html","pdfPage":169,"description":"Il burrito è un'appetitosa ricetta tex-mex: una tortilla di farina avvolge un ricco ripieno di chili con carne e formaggio! Scopri come si prepara"},{"id":"GZ-03839","name":"Chili con carne","category":"Piatti unici e cucine del mondo","serves":"4 porzioni","prep":"15 min","cook":"2 ore","rest":"riposo 10 min","ingredients":["Manzo macinato 800 g","fagioli neri precotti 1170 g (peso lordo)","peperone rosso 250 g","passata di pomodoro 500 g","brodo di carne 360 g","cipolle bianche 160 g","cipolla rossa 100 g","aglio 3 spicchi","peperoncino fresco 1","olio EVO 30 g","cumino in polvere 1 cucchiaino","coriandolo in polvere 1 cucchiaino","zucchero di canna 1 cucchiaino","pepe nero 1 cucchiaino","sale fino 2 cucchiaini","coriandolo fresco q.b. per decorare."],"steps":["Tritare aglio e cipolle; tagliare peperone e peperoncino privandoli dei semi in eccesso.","Rosolare il manzo in metà olio con una parte del sale, bagnando con poco brodo; metterlo da parte.","Nello stesso tegame soffriggere cipolle, aglio e peperoncino; unire il peperone, sale, pepe, zucchero, cumino e coriandolo in polvere.","Cuocere le verdure per circa 10 minuti con un mestolo di brodo, poi reinserire la carne.","Aggiungere passata e brodo restante e sobbollire per circa un'ora.","Incorporare i fagioli con parte del loro liquido e proseguire per circa 40 minuti. Far riposare dieci minuti e completare con coriandolo fresco."],"photo":"","source":"https://www.giallozafferano.com/recipes/Chili-con-carne.html","pdfPage":170,"description":"Il chili con carne è un piatto tipico messicano formato principalmente da carne tagliata a cubetti e fagioli rossi cotti assieme a peperoni, cipolle, aglio, spezie e pomodori"},{"id":"GZ-00119","name":"Cous cous alle verdure","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"25 min","cook":"15 min","rest":"","ingredients":["COUSCOUS: couscous precotto 160 g","acqua calda 320 g","olio EVO 10 g","curcuma 1 cucchiaino","sale 1 pizzico. VERDURE: carote 180 g","melanzane 180 g","pomodorini 100 g","olio EVO 20 g","peperoncino fresco 1","cipollotti 100 g","aglio 1 spicchio","zucchine 180 g","taccole 100 g","zenzero fresco 10 g","sale q.b. DECORAZIONE: menta alcune foglie."],"steps":["Pulire le verdure: tagliare melanzane a cubetti, carote e zucchine a bastoncini, taccole a pezzetti e pomodorini a metà; tritare i cipollotti.","Scaldare l’olio con aglio e peperoncino; saltare melanzane e cipollotti, quindi unire carote, taccole e zucchine.","Salare e completare la cottura a fiamma vivace; togliere l’aglio, aggiungere i pomodorini per 1-2 minuti e profumare con zenzero grattugiato.","Condire il couscous con sale, curcuma e olio, bagnarlo con acqua calda e coprire per circa 2 minuti. Sgranare con la forchetta.","Servire il couscous con le verdure e foglioline di menta."],"photo":"https://ptps.stbm.it/t/y72s05_large.jpg","source":"https://www.giallozafferano.com/recipes/Vegetable-couscous.html","pdfPage":171,"description":"Il cous cous alle verdure è un piatto dal gusto esotico, fresco e saporito; in questa versione mediterranea è arricchito da croccanti e colorate verdure di stagione!"},{"id":"GZ-00122","name":"Couscous alla marocchina","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"25 min","cook":"1 h 40 min","rest":"","ingredients":["COUSCOUS: couscous precotto 200 g","zafferano 0,16 g (1 bustina)","sale 1 pizzico. STUFATO: polpa di cosciotto d’agnello 1 kg","cipolle bianche 80 g","zenzero fresco 30 g","carote 160 g","zucchine 300 g","uva passa 50 g","ceci precotti 100 g","prezzemolo, olio EVO e sale q.b. BRODO: osso del cosciotto d'agnello","cipolle bianche 80 g","carote 130 g","cannella in stecche 1","sale grosso 10 g","pepe in grani 3 g","acqua 2 l."],"steps":["Preparare il brodo con osso d’agnello, carote, cipolla, cannella, pepe, sale e acqua; sobbollire 40 minuti e filtrare.","Stufare cipolla e zenzero con olio e poco brodo; aggiungere la polpa d’agnello a pezzi e coprire con brodo caldo.","Cuocere coperto per 30 minuti, poi unire carote, zucchine e ceci e proseguire per 20 minuti; aggiungere l’uvetta negli ultimi 5 minuti.","Distribuire il couscous in un recipiente con sale e zafferano, versare circa 200–250 g di brodo caldo e lasciare gonfiare coperto per 3 minuti.","Sgranare il couscous e servirlo con agnello e verdure, completando con prezzemolo tritato."],"photo":"https://www.giallozafferano.it/images/171-17166/Couscous-alla-marocchina_780x520_wm.jpg","source":"https://ricette.giallozafferano.it/Couscous-alla-marocchina.html","pdfPage":172,"description":"Un piatto dalle origini antichissime, diffuso nei paesi del Maghreb: il couscous alla marocchina è perfetto per una cena informale e spensierata con gli amici!"},{"id":"GZ-00128","name":"Couscous con verdure e polpettine di pesce","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"45 min","cook":"30 min","rest":"","ingredients":["COUSCOUS: couscous 250 g","acqua 250 g","polpa di zucca 200 g","carote 150 g","fagiolini 150 g","zucchine piccole 120 g","cipollotti freschi 2","sedano 1 costa","scorza di limone non trattato 1/2","olio EVO q.b.","sale fino q.b.","pepe nero q.b.","menta q.b.","POLPETTINE: filetto di orata 260 g","patata media 1","timo 1 rametto","pangrattato 30 g","prezzemolo q.b.","farina 00 q.b.","olio EVO q.b.","sale q.b.","pepe q.b."],"steps":["Lessare la patata, pulire e spinare accuratamente l'orata, tritarne la polpa e unirla alla patata schiacciata, al timo, al prezzemolo, al pangrattato, al sale e al pepe.","Formare polpettine piccole, passarle nella farina e conservarle in frigorifero mentre si preparano le verdure.","Ridurre a pezzetti sedano, carote, cipollotti, zucca e fagiolini; farli cuocere in padella con olio, iniziando da sedano e carote, poi aggiungendo cipollotto, fagiolini e zucca. Regolare il condimento.","Cuocere il couscous nell'acqua indicata con sale e olio, lasciandolo assorbire; sgranarlo e unirlo alle verdure, aggiungendo le zucchine a fettine negli ultimi minuti.","Rosolare rapidamente le polpettine in olio caldo fino a doratura, scolarle e incorporarle al couscous. Completare con menta e scorza di limone."],"photo":"https://www.giallozafferano.com/images/318-31870/couscous-with-vegetables-and-fish-balls_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/couscous-with-vegetables-and-fish-balls.html","pdfPage":173,"description":"Il couscous con verdure e polpettine di pesce è un piatto unico fresco e goloso, arricchito da polpettine di orata e da zucchine, fagiolini e carote"},{"id":"GZ-00129","name":"couscous freddo di pollo","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"20 min","cook":"15 min","rest":"","ingredients":["COUSCOUS: couscous precotto 200 g","brodo vegetale bollente 220 g","olio EVO 10 g","sale 1 pizzico. CONDIMENTO: petto di pollo 800 g","zucchine 200 g","peperone rosso 100 g","carote 140 g","piselli 100 g","scalogno 1","pepe nero q.b.","sale q.b.","paprika dolce q.b.","brodo vegetale q.b.","olio EVO q.b.","scorza di limone 1."],"steps":["Preparare il brodo vegetale; tagliare carote, zucchine e peperone a piccoli cubetti e tritare lo scalogno.","Saltare le verdure con lo scalogno, aggiungendo i piselli e poco brodo; mantenerle consistenti e farle raffreddare.","Tagliare il pollo a bocconcini, condirlo con paprika, sale e pepe, cuocerlo in padella con olio e lasciarlo raffreddare.","Versare sul couscous sale, olio e brodo bollente; coprire per circa 5 minuti, poi sgranare.","Riunire couscous, pollo e verdure; completare con scorza di limone e servire freddo."],"photo":"https://www.giallozafferano.com/images/278-27896/Cold-Chicken-Couscous_1200x800.jpg","source":"https://www.giallozafferano.com/recipes/Cold-Chicken-Couscous.html","pdfPage":174,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03841","name":"Curry verde Thai","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"30 min","cook":"30 min","rest":"","ingredients":["Pasta curry: peperoncini verdi piccanti 6","zenzero fresco 4 cm","scalogno 1","sale 1 cucchiaino","semi di coriandolo 1 cucchiaino","semi di cumino 1 cucchiaino","aglio 2 spicchi","lemongrass 2 gambi","foglie di kaffir lime 3. Curry: petto di pollo 400 g","melanzana lunga 1","fagiolini 150 g","aglio 1 spicchio","zenzero 3 cm","zucchero 1 cucchiaino","latte di cocco 600 g","acqua 300 g","olio di semi 2 cucchiai","peperoncino fresco 1","coriandolo 1 ciuffo","salsa di soia 2 cucchiai","cipolla 1."],"steps":["Tostare brevemente i semi di cumino e coriandolo; tritare lemongrass, zenzero, aglio, scalogno e peperoncini, quindi frullare con sale e foglie di lime per ottenere una pasta aromatica.","Affettare la cipolla e tagliare il pollo a strisce; rosolare con olio e zenzero, poi tenere la carne da parte.","Mondare melanzana e fagiolini; nella stessa padella scaldare la pasta curry e diluirla con latte di cocco e acqua.","Riunire verdure e pollo, condire con zucchero e salsa di soia e completare la cottura; servire con coriandolo e peperoncino fresco."],"photo":"https://ptps.stbm.it/t/e7095r_large.jpg","source":"https://www.giallozafferano.com/recipes/thai-green-curry.html","pdfPage":175,"description":"Il curry verde Thai è un delizioso piatto unico thailandese composto da manzo e verdure cotte nel latte di cocco insaporito con curry verde"},{"id":"GZ-03842","name":"Currywurst","category":"Piatti unici e cucine del mondo","serves":"4 persone","prep":"10 min","cook":"20 min","rest":"","ingredients":["Würstel di vitello 4","curry 1 cucchiaio (per bollitura). Salsa: cipolla bianca 1","curry 4 cucchiaini","paprika 1 cucchiaino","cumino 1 cucchiaino","paprika dolce 1 cucchiaino","sale fino q.b.","acqua calda 2 mestoli","passata di pomodoro 250 g","olio EVO q.b.","ketchup 250 g. Contorno: patate 200 g","patate dolci 200 g","sale q.b.","olio di semi per friggere q.b."],"steps":["Tritare la cipolla e farla appassire in olio; aggiungere le paprike, passata e ketchup. 2. Insaporire con cumino e curry, salare, versare due mestoli d’acqua calda e ridurre fino a ottenere una salsa densa. 3. Tagliare le patate dolci a bastoncini e quelle comuni a chips; friggerle separatamente in olio a 170-180 °C e scolarle. 4. Sciogliere un cucchiaio di curry in acqua bollente, lessare i würstel circa 5 minuti, scolarli e dorarli sulla griglia. 5. Servire i würstel con la salsa speziata e le patate."],"photo":"https://www.giallozafferano.com/images/314-31427/currywurst_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/currywurst.html","pdfPage":176,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03843","name":"Dorayaki","category":"Piatti unici e cucine del mondo","serves":"6 farciti / 12 dischi","prep":"10 min","cook":"20 min","rest":"","ingredients":["Per 12 dischi, circa 6 dorayaki farciti: acqua 180 g","farina 00 240 g","zucchero a velo 150 g","uova 2","lievito in polvere per dolci 3 g","miele 20 g. Per la padella: olio di semi q.b. Farcitura: creme o confetture a scelta (quantità non indicata dalla fonte)."],"steps":["Mescolare farina, zucchero a velo e lievito setacciati in una ciotola.","Unire uova, miele e acqua a temperatura ambiente, lavorando con una frusta fino a ottenere una pastella senza grumi.","Ungere appena una padella antiaderente e scaldarla a fiamma media.","Versare piccole quantità di pastella e cuocere circa 3 minuti, finché compaiono bollicine in superficie; girare e cuocere un altro minuto.","Proseguire con il composto rimanente; accoppiare i dischi con confettura o crema a piacere, se desiderato."],"photo":"https://ptps.stbm.it/t/fjqigc_large.jpg","source":"https://www.giallozafferano.com/recipes/Dorayaki.html","pdfPage":177,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03844","name":"Enchiladas","category":"Piatti unici e cucine del mondo","serves":"12 enchiladas / 6 persone","prep":"20 min","cook":"20 min","rest":"","ingredients":["Per 12 enchiladas: tortillas di mais 12","petto di pollo 700 g","passata di pomodoro 800 g","peperoncini verdi dolci 3","peperoncino fresco piccante 1","cheddar 200 g","panna acida 200 g","prezzemolo 1 rametto","sale fino q.b.","pepe nero q.b.","olio EVO q.b. Nota: il procedimento della fonte impiega cipolla, senza quantità nella lista ingredienti."],"steps":["Grattugiare il cheddar, tagliare i peperoncini e tritare prezzemolo e cipolla (quest'ultima senza dose specificata dalla fonte).","Ridurre il pollo a strisce, rosolarlo in poco olio, quindi tagliarlo a cubetti.","Nella stessa padella appassire la cipolla, aggiungere i peperoncini e parte della passata; salare, pepare e cuocere a fuoco basso per circa 15 minuti.","Incorporare una parte di panna acida, pollo, prezzemolo e formaggio, riservando cheddar per la gratinatura.","Cuocere a parte la passata rimanente con poco olio per 7-8 minuti.","Farcire e arrotolare le tortillas, disporle in una pirofila unta, coprire con salsa, panna acida e cheddar; infornare a 180 °C statico per circa 20 minuti."],"photo":"https://www.giallozafferano.com/images/321-32173/enchiladas_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/enchiladas.html","pdfPage":178,"description":"Le enchiladas sono un piatto della tradizione messicana: tortillas di mais farcite con sugo di pomodoro, carne e altri stuzzicanti ingredienti"},{"id":"GZ-03845","name":"fajitas","category":"Piatti unici e cucine del mondo","serves":"8 fajitas","prep":"20 min","cook":"20 min","rest":"marinatura 1 h","ingredients":["Farcitura: controfiletto di manzo 400 g","petto di pollo 400 g","peperoni rossi 350 g","peperoni gialli 350 g","cipolle bianche 250 g","lime 1","salsa Worcestershire 20 g","coriandolo fresco 10 g","cumino in polvere 1 pizzico","olio EVO q.b.","sale e pepe q.b. Assemblaggio: tortillas di farina 8","Edam q.b.","fagioli neri precotti q.b.","salsa messicana al pomodoro q.b.","guacamole q.b."],"steps":["Tagliare manzo e pollo a striscioline e metterli in una pirofila con scorza e succo di lime, coriandolo, cumino, sale e pepe; coprire e marinare un'ora.","Mondare e affettare cipolla e peperoni.","Scaldare una padella ampia, versare poco olio e saltare le verdure a fuoco vivace per circa 10 minuti.","Aggiungere le carni marinate, rosolare bene e sfumare con la salsa Worcestershire; proseguire per circa 5-6 minuti.","Scaldare le tortillas e farcirle con carne, verdure e condimenti scelti fra formaggio, fagioli, salsa e guacamole; piegare e servire."],"photo":"https://www.giallozafferano.com/images/336-33611/fajitas_780x520_wm.jpg","source":"https://www.giallozafferano.com/recipes/fajitas.html","pdfPage":179,"description":"La newsletter presenta questo piatto, ma non ne conserva una descrizione completa. La fonte è disponibile tramite il collegamento qui sotto"},{"id":"GZ-03846","name":"Fish tacos","category":"Piatti unici e cucine del mondo","serves":"4 tacos / 4 persone","prep":"20 min","cook":"10 min","rest":"","ingredients":["Per 4 tacos: tortillas di farina piccole 4","filetto di merluzzo 400 g","lattuga iceberg 120 g","pomodorini datterini 100 g","carote 80 g","radicchio 60 g","succo di lime 1/2","coriandolo q.b. Pastella: birra scura 165 g","farina 00 135 g","sale e pepe q.b. Salsa: yogurt greco 200 g","scorza di lime 1/2","succo di lime 1/2. Frittura: olio di semi q.b."],"st
