const copy={carta:'<strong>01 · Carta.</strong> Titolo sopra, ingredienti a destra e foto panoramica in basso. Calda e leggera.',notte:'<strong>02 · Notte.</strong> Titolo e ingredienti a destra, preparazione a sinistra e foto sotto. Antracite e ambra.',galleria:'<strong>03 · Galleria.</strong> Foto e titolo affiancati, ingredienti sotto il titolo e preparazione a tutta larghezza. Blu notte e lilla.'};
let current=0;let design=['carta','notte','galleria'].includes(location.hash.slice(1))?location.hash.slice(1):'carta';const checked=new Set();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const r=recipes[current];document.getElementById('position').textContent=String(current+1).padStart(2,'0')+' / 03';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===recipes.length-1;
document.getElementById('canvas').innerHTML=`<header class="heading"><p class="eyebrow">${esc(r.category)}</p><h1>${esc(r.name)}</h1><div class="facts"><span>Preparazione <b>${esc(r.prep)}</b></span><span>Cottura <b>${esc(r.cook)}</b></span><span><b>${esc(r.serves)}</b></span></div></header><section class="ingredients" aria-label="Ingredienti"><div class="sectionLabel"><h2>Ingredienti</h2><small>${esc(r.serves)}</small></div><ul>${r.ingredients.map((x,i)=>`<li><label class="ingredient"><input type="checkbox" data-ingredient="${i}" ${checked.has(r.id+'-'+i)?'checked':''}><span>${esc(x)}</span></label></li>`).join('')}</ul><p class="hint">Tocca per segnare ciò che hai già.</p></section><section class="method" aria-label="Preparazione"><div class="sectionLabel"><h2>Preparazione</h2><small>${r.steps.length} passaggi</small></div><ol>${r.steps.map((x,i)=>`<li data-number="${String(i+1).padStart(2,'0')}"><p>${esc(x)}</p></li>`).join('')}</ol></section><figure class="picture"><img src="${r.image}" alt="${esc(r.name)}" decoding="async"><figcaption><a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">Foto: GialloZafferano ↗</a></figcaption></figure><footer class="foot"><span>Sapore / ${esc(r.id)}</span><a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">La ricetta originale ↗</a></footer>`;
document.getElementById('recipeChoices').innerHTML=recipes.map((x,i)=>`<button data-recipe="${i}">${esc(x.name)}</button>`).join('');}
function setDesign(value){design=value;document.getElementById('prototype').dataset.design=value;document.getElementById('prototype').setAttribute('aria-labelledby','tab-'+value);document.getElementById('description').innerHTML=copy[value];document.querySelectorAll('[role=tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.design===value));b.tabIndex=b.dataset.design===value?0:-1});history.replaceState(null,'','#'+value);}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-design]');if(b)setDesign(b.dataset.design)});
document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const names=['carta','notte','galleria'];const i=e.key==='Home'?0:e.key==='End'?2:(names.indexOf(design)+(e.key==='ArrowRight'?1:2))%3;setDesign(names[i]);document.getElementById('tab-'+names[i]).focus()});
document.getElementById('prev').onclick=()=>{if(current>0){current--;render()}};document.getElementById('next').onclick=()=>{if(current<recipes.length-1){current++;render()}};
for(const name of ['index','pantry'])document.getElementById(name).onclick=()=>{const panel=document.getElementById(name+'Menu');panel.hidden=!panel.hidden;document.getElementById(name).setAttribute('aria-expanded',String(!panel.hidden))};
document.getElementById('recipeChoices').onclick=e=>{const b=e.target.closest('[data-recipe]');if(b){current=Number(b.dataset.recipe);render();document.getElementById('indexMenu').hidden=true;document.getElementById('index').setAttribute('aria-expanded','false')}};
document.getElementById('canvas').onchange=e=>{if(!e.target.matches('[data-ingredient]'))return;const key=recipes[current].id+'-'+e.target.dataset.ingredient;e.target.checked?checked.add(key):checked.delete(key)};
document.getElementById('clearPantry').onclick=()=>{for(const key of checked)if(key.startsWith(recipes[current].id+'-'))checked.delete(key);render()};setDesign(design);render();
</script></body></html>
