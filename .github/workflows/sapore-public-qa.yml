name: Sapore - public Pages QA
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'index.html'
      - '.github/workflows/sapore-public-qa.yml'
      - 'tools/sapore*qa.py'
      - 'tools/sapore_pages_smoke_r16.py'
  workflow_dispatch:
    inputs:
      public_commit:
        description: 'Exact successfully deployed public commit'
        required: true
      pages_run_id:
        description: 'Successful Pages run for that commit'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: sapore-public-qa
  cancel-in-progress: false
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SAPORE_PUBLIC_COMMIT: ${{ inputs.public_commit || github.sha }}
      SAPORE_PAGES_RUN_ID: ${{ inputs.pages_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SAPORE_PUBLIC_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for successful Pages deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          repo, commit = os.environ['GITHUB_REPOSITORY'], os.environ['SAPORE_PUBLIC_COMMIT']
          requested = os.environ.get('SAPORE_PAGES_RUN_ID')
          for attempt in range(30):
              endpoint = f'repos/{repo}/actions/runs'
              if requested:
                  rows = [json.loads(subprocess.check_output(['gh', 'api', endpoint + '/' + requested]))]
              else:
                  rows = json.loads(subprocess.check_output(['gh', 'api', endpoint + '?head_sha=' + commit + '&per_page=100']))['workflow_runs']
              pages = [r for r in rows if r['name'] == 'pages build and deployment' and r['head_sha'] == commit and r['head_branch'] == 'main']
              if pages:
                  r = max(pages, key=lambda row: row['id'])
                  assert r['repository']['full_name'] == repo
                  if r['status'] == 'completed':
                      assert r['conclusion'] == 'success', 'Pages deployment failed'
                      with open(os.environ['GITHUB_ENV'], 'a') as out:
                          out.write(f"SAPORE_PAGES_RUN_ID={r['id']}\n")
                      break
              time.sleep(10)
          else:
              raise RuntimeError('No successful Pages deployment within five minutes')
          PY
      - name: Test update contract when loader changes
        run: |
          if ! git diff --quiet HEAD^ HEAD -- app/layout-r3.js tools/test-r26-loader.cjs; then
            node tools/test-r26-loader.cjs
          fi
      - name: Prepare changed recipes from public snapshot
        env:
          SAPORE_QA_CANARY: 'true'
        run: python tools/sapore_public_qa.py
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          google-chrome --version
      - name: Test live desktop and mobile
        run: python tools/sapore_pages_smoke_r16.py
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapore-public-qa-${{ env.SAPORE_PUBLIC_COMMIT }}
          path: qa-artifacts/
          retention-days: 7
          if-no-files-found: warn

  # A separate no-checkout job is the only QA job with dispatch permission.
  # Explicit dispatch is supported with GITHUB_TOKEN; it does not rely on
  # workflow_run propagation from a bot-dispatched QA run.
  resume-publication:
    needs: browser-qa
    if: >-
      github.repository == 'enricobertotti-rgb/Ricettario-personale' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.SAPORE_R28_ENABLED == 'true'
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Resume only finalization of this exact successful QA
        env:
          GH_TOKEN: ${{ github.token }}
          SAPORE_QA_COMMIT: ${{ inputs.public_commit || github.sha }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          commit = os.environ['SAPORE_QA_COMMIT']
          run_id = os.environ['GITHUB_RUN_ID']
          assert re.fullmatch(r'[0-9a-f]{40}', commit)
          assert run_id.isdigit()
          payload = {
              'ref': 'main',
              'inputs': {'mode': 'finalize', 'qa_run_id': run_id,
                         'public_commit': commit},
          }
          subprocess.run([
              'gh', 'api', '-X', 'POST',
              'repos/' + os.environ['GITHUB_REPOSITORY'] +
              '/actions/workflows/sapore-private-writer-public-runner.yml/dispatches',
              '--input', '-'
          ], input=json.dumps(payload), text=True, check=True)
          print('Exact QA finalization dispatched; publication writer remains serialized')
          PY
