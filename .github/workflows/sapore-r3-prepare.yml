name: Verify approved Sapore R3 release
on:
  push:
    branches: [sapore-lavoro]
    paths: [.github/workflows/sapore-r3-prepare.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public HTTPS bytes against tested Git blobs
        shell: python
        run: |
          import hashlib, json, os, time, urllib.request
          from datetime import datetime, timezone
          base = 'https://enricobertotti-rgb.github.io/Ricettario-personale/'
          expected = {
              'index.html': '1a8cd12a8e99baf8c07124d2725fc29d7710092d',
              'app/index.html': '05cefd478fc1f4d7d310c3111dd25e7dad20bb3b',
              'app/layout-r3.css': '878d6d1946ab112203ce1c7c71a92fe46a84859a',
              'app/layout-r3.js': '119edc48df391da05863f989f1d812abe6ed9e52',
              'app/data/drive-photos-1.json': '05ba50c03237a3a33acda257ba4f0b883c3bb317',
              'app/data/drive-photos-2.json': 'b11cf89df0a4334de19bf1c4ab95401714527779',
              'app/data/drive-photos-3.json': '083941c8e97c71bb748960289a31e971166f2ad2',
              'app/data/drive-photos-4.json': 'd378d6115f23addda7a7b5ed082ba49e061eec34',
              'app/data/drive-photos-5.json': 'e6762c14dbc7b5c7a9ff58f4b39b28cb61bd875c'
          }
          receipts = []
          for path, wanted in expected.items():
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(base + path, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Sapore-release-verification'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          data = response.read()
                          status = response.status
                          final_url = response.url
                      blob = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
                      assert status == 200 and blob == wanted, (path, status, blob, wanted)
                      receipts.append({'path': path, 'url': final_url, 'status': status, 'bytes': len(data), 'blob_sha': blob, 'sha256': hashlib.sha256(data).hexdigest()})
                      break
                  except Exception as error:
                      if attempt == 11: raise
                      print('Waiting for published bytes:', path, type(error).__name__, flush=True)
                      time.sleep(5)
          with urllib.request.urlopen(base, timeout=20) as response:
              root = response.read().decode('utf-8')
              assert response.status == 200 and './app/' in root
          with urllib.request.urlopen(base + 'app/', timeout=20) as response:
              raw = response.read()
              assert hashlib.sha1(('blob ' + str(len(raw)) + '\0').encode() + raw).hexdigest() == expected['app/index.html']
          receipt = {'release_commit': 'a15d81acdcf50a2e065b7a0d53e088076da2ed96', 'checked_at': datetime.now(timezone.utc).isoformat(), 'site_url': base, 'app_url': base + 'app/', 'public_http_verified': True, 'files': receipts, 'production_writes': False}
          print('SAPORE_LIVE_RECEIPT=' + json.dumps(receipt))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Public HTTPS delivery verified against the tested files. No writes to production.\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
