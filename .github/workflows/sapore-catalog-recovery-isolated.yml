name: Sapore - isolated catalog recovery verification
on: create
permissions:
  contents: read
jobs:
  catalog-recovery:
    if: >-
      github.repository == 'enricobertotti-rgb/Ricettario-personale' &&
      github.ref == 'refs/heads/verify/sapore-loader-20261125' &&
      github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SAPORE_CHROMIUM: /usr/bin/google-chrome
      SAPORE_BROWSER_ARTIFACTS: qa-catalog-recovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/sapore-loader-20261125
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the exact isolated snapshot
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          out = pathlib.Path('qa-catalog-recovery')
          out.mkdir(exist_ok=True)
          files = ['app/layout-r3.js', 'app/layout-r3.css', 'tools/test-r26-loader.cjs',
                   'tools/test-catalog-loading.cjs', 'tests/test_catalog_loading_browser.py',
                   'app/index.html', 'app/data/approved-r4-1.json', 'app/data/published-r15.json']
          proof = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                   'sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}}
          (out / 'snapshot.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY
      - name: Verify publication contracts and failure recovery
        run: node tools/test-r26-loader.cjs
      - name: Prepare existing browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          google-chrome --version
      - name: Verify recovery in desktop and mobile browsers
        run: python tests/test_catalog_loading_browser.py
      - name: Preserve isolated public test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapore-catalog-recovery
          path: qa-catalog-recovery/
          retention-days: 7
          if-no-files-found: error
