name: Sapore - category layout candidate
on:
  push:
    branches: [sapore-qa-r24]
    paths: ['app/**', 'tests/test_category_index_browser.py', '.github/workflows/sapore-layout-test.yml']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python tests/test_category_index_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapore-category-layout
          path: layout-qa-artifacts/
          retention-days: 7
